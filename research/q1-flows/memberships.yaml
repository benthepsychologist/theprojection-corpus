# research/q1-flows/memberships.yaml — is_member_of edges (Ruling 1,
# 2026-08-10 second pass): the round-node membership layer.
#
# WHY THIS IS A SEPARATE FILE, NOT MORE ROWS IN edges.yaml: Ruling 1 is
# explicit that the round node and its membership edges are "new
# structure that sits alongside" the existing money-flow edge — the one
# edge per round that fits edges.yaml's from/to/value/observation schema
# is the round -> receiver capital flow (recorded in edges.yaml itself).
# A membership edge carries no dollar value of its own in the general
# case (per-investor check sizes are almost never individually
# disclosed) and no observation stack — it is a roster fact, not a flow
# — so forcing it into edges.yaml's schema would mean padding every row
# with empty observation fields. Keeping memberships in their own file
# with their own minimal schema keeps both files honest about what kind
# of claim each one is.
#
# Schema, one row per is_member_of edge:
#   id            — <investor-node-id-slug>--is-member-of--<round-node-id-slug>
#   from          — the investor's own capital node id (nodes.yaml)
#   to            — the round node id (nodes.yaml, kind: round)
#   role          — lead | participant. MULTIPLE rows may carry role:lead
#                   on the same round (Ruling 5, 2026-08-10 third pass —
#                   see research/PRINCIPLES.md P-01): when a source
#                   discloses two or more co-leads, every one of them
#                   gets role:lead here, matching the round node's own
#                   `leads` list (nodes.yaml) exactly. Zero rows carry
#                   role:lead where no lead at all was named. Pass 2
#                   originally allowed only one role:lead per round and
#                   demoted a real second co-lead (Cohere 2025: Radical
#                   Ventures + Inovia; Together AI 2025 Series B: General
#                   Catalyst + Prosperity7) to role:participant — both
#                   fixed this pass; see their entries below.
#   amount_usd    — nullable; filled ONLY when a source discloses that
#                   specific investor's individual check size (rare —
#                   ASML's €1.3B-of-€1.7B contribution to Mistral's
#                   Series C is the one case this pass), null otherwise
#   source_ref    — points back at the round node's own `sources` list
#                   in nodes.yaml rather than re-stating the citation —
#                   the citation lives once, at the round, since it is
#                   almost always one article naming the whole investor
#                   list at once, not per-investor sourcing
#
# UNDISCLOSED PARTICIPANTS (Ruling 1): where a source says "and other
# investors" (or, for xAI's SEC Form D, names no investors at all), ONE
# is_member_of edge from a generic ext/undisclosed-investors--<round-id>
# stand-in node carries that fact — never fabricated names, never a
# silently dropped "and more."
#
# DEBT SYNDICATES GET THE SAME TREATMENT AS EQUITY ROUNDS (Ruling 4,
# 2026-08-10 third pass — REVERSES the judgment call pass 2 made here).
# Pass 2 reasoned a lender taking no ownership stake isn't naturally a
# "member" of a round the way a co-investor is, and kept debt facilities
# as plain edges.yaml flows even when multiple banks co-lent. Ben
# overruled this: "I'd probably give it a named syndicate also, just
# because those sorts of co-lending parties might be interesting if
# patterns exist (and they def do)." A debt facility with 2+ identifiable
# lenders now gets the SAME round-node + is_member_of pattern as an
# equity round: a syndicate/facility node in nodes.yaml (kind: round,
# round_type describing the debt instrument), is_member_of edges here for
# every named lender (role:lead for the lead arranger/bookrunner/agent —
# per Ruling 5, MULTIPLE lenders can carry role:lead when a source names
# co-leads, e.g. CoreWeave's 2023 Blackstone+Magnetar facility and its
# 2026 JPMorgan+MUFG DDTL 5.5 facility, both below), and the actual
# money-flow edge in edges.yaml running syndicate-node -> borrower,
# exactly like an equity round's own money-flow edge.
#
# Where a facility's co-lenders are confirmed to exist as a class
# ("the Lenders party thereto," a syndicated term loan) but aren't
# individually named anywhere found, the round node still gets created
# with a single ext/undisclosed-lenders--<facility-id> stand-in member —
# same convention as ext/undisclosed-investors on an equity round — so
# the SHAPE is right even when membership is partly unknown (see
# coreweave/2025-ddtl5-amendment below for a worked example).
#
# A loan VERIFIED to have exactly one lender (the JPMorgan Chase $2.3B
# Crusoe/Abilene construction loan — Newmark, named in a secondary trade
# source, turned out on direct fetch to be the deal's broker/arranger,
# not a co-lender; no other bank is named anywhere found) correctly stays
# a plain edges.yaml flow with no round node — that is a fact about that
# specific loan having one lender, not a different rule for debt as a
# category. See edges.yaml's jpmorgan-chase-capital--crusoe-datacenter-construction--2025-construction-loan
# entry for the verification detail.
#
# YAML validated via yaml.safe_load on every write (CLAUDE.md guardrail).

