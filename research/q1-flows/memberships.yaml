# research/q1-flows/memberships.yaml — is_member_of edges (Ruling 1,
# 2026-08-10 second pass): the round-node membership layer.
#
# WHY THIS IS A SEPARATE FILE, NOT MORE ROWS IN edges.yaml: Ruling 1 is
# explicit that the round node and its membership edges are "new
# structure that sits alongside" the existing money-flow edge — the one
# edge per round that fits edges.yaml's from/to/value/observation schema
# is the round -> receiver capital flow (recorded in edges.yaml itself).
# A membership edge carries no dollar value of its own in the general
# case (per-investor check sizes are almost never individually
# disclosed) and no observation stack — it is a roster fact, not a flow
# — so forcing it into edges.yaml's schema would mean padding every row
# with empty observation fields. Keeping memberships in their own file
# with their own minimal schema keeps both files honest about what kind
# of claim each one is.
#
# Schema, one row per is_member_of edge:
#   id            — <investor-node-id-slug>--is-member-of--<round-node-id-slug>
#   from          — the investor's own capital node id (nodes.yaml)
#   to            — the round node id (nodes.yaml, kind: round)
#   role          — lead | participant (exactly one `lead` per round where
#                   a source discloses a single lead; see the round node's
#                   own `lead` field and note for rounds where no single
#                   lead was named — those rounds carry zero `lead` edges)
#   amount_usd    — nullable; filled ONLY when a source discloses that
#                   specific investor's individual check size (rare —
#                   ASML's €1.3B-of-€1.7B contribution to Mistral's
#                   Series C is the one case this pass), null otherwise
#   source_ref    — points back at the round node's own `sources` list
#                   in nodes.yaml rather than re-stating the citation —
#                   the citation lives once, at the round, since it is
#                   almost always one article naming the whole investor
#                   list at once, not per-investor sourcing
#
# UNDISCLOSED PARTICIPANTS (Ruling 1): where a source says "and other
# investors" (or, for xAI's SEC Form D, names no investors at all), ONE
# is_member_of edge from a generic ext/undisclosed-investors--<round-id>
# stand-in node carries that fact — never fabricated names, never a
# silently dropped "and more."
#
# DEBT SYNDICATES ARE NOT MODELED HERE (judgment call, flagged for Ben,
# not a ruling): bank-loan syndicates (e.g. the Vantage/MUFG construction
# loan) are recorded as direct edges.yaml flows from the lead lender's
# capital node, with co-lenders named in that edge's coverage_note —
# not as is_member_of edges into a round node. Rationale: Ruling 1's own
# language ("named investor," "role: lead where a lead is disclosed") is
# written for equity-style financing rounds; a creditor taking no
# ownership stake in exchange for a loan isn't naturally a "member" of
# a round in the same sense a co-investor is. This reading is NOT
# obviously the only correct one — flagging it explicitly rather than
# assuming it's settled.
#
# YAML validated via yaml.safe_load on every write (CLAUDE.md guardrail).

