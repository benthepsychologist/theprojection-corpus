  note: >
    Amazon and Google appear as BOTH members (hyperscaler AI ops) and
    financing counterparties (amazon/capital, google/capital -> Anthropic)
    in the current edge set. This is correct under R-16, not a
    contradiction: the filter classifies flows by whether BOTH endpoints
    are inside the group. Amazon->Anthropic and Google->Anthropic are
    inside<->inside under this cut (both members) and read as TRANSFERS,
    not external capital inflow to the group — worth Ben's eye, since press
    coverage of these deals almost universally frames them as "external"
    investment. Flagged, not resolved, per R-17 (name the ambiguity).

    v2 sharpens this same pattern with a second, broader case: Nvidia's
    own investment arm (nvidia/capital) is a named investor in SIX of
    this pass's rounds — Inflection, Crusoe, World Labs, Cohere (both
    2024 and 2025), Together AI, and Mistral's Series C — while Nvidia
    the chip-design entity is simultaneously a core-buildout member. AMD
    (via AMD Ventures) shows the same shape at smaller scale across both
    Cohere rounds. Under this cut, every one of those investment edges
    reads as an inside<->inside transfer once the receiving company is
    itself a core-buildout member (all six of the above are, as of v2) —
    Nvidia's chip revenue and its venture-investing arm both sit inside
    the same filtered group, so its outbound checks to AI labs are, by
    this cut's own logic, the industry investing in itself at a scale
    and breadth that goes well beyond the original Amazon/Google
    observation. This is documentation of how the cut's own mechanical
    rule (R-16: classify by whether BOTH endpoints are inside the group)
    plays out here, not an open question — no decision is being asked of
    Ben. It is named per R-17 (name ambiguity, don't legislate it) so
    that anyone reading this cut's "external inflow" totals knows Nvidia
    and AMD's own checks to AI labs are counted as transfers, not
    inflow, under this specific cut's rule — exactly the same mechanical
    treatment the Amazon/Google case above gets.

    v3 (third pass, international tranche) adds a third instance of the
    same mechanical pattern: Microsoft (a core-buildout member) invested
    $1.5B in G42 (also now a member, added this pass) — under this cut,
    that flow reads as an inside<->inside transfer, not external inflow
    to G42, for the same reason the Amazon/Google->Anthropic and
    Nvidia/AMD-into-AI-labs flows do. Documentation only, same as above —
    no decision pending.
