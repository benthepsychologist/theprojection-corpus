# research/q1-flows/filters/cut-core-buildout.yaml — the v1 spend-side
# consolidation filter (q1 skeleton sec 3 / sec 12: "cut:core-buildout").
#
# R-16 (binding ruling, not open to relitigation): boundaries are FILTERS
# over the flow map, not memberships baked into the map itself. This file
# is that filter — a named, versioned, dated membership list stored as
# data. Applying it to research/q1-flows/edges.yaml classifies each edge's
# endpoints as inside/outside; flows between two "inside" entities are
# transfers under this cut, flows crossing the boundary are the group's
# external cost/revenue. A different cut (e.g. drawn at retail inference,
# per R-17) is a NEW filter file, never a rewrite of this one or a
# re-sourcing of the map.
#
# Coverage note: this v1 roster covers the entities already instantiated in
# nodes.yaml as of this build pass (2026-08-10) — it is deliberately not
# yet the exhaustive roster the skeleton describes (hyperscaler AI ops,
# frontier labs, neoclouds, AI chip lines, semicap, memory, packaging,
# networking, datacenter builders, AI-dedicated power projects). Extend as
# new nodes instantiate; membership changes are versioned, never silent.

id: "cut:core-buildout"
version: 2
dated: "2026-08-10"
description: >
  Spend-side default cut (q1 skeleton sec 3/12): hyperscaler AI operations,
  frontier labs, neoclouds, AI chip lines, semicap, memory, packaging,
  networking, datacenter builders, AI-dedicated power projects. Capital
  providers and governments sit OUTSIDE this cut by design — their money
  into the group reads as inflow, not a transfer.
version_note: >
  v2 (2026-08-10, second build pass) extends v1's roster to match the
  second Tier-A tranche (memberships.yaml/edges.yaml this pass) — semicap
  beyond TSMC, memory/HBM, advanced packaging, networking, datacenter
  builders, and AI-dedicated power/grid infrastructure, none of which had
  an instantiated node under v1. Every v1 member is unchanged; this is
  additive only, versioned per R-16 (membership changes are never silent).

