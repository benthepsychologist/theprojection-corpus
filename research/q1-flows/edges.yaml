# JUDGMENT CALL flagged for Ben, applied consistently below rather than
# left ad hoc: two edges this pass are outright company acquisitions
# (nVent/Maverick Power, Infineon/C2i Semiconductors) — a shape this
# schema's "asset purchase" type was defined for EPC/construction
