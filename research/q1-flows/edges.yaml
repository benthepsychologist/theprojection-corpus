# matching header and research/q1-flows/graph/README.md. New data goes into
# graph/ via graph/add.py, never here.
#
# research/q1-flows/edges.yaml — q1 flow map: entity-to-entity money/capacity
# flows, classification-free (R-16: boundaries are filters, applied at query
# time, never stored here).
#
# Schema: q1 skeleton v3 (INBOX/2026-08-03-q1-skeleton-v3.md) sec 3 (edges)
# + sec 4 (observations). This is real sourced data, not a placeholder set —
# every entry below carries at least one observation with a live, checked
# citation. Three provenance classes of capture_ref appear:
#   - "step0-audit:<record-id>" = the underlying claim was already
#     live-fetched and verified 2026-08-03 by the shelf audit
#     (INBOX/2026-08-03-q1-step0-audit.md); this file re-expresses that
#     VERIFIED-LIVE finding as a flow edge, it does not re-fetch.
#   - "session-webfetch:<date>" = fetched and verified fresh in the build
#     pass dated in the capture_ref (first pass 2026-08-10 found the
#     Anthropic-xAI and Google-xAI Colossus leases; the SAME-DATED second
#     pass, also 2026-08-10, retrofit the round-node pattern and added the
#     Ruling 2 / Tier-A tranche below — both passes share a build date,
#     distinguish by edge content and the "NEW this pass"/"retrofit" notes).
#   - "subagent-webfetch:<date>" = fetched and verified by a dispatched
#     research subagent during the second 2026-08-10 pass, cross-checked
#     by the orchestrating session before being written here — same
#     verification standard as session-webfetch, distinguished only so a
#     future reader can tell which pass's tooling did the fetch.
#
# ROUND NODES (Ruling 1, second 2026-08-10 pass — see nodes.yaml's header
# for the full node-kind writeup, memberships.yaml for the is_member_of
# edges). Every financing round with 2+ investors gets its own round node
# (kind: round, in nodes.yaml) instead of the first pass's
# ext/investor-syndicate--<company>-<year> placeholder. The round node
# carries date/amount/stage/sources; is_member_of edges (memberships.yaml)
# record who participated and who led; and — the piece that lives HERE,
# in edges.yaml, unchanged in shape from every other edge in this file —
# exactly ONE money-flow edge per round, from the round node to the
# receiver's own capital node, carrying the actual disclosed total dollar
# amount. The five edges below whose `from` field is a round node
# (`.../<year>-...-round`) are either a first-pass RETROFIT (the `from`
# field changed; the edge `id`, receiver, and every observation are
# untouched) or NEW this pass (Ruling 2's added rounds). Retrofit notes
# say which.
#
# NEW EDGE TYPE this pass: "grant / subsidy" — added for the one
# government-to-company flow in this tranche (Intel's CHIPS Act award).
# The original seven-value type enum (asset purchase · capacity/service
# payment · equity · debt · prepayment · revenue · non-cash consideration)
# has no clean home for a non-repayable government grant; "equity" would
# misrepresent it (no shares issued) and there is no seventh alternative
# in q1 skeleton sec 3. This extension is flagged for Ben's review, not
# a ruling — cut:core-buildout.yaml's own filter description already
# names "governments" as an expected capital-provider class sitting
# outside the buildout group, which is the reason this flow needed a
# type at all rather than being skipped.
#
# What this is NOT: a complete q1 map. This is now a THIRD Tier-A tranche
# (materiality floor and tier definitions: q1 skeleton sec 5, sec 12) —
# the first pass covered model-training/cloud-capacity/chip-design flows
# plus early capital-megarounds; the second pass added power generation,
# grid interconnection, semicap beyond TSMC, memory/HBM, advanced
# packaging, networking, and datacenter construction as its own purchase
# category, plus the Ruling 2 materiality-floor tranche; this THIRD pass
# (2026-08-10, same-dated as the second per this file's own convention —
# distinguish by content/notes) adds two more previously-uncovered
# categories per Ben's direct request: (a) DEBT/PROJECT-FINANCE structures
# beyond simple construction loans — bond issuances, private-credit
# facilities, infrastructure-fund JVs, sovereign-backed project finance —
# under Ruling 4 (debt syndicates get the SAME round-node treatment as
# equity rounds when 2+ lenders are named; see memberships.yaml header);
# and (b) INTERNATIONAL (non-US) financing rounds, filling a real US-bias
# gap in every tracker used through pass 2. Coverage is asymptotic by
# design (R-19) — there is no done state.
#
# ext/bond-market (NEW node this pass, nodes.yaml) is the debt-side analogue
# of the existing ext/public-equity-market population node: anonymous
# corporate-bond buyers. Underwriting banks named on a bond deal (e.g.
# Citigroup/Morgan Stanley on Meta's notes) are noted in that edge's
# coverage_note, never modeled as is_member_of participants — the same
# treatment the CoreWeave IPO edge already gives its own underwriters
# (none modeled).
#
# Discipline: never fabricate a figure or URL (CLAUDE.md, this repo's
# citation rule). Every "value" below is either a directly-quoted figure
# from its source, or explicitly marked derived/computed with the method
# stated. Dollar amounts genuinely not disclosed in a source are recorded
# as unmeasured, never estimated silently.
#
# YAML validated via yaml.safe_load on every write (CLAUDE.md guardrail).

