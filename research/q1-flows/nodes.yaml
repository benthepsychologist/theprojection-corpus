# research/q1-flows/nodes.yaml — entity x activity nodes instantiated by
# edges.yaml (q1 skeleton sec 3: "Nodes are entity x activity units...
# Where disclosure doesn't support the split, an edge terminates at the
# entity and the node carries the aggregated state until an allocation
# claim splits it.")
#
# `coverage_state`: measured | aggregated | unmeasured (q1 sec 3 table).
# `ext/*` nodes borrow q2's population-node convention (q2 skeleton sec 3)
# for unnamed capital-provider counterparties on financing edges — q1 itself
# doesn't specify this case; flagged as a judgment call in the build report,
# not a ruling.
#
# `kind: round` (NEW, Ruling 1 — 2026-08-10 second pass, replacing the
# ext/investor-syndicate--<company>-<year> placeholder pattern the first
# pass used): a round node represents a one-time financing EVENT, not an
# entity×activity facet — analogous to a paper being the object authors
# `is_member_of`, even though that specific collaboration happens once.
# Naming convention: `<company>/<year>-<round-slug>-round` (financing
# rounds proper) or `<company>/<year>-<project-slug>-financing` (a
# construction-project JV that is structurally the same shape — 2+ named
# co-investors funding one recipient — even though it isn't a startup
# equity round). Fields: company, date, round_type, total_amount_usd
# (nullable), lead (an investor node id, or null if the source names no
# single lead), sources. A round node does NOT carry `instantiated_by`
# in the entity×activity sense; its own id is what edges.yaml's money-flow
# edge points FROM, and what memberships.yaml's is_member_of edges point
# TO. Full pattern writeup, including why debt syndicates are handled
# differently, lives in edges.yaml's header and memberships.yaml's header.
#
# Investor nodes below are deliberately MINIMAL per Ruling 1 ("if an
# investor doesn't have a node yet, create a minimal one") — entity +
# activity (`capital`) + coverage_state only, no independent research
# beyond what the round's own citation already names. Individuals get
# person-slug ids (e.g. `daniel-gross/capital`), not `ext/*` — they are
# named entities, not an anonymous population.
#
# `instantiated_by` convention differs for investor/round nodes vs. every
# other node in this file: an ordinary entity×activity node's
# `instantiated_by` points at the edges.yaml money-flow edge id that
# brought it live. An investor node's own "flow" is its round
# membership, not a dollar edge — no per-investor amount exists in the
# general case — so its `instantiated_by` points at the ROUND NODE id
# (e.g. `mistral/2023-seed-round`) it's a member of, not at an
# edges.yaml id or a memberships.yaml id. Round nodes themselves are not
# instantiated by anything (they ARE the event); they carry no
# `instantiated_by` field at all.
#
# YAML validated via yaml.safe_load on every write (CLAUDE.md guardrail).

