# research/q3-datacenter-census/attribution.yaml — the owner/operator/
# propco/tenant attribution layer over Epoch AI's datacenter census
# (sources/external/epoch-datacenters/), per the sotg finding (INBOX/sotg/)
# that Epoch already IS ~80% of q3's census for free, and the genuinely
# open work is this attribution graph, which Epoch does NOT model.
#
# Spine: sources/external/epoch-datacenters/data_centers.2026-08-03.csv
# (75 facilities, CC-BY, snapshotted 2026-08-03 — see that dir's
# PROVENANCE.md). Epoch's own per-row "Selected Sources" column already
# carries real citations for the base owner/user facts; this layer adds
# what Epoch's schema doesn't have — the SPLIT between who owns the land
# and shell (propco), who built/operates the technical infrastructure
# (operator), who leases capacity as a business matter (tenant), and who
# actually consumes the compute (end-user) — which are frequently four
# different entities collapsed into Epoch's single "Owner" field.
#
# Discipline: import as a source to verify and reconcile, never as truth
# to copy (this repo's rule, restated in epoch-datacenters/PROVENANCE.md).
# Every record below either (a) cites Epoch's own already-verified
# per-facility source, explicitly noted as such, or (b) cites fresh
# WebSearch/WebFetch research done this build pass (2026-08-10) where the
# owner/operator/propco/tenant split isn't visible from Epoch's columns
# alone — those are marked new_research: true with their own citations,
# independently fetched and quoted, not fabricated.
#
# Coverage: top facilities by current MW (materiality-ordered, echoing q1's
# materiality-floor logic) — NOT the full 75-row census. This is a first
# tranche; extending it is direct, mechanical follow-on work (walk further
# down the MW-sorted list, apply the same research pattern).
#
# control_cut values (this repo's own taxonomy, not Epoch's):
#   vertically-integrated       — one corporate family owns land, builds,
#                                  operates, AND consumes (no external
#                                  tenant at all)
#   vertically-integrated-leased-out — owner/operator is a hyperscaler;
#                                  capacity is sold/dedicated to an
#                                  external AI-lab customer under a
#                                  compute contract (not a real-estate
#                                  lease) — e.g. AWS building for Anthropic
#   propco-lease                — landlord/developer (propco) owns the
#                                  land+shell; a separate operator or
#                                  tenant leases the technical
#                                  infrastructure; sometimes a further
#                                  sub-tenant actually consumes the compute
#   unconfirmed                 — Epoch's own owner/user fields are blank
#                                  or unresolved and this pass did not
#                                  clear it
#
# YAML validated via yaml.safe_load on every write (CLAUDE.md guardrail).

schema_ref: "INBOX/sotg/2026-08-03-state-of-the-game-SYNTHESIS.md"
epoch_snapshot: "sources/external/epoch-datacenters/data_centers.2026-08-03.csv"
built: "2026-08-10"

