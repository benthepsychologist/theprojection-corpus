#   reader proxy, which renders the challenge and returns clean text:
#       https://r.jina.ai/https://www.mobihealthnews.com/
#   Use that prefix for this outlet specifically.
#   ⚠️ ESCALATED AGAIN 2026-08-26 (found by that day's mental-health
#   coverage critic on the 08-25 finalize). The HOMEPAGE above no longer
#   clears: the Cloudflare "Just a moment…" challenge now survives the
#   r.jina.ai render, which it did not before. The FEED path through the
