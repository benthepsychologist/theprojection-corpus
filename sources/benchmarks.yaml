# benchmarks.yaml — coverage-critic baselines, per lens (Ben, 2026-07-20).
# The critic compares each finalized digest against what these led with:
# "they led with → we missed" is the recall guarantee. Misses auto-grow
# watchlist/threads (YAML-guardrail protected) and log to coverage-log.md.
#
# Access note: Money Stuff is partially paywalled — the critic works from
# web search / public copies / issue summaries.
#
# ACCESS FIXES (investigated 2026-08-10, in response to a week of recurring
# 403s on 3 of these benchmarks — see coverage-log.md 2026-08-09 /week):
#
# - **FT Unhedged: FIXED.** `https://www.ft.com/unhedged?format=rss` is FT's
#   own public stream endpoint — no login, no paywall gate, verified live
#   (curl, no UA needed). Returns ~25 dated items, each with the day's real
#   headline + a two-line subhead — exactly what the critic needs to check
#   "did we catch what Unhedged led with." Use this URL directly instead of
#   web search/public copies for this one benchmark.
#
# - **Behavioral Health Business: FIXED, but the tool matters.** The feed at
#   https://bhbusiness.com/feed/ (already the URL in sources/feeds.yaml) is
#   correct and returns full current content via a PLAIN HTTP client (curl,
#   python urllib, kestrel's own collector UA all verified working, 200 OK).
#   The 403s traced specifically to Cloudflare's AI-crawler blocklist
#   (robots.txt names ClaudeBot/GPTBot/etc. explicitly) — Anthropic's own
#   WebFetch tool identifies as one of these and gets blocked at the edge,
#   independent of anything else about the request. CONSEQUENCE: when the
#   critic (or any Claude session) checks this benchmark, fetch the feed via
#   Bash (curl/python urllib), never via the WebFetch tool directly — same
#   URL, different transport, no block.
#
# - **Axios Pro Rata: NO FIX FOUND — open decision for Ben, not resolved.**
#   Every axios.com path (Pro Rata, the bare homepage, an unrelated tech
#   section) returns an identical Cloudflare "Attention Required!" block —
#   this is a domain-wide bot-protection rule against non-browser/cloud-IP
#   traffic, not a paywall or a specific-URL problem, so no RSS/API variant
#   fixes it. No free-tier digest exists distinct from Pro Rata itself. The
#   only real options: (a) drop it from this file's daily critic set and
#   accept the gap honestly, or (b) route through infrastructure that can
#   clear a Cloudflare challenge (headless-browser render, non-cloud IP) —
#   a meaningfully bigger lift than a config change. Needs Ben's call.
#
# - **MobiHealthNews: FIXED, via a reader proxy** (found 2026-08-11 by the
#   08-09 mental-health coverage critic). This one has moved PAST the BHB
#   case: it now blocks a plain `curl` too, not just WebFetch's crawler
#   signature — even with a full browser user-agent it returns Cloudflare's
#   "Just a moment…" JS challenge, so the BHB workaround (same URL, plain
#   HTTP transport) does NOT work here. What does work is the r.jina.ai
#   reader proxy, which renders the challenge and returns clean text:
#       https://r.jina.ai/https://www.mobihealthnews.com/
#   Use that prefix for this outlet specifically. Note the escalation
#   pattern across the three fixed benchmarks — WebFetch-signature block
#   (BHB) → full non-browser block (MobiHealthNews) → domain-wide block
#   with no known route (Axios). Worth re-testing all three periodically
#   rather than assuming a fix stays fixed.
#
# - **Weekend shape (2026-08-11): three of the four mental-health daily
#   benchmarks are weekday-only B2B trade outlets** (BHB, Fierce, MobiHealth)
#   with a hard Saturday/Sunday publishing gap. A Sunday digest-day will
#   therefore show "no misses" against them almost by construction — that is
#   a real null result, not a passed check, and a Sunday's actual recall risk
#   sits with primary/academic/consumer-press channels the critic set does
#   not cover. Read a weekend "no misses" accordingly.

critics:
  ai:
    daily:
      - "The Rundown AI"        # therundown.ai
      - "TLDR AI"               # tldr.tech/ai
      - "The Neuron"            # theneurondaily.com
      - "The AI Daily Brief"    # aidailybrief.ai
    weekly_add:
      - "Import AI"             # importai.substack.com
      - "Last Week in AI"       # lastweekin.ai

  mental-health:
    daily:
      - "Behavioral Health Business"   # bhbusiness.com — closest trade match
      - "STAT Health Tech"             # statnews.com
      - "Fierce Healthcare"            # flagged in a coverage-gap review
      - "MobiHealthNews"               # flagged in a coverage-gap review
    weekly_add:   # ben-steer 2026-08-07: EBP is a first-class strand — the critic
                  # now has an academic recall baseline, not just trade press.
                  # Weekly tier because journals publish on journal cadence; a
                  # research finding that leads one of these and isn't in the
                  # week's digests is a logged miss like any trade-press miss.
      - "JMIR Mental Health"           # mental.jmir.org — direct digital-MH-intervention journal
      - "npj Digital Medicine"         # nature.com/npjdigitalmed — AI-in-clinical-care flagship

  global-capital:   # renamed from `money` 2026-07-30 (full rename, DESIGN.md Part 2)
    daily:
      - "Money Stuff (Matt Levine)"    # financial structure; circular-financing genre
      - "Axios Pro Rata"               # deals / VC / PE
      - "FT Unhedged"                  # markets / macro
      - "Bloomberg Technology"         # tech-capital news
    weekly_add:
      - "Odd Lots"                     # macro / market-plumbing, weekly-depth
