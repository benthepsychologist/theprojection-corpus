#       https://r.jina.ai/https://www.mobihealthnews.com/rss.xml
#   Prefer the feed URL for this outlet. This is the third escalation on
#   this one benchmark and the second time a working fix decayed rather
#   than broke outright — the "re-test periodically" advice below is not
#   theoretical.
#   Note the escalation
#   pattern across all four fixed benchmarks — WebFetch-signature block
#   (BHB) → full non-browser block (MobiHealthNews) → domain-wide block,
#   also resolved by the same reader-proxy class of fix once found
