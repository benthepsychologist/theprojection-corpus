data_gov:
  name: api.data.gov key family (GovInfo, Regulations.gov, ...)
  endpoint: https://api.govinfo.gov + https://api.regulations.gov
  auth: key(env:DATA_GOV_API_KEY)
  lenses: [ai, global-capital, mental-health]
  cadence: daily
  recall: full history
  perishability: durable
  status: candidate
  notes: "Key validated live vs GovInfo 2026-07-28 (covers the GOVINFO slot too — one key, whole family). Also validated vs api.congress.gov 2026-07-28 (200 — Congress.gov signup issues the same api.data.gov key; no separate CONGRESS_GOV_KEY needed). regulations.gov v4 400s on our param shape — encoding quirk to solve at collector build. Collectors not yet written."

semantic_scholar:
  name: Semantic Scholar (Graph API)
  endpoint: https://api.semanticscholar.org/graph/v1
  auth: key(env:SEMANTIC_SCHOLAR_KEY)
  lenses: [ai, mental-health]
  cadence: daily
  recall: full corpus
  perishability: durable
  status: wired
  collector: collectors/semantic_scholar.py
  notes: "Key validated + collector built 2026-07-28. Keyed tier = 1 req/s STRICT (429s readily; paced 1.1s, 3s-backoff retries). Lens-filtered IN-COLLECTOR to ai+mh (first collector to do so — the runner passes all lenses' terms). Date window param is publicationDateOrYear — publicationDateOrRange is silently ignored (verified live)."

github:
  name: GitHub (release watch, curated repo panel)
  endpoint: https://api.github.com/repos/{owner}/{repo}/releases
  auth: token(authctl github:default; GITHUB_TOKEN env overrides)
  lenses: [ai]
  cadence: daily
  recall: full release history
  perishability: durable
  status: wired
  collector: collectors/github.py
  notes: "Repos-not-search (the fred.py curated-panel pattern): 12 load-bearing AI-infra repos (vllm, llama.cpp, ollama, transformers, pytorch, triton, TensorRT-LLM, sglang, langchain, claude-code, codex, ComfyUI) — panel is source config, edit freely in the module. Ignores watch terms. Keyed 5000 req/hr via authctl; degrades to anon 60/hr."

lda:
  name: Senate LDA (lobbying filings)
  endpoint: https://lda.senate.gov/api/v1/filings/
  auth: token(env:LDA_API_KEY)
  lenses: [ai, global-capital, mental-health]
  cadence: daily
  recall: full register (quarterly filing cadence)
  perishability: durable
  status: wired
  collector: collectors/lda.py
  notes: "client_name sweep of ENTITY-bearing terms only (watchlist orgs/people; keyword thread terms skipped — the register is name-indexed). Filings post in quarterly bursts; most daily sweeps legitimately return zero. Registered tier 120 req/min (paced 0.6s). filing_year pinned to current year — December filings lag across New Year until widened."

fec:
  name: FEC (campaign-finance filings)
  endpoint: https://api.open.fec.gov/v1/filings/
  auth: key(env:DATA_GOV_API_KEY)
  lenses: [global-capital, ai]
  cadence: daily
  recall: full history
  perishability: durable
  status: wired
  collector: collectors/fec.py
  notes: "The OpenSecrets replacement (their API died 2025) — q_filer sweep of entity-bearing terms; ANTHROPAC + Meta PAC verified live 2026-07-28. Same api.data.gov key as GovInfo/Congress. url prefers pdf_url (human receipt) over fec_url (raw .fec). receipt_date is a datetime despite the date-named param — handled."

