# sources.yaml — the machine-readable source map.
# "Information about where things are and how to get them" — first-class product.
#
# Schema per source:
#   <source_id>:
#     name:          human name
#     endpoint:      base URL
#     auth:          none | key(env:VAR) | token(env:VAR) | membership
#     lenses:        [ai, global-capital, mental-health]  # which lenses it serves
#     cadence:       realtime | daily | weekly | monthly | quarterly | annual
#     recall:        how far back the source itself can answer (its own history)
#     perishability: durable | diffable | perishable
#     status:        wired | candidate | at-risk | retired
#     notes:         anything load-bearing
#
# perishability semantics (README §principle):
#   durable   — SoT keeps history; fetch on demand, keep nothing
#   diffable  — keep exactly one prior snapshot to compute deltas (prune-exempt)
#   perishable — needs real capture; DOES NOT BELONG IN THIS REPO (see kalshi-scanner)
#
# buffer retention: 30 days (Ben, 2026-07-20) — cache semantics; deleting
# buffer/ entirely must never lose anything.

# ── wired (proven in bizdev's collect-news.py; kestrel builds its own
#           collectors fresh — old code is reference reading, never imported) ──

gdelt:
  name: GDELT DOC API
  endpoint: https://api.gdeltproject.org/api/v2/doc/doc
  auth: none
  lenses: [ai, global-capital, mental-health]
  cadence: daily  # daily poll; source itself updates continuously
  recall: ~3 months (free DOC API); BigQuery archive for deeper backward crawl
  perishability: durable
  status: wired
  notes: >-
    Pace ~5.5s/req, retry 429s (observed 2026-07-20). Backward crawls past
    ~3mo use the GDELT BigQuery public dataset — gcloud auth verified
    working from this container 2026-07-20 (a personal Google account and
    GCP project; re-auth is interactive if the token ever dies again).

openalex:
  name: OpenAlex
  endpoint: https://api.openalex.org
  auth: key(env:OPENALEX_API_KEY) optional; mailto polite pool
  lenses: [ai, mental-health]
  cadence: daily
  recall: full corpus
  perishability: durable
  status: wired

