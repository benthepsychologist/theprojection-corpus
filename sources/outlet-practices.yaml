# sources/outlet-practices.yaml — LAYER 3 of the credibility stack:
# our own observations of an outlet's PUBLISHED PRACTICES.
#
# Rubric (published BEFORE any rating shipped, which is this layer's own
# gate): https://theprojection.org/methodology/
#
# These are transparency indicators, NOT accuracy or quality. An outlet can
# score 7/7 and publish badly; a one-person specialist newsletter can be the
# best source on a beat and score 2/7. What a high count means is that the
# outlet has made itself accountable — you can find who wrote a piece, who
# owns the publication, and how to get an error fixed.
#
# `null` on an indicator means COULD NOT CHECK (the page was blocked), not
# 'does not have'. Nulls drop out of the denominator so a badge reads 3/4
# rather than penalising an outlet for bot-blocking.
#
# Lives in its own file because sources/outlet-credibility.yaml is
# REGENERATED from external data on every rebuild — these observations must
# survive that, so the builder merges this in rather than owning it.

meta:
  rubric: https://theprojection.org/methodology/#layer-3--published-practice-indicators
  checked: '2026-08-11'
  indicators:
  - masthead
  - bylines
  - corrections
  - ownership
  - standards
  - ad_separation
  - primary_sourcing
  principle: observable published practices only — never a judgement about accuracy, bias or quality
  null_means: could not be checked (page blocked); dropped from the denominator, never counted as absent
  domains_rated: 37
  domains_not_rated: 2
