# sources/feeds.yaml — the RSS set, per lens.
#
# WHY THIS EXISTS (see attention/watchlist.yaml header): RSS only tells us
# what a publisher chose to push — it's the "what got published" layer,
# complementary to the query-based sweep collectors (GDELT/OpenAlex/EDGAR/
# etc. in sources.yaml) that hunt for watchlist terms everywhere.
#
# Schema per lens: a flat list of
#   { name: <human name>, url: <feed url>, axis: <coverage role>,
#     status: dead (only present when dead), note: <why/when, if dead> }
#
# `axis` = the feed's coverage role within the lens (a coarse category for
# the audit breakdown, not the board.yaml capital/optionality/gravity axes):
#   official    — the org's own blog/newsroom (primary-source, low volume)
#   press       — trade/tech journalism covering the lens
#   newsletter  — curated digest (several are also coverage-critic baselines
#                 in sources/benchmarks.yaml — the critic's daily/weekly_add
#                 lists overlap this axis on purpose)
#   research    — paper/preprint feeds (arXiv, agency research news)
#   policy      — government/regulatory newsroom feeds
#
# PROVENANCE: bizdev's reference monitoring-feeds.yaml was the intended
# one-time seed source per BOOTSTRAP.md §Seeding, but /workspace/bizdev does
# not exist in this container (checked 2026-07-28 — no such path, nothing
# matching *feed* under /workspace). Built fresh instead: every URL below
# was HEAD/GET-probed live (stdlib urllib, kestrel UA, 10s timeout) on
# 2026-07-28 before being added — see the collectors/rss.py audit output.
# `mental-health` deliberately reuses the two named trade publications from
# sources/benchmarks.yaml's critic baseline (Behavioral Health Business,
# Fierce Healthcare's mh-adjacent coverage) per this week's steer to prefer
# Google-News-independent sources.
#
# PRUNE DISCIPLINE (BOOTSTRAP.md): dead feeds are marked `status: dead` with
# a note, never silently deleted — a loud skip, not a quiet drop.
#
# Checked-but-no-working-feed-found (not listed as entries — no real URL to
# preserve, so nothing to mark dead): Anthropic (no public RSS as of
# 2026-07-28) · Meta AI blog (ai.meta.com has no /feed; About Meta's general
# newsroom feed exists but isn't AI-specific — left out as noise, not
# signal) · SAMHSA newsroom · Psychiatry.org news room (both 404 on every
# guessed path, no <link rel="alternate" type="application/rss+xml"> found
# on their listing pages).

