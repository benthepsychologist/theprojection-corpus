# sources/outlet-credibility.yaml — domain-keyed credibility layer for
# published source lists (the ground.news-style badge data). ben-steer
# 2026-08-07: credibility FIRST, political lean parked indefinitely.
#
# Three layers, per the 2026-08-07 licensing audit (two crawler runs,
# license text fetched verbatim — see log.md 08-07 entries):
#   pc1  — Lin/Lasser/Lewandowsky/Cole/Gully/Rand/Pennycook 2023 ensemble
#          (PNAS Nexus 2(9):pgad286, CC BY 4.0 paper), data
#          github.com/hauselin/domain-quality-ratings (11k domains,
#          static snapshot, data pushed 2023-09-14). 0-1, higher=better.
#          USE pc1 ONLY — the CSV's component columns (afm_*, mbfc_*)
#          inherit their raters' restrictive terms; the PCA aggregate is
#          the authors' own published measure. License: informal
#          "feel free to reuse" in README (no formal stamp) — written OK
#          requested from the author 2026-08-07.
#          ✅ PUBLICATION CLEARED — ben-steer 2026-08-11, verbatim: "outlet
#          credibility can be public, no problem. even the stuff we're
#          waiting to hear back on. It already says feel free to use it. We
#          are oss on the web. We should feel free until we hear back.
#          permission granted." This SUPERSEDES the earlier keep-INTERNAL
#          hold on this line. pc1 and band may render on public pages.
#          The written-OK request stands and is still outstanding; if the
#          author answers with a restriction, this ruling is what gets
#          revisited — cite the paper (PNAS Nexus 2(9):pgad286, CC BY 4.0)
#          on any surface that renders pc1.
#   rsp  — Wikipedia perennial-sources tier (CC BY-SA 4.0, attribution
#          required on render), parsed from the 8 subpages via the
#          MediaWiki API on the build date. Live list; re-parse on
#          rebuild. Values: generally-reliable / no-consensus /
#          generally-unreliable / deprecated / blacklisted. Slash-joined
#          values = the outlet has MULTIPLE RSP entries with different
#          verdicts (e.g. forbes.com: staff journalism vs the contributor
#          platform) — a domain-level join can't split those; render as
#          "disputed/split" and link the RSP row, don't pick a side.
#   (layer 3, pending) — instance practice-indicator ratings for
#          gap_fill: candidate domains (trade press the ensemble
#          misses). Rubric TBD on the methodology page before any
#          rating ships; observable practices only, never truth verdicts.
#
# Fields per domain: pc1 · band (render hint: high>=0.8, solid>=0.6,
#   mixed>=0.4, low<0.4) · rsp · class: primary-source (government,
#   legislatures and courts; registries, preprint servers and journal
#   platforms; and an actor's OWN announcement channel — a news-credibility
#   badge is a category error for all of these, so render "primary source"
#   instead, and where both class and rsp appear CLASS WINS) · status:
#   unrated (+ gap_fill: candidate) · cited (times this domain appears as a
#   source on a published story page) · n30d (records in the 30-day buffer
#   at build time — counts drift between rebuilds, that's expected).
#
# ── REBUILD (2026-08-25, migrated off the local script) ────────────────────
#   cloud-researcher credibility --corpus . [--dry-run]
#
# Retired 2026-08-25 (INBOX/2026-08-25-cloud-researcher-credibility-verb-
# shipped/, closed kestrel issue #5): `sources/build_outlet_credibility.py`
# moved engine-side as `cloud-researcher`'s `credibility` verb — same
# three-layer design (pc1 ensemble, Wikipedia RSP, `class: primary-source`),
# same universe logic, same output shape. This corpus's own curated
# own-channel list now lives at `sources/outlet-classification.yaml`,
# which the shared tool reads if present. The local builder is deleted;
# nothing else in this repo referenced it.
#
# ── REBUILD (2026-08-11, retired) ───────────────────────────────────────
#   python3 sources/build_outlet_credibility.py [--dry-run]
#
# There is now a committed builder. The 08-07 build had none — it was
# assembled ad hoc against a prose procedure nobody could run, which is
# exactly why the layer went stale and why 224 of the 267 domains we
# actually CITE were missing from it.
#
# UNIVERSE CHANGED, and it is the substance of this rebuild: it was buffer
# frequency (n30d>=3), which silently excluded the domains we quote —
# aljazeera.com (22 citations), npr.org (11), sec.gov (9),
# washingtonpost.com (6) were all absent. They were never judged
# unrateable; they were never looked up. The universe is now
#   CITED-DOMAINS ∪ BUFFER(gdelt+rss, n30d>=3)
# because a domain we quote on a public page matters more than one that
# merely passed through collection. Buffer joins still exclude
# google_news_rss, whose urls are redirects rather than publisher domains.
#
# Result: 149 -> 400 domains, primary-source 6 -> 60, and citation coverage
# (the share of real story citations carrying any badge) 33% -> 77%.
#
# The builder should still move engine-side if this pattern spreads
# (kestrel INBOX brief, 2026-08-07).

