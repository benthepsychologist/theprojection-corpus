# sources/outlet-credibility.yaml — domain-keyed credibility layer for
# published source lists (the ground.news-style badge data). ben-steer
# 2026-08-07: credibility FIRST, political lean parked indefinitely.
#
# Three layers, per the 2026-08-07 licensing audit (two crawler runs,
# license text fetched verbatim — see log.md 08-07 entries):
#   pc1  — Lin/Lasser/Lewandowsky/Cole/Gully/Rand/Pennycook 2023 ensemble
#          (PNAS Nexus 2(9):pgad286, CC BY 4.0 paper), data
#          github.com/hauselin/domain-quality-ratings (11k domains,
#          static snapshot, data pushed 2023-09-14). 0-1, higher=better.
#          USE pc1 ONLY — the CSV's component columns (afm_*, mbfc_*)
#          inherit their raters' restrictive terms; the PCA aggregate is
#          the authors' own published measure. License: informal
#          "feel free to reuse" in README (no formal stamp) — written OK
#          requested from the author 2026-08-07; keep INTERNAL until it
#          lands or Ben rules otherwise.
#   rsp  — Wikipedia perennial-sources tier (CC BY-SA 4.0, attribution
#          required on render), parsed from the 8 subpages via the
#          MediaWiki API on the build date. Live list; re-parse on
#          rebuild. Values: generally-reliable / no-consensus /
#          generally-unreliable / deprecated / blacklisted. Slash-joined
#          values = the outlet has MULTIPLE RSP entries with different
#          verdicts (e.g. forbes.com: staff journalism vs the contributor
#          platform) — a domain-level join can't split those; render as
#          "disputed/split" and link the RSP row, don't pick a side.
#   (layer 3, pending) — instance practice-indicator ratings for
#          gap_fill: candidate domains (trade press the ensemble
#          misses). Rubric TBD on the methodology page before any
#          rating ships; observable practices only, never truth verdicts.
#
# Fields per domain: pc1 · band (render hint: high>=0.8, solid>=0.6,
#   mixed>=0.4, low<0.4) · rsp · class: primary-source (labs, registries,
#   preprint servers, journal platforms — a news-credibility badge is a
#   category error for these; render as "primary source" instead; where
#   both class and rsp appear, class wins the render) · status: unrated
#   (+ gap_fill: candidate where n30d>=8) · n30d (records in the 30-day
#   buffer at build time — inclusion floor n30d>=3; rebuilt counts will
#   drift, that's expected).
#
# Rebuild: re-download the CSV, re-fetch RSP subpages 1-8 wikitext, re-run
# the join against buffer/ (gdelt+rss files only — google_news_rss URLs
# are redirect links, not publisher domains). The builder should move
# engine-side if this pattern spreads (kestrel INBOX brief, 2026-08-07).

