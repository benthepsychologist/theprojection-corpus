# 50 CHARACTERS of the bullet's bold lead phrase (see the 08-21 sidecar's
# header for why the [:50] truncation is load-bearing).
#
# TWO entries, both on this afternoon's late catches, because both name a
# transmission channel rather than restating their own facts. Nothing
