softbank-s-record-1tn-retail-bond-gets-its-terms:
  mechanism: When the institutional bid for an AI-linked borrower thins, funding
    re-routes to retail at a higher coupon instead of stopping — and that re-routing
    prices the risk banks declined to hold.
  confidence: plausible
  scenarios:
  - direction: Prices at or above the top of the 4.3-4.9% range on 09-04, and
      later AI-linked Japanese issuance keeps leaning on retail rather than institutional
      books.
    why: 'The falsifiable form: the funding channel stays shifted, not just that
      one deal was dear. A below-range print would mean retail demand was strong,
      not institutions absent.'
    precedent: SoftBank's own April 2025 Y600bn retail bond — the prior Japanese
      record, same instrument used the same way — makes this deal measurable against
      a known coupon rather than a hypothetical.
  - direction: It clears inside the range, and bank reluctance proves to be about
      SoftBank's leverage and Arm concentration, not AI credit generally.
    why: SoftBank is an unusually leveraged borrower with a stalled-loan history
      this map tracks. Reluctance toward SoftBank is not reluctance toward the
      buildout; conflating them is the error here.
    precedent: The 2026-08-06 Q1 FY26 print — profit down 18%, Arm's slide erasing
      Y14T of pro-forma NAV — is already on `softbank-all-in` as an issuer-specific
      shock with no read-across to peers.
  context_note: Sits against the standing picture's AI-credit strand and `ai-circular-financing-risk`,
    which has run on argument rather than a printed price. 09-04 supplies the
    number.
texas-s-attorney-general-runs-against-data-centers:
  mechanism: 'Opposition reaches project economics through the subsidy line, not
    the moratorium line: campaigning to repeal a sales-tax exemption turns backlash
    into a cash-flow variable lenders can discount.'
  confidence: plausible
  scenarios:
  - direction: The exemption's status appears as a named sensitivity in Texas
      data-center financings, S-1 risk factors or rating commentary, whether or
      not Paxton wins.
    why: 'That is what this thread was opened to detect: the first lender or prospectus
      explicitly discounting for backlash. A campaign plank is upstream; the test
      is propagation into pricing.'
    precedent: Anthropic's coming S-1 was reported 2026-08-21 to name data-center
      opposition as a risk factor — the same propagation one step earlier, already
      on this thread's record.
  - direction: It stays rhetoric, the exemption survives the legislative session,
      and the episode reads as a primary-season position with no financing consequence.
    why: Repeal needs the Texas legislature, not an attorney general, and the
      state's revenue interest cuts the other way. The plank signals where politics
      is moving, not an enacted instrument.
    precedent: Abbott's 08-03 pause on new data centers pending the ERCOT/PUCT
      audit is the near-comparator whose financing effect is so far nil — announced,
      real, not visible in any priced instrument.
  context_note: '`ai-datacenter-sites` tracks the siting fights; this thread tracks
    whether they become a priced line item. The tax-exemption clause is what puts
    Paxton in the second category.'

# Added 2026-08-26 on the 08-25 finalize run, for the late-caught
# Canada retaliation bullet. Written because the item names a real
# transmission channel — a dated supply-side price shock arriving
# eight days before the 09-16 FOMC — rather than restating itself.
canada-answered-the-tariffs-dollar-for-dollar-and:
  mechanism: Retaliatory tariffs are a supply-side price shock with a known start date. Landing
    09-08, eight days before the FOMC, they raise goods prices into a Fed already split between
    holding and hiking.
  confidence: plausible
  scenarios:
  - direction: Tariffed categories show discrete price steps in the September/October prints,
      hardening the hike-dissent bloc and pushing any cut further out.
    why: The falsifiable form is category-level, not headline — steel, aluminium, dairy and
      appliances are narrow enough to trace. Headline moving without them would not implicate
      the tariff.
    precedent: 'The 2018-19 US-China and US-Canada rounds are the measurable case: tariffed
      categories showed discrete price steps while headline CPI barely moved, which is why
      the category test is the honest one.'
  - direction: It never reaches consumer prices — the list is suspended or narrowed before
      09-08 and works purely as a negotiating instrument.
    why: Trump conceded on the record that the US added eleventh-hour conditions, which reads
      tactical rather than structural. Tactical fights are the kind that settle before the
      effective date.
    precedent: Canada's 2018 counter-tariffs ran about a year and were lifted in a May 2019
      settlement with no durable inflation signature — the same instrument, used the same
      way, resolved by negotiation.
  context_note: 'Reads against the standing rate_regime: a hawkish hold at 3.50-3.75% with
    three dissents FOR a hike, against a July payroll FALL of 23,000. A tariff pulls those
    two readings further apart.'
