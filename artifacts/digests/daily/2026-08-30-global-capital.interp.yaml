# 2026-08-30-global-capital.interp.yaml — Global Capital's per-item
# interpretations (DESIGN.md Part 2 §8), keyed by slugify() of the FIRST
# 50 CHARACTERS of the bullet's bold lead phrase.
#
# TWO entries today, on the two items with an identifiable transmission
# mechanism and a real fork in front of them. Nothing for the
# S-1/Moonshot/Mistral negatives (absences, already characterised as
# such, carrying no mechanism), nothing for SoftBank's bond or Broadcom's
# guidance (restatements of an existing record), and nothing for the
# Starbase Louisiana commitment — a real capital fact, but a commitment
