sk-telecom-carved-its-ai-data-centre-business-into:
  mechanism: When long-end borrowing costs stay above 5%, buildout financing
    migrates from bank and vendor credit into private-capital equity in the
    operating asset, because equity is not repriced by the curve.
  confidence: plausible
  scenarios:
  - direction: More carriers and utilities carve AI data-centre assets into
      separate vehicles with manager equity, rather than funding them on the
      parent balance sheet.
    why: 'The falsifiable form: the structure repeats at other operators, not
      just that this one deal happened. Continued parent-balance-sheet builds
      at comparable scale would refute it.'
    precedent: Nvidia''s own 10-Q filed 2026-08-26 discloses $500bn+ of planned
      third-party capital through Apollo, BlackRock, Blackstone, Brookfield,
      Goldman and KKR — the same managers, the same substitution, one layer up.
  - direction: It stays a Korea-specific financing choice driven by SK Telecom's
      own leverage and regulatory position, and does not generalise.
    why: SK Telecom is a carrier with a particular capital structure, and Korean
      telecom regulation shapes what it can hold; a single transaction is not a
      market-wide shift in funding channel.
    precedent: Oracle funded its Stargate-linked buildout on its own balance
      sheet through 2026 and took the pipeline-delay hit directly — the
      counter-pattern, same sector, same period.
  context_note: Read against capital-context's cross-border credit reading —
    claims rose to $47.62T in Q1 — so bank capacity is expanding, not
    contracting. The substitution is about price, not availability.
