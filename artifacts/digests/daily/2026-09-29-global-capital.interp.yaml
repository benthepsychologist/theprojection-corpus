# Interpretations for 2026-09-29 global-capital, keyed by
# slugify(bold lead[:50]). Read against attention/capital-context.yaml
# (asof 2026-08-25, about five weeks stale; used for its described pattern
# only) and this map's fed-independence-fight thread.

us-consumer-confidence-fell-6-7-points-to-81-9-in:
  mechanism: >
    A fuel-cost squeeze is now showing up in household sentiment: the
    Conference Board says consumers' mentions of prices, oil and gas hit
    new highs and that they expect business conditions and the labor market
    to weaken over six months, while job openings (7.1 million) and layoffs
    (1.6 million) show no labor-market break yet. That combination is the
    stagflation-shaped mix the oil-driven rise in yields has been pricing.
    It bears on the Fed's 10-28 decision because the committee, which hiked
    25bp on 09-16, is weighing an inflation impulse from oil against
    softening demand signals, and soft sentiment alone has not stopped it
    from tightening.
  confidence: plausible
  scenarios:
    - direction: >
        Sentiment weakness does not change the Fed's path, and October hike
        odds stay high while long-end yields keep climbing.
      why: >
        The hard labor data (openings little changed, layoffs flat) gives no
        recession signal, and oil-led price pressure is what consumers
        themselves cite.
      precedent: >
        The FOMC hiked 25bp on 09-16, 12-0, after July payrolls fell 23,000,
        July retail sales fell 0.6% and August sentiment printed 51.0, all
        recorded in capital-context.yaml's rate_regime reading.
    - direction: >
        A further slide in confidence and spending data starts to pull
        October hike odds down, easing the long end even with oil high.
      why: >
        Expectations components are already deep in negative territory and
        consumers expect the labor market to weaken; if that reaches payrolls
        in the 10-02 report, the case for a second hike weakens.
      precedent: >
        The 08-07 payrolls miss, which capital-context.yaml records as the
        sharpest challenge to the hawkish read, produced relief in yields
        before the Fed then hiked anyway, so the branch needs hard labor
        data and not sentiment alone.
  context_note: >
    capital-context.yaml's rate_regime (asof 08-24) predates the 09-16 hike
    and the current 5.24% 10-year; it describes the same
    cooling-data-versus-hawkish-Fed tension but not today's level. The next
    /week refresh should fold in the hike, the 10-year at a two-decade high
    and today's confidence print.

new-york-fed-president-williams-said-one-more-rate:
  mechanism: >
    Williams is a permanent FOMC voter, and his text splits the market's
    worry in two. He says one more hike "may be appropriate late this
    year" and sees inflation at 3.5% in 2026 because of energy and
    AI-related goods prices, which keeps the hike path alive. But he also
    says there is "no need for urgency" after the 09-16 hike, which argues
    against the near-70% October hike odds the CME FedWatch tool showed
    before he spoke. Long yields depend on both the expected policy path
    and the inflation risk premium that oil adds, so the speech can pull
    the front end down (the 2-year eased to about 4.90%) without settling
    the 30-year, which had just touched 5.61%.
  confidence: plausible
  scenarios:
    - direction: >
        October hike odds fade toward one hike by year-end, the 2-year yield
        stays near 4.90% and the long end stops rising unless oil rebounds.
      why: >
        A voter who anchors the committee has signalled a slower path, and
        the SPR loan plus recovering Saudi exports are trimming oil, the
        input that has been driving the inflation forecasts.
      precedent: >
        The 09-16 hike was followed by a run of higher yields only after
        officials such as Williams on 09-24 called another 2026 hike
        reasonable (this map's 09-24 record: CNBC citing CME FedWatch had
        October odds at about 53% Wednesday morning, about 70% at
        Wednesday's close and 77.5% Thursday morning, with Reuters nearer
        70% by Thursday afternoon), which shows that a voter's words can
        move the odds by several points within a session.
    - direction: >
        A hot PCE report on 09-30 or a firm payrolls print on 10-02 revives
        October hike pricing despite Williams's "no urgency", and the
        30-year keeps making 24-year highs.
      why: >
        Williams himself says the inflation risk has increased and that he
        expects longer-lasting energy effects; other officials, including
        Goolsbee as reported by investingLive, are arguing against looking
        through supply shocks.
      precedent: >
        Monday 09-28's 5.24% 10-year close (Treasury par curve, in the
        09-28 digest) came as oil jumped, before Trump's denial of sanctions
        relief, so the recent yield climb has tracked oil headlines more
        than Fed language.
  context_note: >
    capital-context.yaml's rate_regime (asof 08-24) predates the 09-16 hike
    and the 09-29 yield highs; it describes the same cooling-data versus
    hawkish-Fed tension but not the current levels. The Williams precedent
    for 09-24 rests on the CNBC and Reuters odds readings logged in this
    map's treasury-long-end-intervention thread and 09-24 digest, not on
    the speech text itself.

france-s-public-debt-reached-a-record-119-of-gdp:
  mechanism: >
    France's debt is now rolled at much higher rates than it was issued, so
    the arithmetic worsens on its own: redemptions rise to a record
    EUR189.2 billion in 2027 and the agency's debt-service bill rises to
    EUR72.9 billion from EUR62.6 billion, with a record EUR340 billion to be
    sold into a market where France's premium over German bonds is already
    the widest since 2012. The agency's plan assumes the 10-year yield eases
    to 4.3% from about 4.8%, so the plan itself depends on the rate backdrop
    calming, which in turn depends on the global long-end selloff that this
    map's cross-border-rates thread tracks. Supply on that scale meets a
    budget bill that goes to a divided parliament on Thursday and a
    presidential election next spring, which is why the premium, not the
    level, is the number to watch.
  confidence: plausible
  scenarios:
    - direction: >
        The premium over Bunds stays above 100 basis points and the OAT
        makes new post-2008 highs around the budget votes, pushing the
        agency's 4.3% assumption out of reach.
      why: >
        Record issuance, a deficit target the government has already
        acknowledged slipping, and a budget that needs a hostile parliament
        all add supply and political risk together.
      precedent: >
        On 09-22 the OAT traded about 102 basis points over the Bund, and on
        09-24 France's 10-year reached an 18-year high near 4.7% as
        strategists warned the budget fight could topple the government
        (both logged in the cross-border-rates thread).
    - direction: >
        The premium narrows if US and German long yields stop rising, and the
        OAT eases toward the agency's assumed range without a budget shock.
      why: >
        France's spread has moved with the global bond selloff and with oil,
        so a pause in US long-end yields would take pressure off before the
        issuance calendar starts.
      precedent: >
        On 09-24 the 10-year OAT closed down 5.7 basis points after a 4.719%
        intraday high while US yields were still rising (CNBC tracker, in
        the cross-border-rates thread), showing French yields can retrace in
        a session when the day's global move fades.
  context_note: >
    capital-context.yaml (asof 08-25) predates the long-end selloff and has
    no France reading. The 4.8% "current" 10-year is the agency's figure via
    Reuters; other vendors today show 4.73% to 4.74%, so the level is a range
    and the premium is the firmer read.
