fed-governor-christopher-waller-said-he-would-supp:
  mechanism: >
    A rate decision is priced off the committee's expected vote, and a
    governor pre-announcing a hold before the data is a public claim on
    that vote. What makes this one structural rather than a data reaction
    is who is speaking: a sitting governor against a chair whose regime is
    low guidance, on a committee whose composition is itself being fought
    over (the Cook removal). The market repriced twelve points on words,
    not numbers, which means the words were the missing information.
  confidence: plausible
  scenarios:
    - direction: >
        Waller is the visible edge of a larger hold bloc, tomorrow's payrolls
        come in soft, and September becomes a hold — the long end rallies on
        the removal of hike risk even as the term-premium and oil stories
        keep the 30-year above 5%.
      why: >
        Checkable on 09-04 and 09-16: a payrolls print near the low end of
        previews (+50,000) followed by no hike would confirm Waller was
        reading the committee, not freelancing; the vote split at the
        meeting is the direct test of how many governors he speaks for.
      precedent: >
        September 2024: Waller's own pre-meeting speech ("the time has
        come") preceded the 50bp cut, and the market repriced the size of
        the move on his remarks days before the decision — the same
        governor performing the same signalling role, in the other
        direction.
    - direction: >
        Waller is isolated, the three-dissent hawkish bloc holds, and a hot
        CPI on 09-10 puts the hike back — the twelve-point move reverses and
        the episode reads as a failed attempt to steer a Warsh committee
        from the outside, widening the visible split rather than resolving
        it.
      why: >
        The tell is whether any second governor echoes him before the
        blackout; a solo voice against a chair in a low-guidance regime has
        historically moved odds for days, not weeks. The CPI print is the
        condition Waller himself attached.
      precedent: >
        Late 2022, when Governor Brainard's "premature" remarks on pace were
        followed within a week by hawkish counter-speeches from regional
        presidents and the pricing snapped back — a single dissenting voice
        moving the odds until the majority spoke.
  context_note: >
    `capital-context.yaml` records the rate regime as a hawkish hold with
    three dissents FOR a hike and a composition fight over Cook. Today adds
    the opposite pressure from inside the Board for the first time; the
    reading should carry both blocs, not one, by the next refresh.

brent-closed-above-95-on-wednesday-for-the-first:
  mechanism: >
    An intraday round trip from $95 to $99 and back on the same news flow
    is what a market does when it cannot decide which series to price:
    strike frequency (rising — Kuwait and the UAE hit again) or transit
    volume (disputed — 17 million barrels per Washington, four tanker
    crossings per Kpler). Iran's blacklist adds a third series that neither
    side's number captures: counterparty exclusion. A vessel struck from
    the list is not counted as blocked, but its charterer will not sail it.
  confidence: plausible
  scenarios:
    - direction: >
        The blacklist becomes the binding constraint — shipowners and
        refiners self-exclude listed hulls and their ship-to-ship
        counterparties, transit volumes stay low regardless of escorts, and
        Brent grinds higher on a supply channel that no strike wave
        reopens.
      why: >
        Checkable in the list's growth rate and in who honours it: three
        Indian refiners and a major energy company already stopped using
        listed vessels by late August. If the count keeps rising toward the
        low hundreds and charter fixtures for listed hulls dry up, the
        constraint is commercial, not kinetic.
      precedent: >
        OFAC's shadow-fleet designations from 2023 onward: listing a tanker
        did not sink it, but within weeks it lost charterers, insurers and
        ports, and the effective supply loss exceeded any physical
        interdiction.
    - direction: >
        The escort convoys and the "tanker for tanker" doctrine work as
        advertised, transit counts recover toward the 40-a-day claimed on
        09-01, and the whipsaw resolves down — today's $99 print was the
        top of the strike-frequency trade.
      why: >
        The discriminating evidence is an independent count converging on
        the official one: if Kpler or Lloyd's List show crossings back in
        the dozens for a week, the volume series wins and the blacklist is
        being ignored in practice.
      precedent: >
        The 1987-88 reflagging operation, again — volumes recovered under
        escort while attacks continued, and the price of Gulf crude
        normalised months before the shooting stopped.
  context_note: >
    `conflict_risk_premium` in `capital-context.yaml` still reads off strike
    intensity. Today's session shows the market pricing three series at
    once; the reading needs the transit count and the blacklist size beside
    the strike count.
