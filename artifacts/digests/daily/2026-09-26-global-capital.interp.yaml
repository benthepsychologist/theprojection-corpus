# Interpretations for 2026-09-26 global-capital (afternoon pass, agent G,
# ~3pm ET Saturday), keyed by slugify(bold lead[:50]). Read against
# attention/capital-context.yaml (asof 2026-08-25, conflict_risk_premium
# reading) and this map's own red-sea-oil-shock / iran-conflict-widening
# threads, which already carry a precedent for exactly this pattern (a
# diplomatic signal reversing within the same window it was made).
# Saturday has no US market prints, so there is no same-day price reaction
# to check this against; the first test is Sunday evening's oil futures
# open.

president-trump-said-saturday-he-has-rejected-iran:
  mechanism: >
    Trump's on-camera rejection is the first on-the-record US answer since
    Friday's Wall Street Journal report (unnamed officials) and Iranian
    officials' repeated statements that Washington had not yet responded;
    it converts an attributed, second-hand account into a leader-level
    fact that oil desks can price directly rather than discount for source
    risk. The rejection itself, and Trump's framing that Iran is "losing
    so badly" and wants an immediate reopening only because it is short of
    oil revenue under the US blockade, reads as Washington signalling it
    sees no urgency to trade the blockade away — the same posture a US
    official gave NBC News on Friday ("we are not in a rush"). Absent a
    market open to test it against, the open question is whether Sunday
    evening's oil futures treat this as confirmation of the status quo
    (little move, since Friday's settle already priced "no deal yet") or
    as a fresh escalation risk (a move up, since a leader-level rejection,
    on the record, forecloses the near-term diplomatic exit the WSJ report
    had left open).
  confidence: plausible
  scenarios:
    - direction: >
        Oil futures open little changed to slightly higher Sunday evening
        (a small, not a sharp, move), because Friday's Brent/WTI settle
        already priced "no deal yet" off the WSJ report, and Trump's own
        framing (confidence the blockade is working, "not in a rush") is
        continuity rather than a new threat of imminent strikes.
      why: >
        The market had 36+ hours (Friday's WSJ report to Saturday
        afternoon) to digest the substance of a US rejection; an on-record
        confirmation of an already-priced expectation is a smaller
        surprise than the original report.
      precedent: >
        This map's own `iran-conflict-widening` thread recorded on
        2026-07-28 that "the pause is a headline, not a state" — Trump's
        "good talks" comments and an actual missile attack landed the same
        day, and Brent round-tripped a nearly 9-point range (from -4.8% to
        +4.3%) within hours once the diplomatic read flipped; a rejection
        that confirms rather than reverses the prior day's pricing is the
        milder analogue of that pattern.
    - direction: >
        Brent and WTI open higher Sunday evening and the move holds into
        Monday's cash session, because a leader-level, on-camera rejection
        (not an anonymous-official leak) forecloses the seven-day
        reopening path markets had been pricing some probability of, and
        raises the odds Trump's own "renewed bombing after the midterms"
        framing (per the WSJ) becomes the operative scenario.
      why: >
        Traders price attributed statements more heavily than anonymously
        sourced ones; Friday's rally-on-hope settle (Brent -2.1% to
        $104.32) reflected optimism this map's own Friday coverage flagged
        as resting on an unconfirmed report, so the confirmation that the
        hope was misplaced is itself new information.
      precedent: >
        `red-sea-oil-shock`'s 2026-07-23 entry: Brent jumped 7% the day
        Houthi tanker strikes and a blockade declaration turned an
        ambiguous risk into a confirmed, on-the-record fact pattern —
        confirmation of a downside scenario previously discounted as
        uncertain moved price sharply that day.
  context_note: >
    capital-context.yaml's conflict_risk_premium reading (asof 08-25) is a
    month stale and describes an earlier phase of the same war (Iran-Oman
    "final drafting," six IRGC conditions); it is used here only for the
    general pattern that diplomatic signals in this war have repeatedly
    reversed within the news cycle that produced them, not for any
    current-week detail. No Iranian on-record reaction to Trump's Saturday
    remarks was found by 3pm ET; Pezeshkian's own Saturday remarks to Al
    Jazeera ("we don't trust talks") predate Trump's rejection by several
    hours and are not a response to it.
