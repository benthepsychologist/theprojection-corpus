us-central-command-disabled-two-irgc-crude-carrier:
  mechanism: Kharg Island is the single node through which roughly 90% of Iran's crude leaves
    the country, and a US strike on a laden carrier in its waters converts the war's oil channel
    from an insurance-and-transit problem into a terminal-availability question — with the
    answer arriving on a weekend, so the first price to carry it is Tuesday's open, not Monday's,
    because 09-07 is Labor Day. Brent had already posted its steepest weekly gain in months
    (+7.6%, settling at $92.68 on Friday) on the Gulf-base strikes and a Hormuz transit collapse
    and frames the premium as a shipping and underwriting story; this is the first event that
    could reprice the export terminal itself.
  confidence: plausible
  scenarios:
  - direction: Brent gaps above $95 at Tuesday's open and holds, because the market reads
      a strike at Kharg as a signal that the terminal is now a target class, and the underwriting
      layer widens Gulf war-risk premia again.
    why: 'Checkable in the first two sessions: the size of the gap, whether it retraces as
      the 09-02/03 whipsaws did, and whether any war-risk underwriter names Kharg in a premium
      notice.'
    precedent: 'June 2025: the twelve-day Israel-Iran war produced a Brent spike of about
      10% on the first strikes, which fully retraced within a week once it was clear export
      infrastructure at Kharg had not been hit. The distinguishing fact this time is that
      it has been — disabling a carrier in its waters, not the terminal — so the precedent
      bounds the retrace case rather than the spike case.'
  - direction: 'The move is a tanker story, not a terminal story: three shadow-fleet vessels
      disabled or destroyed changes Iran''s export capacity at the margin, Brent reopens near
      Friday''s $92.68 settle, and the premium stays in shipping and insurance where the snapshot
      already has it.'
    why: Checkable in whether independent ship-tracking shows Kharg loadings continuing through
      the week; CENTCOM's own framing — disable, not sink, no spill — argues it wanted the
      vessels, not the terminal.
    precedent: null
  context_note: Written against a conflict_risk_premium snapshot that frames the oil channel
    as shipping and underwriting, and a red-sea-oil-shock thread whose last Brent read is
    Friday's $92.68 settlement, +7.6% on the week. The IRGC-on-US-Navy exchange is the world-news
    half of the same event, on iran-conflict-widening; this bullet carries the capital read
    only.
