president-trump-told-reporters-on-the-white-house:
  mechanism: >
    Trump's South Lawn claim — a "record amount" of oil moved through
    Hormuz overnight, with prices set to fall once the war ends — and
    Bessent's Fox claim (above), made the same day, describe the same
    strait's oil flow in opposite terms: Bessent frames Iran's own
    export outlet to China as closing (a shrinking, sanctions-driven
    supply of Iranian barrels specifically); Trump frames the strait's
    total throughput as already at a record, driven by the US-secured
    shipping lane and Saudi Arabia's own rerouted exports (a story this
    map has independently tracked since 09-21, corroborated by
    Bloomberg/CNBC, of Saudi exports rising toward 6 million bpd). The
    two claims are not strictly contradictory — Iran's specific export
    channel could be closing while the strait's aggregate volume rises
    on Saudi supply — but they carry opposite price implications and
    neither official's specific figure (Bessent's "15 million barrels,"
    Trump's unspecified "record") is corroborated by independent
    tanker-tracking or customs data as of this pass. Both statements
    function as pre-positioning for Sunday evening's futures reopen, the
    first actual price test either framing will face.
  confidence: plausible
  scenarios:
    - direction: >
        Futures open flat-to-lower, tracking the corroborated Saudi
        supply-surge story rather than either administration claim,
        because the Saudi export data has independent wire sourcing
        (Bloomberg, CNBC) that neither Bessent's nor Trump's Sunday
        remarks have.
      why: >
        Traders have historically weighted verified flow/customs data
        over administration rhetoric on this conflict; a real, sourced
        supply increase should dominate two dueling, unsourced claims
        made on the same news cycle.
      precedent: >
        This map's own `red-sea-oil-shock` thread has recorded price
        firming tracking verified supply/demand data (the Libya
        pipeline reopening, the Saudi Gulf-of-Oman rerouting) more
        reliably than it has tracked one-off rhetorical claims from
        either side of the conflict.
    - direction: >
        Futures open higher on continued Hormuz/Iran risk premium,
        because both claims are Sunday-news-cycle messaging rather than
        tradeable data, and the standing sanctions-squeeze narrative
        (Bessent's, and this map's own tracking since Operation Economic
        Outcast was announced 08-24) has proven stickier with traders
        than one-off supply claims from the administration.
      why: >
        Oil desks have repeatedly discounted unverified administration
        oil-flow claims on this conflict before (see the capital-context
        note above on uneven price reactions to diplomatic/sanctions
        signals); the risk premium from an active blockade and an
        unresolved Hormuz standoff is the more persistent input.
  context_note: >
    No independent tanker-tracking, customs, or third-party flow data
    corroborating either Bessent's "15 million barrels" or Trump's
    "record amount" was found as of this pass (~15:30 ET Sunday). The
    Saudi 80%/6-million-bpd export-surge figure is real and independently
    sourced (Bloomberg 09-24, CNBC 09-25) but is a distinct claim about
    Saudi Arabia's own exports, not a corroboration of either official's
    Sunday statement.
