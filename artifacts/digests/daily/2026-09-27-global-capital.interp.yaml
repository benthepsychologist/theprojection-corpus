treasury-secretary-scott-bessent-said-sunday-that:
  mechanism: >
    Bessent's claim quantifies, for the first time by a named US official,
    how much of Iran's sanctioned oil-export channel to China remains open
    — "15 million more barrels ... on the water" and a roughly two-week
    delivery horizon — as part of the administration's declared sanctions
    campaign (Treasury's "Operation Economic Outcast," announced 08-24) to
    cut off Iran's remaining revenue. China has been the one buyer this
    map's own coverage has repeatedly named as still taking Iranian oil
    despite the broader blockade; if the volume and timeline Bessent
    describes are accurate, the one channel keeping any Iranian oil moving
    closes within the window this map is already watching for the next
    price test (Sunday evening's futures open). The claim is Bessent's own
    number, not sourced to tanker-tracking (Kpler/Vortexa-style) or Chinese
    customs data in any coverage found this pass, so it functions as
    sanctions messaging with a specific, checkable prediction attached
    rather than as confirmed trade data.
  confidence: plausible
  scenarios:
    - direction: >
        Sunday evening's oil futures treat the claim as confirming an
        already-priced supply squeeze — a continuation of Friday's settle
        rather than a fresh jump — because the market has been pricing a
        tightening Iran-sanctions channel for weeks and a Treasury
        official's timeline on an outlet already assumed to be closing is
        incremental information, not new information.
      why: >
        Brent/WTI's recent settles already reflect the blockade and
        sanctions regime as an ongoing supply constraint; a specific
        two-week number on a channel already understood to be shrinking
        confirms direction without changing it.
      precedent: >
        This map's own `red-sea-oil-shock` thread recorded Brent firming
        gradually, not jumping, on prior confirmations of tightening
        supply that the market had already been discounting (e.g. the
        08-09 IRGC rejection of interim terms firmed price without a sharp
        one-day move) — distinct from the sharper repricings that followed
        genuinely new shocks (the 07-23 Houthi tanker strikes, a ~7% jump).
    - direction: >
        Futures largely shrug off the claim on the Sunday-evening open,
        treating it as sanctions messaging rather than a tradeable fact,
        because neither the 15-million-barrel figure nor China's compliance
        with an end date is independently confirmed, and a Treasury
        secretary predicting Iran's near-term economic exhaustion is not
        itself new (Bessent made a similar "on their knees" case publicly
        at the G20 finance ministerial in August, and Treasury's broader
        "Operation Economic Outcast" campaign was announced over a month
        ago without a market-moving reaction on the announcement itself).
      why: >
        Oil desks have historically waited for confirmable flow data
        (tanker-tracking, customs releases) rather than administration
        timelines before repricing off an Iran-sanctions claim, and this
        specific figure has no independent corroboration as of this pass.
  context_note: >
    capital-context.yaml's conflict_risk_premium reading (asof 08-25) is a
    month stale and describes an earlier phase of the same war; it is used
    here only for the general pattern — that this war's diplomatic and
    sanctions signals have moved price unevenly, sometimes confirming what
    was already priced and sometimes producing a sharp repricing — not for
    any current-week detail. No Chinese government or state-refiner
    response to Bessent's remarks was found by 15:20 ET Sunday, and no
    tanker-tracking or customs figure corroborating "15 million barrels"
    was found in any coverage checked this pass.

