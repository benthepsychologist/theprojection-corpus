# Interpretations for 2026-09-30 global-capital, keyed by
# slugify(bold lead[:50]). Read against attention/capital-context.yaml
# (asof 2026-08-25, about five weeks stale; used for its described pattern
# only) and this map's fed-independence-fight thread.

core-pce-inflation-cooled-to-3-0-in-august-below:
  mechanism: >
    A lower-than-forecast core reading (3.0% against 3.3%) removes the
    near-term case for an October hike, which is why the 2-year yield fell
    about 5 basis points and hike odds dropped from roughly a coin flip to about 37%.
    Two caveats keep it from settling the long end: BEA changed how it
    measures legal services, software and portfolio management, so part of
    the miss may be method rather than price behaviour, and the data
    predate September's diesel and gasoline surge, which Navy Federal's
    chief economist expects to push the next print higher. ADP (90,000 jobs)
    and the second-quarter GDP revision to 2.2% also keep a December hike
    priced, so the effect is on timing more than direction.
  confidence: plausible
  scenarios:
    - direction: >
        October hike pricing keeps fading and front-end yields ease, while
        the 30-year stays near 5.6% because oil and issuance, not the next
        meeting, are driving it.
      why: >
        Two days of Fed-speak and data (Williams's "no urgency" on 09-29,
        this print) moved October odds from about 71% to about 37%, but
        Tuesday's 30-year still closed at 5.59% on Treasury's par curve.
      precedent: >
        On 09-29 the 2-year eased to about 4.90% after Williams spoke, yet
        the 30-year touched 5.61%, its highest since 2002 (this map's
        09-29 digest), showing the front end and the long end can diverge.
    - direction: >
        September inflation and the 10-02 payrolls report revive October
        pricing and push yields back up.
      why: >
        The August print predates the September fuel-price surge, and
        strong hiring data would leave the committee's case for further
        tightening intact.
      precedent: >
        After Williams called another 2026 hike reasonable on 09-24,
        CNBC citing CME FedWatch had October odds at 77.5% Thursday
        morning, up from about 70% at Wednesday's close (recorded in this
        map's treasury-long-end-intervention thread), so a hawkish signal
        can lift the odds several points within a session.
  context_note: >
    capital-context.yaml's rate_regime (asof 08-24) predates the 09-16 hike
    and today's data; it describes the same cooling-data-versus-hawkish-Fed
    tension without the current levels. The next /week refresh should fold
    in the hike, the 5.6% 30-year and this print.

hedge-funds-borrowing-from-banks-reached-nearly:
  mechanism: >
    Leverage turns a price drop into forced selling. When AI stocks fell
    this summer, Situational Awareness's lenders called margin and the fund
    had to sell about $20 billion of stocks to Citadel at a discount; with
    hedge-fund bank borrowing at about $3.7 trillion, the largest in over a
    decade, a similar shock in a crowded trade can spread from one fund to
    the banks that lent to it and to the stocks it held. Rising yields and
    an AI-earnings disappointment are the triggers the Bank of England and
    the Bank for International Settlements have both named recently.
  confidence: plausible
  scenarios:
    - direction: >
        Leverage stays high and nothing forces it lower, so the risk remains
        a tail that shows up only in a sharp AI-stock drawdown.
      why: >
        Morgan Stanley's talks on additional borrowing for the fund have
        resumed, and the SEC has proposed easing borrowing-disclosure rules,
        so neither lenders nor regulators are tightening yet.
      precedent: >
        The July episode itself: the fund's forced sale to Citadel spilled
        into specific names (Micron fell 4.3% to 6.0% on 07-31) but not into
        the indexes, which rose that day (Nasdaq +1.00%, Dow +0.53%) (this
        map's ai-trade-bear-turn and ai-circular-financing-risk threads,
        07-31).
    - direction: >
        A fresh drop in AI-linked stocks or a further jump in long-term
        yields hits another leveraged fund and lenders pull back together.
      why: >
        The long end is at 2002 highs and 30-year yields are near 5.6%,
        which lowers the value of collateral and raises funding costs at the
        same moment.
      precedent: >
        The summer's Situational Awareness margin calls followed a sharp
        fall in AI stocks and ended with the SEC subpoenaing four large
        banks in August.
  context_note: >
    capital-context.yaml (asof 08-25) has no leverage or prime-brokerage
    reading, so this entry rests on the Times report as summarized by Quartz
    and on this map's ai-buildout-debt-risk thread; the next /week refresh
    could add a leverage line.

federal-reserve-inspector-general-found-no-grounds:
  mechanism: >
    The report removes the only official finding that could have supported
    a for-cause case against Powell over the renovation: the inspector
    general found mismanagement but no criminal violation and no
    administrative misconduct. What remains are two other levers, a Justice
    Department decision by US attorney Jeanine Pirro to reopen her dropped
    probe, which she said in April she would not hesitate to do "should the
    facts warrant," and pressure from the White House on the Board. Markets
    price this through how much political risk they attach to the Fed's
    independence, which matters most now because the 30-year yield is at its
    highest since 2002 and the Fed raised rates on 09-16.
  confidence: speculative
  scenarios:
    - direction: >
        The report is treated as closing the renovation line of attack, and
        the Fed-independence discussion moves back to the rate path and the
        Cook removal fight.
      why: >
        Chair Warsh, Trump's own appointee, welcomed the findings and
        ordered an audit with the General Services Administration as project
        executive, which gives critics a remediation story without a
        dispute with the inspector general.
    - direction: >
        The Justice Department or the White House disputes the report, and
        the Powell matter re-enters the news as a removal or prosecution
        threat.
      why: >
        Pirro said she would review the report and had not ruled out
        reopening; Trump has insisted there was "criminality" and blames a
        "hostile" Board for this month's rate rise, and late Wednesday he
        wrote on Truth Social that Powell "should be forced to resign,
        IMMEDIATELY" and be sued by the government (NBC News), so the
        second path was already being pressed hours after the report.
  context_note: >
    capital-context.yaml (asof 08-25) predates Warsh's confirmation as
    chair and the 09-16 hike; this entry rests on this map's
    fed-independence-fight thread and on CNBC's and CBS's accounts of the
    report. Confidence is speculative because no market reaction to the
    report was observed in the reads available at about 3:30pm ET.

micron-reported-record-fiscal-fourth-quarter-reven:
  mechanism: >
    Micron's record quarter came from price, not volume: revenue rose 379%
    to $54.23 billion with an 87.0% gross margin because supply cannot keep
    up with AI-driven memory demand, and an analyst quoted by Benzinga
    noted that DRAM and NAND revenue growth far outpaced shipment growth.
    Management is now spending against that shortage, raising fiscal 2027
    capex mostly for construction that opens cleanroom space in late
    calendar 2028 and beyond, while saying more than 75% of 2027 output is
    already committed and that 26 multi-year customer agreements cover over
    35% of revenue through 2030. The flat after-hours reaction fits a
    market that had already priced a very strong print (the stock was up
    roughly 275% for the year, per CNBC) and is now weighing the capex
    bill. The mechanism worth watching is the lag: shortage pricing holds
    until new capacity lands, and the capex announced now is what ends it.
  confidence: plausible
  scenarios:
    - direction: >
        Memory stays tight through 2027 and 2028, margins stay near 85% or
        higher and the capex step-up is absorbed by cash flow.
      why: >
        New cleanroom space is not due until late 2028, supply is largely
        pre-committed, and operating cash flow was $43.97 billion in the
        quarter against $10.77 billion of capex.
      precedent: >
        The 2017 to 2018 memory upcycle, when contract DRAM prices kept
        rising for several quarters while the industry's new fabs were still
        being built.
    - direction: >
        Pricing rolls over once the 2028-era capacity arrives, or sooner if
        AI orders pause, and today's capex raise reads as the cycle's late
        signal.
      why: >
        Revenue growth is mostly price, so a modest rise in supply or fall
        in orders moves margins sharply; the capex is committed years ahead
        of the demand it is meant to serve.
      precedent: >
        The 2019 memory downturn, when DRAM prices fell and Micron's revenue
        dropped after the 2017 to 2018 capacity build.
  context_note: >
    capital-context.yaml (asof 08-25) has no memory-cycle reading; this entry
    rests on Micron's own release, CNBC's and Benzinga's accounts of the
    call, and this map's ai-memory-shortage thread. Short-seller Michael
    Burry's September 22 bet that chip prices fall when capacity arrives
    (in that thread) is the opposing view, not evidence for this entry.
