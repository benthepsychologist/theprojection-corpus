# Interpretations for 2026-09-24 global-capital (first pass ~10am ET, afternoon
# additions ~3pm ET Thursday), keyed by slugify(bold lead[:50]). Read against
# attention/capital-context.yaml (asof 2026-08-25, rate_regime reading) and this
# map's treasury-long-end-intervention, cross-border-rates and
# oracle-stargate-bet threads. Thursday levels are intraday reads.

new-york-fed-president-john-williams-said-thursday:
  mechanism: >
    With the Fed saying explicit forward guidance is over, every data print
    now reprices the October meeting directly: Wednesday's PMI, weak 5-year
    auction and Barr's hike call moved the odds from 55% to about 70%, and
    Williams' "reasonable" took them as high as 77.5% (later reads were about
    64% to 71%), which keeps short and long yields rising together instead of
    one offsetting the other.
  confidence: plausible
  scenarios:
    - direction: >
        October hike odds push toward 85% or more as claims and activity stay
        strong, and the 30-year holds above 5.4% into the 10-28 meeting.
      why: >
        Williams and Barr both put a further hike in their base case, and
        Thursday's 197,000 claims add a firm labor reading to the hot PMI.
      precedent: >
        09-16 to 09-18: after the Fed's hike the 10-year cleared 5% and closed
        at 5.01% on 09-18, extending over three sessions
        (`treasury-long-end-intervention`).
    - direction: >
        A softer data print or a drop in oil pulls hike odds back toward 60%
        and the 10-year eases below 5.1%.
      why: >
        The long end has tracked oil as much as the Fed; with no guidance, a
        soft print moves odds as fast as a hot one did on Wednesday.
      precedent: >
        09-22: the 10-year held at 4.96% through two hawkish Fed speeches
        because oil fell for a fifth session.
  context_note: >
    capital-context.yaml's rate_regime (asof 08-25) predates the 09-16 hike and
    the 3.75%-4.00% range; used for the reaction-function logic only. Odds are
    CME FedWatch as read by CNBC on Thursday morning; Reuters and CNBC reads
    later in the day were lower, about 64% to 71%.

france-s-10-year-borrowing-cost-rose-to-a-new-18-y:
  mechanism: >
    A fractured parliament, a tough 2027 budget and a rising ECB rate path
    raise France's risk premium: the OAT-Bund gap above 100bp, with more than
    half the debt held by foreign investors who may be less sticky, is being
    priced before the budget even reaches parliament, and the ECB is unlikely
    to buy bonds unless markets turn disorderly.
  confidence: plausible
  scenarios:
    - direction: >
        The OAT-Bund spread widens toward the top of ING's 100-125bp range as
        the draft budget goes to parliament in early October and a
        no-confidence vote before the 11-17 budget vote becomes plausible.
      why: >
        Opposition to the pension freeze and spending cuts is broad, and
        Eurasia Group says a tough draft risks toppling the government.
      precedent: >
        09-18: France's premium over Germany passed 100bp for the first time
        since the 2012 euro crisis, up from about half that before the 2024
        snap election (`cross-border-rates` 09-18 entry).
    - direction: >
        Lecornu forces the budget through with constitutional powers or a
        compromise, and the spread stabilises near 100bp.
      why: >
        Pre-election caution makes a government collapse costly for every
        faction, and Lecornu has used the clause before.
      precedent: >
        Lecornu did not pass the 2026 budget until February this year, using a
        constitutional clause that bypasses parliament (CNBC).
  context_note: >
    capital-context.yaml has no France reading; this uses the map's own
    cross-border-rates thread and CNBC's 09-24 read. OAT levels are Thursday
    intraday reads.

oracle-sent-the-blue-owl-owned-developer-of-its-pr:
  mechanism: >
    Lease-backed data-center debt is repaid from the anchor tenant's contracted
    payments, so a force majeure notice from that tenant, even a precautionary
    one, puts the cash flow behind the $18bn bank loan in doubt and hits the
    loan's price, which is already below 90 cents and prices how banks treat
    the next Stargate-scale lease.
  confidence: plausible
  scenarios:
    - direction: >
        The Project Jupiter loan slides further and lenders demand tighter
        terms on other lease-backed AI data-center debt.
      why: >
        Bloomberg says the notice could alarm the roughly 20 lending banks, and
        the loan was already stressed before it.
      precedent: >
        09-18: the $18bn Project Jupiter loan stalled in syndication at 89 to
        91 cents on the dollar, and on 09-22 the Jane Street-leased Oklahoma
        bond traded at 11.3% against 8.9% at issue.
    - direction: >
        Oracle and Blue Owl both restate their commitments, the notice reads
        as a protective legal step, and the loan stabilises near its current
        price.
      why: >
        Oracle says it is fully committed and Blue Owl says the notice does not
        change its financial commitments.
  context_note: >
    Bloomberg's own caveat is that it is not certain the maneuver would free
    Oracle from its obligations, and it says Oracle is seeking to defer
    payments rather than walk away as the main tenant; the loan price is one
    unnamed source's figure, and the developer (Blue Owl's Stack
    Infrastructure) is separately reported to be facing a delayed gas pipeline.

treasury-sold-44bn-of-7-year-notes-on-thursday-at:
  mechanism: >
    An auction's coverage, tail and indirect share measure whether end-buyers
    will take new supply at the prevailing yield without a concession. A
    near-average result a day after a weak 5-year sale says the market cleared
    at a small concession rather than needing a step up in yield, which limits
    the risk that supply alone drives the next leg, though indirect demand
    below its average leaves long paper dependent on yields staying near 5%.
  confidence: plausible
  scenarios:
    - direction: >
        Buyers keep absorbing supply at a modest concession, the 7-year stays
        in a 5.0% to 5.2% range, and the Fed's October path and oil, not
        auction demand, set the direction of yields.
      why: >
        The tail was about 0.7 basis point and dealers took a normal 12.5%;
        strong direct bidding offset thinner indirects.
      precedent: >
        09-23: the 5-year sale, with a 2.21 bid-to-cover and one of the largest
        tails on record, was followed by the 10-year's biggest one-day jump
        since April 2025 (CNBC), the outcome this result avoided.
    - direction: >
        A second below-average showing at the next long-end sale would put
        buyer depth, not Fed odds, at the centre of the selloff.
      why: >
        Indirect bidders took 57.2% against a 64.6% average and about 54% on
        Wednesday, two thin reads in two days.
  context_note: >
    capital-context.yaml's rate_regime (asof 08-25) predates the 09-16 hike, so
    it is used for the reaction-function logic only. The 0.7 basis point tail,
    the averages and the C- grade are BiFu's calculation against a 5.078%
    when-issued yield; the accepted amounts and bidder shares come from
    Treasury's own FiscalData record.

treasury-s-buyback-of-20-to-30-year-bonds-on-thur:
  mechanism: >
    A buyback swaps cash for specific older bonds, which steadies prices on
    those issues and improves liquidity but leaves the long end's overall
    supply and the Fed's rate path unchanged, so taking less than the ceiling
    in a rising-yield market means the programme's price effect is bounded and
    cannot by itself cap the 30-year.
  confidence: plausible
  scenarios:
    - direction: >
        Yields keep rising despite the operations, and Treasury enlarges or
        adds long-end buybacks to relieve the long end.
      why: >
        The 30-year rose about 7 basis points on the day of an operation that
        Treasury filled to about 68%, and officials have already enlarged the
        programme once.
      precedent: >
        08-19: Treasury doubled the buyback ceiling to $4bn per off-the-run
        issue, funded by a Treasury General Account cushion of roughly
        $935bn to $950bn (`treasury-long-end-intervention`).
    - direction: >
        The programme stays a sideshow and the 30-year is set by Fed hike odds
        and oil, holding near 5.4% to 5.5%.
      why: >
        $6bn is small against the market's size, as Oxford Economics noted, and
        yields kept climbing after earlier operations.
      precedent: >
        09-10 to 09-18: a week after the 10- to 20-year operation took $5.19bn
        of a $6bn cap, the 10-year cleared 5% and closed at 5.01% on 09-18
        (`treasury-long-end-intervention`).
  context_note: >
    The offers-to-ceiling ratio (about 1.7 times) is similar to 09-10's, so the
    smaller fill is not evidence of fewer sellers; Treasury has not published
    why it accepted 12 of 35 issues. Accepted and offered amounts are from
    Treasury's FiscalData buybacks record; the 5.469% 30-year yield is CNBC's
    3:10pm ET quote, an intraday read.

oracle-s-credit-default-swaps-hit-a-record-high-on:
  mechanism: >
    Oracle funds a buildout that outruns its free cash flow with debt and
    equity, so what lenders charge to hold or insure its paper sets its cost of
    capital directly. A record credit default swap price and an 8% yield on a
    Baa2/BBB- bond mean the market is pricing some chance of a downgrade toward
    junk, which matters because index rules would force sales of bonds that
    investment-grade funds must hold, and a higher funding cost for Oracle
    flows into how banks and private lenders price the next Stargate-scale
    lease.
  confidence: plausible
  scenarios:
    - direction: >
        The credit measures keep widening and Oracle's next debt or equity
        raise costs visibly more, tightening terms across lender-financed AI
        data-center projects.
      why: >
        The force majeure notice arrives while the $18bn Project Jupiter loan
        already trades below 90 cents on the dollar (Bloomberg) and Oracle
        told investors on 09-10 that several planned sites were not delivered
        in the first quarter.
      precedent: >
        07-20: Oracle's five-year credit default swaps reached about 2.03
        percentage points, an 18-year high (Bloomberg, ICE Data Services), and
        this week's record is a further step on the same path.
    - direction: >
        Oracle's statements that Jupiter is on schedule and its $664bn backlog
        hold, and the credit measures stabilise once the notice is read as a
        contractual protection rather than a retreat.
      why: >
        Oracle and Blue Owl both say the notice does not change their
        commitments, and Bloomberg says Oracle is not trying to walk away.
  context_note: >
    The record and the 8% yield are Zerohedge's figures as relayed by Seeking
    Alpha, which gave no CDS level, so treat the magnitude as unconfirmed;
    capital-context.yaml (asof 08-25) has no Oracle credit reading and is used
    for the reaction-function logic only. Prices for Oracle and Blue Owl are
    intraday reads from CNBC's quote feed at 3:39pm ET.

saudi-arabia-s-red-sea-export-hub-yanbu-had-still:
  mechanism: >
    Saudi Arabia's Hormuz workaround only helps the oil market if crude
    actually reaches tankers at Yanbu, and a pipeline that is pumping but not
    loading leaves the barrels stranded while war-risk insurance at 3% of
    vessel value makes each Red Sea voyage cost millions, so the bypass supplies
    less than its nominal 4 million barrels a day and keeps a supply premium in
    Brent.
  confidence: plausible
  scenarios:
    - direction: >
        Loadings restart within days as Aramco builds volumes, and Brent gives
        back part of Thursday's supply premium.
      why: >
        Kpler shows about six tankers scheduled to load from 09-24 to 09-27 and
        Aramco says it needs days to build volumes and finish pressure tests.
      precedent: >
        09-21: Reuters reported Saudi crude flows partially recovering as Gulf
        loadings increased, the last time exports improved after the 09-11
        shutdown.
    - direction: >
        A further Houthi strike near Yanbu or Taif or a slower repair keeps
        loadings halted, and Brent tests Thursday's $108 high.
      why: >
        Saudi forces intercepted six Houthi missiles aimed at Taif and Yanbu on
        Thursday, and it may take six weeks or more for the line to return to
        full capacity.
      precedent: >
        09-11: drone attacks shut the pipeline and stopped loadings, and Brent
        jumped nearly $3 in the following sessions (Reuters, 09-15).
  context_note: >
    capital-context.yaml's conflict_risk_premium (asof 08-25) predates the 09-11
    pipeline attack, so it is used for logic only. Loading status is from
    Reuters' industry sources and Kpler schedules, not Aramco, which did not
    immediately comment; insurance figures are OilPrice's summary of Reuters.

akamai-said-thursday-it-signed-an-11-6-billion-s:
  mechanism: >
    Structuring a compute buyer's commitment as a warrant on the vendor's
    stock, alongside cash revenue, makes the vendor's equity partly a bet on
    its own biggest customer staying solvent and paying out its full
    multi-year contract, the same customer-as-investor shape this map has
    tracked in Nvidia's guarantee and share position in Nscale; Akamai's own
    2026 capex rises to secure the memory and components the deal requires
    before the revenue is fully booked.
  confidence: plausible
  scenarios:
    - direction: >
        The deal expands toward its disclosed $20bn ceiling as Anthropic's
        compute needs grow, and Akamai's stock gain holds or extends past
        Friday's premarket spike.
      why: >
        Akamai's release frames $11.6bn as a floor with room to $20bn, and
        the warrant aligns Anthropic's incentive to keep expanding the
        relationship rather than diversify away from it.
      precedent: >
        Nvidia's $860.3m Nscale lease guarantee and warrant, paid partly in
        Series B shares, is the same structure at smaller scale
        (`nvidia-vendor-financing`).
    - direction: >
        Anthropic's own compute needs shift to other vendors or its own
        infrastructure, and Akamai's committed 2026 capex outruns the
        revenue this contract was meant to secure.
      why: >
        Akamai said guidance is unchanged for 2026, meaning the capex lands
        before match to revenue is proven, the same sequencing risk the
        Brookings AI-financing paper above flags for the sector generally.
  context_note: >
    capital-context.yaml has no reading on vendor-financing structures
    specifically; this draws on the map's own nvidia-vendor-financing thread.
    Terms are Akamai's own GlobeNewswire release; the premarket move (21%
    falling to about 14%) is CNBC's live blog, an intraday read.

french-president-emmanuel-macron-said-thursday-tha:
  mechanism: >
    War-risk insurance and stalled loadings at Yanbu are priced off the
    chance of another Houthi strike on the site; a French military presence
    (radar, air-defence systems) is a physical hedge against that chance,
    so if it is actually fielded it works on the same variable this map's
    own Yanbu coverage already tracks — the gap between the pipeline
    pumping and tankers actually loading.
  confidence: speculative
  scenarios:
    - direction: >
        French radar and air-defence assets are deployed and reduce the
        near-term odds of a further strike, and Yanbu's insurance premium
        and loading delay both ease faster than they would have otherwise.
      why: >
        Macron tied the commitment directly to protecting the site rather
        than to a broader Red Sea mission, and framed it as a response to
        the missile attacks already disrupting Yanbu.
    - direction: >
        The commitment stays a stated intention with no deployed hardware
        in the announcement itself, and Yanbu's insurance and loading
        picture keeps moving on Aramco's own pace and further Houthi
        attempts, unaffected by Thursday's remarks.
      why: >
        Macron gave no timeline, unit count or deployment date, and no
        French assets are reported as already in place at Yanbu.
  context_note: >
    No historical precedent offered — kept at speculative confidence per
    the discipline that above-speculative confidence needs one.
    capital-context.yaml's conflict_risk_premium (asof 08-25) predates the
    09-11 pipeline attack and has no France/Yanbu-military reading; this
    draws on the map's own red-sea-oil-shock thread instead.

the-federal-reserve-board-proposed-its-first-forma:
  mechanism: >
    The GENIUS Act requires payment-stablecoin issuers to hold reserves in
    short-dated, high-quality assets such as Treasury bills, so the Fed's
    proposed capital and reserve-asset rule sets how large and how strict
    that statutory bid for bills becomes for every Board-supervised issuer
    — the same reserve-rule-to-T-bill-demand mechanism this map logged when
    the GENIUS Act itself passed.
  confidence: plausible
  scenarios:
    - direction: >
        The rule finalizes close to Barr's described shape and issuance
        grows under it, and Board-supervised stablecoins become a durable,
        price-insensitive structural bidder for short-dated Treasuries.
      why: >
        A statutory reserve requirement forces each new stablecoin dollar
        into short-dated government paper regardless of yield, the same
        logic this map used for the GENIUS Act's reserve regime generally.
      precedent: >
        US money-market fund reform in 2014-16 forced prime funds into
        government-only paper and moved several hundred billion dollars
        into T-bills and reverse repo — a reserve rule rerouting a private
        float into the front end (`the GENIUS Act's reserve rule` entry,
        2026-08-30 digest).
    - direction: >
        The unresolved AML "significant or systemic" fight and the 60-day
        comment period delay a final rule for months, and today's proposal
        stays a procedural step with no near-term effect on issuance or
        bill demand.
      why: >
        Barr's own statement flags the AML standard as unresolved from a
        July proposal that has not been finalized either, and a proposed
        rule is not itself binding.
  context_note: >
    capital-context.yaml has no stablecoin-specific reading; this extends
    the map's own reasoning from the 2026-08-30 global-capital digest's
    GENIUS Act interpretation to today's concrete rulemaking. This bullet
    carries no owning thread — flagged in the 09-24 digest's Map changes
    section as a candidate rather than assigned a slug here.
