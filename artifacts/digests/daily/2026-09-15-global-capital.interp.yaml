the-10-year-treasury-yield-crossed-5-041-tuesday:
  mechanism: >
    Two forces are colliding on the long end at once. Treasury's own
    intervention — the TGA-funded, tripled long-bond buyback campaign
    disclosed in August and escalated through September — exists
    specifically to suppress long-end yields by acting as a standing
    buyer; capital-context.yaml's `rate_regime` reading has carried the
    "fiscal dominance" framing (monetary policy effectively subordinated
    to fiscal financing needs) since that disclosure. Running against it:
    a genuinely hawkish data backdrop — Friday's hot August CPI plus
    oil holding near $108 on the Saudi pipeline outage — that has pushed
    Fed-hike odds for tomorrow's FOMC decision from 65-68% at the start
    of the month to roughly 92% today. If the Fed actually hikes into a
    market where the buyback is simultaneously trying to hold yields
    down, tomorrow is the cleanest test yet of which mechanism dominates:
    a central bank tightening, or a Treasury balance-sheet operation
    trying to counter it.
  confidence: high
  scenarios:
    - direction: >
        The Fed hikes 25bp tomorrow and the 10-year does not retreat
        afterward — it holds near or above today's 5.041% print, or
        keeps climbing.
      why: >
        Would confirm the fiscal-dominance framing directly: a hiking Fed
        and an active long-end buyback campaign both operating on the
        same curve, with the hike winning the tug-of-war on level even as
        the buyback keeps bidding. That is the "coordinated or in
        tension" question this map has carried open since Warsh's
        08-28 Jackson Hole keynote pointedly avoided addressing the
        buyback mechanism at all.
      precedent: >
        The first tripled-size buyback operation (09-09) saw yields rise
        on the announcement itself rather than fall, and the first
        operation under the new ceiling (09-11) undershot its own $6bn
        cap — both prior tests this map has logged came out arguing the
        buyback cannot out-muscle a genuinely hawkish data backdrop, which
        is the same shape this scenario would extend.
    - direction: >
        The Fed hikes but signals a pause via the dot plot or Warsh's
        press conference, and the 10-year pulls back from 5.041% within
        the following sessions — an "event resolved, priced-in" reaction
        rather than a continuation.
      why: >
        A hike that was already ~92% priced by the morning of the
        decision has limited room to surprise on the level itself; the
        actual news content Wednesday is in the dot plot and Warsh's
        guidance, not the 25bp move. A curve that has run up hard into a
        fully-priced event is the textbook setup for a "sell the rumor,
        buy the news" reversal once the uncertainty clears.
      precedent: >
        Warsh's own Jackson Hole keynote (08-28) produced a belly-led
        repricing (5-year +9.2bp) while the 30-year barely moved
        (+2.2bp) — a shape this map read at the time as evidence against
        the long-end-intervention thesis on that specific day, showing
        the curve can reprice sharply on a Fed-communication event
        without the long end itself breaking down further.
  context_note: >
    This is a threshold-crossing event, not yet a resolved one — the
    FOMC decision itself lands tomorrow (2:00pm ET), and both scenarios
    above are genuinely open going into it. Figures are Tuesday intraday
    reads (5.041% per CNBC), not a closing print.
