# 2026-08-21-global-capital.interp.yaml — Global Capital's per-item
# interpretations (DESIGN.md Part 2 §8), keyed by slugify() of the FIRST
# 50 CHARACTERS of the bullet's bold lead phrase.
#
# ⚠️ The [:50] truncation is load-bearing and is NOT stated in the /daily
# skill's own description of this file (which says only "slugify() of the
# bold lead phrase"). It is what render_read.py:307 actually looks up:
#     interps.get(slugify(tm.group(1).strip()[:50]))
# The bold text is line-joined and single-spaced first, so the 50 chars
# are counted on the flattened one-line form, not the wrapped source.
#
# Validator shape (theprojection_pipeline/readouts.py:658):
#     mechanism        30-200 chars, must end as a sentence
#     confidence       speculative | plausible | well-supported
#     scenarios        2-4; direction 20-160, why 20-200 chars, distinct
#     precedent        REQUIRED on >=1 scenario above `speculative`
#     context_note     20-200 chars, must end as a sentence
#
# Five entries: two from the 10:00 ET opening pass, three added at the
# 15:00 ET pass. Still nothing written for the Anthropic $2T/Citigroup
# bullet or the Sibu 1 hijacking: the first is a reported figure whose
# mechanism is simply "a company is going public", and the second is a
# real risk-premium input whose transmission is already fully described in
# the bullet itself. Nothing written for the Operation Economic Fury
# bullet either — secondary sanctions have a well-understood mechanism
# that the bullet states outright, and restating it here would be padding.
# Forcing an interpretation onto any of them is exactly what this file is
# not for. Read against attention/capital-context.yaml (asof 2026-08-18).

openai-s-revenue-is-reported-up-35-this-quarter-w:
  mechanism: >
    Circular AI financing is collateralised by forward revenue, so a shift
    in which lab is growing fastest reprices the loop's counterparties
    rather than the loop's size.
  confidence: plausible
  scenarios:
    - direction: >
        Vendor-financing terms start tracking quarterly revenue share
        between the two labs, rather than being fixed at deal signing.
      why: >
        Nvidia, Microsoft and Oracle each hold exposure to specific labs;
        if relative growth flips twice a year, the natural response is
        shorter commitment tenors and revenue-linked covenants.
      precedent: >
        Nvidia halved the Ohio guarantee under investor pressure on
        2026-08-15 — already on this map's own timeline, and evidence
        these commitments are revisable rather than fixed.
    - direction: >
        Nothing reprices, because both labs' growth stays high enough in
        absolute terms that relative position is noise to lenders.
      why: >
        82% and 76% quarter-on-quarter are both extraordinary; a
        counterparty underwriting either is underwriting the category,
        not the league table within it.
  context_note: >
    Ramp card data is a spend proxy, not a filed figure, and this map has
    no audited revenue number for either lab this quarter.

nvidia-took-a-minority-equity-stake-in-cloverleaf:
  mechanism: >
    A chip vendor is buying equity in the physical bottleneck that gates
    its own demand, converting a supply constraint on customers into an
    asset on its own balance sheet.
  confidence: plausible
  scenarios:
    - direction: >
        The pattern keeps moving upstream — power agreements, queue
        positions and land options become Nvidia-held assets rather than
        customer problems.
      why: >
        Power and siting are now the binding constraint on GPU
        deployment, so the marginal dollar of demand creation is worth
        more spent there than on customer equity.
      precedent: >
        Nvidia's existing customer-base stakes — Nebius 9.3%, Intel $5B,
        Naver $1B, Groq ~$20B licensing — are the same instrument applied
        one layer downstream, and are already on this thread.
    - direction: >
        It stays a one-off partnership: a few hundred million to secure
        priority access at named sites, never scaled into a portfolio.
      why: >
        Owning land-and-power developers carries permitting, community
        and utility-regulatory exposure that a fabless chip designer has
        no apparatus to manage at scale.
  context_note: >
    No figure is disclosed in the joint release, so the "several hundred
    million" size rests on outside coverage rather than a filing.

treasury-s-long-bond-buyback-bump-has-fully-round:
  mechanism: >
    A buyback changes which maturity investors must hold without changing
    net Treasury supply, so it can only work as a signal — and a signal
    the market can test costs credibility when it fails.
  confidence: plausible
  scenarios:
    - direction: >
        Treasury escalates on size rather than concede the tool is weak,
        taking buybacks past Bessent's own $4bn-per-issue floor.
      why: >
        He has already framed $4bn as a floor and claimed private
        information the market lacks; both are positions that are harder
        to retreat from than to double down on.
      precedent: >
        The 1999-2000 Treasury buyback programme under Rubin and Summers
        is the closest structural precedent, but it ran against fiscal
        surpluses rather than deficits — the opposite setup.
    - direction: >
        Issuance composition shifts shorter instead, moving the problem
        off the long end and onto rollover frequency.
      why: >
        Shortening duration is the cheaper lever and does not require
        defending a purchase programme that visibly failed to hold yields
        down within two sessions.
  context_note: >
    Yield levels here are aggregator snapshots rather than primary ticks,
    and this map still has no thread carrying the long-end story.

gold-and-bitcoin-are-trading-the-treasury-interven:
  mechanism: >
    If buybacks read as debt monetisation, the absorbing counterparty is
    the currency itself rather than any institution, so capital rotates
    into assets with no issuer standing behind them.
  confidence: plausible
  scenarios:
    - direction: >
        The dollar keeps sliding as buyback size scales, and gold and
        bitcoin go on tracking Treasury announcements rather than yields.
      why: >
        That is the falsifiable form of the debasement reading — it
        predicts the dollar, not the curve, is the variable that moves on
        the next announcement.
      precedent: >
        The 2020-21 gold and crypto move on Fed balance-sheet expansion is
        the same trade, though driven by a central bank rather than by the
        Treasury's own buying.
    - direction: >
        The move fades as a one-week positioning story once buyback
        auctions clear without incident.
      why: >
        A buyback creates no new money, and the market may simply be
        mispricing the difference between Treasury purchases and
        central-bank purchases for a few sessions.
  context_note: >
    Both moves are one-day and one-week readings; nothing here establishes
    a sustained regime change in the dollar.

broadcom-is-assembling-70-80bn-of-debt-through-a:
  mechanism: >
    Compute capacity is being financed off balance sheet through an SPV,
    so first loss sits with junior lenders rather than with Broadcom or
    the lab whose demand underwrites the whole structure.
  confidence: plausible
  scenarios:
    - direction: >
        The junior tranche prices wide enough that the structure becomes
        the market's first public estimate of AI-buildout credit risk.
      why: >
        A junior piece near $35bn is too large to place quietly, so its
        spread becomes a visible number where none has previously existed
        for AI lab compute.
      precedent: >
        The $35bn Broadcom/Apollo/Blackstone partnership announced in June
        is the same structure at half the size, and is already on this
        thread's timeline.
    - direction: >
        The raise is cut or restructured before pricing, given reported
        totals still span $60bn to $100bn across outlets.
      why: >
        That spread suggests the deal is still being shopped rather than
        sized, which makes lender appetite the binding constraint rather
        than Broadcom's stated need.
  context_note: >
    Every figure here is sourced to unnamed lenders through press
    reporting; no filing or signed commitment exists yet.
