the-10-year-pushed-past-its-january-2025-ceiling-t:
  mechanism: >
    A synchronised move across the US, UK, German, French and Japanese long
    ends cannot be a US fiscal story, because those five sovereigns are not
    running one fiscal policy. What they share is a term premium — the
    compensation for holding duration — and a term premium repricing on the
    same session in five markets means the price of duration itself moved,
    not any one issuer's credit. Oil is the obvious candidate: an energy
    shock raises expected inflation everywhere simultaneously and is the
    one input all five curves hold in common.
  confidence: plausible
  scenarios:
    - direction: >
        This is the oil shock passing through, and it unwinds with the oil
        shock. Brent's four-session run is the whole explanation; if Hormuz
        transit normalises, the global term premium compresses back and the
        US 10-year's "highest since November 2023" print is a spike rather
        than a level.
      why: >
        Directly falsifiable on two series this map already carries daily:
        Brent's daily print and the 10-year's. If Brent gives back the move
        toward the high $80s and the 10-year does not follow within a week,
        the oil explanation is insufficient and something structural is
        being mispriced as a shock.
      precedent: >
        The 2022 global bond selloff after the Ukraine invasion. Yields rose
        together across the G7 on an energy-driven inflation impulse, and
        the correlation broke apart within two quarters as each central bank
        reverted to its own domestic data.
    - direction: >
        The energy shock is the trigger and the AI buildout's issuance is
        the reason it is not absorbing. Duration is being supplied faster
        than it is being demanded — September corporate issuance forecast at
        $215bn on top of a record August — so an inflation impulse that
        would once have been absorbed now moves the curve.
      why: >
        The discriminating test is relative: if US long-end yields rise more
        than the UK, German and French moves on the same session, the excess
        is US-specific supply rather than the shared inflation impulse. This
        map has Bloomberg's own count of 55 days above 5% on the 30-year and
        named analysts (Briggs, Misra) arguing buybacks are being dwarfed by
        AI-buildout supply — the disagreement is already on the record and
        dated.
      precedent: >
        The 2003-2007 GSE and structured-credit issuance wave. Steady
        duration supply from a single sector compressed the market's
        capacity to absorb shocks, and the effect showed up as an unusually
        sharp reaction to news that would previously have been routine.
  context_note: >
    `capital-context.yaml`'s rate_regime reading is a hawkish hold at
    3.50-3.75% built on domestic data — the July payrolls miss, weak retail
    sales, the Cook removal fight. It has no cross-border term-premium leg
    at all, which is precisely the gap yesterday's JGB crossing exposed and
    today's five-market move widens.

brent-traded-around-96-11-at-8am-et-up-roughly:
  mechanism: >
    Until today, striking launchers and mine-laying capability was a supply
    story about Iranian export capacity. Striking Iranian tankers directly,
    under a declared "tanker for tanker" policy, moves the risk from cargo
    to hull — and hull risk is priced by war-risk underwriters, who set
    transit volume. Announcing the policy is what makes it structural: an
    insurer prices a stated retaliation doctrine differently from an
    incident, because the doctrine is repeatable by design.
  confidence: plausible
  scenarios:
    - direction: >
        The doctrine works as advertised and the premium compresses.
        Officials' stated objective is "at least a month of lowered threat
        levels"; roughly 40 ships transited on the day of the strikes
        anyway, which suggests underwriters have not yet repriced the
        corridor as closed.
      why: >
        Watch the war-risk rate as a percentage of hull value against the
        daily transit count — the two series this map already tracks
        together. If transits hold near 40/day or recover while the rate
        stays flat, the market is reading "tanker for tanker" as deterrence
        rather than as escalation.
      precedent: >
        The 1987-88 reflagging operation. US Navy escorts restored Gulf
        transit volumes and compressed war-risk premiums within months
        while the shooting continued — physical protection, not peace, was
        what repriced the risk.
    - direction: >
        Naming a tanker-for-tanker doctrine removes the ambiguity that let
        commercial shipping treat attacks as accidents, and converts a
        rising premium into a categorical exclusion for a class of hulls.
        Once a state declares tankers legitimate reciprocal targets, the
        insurable question stops being how likely and becomes whether
        cover is written at all.
      why: >
        The tell is exclusion language rather than rate. A Gulf war-risk
        exclusion for Iranian-linked or Iran-calling hulls, or a P&I club
        circular, would be a dated, checkable event and a different
        phenomenon from the premium widening this thread has logged since
        August.
      precedent: >
        The Tanker War again, from the other side: after Iraq declared the
        northern Gulf an exclusion zone in 1984, Lloyd's underwriters wrote
        geographic exclusions rather than merely raising rates, and traffic
        rerouted before any additional ship was hit.
  context_note: >
    This thread has priced four sessions of Brent gains off strike intensity.
    Today changes the target class, not the intensity — the interpretive
    question is whether underwriters distinguish those, which the transit
    and rate series this map already collects can actually answer.

greg-abel-gave-his-first-on-record-ai-comments-sin:
  mechanism: >
    Berkshire is simultaneously an AI equity holder and, through Berkshire
    Hathaway Energy, a regulated utility selling power into the same
    buildout. A regulated utility earns an allowed return on rate base, so
    data-center load is not a margin opportunity for it — it is a licence to
    grow the rate base and earn on the capital. That makes Abel's "energy
    would be the constraint" both an investment thesis and a description of
    his own business, which is why it deserves discounting rather than
    treating as neutral outside confirmation.
  confidence: plausible
  scenarios:
    - direction: >
        The signal is genuine and BHE is the tell rather than the Alphabet
        stake. If the constraint really is power, the durable return accrues
        to whoever owns regulated generation and transmission, not to the
        model layer — and Berkshire is positioning on both sides of the same
        thesis at once.
      why: >
        Checkable in BHE's own capital plan, which is disclosed. If BHE's
        forward capex guidance rises materially against the Iowa 8%-of-load
        figure Abel cited, the words are backed by capital. If it does not,
        this is commentary on an equity position.
      precedent: >
        NextEra's 2020-2023 repositioning around data-center and
        electrification load — the disclosed capital plan moved before the
        narrative did, and the rate-base growth, not the commodity price,
        was what the equity repriced on.
    - direction: >
        Read it as marketing for a rate case. The single most valuable thing
        a regulated utility can establish with a commission is that new load
        is unavoidable and requires pre-emptive investment, and "8% of the
        state's regional load" is exactly the kind of figure that argument
        needs.
      why: >
        The discriminating evidence is whether the same figure appears in a
        BHE or MidAmerican regulatory filing within two quarters. This map
        already carries the TVA data-center rate effective 10-01 as a live
        instance of utilities converting AI load into tariff structure.
      precedent: >
        The 2021-2024 wave of large-load tariff filings across PJM and the
        Southeast, where utility public commentary on data-center demand
        growth consistently preceded the rate filings that cited it.
  context_note: >
    This thread has read Berkshire's AI stance almost entirely off 13F
    positioning. Abel connecting it to BHE is the first first-party
    statement tying it to an operating business, and the first that has an
    incentive structure worth naming rather than taking at face value.

bank-of-japan-governor-ueda-said-the-board-would:
  mechanism: >
    Japan is the largest foreign holder of Treasuries, and Japanese
    institutions hold them hedged; the hedge cost is set by the short-rate
    gap. A BOJ hike narrows that gap from the Japanese side at the same
    moment a 3% JGB offers a domestic alternative for the first time in a
    generation, so the marginal Japanese buyer of the US long end faces a
    lower hedged yield and a better home substitute simultaneously. Ueda
    hinting is the market pricing the flow before it happens; the yen
    reversal is the first visible leg of that repricing.
  confidence: plausible
  scenarios:
    - direction: >
        The hike is delivered, the yen firms, and Japanese repatriation shows
        up as a persistent bid for JGBs and a persistent offer in Treasuries
        — the "global selloff" stops being a shared term premium and becomes
        a flow-of-funds story with a named seller.
      why: >
        Checkable on two lagged series this map already collects: Treasury
        TIC's Japan line (two-month lag) and the MOF weekly securities-flow
        data. If Japanese net Treasury purchases turn negative in the
        September-October prints while the JGB curve bull-flattens, the
        mechanism is running; if TIC shows continued buying, the yen move was
        positioning, not repatriation.
      precedent: >
        The 2022 episode: the BOJ's December yield-curve-control widening sent
        the 10-year JGB through its band and Japanese life insurers cut
        hedged Treasury holdings through 2023 — the largest foreign seller
        that year — while US term premium rose independently of Fed policy.
    - direction: >
        Ueda is talking the yen up to avoid intervening, the hike is small or
        deferred to October, and the transmission stalls — the low-158 print
        was a squeeze on short-yen positioning, not a regime change, and
        Treasuries keep trading on US supply and oil.
      why: >
        The tell is the size and the language on 09-18: a 25bp move with
        "gradual" guidance and no balance-sheet change leaves the hedge-cost
        gap wide enough that US paper still wins on a hedged basis. Bessent's
        public pressure for "also rate hikes" cuts the other way and is
        itself a novelty worth weighting.
      precedent: >
        The 2024 sequence: the BOJ's March exit from negative rates and the
        July hike produced a violent yen squeeze and the August 5 global
        equity unwind, then faded within weeks as the carry trade rebuilt —
        the currency moved far more than the cross-border bond flow did.
  context_note: >
    `capital-context.yaml`'s rate_regime reading is entirely US-domestic and
    its own comment block twice deferred a BOJ/JGB leg as a /week-scale gap.
    Two consecutive days have now produced real misses on exactly that leg,
    one of them with 108 buffer hits; the standing snapshot needs the leg
    written in, not deferred again.

