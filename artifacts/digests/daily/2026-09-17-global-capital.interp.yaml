brent-fell-roughly-3-6-to-about-102-thursday-as:
  mechanism: >
    Two of this map's own standing risk premia are moving in opposite
    directions on the same event. Saudi Arabia's East-West pipeline
    outage has been the load-bearing supply-side input behind Brent's
    run toward $108 since 09-10 — capital-context.yaml's
    `conflict_risk_premium` reading has tracked it explicitly as the
    mechanism turning Yemen's civil war into a direct oil-supply input,
    via the roughly 8x volume now rerouted through Bab al-Mandeb. A
    concrete restart timeline (rather than another undated "soon")
    removes that specific input at the exact moment rate_regime's own
    test — whether a hiking Fed needs oil-driven inflation risk to stay
    elevated to keep validating the "more hikes coming" dot-plot
    signal — is live. The two readings pull the same "is this inflation
    still supply-shock-driven" question in opposite directions on the
    same day.
  confidence: reported
  scenarios:
    - direction: >
        The restart executes roughly on the stated timeline (half
        capacity within days, full within six weeks) and Brent
        continues easing from the $108 peak rather than re-spiking.
      why: >
        Saudi Arabia restored this same pipeline to full capacity within
        days after an April 2026 attack — the precedent this outage has
        already exceeded once on timeline alone, but the mechanism (a
        fast, disclosed repair) is the same one now being invoked again
        with an actual number attached rather than "soon."
      precedent: >
        The April 2026 East-West pipeline attack and its within-days
        restoration — this map's own thread record cites it directly as
        the comparison for how fast this specific pipeline can come back
        once Aramco discloses a plan.
    - direction: >
        The restart slips or the ship-to-ship workaround itself becomes
        a target, and Brent resumes climbing toward or past the $108
        peak.
      why: >
        The pipeline is Saudi Arabia's principal Hormuz-avoidance route;
        a workaround built specifically to dodge one chokepoint being
        forced to route through a second (Hormuz-adjacent Sohar
        transfers) concentrates rather than diversifies the war's
        remaining points of failure, and this war has repeatedly
        produced incidents this map didn't anticipate on stated
        timelines (the pipeline's own "soon" comment from 09-15 already
        slipped once before today's concrete plan).
      precedent: >
        The 08-14 episode where Brent jumped 5%+ on "indefinite
        blockade" rhetoric alone, no physical incident required — this
        market has already shown it reprices hard and fast on
        chokepoint risk in either direction.
  context_note: >
    Read against `conflict_risk_premium`'s standing framing that the
    Yemen civil war and the Red Sea/Hormuz shipping story are now
    mechanically linked through Saudi's own export routing, and against
    `rate_regime`'s open question of whether Wednesday's hike needs
    continued oil-driven inflation pressure to stay validated by the
    data. A genuine pipeline fix, if it holds, removes one leg of the
    inflation case the Fed's own hawkish dot plot is resting on.

coreweave-raised-3-0bn-in-convertible-notes-aimed:
  mechanism: >
    CoreWeave's own backlog-vs-debt bet — the core question this map's
    `coreweave-backlog-bet` thread exists to track — just got materially
    more leveraged in one filing, and the market's reaction (a same-day
    sell-off rather than a rally) reads the raise as a credit-quality
    admission rather than confidence: capped-call transactions exist
    specifically to blunt dilution on conversion, which only matters if
    the market expects the notes to convert, which only happens if the
    stock performs — the instrument itself is a hedge against CoreWeave's
    own optimism about itself. This lands the same week this map's
    broader AI-buildout-debt-risk watch has tracked genuinely mixed
    signals on whether AI infrastructure debt is being priced as
    investment-grade-adjacent or as risk.
  confidence: reported
  scenarios:
    - direction: >
        The sell-off is a one-day technical reaction to dilution
        mechanics and CRWV recovers within the week once the notes
        price and the capped-call structure is fully disclosed.
      why: >
        Convertible-note announcements routinely produce a short-term
        "supply" overhang sell-off independent of the underlying
        business — this thread's own 09-11 entry already logged a
        comparable CoreWeave balance-sheet-driven drop reverse within a
        week on unrelated sector news (the Oracle backlog print).
      precedent: >
        This thread's own 09-04→09-11 record: a "balance sheet concerns"
        5% drop the same week Oracle's earnings beat pulled CoreWeave
        back up 4% in sympathy — the stock's balance-sheet-driven moves
        in this thread have not stuck without a fresh demand-side catalyst.
    - direction: >
        The sell-off holds or extends, becoming this map's clearest data
        point yet that credit markets are starting to price AI-neocloud
        debt as genuinely risky rather than a growth-story pass-through.
      why: >
        This is the second instance logged on this specific thread of
        the market punishing rather than rewarding a CoreWeave financing
        move, and it arrives the same week Treasury yields are already
        elevated on the Fed's own hiking cycle — a worse macro backdrop
        for absorbing new corporate debt supply than earlier in the year.
      precedent: >
        capital-context.yaml's `rate_regime` reading has tracked the
        30-year Treasury auction clearing above 5% three times in 2026 as
        evidence the market is demanding real compensation for duration
        risk broadly, not just on sovereign paper — a backdrop this
        convertible offering is pricing into directly.
  context_note: >
    Directly on this thread's own watch line ("debt costs vs the
    AI-credit repricing") and adjacent to `ai-buildout-debt-risk`'s wider
    tracking of how AI infrastructure debt is priced across issuers —
    worth reading this raise's eventual coupon/conversion terms against
    that thread once pricing is confirmed.
