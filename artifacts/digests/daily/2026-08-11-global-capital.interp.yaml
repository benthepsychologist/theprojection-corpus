# Read against capital-context.yaml (asof 2026-08-09).

epfr-s-weekly-global-navigator-report-published-t:
  mechanism: >
    Two independent inflation channels are being read together for the
    first time in this record: the war-risk oil premium
    (red-sea-oil-shock) and AI-buildout "chipflation" (higher tech-goods
    and electricity costs from the compute buildout itself). Both are
    real-economy cost-push channels rather than demand-side overheating,
    which is why central banks holding steady through both is itself
    informative — a demand-driven inflation scare would normally draw a
    faster hawkish response than a cost-push one, where tightening does
    less to fix the actual cause.
  confidence: plausible
  scenarios:
    - direction: >
        The two channels compound into a genuine second-round inflation
        problem — oil feeding transport/energy costs, AI buildout
        feeding tech-goods/electricity costs — forcing central banks off
        their current hold sooner than the 09-16 FOMC date this lens is
        already tracking.
      why: >
        capital-context.yaml's own rate_regime reading already flags a
        hawkish 9-3 FOMC vote with three dissents FOR a hike; two
        simultaneous cost-push channels newly on the record are exactly
        the kind of data that could move that vote count further before
        09-16.
      precedent: >
        The 2021-2022 semiconductor-shortage episode, where a narrow,
        sector-specific input-cost shock (chip scarcity) fed through
        into broad vehicle and electronics CPI prints well beyond the
        chip sector itself, forcing central banks to treat what started
        as a supply-chain story as a genuine inflation input.
    - direction: >
        Both channels stay sector-contained — oil in energy/transport,
        AI buildout costs in tech-goods/electricity — without showing up
        as a broad CPI mover, and the current hold survives to 09-16
        unchanged.
      why: >
        Neither channel has produced a specific fund-flow or CPI figure
        yet in this week's EPFR report (unlike the $10B/$75B/$31B reads
        capital-context.yaml already carries from prior weeks) — the
        report itself frames this as a risk re-emerging, not a
        confirmed broad print.
      precedent: >
        The 2017-2019 solar-panel-tariff cost pressure, a real,
        sustained sector-specific input-cost increase that never
        registered as a broad CPI mover because it stayed contained to
        one narrow goods category.
  context_note: >
    capital-context.yaml's fund_flows reading is still keyed to EPFR's
    08-04 report ("technology story shines through the smoke," $10B) —
    this week's report is qualitatively new (a named second inflation
    channel) but carries no dollar figure, so it isn't yet a clean
    like-for-like update to that reading; worth flagging for the next
    /week refresh rather than forcing into fund_flows now.
