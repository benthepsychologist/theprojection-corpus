# 2026-08-11-global-capital.interp.yaml — Global Capital's per-item
# interpretations (DESIGN.md Part 2 §8), keyed by slugify() of the
# bullet's own bold lead phrase (first 50 chars). The bullet's
# <!-- k: ... --> annotation carries interp=yes to point here.
# Read against capital-context.yaml (asof 2026-08-09) and against the
# 08-10 sidecar's own Nvidia/Moody's/CoreWeave entries, which this
# quarter's print is the first empirical test of.

coreweave-beat-q2-consensus-on-both-lines-2-575:
  mechanism: >
    This earnings print is the first time backlog growth (bullish) and
    financing-cost growth (bearish) show up together in CoreWeave's own
    numbers rather than as separate data points on separate days: net
    interest expense rose 140% YoY ($640M vs $267M) — faster than the
    112% YoY revenue growth — in the same quarter backlog grew to
    roughly $129B including new Q3 commitments. It is the first
    real-world test of whether the SOFR+550 spread that priced three
    days before this print (see `coreweave-backlog-bet`) reflects
    CoreWeave-specific risk or a genuine, broader repricing of
    AI-infrastructure debt — the exact open question `ai-buildout-debt-
    risk` was opened to track.
  confidence: likely
  scenarios:
    - direction: >
        The market treats this as confirmation CoreWeave can service a
        growing debt load while still growing revenue and backlog, and
        financing keeps flowing at the current, already-repriced spread
        without further widening — capital keeps flowing, just
        permanently more expensively than early-2026 levels.
      why: >
        Shares jumped as much as 14% after hours and management raised
        full-year revenue guidance rather than trimming it — the
        market's real-time verdict was "still investable" despite the
        interest-expense jump, and Oracle's own stock (a different,
        larger neocloud-adjacent bet) rallied 5.9% the next day
        explicitly on this print as read-across for buildout demand.
      precedent: >
        AMD's own Q2 2026 double beat (revenue and EPS both ahead of
        guidance) reassured markets on a highly-levered AI growth story
        the same way — a pattern also visible in 1990s-2000s telecom/
        cable operators, which kept raising debt capital through
        repeated earnings beats even as leverage climbed, until the
        growth-vs-debt-service gap eventually became the story itself.
    - direction: >
        The $640M interest bill is an early symptom of a financing
        treadmill: CoreWeave must keep growing its backlog faster than
        debt-service costs compound, and a single quarter of guidance
        miss would expose the gap Bloomberg's own AIndicators tracker
        (this map's 08-10 digest) was built specifically to watch for.
      why: >
        Interest-expense growth (+140% YoY) is outpacing revenue growth
        (+112% YoY) in the same quarter — a modest but real gap moving
        in the wrong direction for a company already carrying $30B+ of
        2026 secured debt, on top of the new $3.1B DDTL's 1.35x DSCR
        covenant, which is the first hard financial covenant this map
        has recorded anywhere in the AI-buildout debt stack.
      precedent: >
        The Bank for International Settlements' own June 2026 warning
        on vendor-financed, cash-flow-dependent AI-infrastructure debt
        (cited in this same digest's Lambda-loan coverage, and echoed
        in Moody's 08-09 vendor-dependence warning on this map's
        `ai-buildout-debt-risk` thread) — the risk in both cases
        materializes only once revenue growth decelerates below
        debt-service growth, which this quarter's numbers show the gap
        beginning to form without yet triggering.
  context_note: >
    `capital-context.yaml` doesn't carry an AI-debt-specific reading yet
    — flagged as a candidate in the 08-10 sidecar's Moody's entry. This
    quarter's numbers are the first company-level empirical test of the
    mechanism that candidate reading would need to track, and the first
    quarter where this map can compare debt-service growth to revenue
    growth for the same borrower rather than reading them as separate
    financing-side and operating-side stories.
