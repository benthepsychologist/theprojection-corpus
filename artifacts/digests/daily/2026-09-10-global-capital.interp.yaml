# Interpretations for 2026-09-10 global-capital, keyed by slugify(bold lead[:50]).
# Read against attention/capital-context.yaml (asof 2026-08-25 — sixteen days
# stale; the readings below note where today's data has overtaken it).

brent-crude-traded-104-80-105-07-this-morning-u:
  mechanism: >
    The standing capital snapshot's conflict_risk_premium reading has spent
    most of August documenting one pattern: oil prices FELL even as
    enforcement and rhetoric escalated, because the physical barrels were
    already gone — Iranian loadings had collapsed to roughly 287k bbl/day
    from about 2m pre-war, so sanctions were hitting payment rails rather
    than supply. That pattern has now fully inverted, and the inversion
    is the finding. Brent has gone from about $88 on 08-31 to $105 this
    morning, roughly +19% in ten days, and the trigger each step of the way
    was not a supply loss but a change in WHO was being hit. The market
    spent August correctly pricing that there was little Iranian oil left
    to interdict; it is now pricing something different — that a
    US-vs-Iranian-Navy exchange plus a missile strike on a treaty ally's
    air base puts the Gulf's OTHER 20-odd million barrels a day at risk,
    not Iran's remaining fraction.
  confidence: probable
  scenarios:
    - direction: The premium now sits on Gulf-wide transit rather than Iranian supply, and stays until the state-on-state exchange stops
      why: >
        The price barely moved on the sanctions package that removed
        Iran's export capacity, and moved 19% in ten days on strikes
        that removed almost no barrels at all. That gap is only
        explicable if what repriced is the probability of a much larger
        supply disruption, not the realised loss of a small one.
      precedent: >
        This map's own record: the 08-24 "Operation Economic Outcast"
        package — roughly 60 designations, five sectoral determinations,
        every Bank Melli branch ordered shut — was followed by oil
        falling about 2.5% INTO the announcement. The 08-30/31 Larak
        Island strike, which destroyed no export capacity, took Brent
        from about $88 to above $90 within a session.
    - direction: The move retraces if the exchange reverts to shadow-fleet interdiction without further strikes on state assets
      why: >
        If the repricing is about combatant risk rather than barrels,
        then removing the combatant escalation should remove most of the
        premium, quickly and without needing any supply to return.
      precedent: >
        Through July and most of August this thread recorded repeated
        incident-driven spikes decaying within days back to a
        fundamentals-set level, including the drift lower through
        08-28/08-29 that the Larak strike then reversed.
  context_note: >
    ⚠️ capital-context.yaml is sixteen days stale (asof 2026-08-25) and its
    conflict_risk_premium reading still describes the falling-oil pattern
    as current. It is not. Treat that reading as superseded by this
    interpretation until the next /week refresh.

the-us-10-year-treasury-yield-reached-4-926-0-0:
  mechanism: >
    An oil shock and a bond selloff arriving together, with gold falling,
    is not how a war scare normally transmits. The classic pattern is
    risk-off: yields fall as money buys Treasuries, gold rises. What
    happened instead — the whole curve up, gold down $58, VIX up 8.2%,
    equity futures down — says the market is treating this as an
    inflation event that constrains the Fed rather than a growth scare
    that frees it. That reading connects two threads this map has been
    running separately. `treasury-long-end-intervention` has documented a
    market where yields rise on bad news, which the standing snapshot
    attributes partly to the Treasury General Account funding a tripled
    long-bond buyback — Deutsche Bank's "soft-form financial repression,"
    escalated in commentary to "fiscal dominance." `fed-independence-fight`
    has documented a hawkish-dissent bloc on a committee already under
    White House pressure over its composition. A $105 oil print eleven
    days before the 09-16 decision hands the dissenters their argument.
  confidence: probable
  scenarios:
    - direction: The war raises the probability of a September hike rather than lowering it
      why: >
        A supply-side price shock lifts headline inflation without
        weakening demand first, which is the configuration that pushes a
        committee already carrying three hike dissents toward acting
        rather than waiting. The move in hike odds from 49% to 60% on the
        payroll print alone, before oil added another 3.8%, is consistent
        with that.
      precedent: >
        The committee's own July vote was 9-3 with all three dissents FOR
        a hike, up from unanimous in June — the bloc exists and has been
        growing on less provocation than this.
    - direction: The correlation break is about the buyback mechanism, not the war, and would have happened anyway
      why: >
        If the TGA-funded buyback is what has been setting the long end,
        then a war headline is incidental to a market already selling
        duration for balance-sheet reasons, and the oil coincidence is
        being over-read.
      precedent: >
        The 30-year touched a 19-year high of 5.33% intraday on 08-24 and
        pulled back specifically on the TGA reporting itself, with no
        conflict trigger in either direction that session.
  context_note: >
    The 2-year and 30-year levels behind this reading were single-sourced
    this cut. The 10-year is cross-checked and is what the interpretation
    actually rests on. The August CPI print lands 09-11, one day after this
    digest and five days before the decision — it is the real test of the
    inflation-repricing reading above.
