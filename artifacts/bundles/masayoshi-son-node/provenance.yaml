notes: "Personal net worth vs. directed capital is the key distinction: Son's PERSONAL wealth swung from ~65th on Forbes (May-2025) to a brief $100.7B peak (2-Jun-2026, Asia's richest) and back within days — volatile, and NOT the same pile as the ~$150-160B SoftBank directs. Leverage is the real risk at both levels: over a third of his personal SoftBank stake is pledged as loan collateral, and he has personally owed SoftBank itself close to $5B from Vision Fund co-investment losses (2022-23) — a sustained stock-price shock could trigger forced selling / margin calls on the very stake his voting control depends on."
