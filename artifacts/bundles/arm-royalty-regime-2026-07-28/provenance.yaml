notes: >-
  Confidence key matches prior bundle convention (e.g.
  google-capex-2026-07-27): high = primary source fetched directly, or 3+
  independent outlets converge same-day/same-week. medium = single outlet
  or a small convergent cluster via RSS feed metadata (title/source/date
  confirmed real via the RSS feed itself, article body not independently
  re-fetched). thin = single outlet, unclear methodology, a
  speculative/rumor framing ("reportedly", "eyeing", "talks"), a
  self-reported/company-book claim (Nikkei's unnamed-exec 50% figure), or
  an outsized/uncorroborated figure flagged explicitly in the finding. No
  URL or figure in this bundle was fabricated. Explicit verification gaps
  carried into the finding's "open questions": (1) Arm's appeal status in
  the Qualcomm case has no 2026 coverage located; (2) the exact FY2026
  $4.92B revenue / $2.61B royalty digits from the crawl brief rest on
  directional corroboration (four straight >$1B quarters) rather than a
  refetched primary filing — investors.arm.com and newsroom.arm.com
  returned 404/stripped content this session; (3) the Raspberry Pi £50M
  April-2026 top-up is inferred, not confirmed, as the FY26 20-F
