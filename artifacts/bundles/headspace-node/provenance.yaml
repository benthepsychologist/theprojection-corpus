  value: "mixed — expanding distribution (specialty-care/health-plan partnerships, new AI clinical model) while contracting cost base (workforce cuts, therapist-network downsizing); revenue trend itself is disputed across sources (see gravity/operating)."
  basis: "2021 Headspace+Ginger merger created a $3B-valued combined entity backed by Blackstone Growth and Bain Capital. Since 2023: $105M debt financing (Jul-2023) explicitly earmarked for enterprise-business expansion and potential M&A; but also a 33-therapist layoff (Jul-2023) and a 13% workforce reduction with therapist network shifted to part-time/contract (Nov-2024). In parallel, 2025-2026 shows a steady cadence of specialty-care/channel expansion: US Navy mental-health-coaching extension (Mar-2025), a new AI-powered 'stratified care' clinical model called Ebb (May-2025), an insurance-backed direct-to-consumer therapy launch reaching ~90M insured Americans (Jun-2025), a Cigna mental-health collaboration (Nov-2025), and a Care.com caregiver mental-health partnership (Feb-2026). Net read: growing the specialty-care/enterprise channel while shrinking headcount and cost — consistent with a company managing toward profitability/IPO readiness rather than pure growth-mode expansion."
