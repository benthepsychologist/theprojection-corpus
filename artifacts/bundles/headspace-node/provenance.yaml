notes: "Pocket set to 'health' (closest existing board pocket) — this is the mental-health-app/digital-therapeutics vertical, not general healthcare. Biggest uncertainties: (1) WEIGHT — third-party aggregators disagree by roughly 3x on cumulative funding ($178M Tracxn vs ~$534-541M built from Wikipedia+press pre/post-merger figures used here); the background brief's '~$215M combined funding raised in the merger' was not independently re-confirmed this pass, though the ~$3B merger valuation and Blackstone Growth/Bain Capital backers were. (2) OPERATING/GRAVITY — GetLatka's 2024->2025 revenue estimate swings from $348.4M to $140M, a halving that is not corroborated elsewhere and may be a data artifact; treated as low-confidence throughout. (3) THRUST — no company-disclosed dollar figure exists for any 2025-2026 specialty-care/health-plan partnership (Navy, Ebb AI model, D2C therapy, Cigna, Care.com); the $0.05B/yr estimate is a rough proxy built from the 2023 debt raise's stated use plus launch cadence, tempered by the concurrent Nov-2024 workforce cut — treat as directional only. Overall confidence: medium on posture/optionality, low-medium on weight, low on thrust and gravity's precise $ value (though the qualitative 'largest gravity in the 8-actor cohort' read is medium-confidence)."
