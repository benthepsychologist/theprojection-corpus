thrust:
  value: "~$0.03-0.1B/yr (thin, estimated) — no company-disclosed deployment/commitment figure exists for the 2025-2026 specialty-care expansion wave. Point estimate ~$0.05B/yr, built as a proxy from: (1) the $105M Jul-2023 debt raise explicitly earmarked for enterprise-business expansion (a multi-year facility, not a single-year spend, so only a fraction lands in any one 12mo window); (2) the breadth/pace of 2025-2026 launches (Navy coaching extension, the Ebb AI clinical-care model, D2C insurance-backed therapy reaching ~90M insured Americans, the Cigna collaboration, the Care.com partnership) — five distinct new-channel moves within ~12 months signals real sustained build spend even though none carries a public number; (3) tempered downward by the concurrent 13% workforce cut (Nov-2024) and disputed revenue decline, which argue against a large-scale investment push. This is a rough band, not a computed run-rate."
  basis: "The board's thrust method for private cos is capital committed in the last ~12mo to new positions. Headspace has not disclosed a $ figure for any individual 2025-2026 partnership (Navy, Cigna, Care.com, D2C therapy, Ebb AI model) — these read as product/channel launches with undisclosed financial terms, the same pattern seen elsewhere in this wave (cf. Mistral's undisclosed Microsoft deal in the same batch). Absent a disclosed number, the estimate anchors on the one dollar figure available (the $105M 2023 debt raise, spread across its stated multi-year enterprise-expansion use) cross-checked against the observed cadence of launches, then discounted for the concurrent cost-cutting signal. Should a specific contract value or capex figure surface in a later pass, replace this estimate."
