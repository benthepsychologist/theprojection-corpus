  value: "~$0.2-0.35B/yr, estimated — grounded in revenue/contract scale (per the recipe, not gross download/subscriber headlines): third-party ARR estimates put Headspace at ~$140M (2025) to ~$348M (2024), which stands in as the best available proxy for the dependent-economy dollar value flowing through its 4,000+ employer contracts, health-plan partnerships (Cigna), and government contracts (US Navy) — i.e., the budgeted mental-health-benefit spend that would need to be replaced if Headspace stopped. Point estimate ~$0.3B taking the higher, more-recent-full-year (2024) figure as the more stable anchor given the disputed 2025 drop. Likely the highest gravity of the 8 mental-health actors in this wave given its enterprise/health-plan distribution breadth (100M+ reach across 190 countries, 4,000+ employers incl. Starbucks/Adobe/US Military, a Cigna insurance channel), but this estimate stays anchored to revenue rather than assuming scale from user-count headlines."
