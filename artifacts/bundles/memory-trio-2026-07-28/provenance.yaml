method: >
  WebSearch was pre-exhausted on all three lanes (session-shared budget)
  before a single query ran. Three parallel sonnet subagents ran WebFetch
  against Google News RSS search feeds (news.google.com/rss/search) and
  DuckDuckGo HTML search (html.duckduckgo.com/html) as fallback, resolving
  to publisher URLs where possible. Google News' own redirect links
  (news.google.com/rss/articles/...) essentially never resolved to article
  body text via WebFetch (empty JS shell) — those items are cited as RSS
  metadata only (title/source/date), capped at medium confidence. High =
  full article body or primary IR/press-release page directly fetched.
  Medium = RSS/search-snippet metadata only, single outlet or a small
  convergent cluster. Thin = single outlet, headline-only, unclear
  methodology, or an uncross-verified outlier figure. Several outlets
  (chosun.com, techtimes.com, reuters.com, wccftech.com on some URLs)
  blocked direct WebFetch (403) — their claims carried at RSS/snippet
  confidence only. No URL or figure fabricated; explicit gaps are marked
  "not found" in the finding rather than guessed.
