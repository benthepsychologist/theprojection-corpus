notes: "Biggest uncertainty: NO official revenue disclosed — every figure below the raise is a raise/adoption proxy or a third-party estimate (GetLatka ARR), not an audited earnings figure. Smallest capital base of the frontier labs (~10-40x below the US pure-plays). The Microsoft partnership complicates the 'EU-sovereign alternative' framing further as of the Jul-21-2026 expansion. THRUST is explicitly thin: Mistral has not disclosed a $-figure-plus-time-horizon for its largest 2026 commitment (Microsoft, 'multibillion-dollar' only) — re-check for a disclosed number in a later pass rather than trusting the ~$1B/yr band as precise. The ~€3B Samsung/EQT round is IN TALKS ONLY as of 2026-07-28, not closed — do not fold into capital.available's closed total until confirmed."
