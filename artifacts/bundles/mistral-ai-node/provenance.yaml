    - {figure: "no disclosed multi-year compute/build commitment figure (both $ and years) found in any source consulted", label: "absence noted across Wikipedia + Google News RSS passes", url: "https://en.wikipedia.org/wiki/Mistral_AI", as_of: "2026-07-28", confidence: low}
optionality:
