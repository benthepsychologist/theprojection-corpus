thrust:
  value: "~$0.5-2B/yr (thin) — no disclosed multi-year compute/build commitment with both a $ figure AND a time horizon. Two inputs, neither fully quantified: (1) $830M datacenter buildout (Paris + Sweden, Mar-2026) with no disclosed build-out horizon — spread over an assumed 2yr horizon that's ~$400M/yr; (2) the Jul-21-2026 Microsoft EU-infra deal, reported everywhere as 'multibillion-dollar' with no specific figure or years disclosed. Point estimate ~$1B/yr, but this is a rough band, not a computed run-rate — do not treat as precise."
  basis: "The board's thrust method for private labs is committed multi-year compute/build $ ÷ years. Mistral has NOT disclosed either half of that ratio for its largest 2026 commitment (the Microsoft deal) — every outlet checked (Reuters, WSJ, SiliconANGLE, euractiv, Yahoo Finance, Tech Xplore, Blockspace Media, the-decoder.com, qz.com) independently reports only 'multibillion-dollar'/'billions', no number, no term. The $830M datacenter figure at least has a dollar amount but no disclosed build horizon either. Rather than fabricate a precise run-rate off two unquantified inputs, this is reported as an explicit thin/low-confidence band. If either figure gets a disclosed number+horizon in a later pass, replace this estimate."
  sources:
    - {figure: "$830M for datacenters near Paris and in Sweden (Mar-2026), no build-horizon disclosed", label: "Wikipedia — Mistral AI", url: "https://en.wikipedia.org/wiki/Mistral_AI", as_of: "2026-03", confidence: med}
