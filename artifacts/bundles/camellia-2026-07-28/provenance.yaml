method: >
  One sonnet subagent ran WebFetch against Google News RSS search feeds
  (news.google.com/rss/search) plus direct outlet fetches. WebSearch was
  reported exhausted (shared session budget) on first call, so the agent
  ran API/RSS-only for the remainder. thecurrentga.org (The Current GA, a
  Georgia nonprofit newsroom) was the one outlet whose article pages
  resolved full body text on direct fetch and became the backbone of this
  crawl — it is the most detailed local reporting found on the Effingham
  County process. Other outlets (Bloomberg, AJC, CBS, GPB, Axios, Savannah
  Morning News, ConstructConnect, Data Center Dynamics, Breitbart) were
  citable only via RSS metadata (headline/outlet/date) since Google News
  redirect links did not resolve to publisher body text — those are capped
  at medium confidence. No URL or figure fabricated; explicit gaps
  (generation mix, GC/financer name, groundbreak date) are marked
  not-found rather than guessed.
