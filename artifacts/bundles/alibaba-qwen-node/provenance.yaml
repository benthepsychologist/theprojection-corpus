    - {figure: "MofCom reportedly consulting Alibaba/ByteDance on restricting overseas transfer of weights", label: "SCMP via kestrel china-stack thread", url: "https://www.scmp.com/tech/tech-war/article/3361625/global-ai-experts-push-back-us-distillation-claims-against-moonshots-kimi-k3-model", as_of: "2026-07", confidence: med}
gravity:
  value: "~$1.05T GMV GROSS (VERY gross — commerce GMV) + ~$22B/yr Cloud. VA-deflated ~$43B/yr (~6% VA, DEFERRED — the gross-vs-value-added trap). Qwen-OWN-attributable gravity (distinct from the commerce number above): monetized floor ~$4.2B/yr (Alibaba Cloud AI ARR target, thin) atop a much larger unmonetized open-weight/enterprise-adoption footprint (200k+ HF derivatives, 1B+ downloads, 234M app users, now + Apple Intelligence China selection)"
  sources:
    - {figure: "GMV 'US$1 trillion' last-official (FY2020); Cloud ¥158B; Qwen 200k+ HF derivative models, 1B downloads Apr-2026", label: "alibaba-qwen-axes bundle", url: "artifacts/bundles/alibaba-qwen-axes/provenance.yaml", as_of: "2026-07", confidence: med}
    - {figure: "Apple selected Qwen as the primary LLM for Apple Intelligence in China (Baidu handles visual search); approved ~mid-Jul-2026 after a 22-month review; BABA +4-7.9%, ~+$17B market cap on the news", label: "Google News RSS aggregation (multiple outlets)", url: "https://news.google.com/rss/search?q=Apple+Qwen+Alibaba+China+Apple+Intelligence", as_of: "2026-07", confidence: med}
    - {figure: "Alibaba Cloud AI annual recurring revenue (ARR) 'expected to exceed ¥30B (~$4.2B) by year-end' (2026) — forward-looking company target, not yet a realized TTM figure, and is Alibaba-Cloud-AI-wide (not Qwen-model-line-isolated)", label: "Futu (via Google News RSS) — earnings commentary summary", url: "https://news.google.com/rss/search?q=Alibaba+%22380+billion%22+OR+%2253+billion%22+AI+three+years", as_of: "2026-07", confidence: low}
thrust:
  value: "~$11.0B/yr net (capex-D&A recipe, FY2026 actual: ¥126,063M capex - ¥47,118M D&A = ¥78,945M / 7.2 ~ $11.0B); cross-checked against the ¥380B/$53B buildout's implied 3-yr run-rate ¥126.7B/yr (~$17.6B/yr GROSS, i.e. before the D&A netting) — FY2026 actual capex (¥126,063M) landed almost exactly on that gross pace, so the buildout commitment is confirmed as the real driver. Time horizon: FY2026-FY2028 (3-yr plan announced Feb-2025). Does NOT separately break out acquisitions/strategic equity stakes/capitalized training runs/power-PPA PV — likely understates true thrust somewhat, but those line items aren't disclosed distinctly by Alibaba (thin on that component)"
  sources:
    - {figure: "FY2026 (ended Mar 2026) capex ¥126,063M; D&A ¥47,118M -> capex-D&A ¥78,945M (~$11.0B @7.2)", label: "stockanalysis.com — BABA cash flow statement", url: "https://stockanalysis.com/stocks/BABA/financials/cash-flow-statement/", as_of: "2026-03", confidence: high}
    - {figure: "¥380B/$52-53B AI+cloud infra investment plan explicitly framed as a THREE-YEAR commitment (FY2026-FY2028)", label: "Google News RSS aggregation (Network World / Express Tribune / Futu headlines)", url: "https://news.google.com/rss/search?q=Alibaba+%22380+billion%22+OR+%2253+billion%22+AI+three+years", as_of: "2026-07", confidence: med}
    - {figure: "~¥380B (~$53B) AI/compute buildout + Zhenwu M890 (original figure, unchanged since 2026-05)", label: "The Register via kestrel china-stack thread", url: "https://www.theregister.com/systems/2026/05/22/alibaba-just-admitted-its-struggling-to-keep-up-with-rival-chipmakers-and-ai-shops/5244665", as_of: "2026-05", confidence: med}
notes: "Biggest uncertainty: GMV->value-added conversion (VA-share 4-8% and dependency 40-60% swing gravity ~$30-65B); GMV is the last-official ~2020 figure. CNY/USD @7.2 assumed. Unlike the US pure-plays, Alibaba funds the buildout from a profitable operating base. THRUST reconciles two ways of reading the ¥380B figure (gross 3-yr run-rate vs capex-D&A net) and they land close together, which is reassuring; the netted actual ($11.0B/yr) is used as the point estimate since it best matches the public-corp recipe. WEIGHT throughout this bundle is Qwen/AI-unit-ATTRIBUTABLE capital riding the Alibaba parent (the buildout commitment + allocated cash), NOT a standalone Qwen entity raise — Qwen has no separate balance sheet."
