# Bundle — node posture + capital-flow: alibaba-qwen / Alibaba/Qwen (2026-07-26)
# Extends artifacts/bundles/alibaba-qwen-axes/ (capitalization/optionality/gravity)
# with posture + the 5-way capital-flow decomposition for board.yaml frontier-lab.
# Method: WebFetch primary sources (WebSearch exhausted). Alibaba 20-F FY2026
# (SEC) + stockanalysis balance sheet/segments; Qwen ecosystem via Wikipedia;
# China state-influence via kestrel china-stack-independence thread. CNY->USD
# at ~7.2 (assumption, flagged). Node = the Alibaba parent AND its Qwen model
# line; capital is the parent's.
#
# 2026-07-28 pass — thrust-focused refresh. Added a `thrust:` block (capex-D&A
# recipe, ¥380B/$53B buildout as core figure) plus fresh capex/D&A/buyback
# actuals (stockanalysis cash-flow statement) and Qwen-specific gravity
# datapoints (Apple Intelligence China selection, AI ARR target). IMPORTANT:
# WEIGHT on this board is Qwen/AI-unit-ATTRIBUTABLE capital riding the Alibaba
# parent balance sheet (the AI/compute buildout commitment + cash allocated to
# it) — an attribution choice, NOT a separate Qwen entity's own raise. Qwen has
# no independent balance sheet; every $ here answers to Alibaba's signature.
node: alibaba-qwen
name: "Alibaba/Qwen"
pocket: frontier-lab
asof: 2026-07-28
