# Bundle — node posture + capital-flow: openai / OpenAI (2026-07-26)
# Extends artifacts/bundles/openai-axes/ (capitalization/optionality/gravity)
# with posture + the 5-way capital-flow decomposition for board.yaml frontier-lab.
# Method: WebFetch primary sources (WebSearch exhausted). Private company —
# figures are reported/leaked via Wikipedia's synthesis of Reuters/Bloomberg/
# The Information; net-loss/revenue are company-guided. Anchored to the
# openai-axes bundle; new capital-flow figures re-fetched 2026-07-26.
node: openai
name: "OpenAI"
pocket: frontier-lab
asof: 2026-07-26
posture:
