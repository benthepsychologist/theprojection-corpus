notes: "Biggest uncertainty: the split between Allianz's OWN general account (~EUR 810B, board estimate, low-confidence) and third-party AUM (~EUR 1.8T) is not cleanly re-verified from a primary filing this session — the total AUM EUR 2.512T and total assets EUR 1.024T are firm. All EUR; USD conversions at ~$1.10/EUR. WEIGHT-BASIS FLAG (axes_num rollout, 2026-07-28): axes_num.weight uses on-balance-sheet total assets ~$1085B (EUR 1.024T, 2024 USD ranking basis) — NOT the ~$2.76T total-AUM figure, which is ~EUR 1.8T (~65%) third-party PIMCO/AGI fiduciary money sitting off Allianz's own balance sheet. The PIMCO question: PIMCO's ~$2T is asset-management AUM (fee-generating, client-owned), structurally different from Allianz's own policyholder-liability-backed general account — excluded from weight, noted here as the dominant scale driver of Allianz's market reach regardless."
