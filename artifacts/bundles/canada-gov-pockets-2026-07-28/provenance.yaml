notes: >-
  Confidence key matches prior bundle convention (e.g.
  tsmc-capacity-race-2026-07-28): high = primary source fetched directly
  (canada.ca/budget.canada.ca/ised-isde.canada.ca, amii.ca, mila.quebec —
  all direct-fetch succeeded) or 3+ independent outlets converge.
  medium = single outlet or small convergent cluster via RSS feed metadata
  (title/source/date confirmed real via the feed, article body not
  independently re-fetched). thin = single outlet, unclear methodology,
  unconfirmed dollar figure, a genuinely-searched-for-and-not-found gap, or
  a discrepancy between sources left unresolved. No URL or figure in this
  bundle was fabricated.

  Explicit unresolved gaps carried into the finding's "dated expectations":
  (1) whether the Jun-2026 "AI for All" ~$2B is incremental to or restates
  the Dec-2024 $2B Sovereign Compute Strategy; (2) SIF's rebrand into a
  "Strategic Response Fund" — no confirmed transition date or current total
  envelope; (3) CIFAR AI Chairs 2026 top-up scope ("20 new appointees" vs.
  "42 positions across Canada" per Amii) unresolved; (4) no primary CIHR
  budget or AI-program figure obtainable this session (site TLS failure +
  GC InfoBase blocked) — the ~$1.3B figure is Wikipedia-sourced only;
  (5) Anthropic's Canada commitment reported inconsistently ($1M in API
  credits to Amii vs. $10M broadly attributed near Mila) — likely the same
  underlying multi-institute commitment seen from two angles, not
  independently reconciled.
