      - {figure: "Colossus ~230k GPUs, ~$18B buildout (SemiAnalysis)", label: "Wikipedia — Colossus (supercomputer)", url: "https://en.wikipedia.org/wiki/Colossus_(supercomputer)", as_of: "2026-06", confidence: med}
