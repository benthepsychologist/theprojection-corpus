optionality:
  value: "free-ish — Musk ~82-85% voting so outside holders cannot bind him; documented cross-venture redeployment; thin post-IPO locked overlay (Aug-6-2026 lock-up, 911.5M shares) + a real execution constraint: the consolidated AI arm is burning cash at a rate in the ~$1B+/mo neighborhood (directional, not exact), which pressures the pace of buybacks/discretion even though it doesn't touch Musk's control"
  sources:
    - {figure: "Musk 42% equity / 82% voting control (one section states 85%)", label: "Wikipedia — SpaceX infobox", url: "https://en.wikipedia.org/wiki/SpaceX", as_of: "2025-12", confidence: high}
    - {figure: "xAI FY2025 operating loss -$6.4B (~$533M/mo run-rate); SpaceXAI Q1-26 cash burn ~$8.8B in the quarter (~$2.9B/mo, broader than just AI-arm opex)", label: "Wikipedia — xAI (company) + kestrel finding (424B4/S-1)", url: "https://en.wikipedia.org/wiki/XAI_(company)", as_of: "2026-07", confidence: low}
gravity:
  value: "~$85B/yr GROSS orbiting (Starlink + launch-dependent + compute leases, now firmed up by the Google Colossus-2 lease below); + ~$18B one-time Colossus buildout stock. VA-deflated ~$30B/yr (x0.5 x0.7, DEFERRED)"
  sources:
    - {figure: "Starlink $11.4B + ~50% of global orbital launches 2025 + Colossus leases", label: "spacex-axes bundle", url: "artifacts/bundles/spacex-axes/provenance.yaml", as_of: "2026-07", confidence: med}
    - {figure: "Google lease $920M/mo (~$11.0B/yr) for 110,000 GB200 GPUs at Colossus 2, Oct-2026 through Jun-2029", label: "Wikipedia — Colossus (supercomputer)", url: "https://en.wikipedia.org/wiki/Colossus_(supercomputer)", as_of: "2026-07", confidence: med}
    - {figure: "Starlink 12M subscribers (Jun-2026), up from 10.3M (Mar-2026) and 8.9M (Dec-2025); 2025 op income $4.4B", label: "Wikipedia — Starlink", url: "https://en.wikipedia.org/wiki/Starlink", as_of: "2026-06", confidence: high}
thrust:
  value: "~$14.1B/yr dep-only (FY2025 capex $20.8B minus combined D&A $6.7B); components: Colossus/Colossus-2 buildout (110k GB200 GPUs, ~1M-GPU target) + continued Starlink constellation capex, not separately broken out in filings. 2026 run-rate is almost certainly materially higher (capex nearly doubled FY24->FY25) but the first post-IPO 10-Q isn't filed yet (due 2026-08-04) so this is the best-available anchor. Buybacks: $0 (none, per Ben's brief)."
  basis: "Recipe: capex - D&A (dep-only intended; filings report combined D&A, not split — same convention used elsewhere on the board, e.g. Intel). SpaceX's $2B equity contribution into xAI's Jul-2025 raise predates the Feb-2026 SpaceX-xAI merger and is NOT added as a separate stake — post-merger it's already inside the same consolidated capex/investing base, so counting it again would double-count."
  sources:
    - {figure: "FY2025 capex -$20,788M; combined D&A $6,701M -> dep-only thrust ~$14.09B", label: "stockanalysis.com SPCX cash-flow statement", url: "https://stockanalysis.com/stocks/SPCX/financials/cash-flow-statement/", as_of: "2026-06", confidence: high}
    - {figure: "FY2024 capex -$11,163M; combined D&A $3,824M -> capex nearly doubled YoY into FY2025", label: "stockanalysis.com SPCX cash-flow statement", url: "https://stockanalysis.com/stocks/SPCX/financials/cash-flow-statement/", as_of: "2026-06", confidence: high}
    - {figure: "Colossus 2: 110,000 GB200 GPUs; Colossus overall targeted toward 1M+ GPUs; third building purchased Dec-2025 to push training capacity toward ~2GW", label: "Wikipedia — xAI (company)", url: "https://en.wikipedia.org/wiki/XAI_(company)", as_of: "2025-12", confidence: med}
    - {figure: "SpaceX contributed $2B into the $5B equity leg of xAI's Jul-2025 $10B raise (pre-merger; now consolidated, not added separately)", label: "Wikipedia — xAI (company)", url: "https://en.wikipedia.org/wiki/XAI_(company)", as_of: "2025-07", confidence: high}
    - {figure: "xAI capex $7.7B in Q1-26 alone (cash $24.7B->$15.9B in the quarter) — directional confirmation the FY2025 full-year capex anchor is still climbing", label: "kestrel finding (424B4/S-1 extraction)", url: "artifacts/findings/spacexai-public-megacap-2026-07-24.md", as_of: "2026-07", confidence: med}
notes: "Biggest uncertainty: merged-entity accounting (consolidated SPCX vs SpaceX vs xAI standalone) does not reconcile, so operating/out figures are directional. The Anthropic-Colossus lease terms conflict across CNBC/Bloomberg/Yahoo and are not SEC-confirmed. Thrust and weight both rest on the last PRE-IPO filed quarter (~Mar-2026) since SpaceX's first quarterly report as a public company isn't due until 2026-08-04 — revisit both once that lands. D&A used un-split (combined depreciation+amortization) per filing limits, matching board convention elsewhere (Intel)."
