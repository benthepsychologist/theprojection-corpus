# not reconcile cleanly — capital-flow figures are directional.
# 2026-07-28 (axes_num rollout wave B): added `thrust` block (dep-only capex
# recipe) + refreshed weight (total-assets) and gravity (compute-lease)
# sourcing via stockanalysis.com SPCX statements. First post-IPO 10-Q not yet
# filed (reports 2026-08-04) — figures below are the last-filed pre-IPO
# anchors plus pro-forma notes, flagged accordingly.
node: spacex
name: "SpaceXAI"
pocket: frontier-lab
asof: 2026-07-28
posture:
