    value: "WEIGHT (total assets): $102.1B is the last-filed anchor (quarter ~Mar-2026, pre-IPO); post-IPO total assets not yet findable (first 10-Q as a public co. due 2026-08-04). Fallback basis: pre-IPO total assets ($102.1B, already includes cash+investments) + the Jun-2026 IPO's ~$75B raise pro-forma -> ~$175-180B, primary/secondary split UNCONFIRMED so treat the pro-forma add as low-confidence. Cash alone ~$16B + demonstrated ~$75B raise access; market cap ~$1.52T (SPCX) is a side-label, not weight."
    sources:
      - {figure: "total assets $102,094M (quarter ~Mar-2026, latest filed, pre-IPO)", label: "stockanalysis.com SPCX balance sheet", url: "https://stockanalysis.com/stocks/SPCX/financials/balance-sheet/", as_of: "2026-03", confidence: high}
