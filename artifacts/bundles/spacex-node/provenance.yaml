      - {figure: "~$15.9B cash (down from $24.7B) end Q1-26", label: "kestrel finding (extracted from 424B4/S-1; prospectus >10MB)", url: "artifacts/findings/spacexai-public-megacap-2026-07-24.md", as_of: "2026-07", confidence: med}
