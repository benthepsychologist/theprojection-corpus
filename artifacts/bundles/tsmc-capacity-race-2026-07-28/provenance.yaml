notes: >-
  Confidence key matches prior bundle convention (e.g.
  google-capex-2026-07-27): high = primary source fetched directly
  (TrendForce full-body, NIST.gov, Wikipedia's convergent synthesis), or
  3+ independent outlets converge same-day/same-week. medium = single
  outlet or a small convergent cluster via RSS feed metadata (title/
  source/date confirmed real via the RSS feed itself, article body not
  independently re-fetched — Google News redirect links almost never
  resolved to article text this session, the one consistent exception
  being TrendForce which resolved on several direct-fetch attempts).
  thin = single outlet, unclear methodology, a speculative/rumor framing,
  a contradicted claim, or an explicit crawl gap. No URL or figure in
  this bundle was fabricated. Explicit unresolved gaps carried into the
  finding's "what to watch": (1) no per-facility node/timeline breakdown
  for the 12-facility $265B Arizona commitment; (2) no fresh 2026 source
  independently confirms the board's ~90%+ advanced-node TSMC-specific
  share anchor; (3) the Apple-vs-Nvidia "who's TSMC's biggest customer /
  who lost priority-shipment status" narrative has directly contradicting
  same-week headlines that were not resolved to primary text and should
  not be treated as settled; (4) no dollar/percentage split found for how
  much of the $60-64B 2026 capex is packaging (CoWoS) vs. wafer capacity.
