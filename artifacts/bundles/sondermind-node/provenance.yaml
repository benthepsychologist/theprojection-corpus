notes: "Pocket: health (mental-health provider-network vertical — therapist/psychiatrist marketplace with AI-assisted matching and clinician tools, not a pure AI lab). Biggest uncertainties: (1) no official revenue disclosed anywhere — the operating/gravity figures rest entirely on low-reliability auto-generated estimator sites that disagree by ~8x ($20M-$159M), landed at a conservative midpoint; (2) no primary equity round confirmed since the 2021 Series C despite checking through 2026-07-28 — capital base (weight) is stale, and thrust is correspondingly thin/estimated rather than computed from a disclosed figure; (3) background note that SonderMind has 'reportedly been acquisitive' is only true through Mar-2023 (Qntfy/Total Brain/Mindstrong) — no acquisition found in 2024-2026 in any source reached, so M&A contribution to thrust is treated as $0 for the trailing 12mo, a correction to the wave's background assumption. WebSearch was exhausted (200/200) before this bundle's research began; every source above is a WebFetch against Google News RSS, DuckDuckGo HTML, or an aggregator page (GetLatka, Behavioral Health Business via RSS) — no SEC/IR primary source exists for this private company."
