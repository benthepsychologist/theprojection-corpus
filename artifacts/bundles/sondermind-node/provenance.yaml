# Bundle — node posture + capital-flow: sondermind / SonderMind (2026-07-28)
# axes_num rollout wave G (8-actor small mental-health-AI batch). Recipe (Ben's
# spec for the wave): WEIGHT = cumulative VC raised ($B, private co); THRUST =
# ~12mo deployment run-rate into new positions (network/M&A/contract buildout/
# tech spend), expected to be a modest fraction of a $B; GRAVITY = attributable
# dependent economy in USERS-IN-CARE / payer-contract-revenue terms, NOT gross
# provider/user headline counts; OPTIONALITY = band for how free the commanded
# capital is (VC-backed private cos default to constrained absent evidence
# otherwise). Buybacks N/A ($0, private company).
# Method: WebSearch was budget-exhausted this session (200/200) before any
# query ran; all research is WebFetch against Google News RSS
# (news.google.com/rss/search?q=...), DuckDuckGo HTML results, GetLatka, and
# Behavioral Health Business / Wikipedia-style aggregator pages. No SEC/IR
# primary source exists (private company, no S-1). Revenue in particular is
# NOT independently disclosed by SonderMind — the figures below are
# auto-generated third-party estimator outputs (Zippia/IncFact/RocketReach/
# Compworth) that disagree with each other by 8x ($20M-$159M); treated as
# low-confidence triangulation only, never as an earnings figure.
