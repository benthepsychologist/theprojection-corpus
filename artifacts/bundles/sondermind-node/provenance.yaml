optionality:
  value: "constrained — VC-backed private company (General Catalyst and other undisclosed Series C investors), board oversight, no public listing. Jan-2024 layoffs (~17% of staff) and no fresh primary round since the 2021 Series C are runway/burn signals consistent with constrained, investor-controlled capital rather than freely deployable cash; Feb-2024 trade-press speculation about an 'exit' further points toward investor-driven strategic optionality (M&A/IPO timing) rather than founder-controlled freedom. No evidence found of unusual investor control (e.g., a strategic-industrial or government stake) that would push this toward 'locked.'"
