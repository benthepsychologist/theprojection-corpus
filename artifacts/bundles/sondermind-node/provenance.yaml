gravity:
  value: "~$0.1-0.15B/yr (estimate, low confidence) — reasoned in patients-in-care / payer-contract-revenue terms per the wave recipe, not gross provider/user counts. SonderMind is an in-network insurance marketplace: its network (~12,500 licensed providers, all 50 states for therapy + psychiatry) generates revenue only as insurance-reimbursed sessions actually clear, so the attributable dependent economy is bounded by SonderMind's own operating revenue (the payer-contract dollars flowing through it), not by headline provider/state counts. No official revenue is disclosed; third-party estimator outputs (all low-reliability, auto-generated) range $20M-$159M/yr, with the higher end (Compworth ~$159M) and a rough headcount-implied opex check (~1,100-1,276 employees) both pointing toward the upper-tens-to-low-hundreds-of-millions band. Landed at ~$0.1-0.15B/yr as a midpoint, not the top of the recipe's suggested $0.1-1B range, given the disagreement among sources and no confirmation from SonderMind itself."
  sources:
