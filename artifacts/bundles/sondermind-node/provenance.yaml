thrust:
  value: "~$0.02-0.05B/yr (thin, estimate) — no disclosed multi-year buildout $ figure or M&A spend in the last 12mo. Inputs are qualitative only: completed nationwide network expansion (all-50-states therapy by Apr-2025, psychiatry by Nov-2025) and a Jul-2026 AI-guardrails R&D release, funded out of the existing 2021 capital base / operating revenue rather than a fresh raise (no primary round since 2021 confirmed). No acquisition since Mar-2023, so M&A is $0 for the trailing 12mo, unlike the 2021-2023 acquisitive stretch. Band derived as a modest slice of the ~$0.18-0.24B total capital base plus plausible opex-funded tech/network spend, per the wave recipe's expectation that this figure comes in well under $1B."
  basis: "No source discloses a $-figure-plus-horizon for SonderMind's network expansion, tech spend, or R&D commitment. Absent that, thrust is estimated as a modest fraction of the disclosed capital base and headcount-implied opex, consistent with the wave's stated expectation for a mid-stage single-market provider network with no active fundraise. Flagged explicitly as a rough band, not a computed run-rate — replace if a disclosed capex/opex figure surfaces."
  sources:
