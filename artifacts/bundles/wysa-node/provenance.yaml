# Bundle — node posture + capital-flow: wysa / Wysa (Touchkin eServices)
# axes_num rollout wave G (2026-07-28), one of 8 small mental-health-AI actors.
# Recipe (Ben's spec for the wave):
#   WEIGHT   = cumulative VC/grant capital raised across all rounds ($B).
#   THRUST   = deployment run-rate, $/yr — capital committed in the last ~12mo
#              to NEW positions (buildout, hiring/expansion, clinical/product
#              commitments, enterprise/insurer rollout spend).
#   GRAVITY  = attributable dependent economy (users/enterprise clients that
#              actually depend on Wysa, in $ terms) — NOT gross download/
#              headline-user counts.
#   OPTIONALITY = how free the commanded capital is — default "constrained"
#              for VC-backed private cos absent contrary evidence.
#   Buybacks: n/a, $0 (private company).
# Method: WebSearch budget was exhausted this session (200/200) before any
# Wysa-specific queries ran; all research below is WebFetch against Google
# News RSS (news.google.com/rss/search) and DuckDuckGo HTML search-result
# pages, plus a direct Inc42 company-funding-page fetch. No Wikipedia page
# exists for Wysa (404). Individual publisher article pages mostly blocked
# WebFetch (403) or redirected to expired-domain parking pages — cited via
# the Google News RSS search URL and headline/snippet instead, which are
# real, clickable, and reproduce what WebFetch actually returned (not
# fabricated). Funding-aggregator totals (Tracxn/Inc42/CB Insights) disagree
# with each other by ~30-50% — flagged throughout, not resolved.
