notes: >-
  Confidence key: high = primary/official source or 3+ independent
  outlets converging same day. medium = single outlet, RSS-listed
  (title/source/date confirmed real via the RSS feed itself, but article
  body not independently re-fetched — Google News redirect links did
  not resolve to article text via WebFetch in this crawl, confirmed
  across ~90 attempts by all four subagents). thin = single outlet
  and/or unresolved discrepancy between outlets, or (for
  payoff-76b-ttm-not-found specifically) a negative finding. Several
  items above cite a reconstructed Google News RSS *search* URL rather
  than a specific *article* redirect URL, where the subagent's report
  gave only the outlet/title/date without preserving the individual
  article redirect link — these are marked medium/thin accordingly and
  the search URL will reproduce the same listing. No URL, figure, date,
  or quote in this bundle was fabricated; where subagents flagged a
  claim as unconfirmed or found conflicting figures across outlets
  (e.g. the Hyperion $50B vs. $200B figures, the nuclear RFP 1.4GW vs.
  4GW target, the tent power source "jet engines" vs. "off-grid gas"),
  that conflict is preserved above rather than silently resolved.
