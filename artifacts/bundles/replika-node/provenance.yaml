  deployed:
    value: "No disclosed capex/buildout commitment found (no datacenter deals, no disclosed compute-purchase agreements). Presumed spend is ordinary cloud/hosting + engineering payroll (115 employees per GetLatka) folded into operating costs, not broken out anywhere found."
    sources:
      - {figure: "no disclosed capex, datacenter, or compute-purchase commitment found in any source consulted", label: "absence noted across Wikipedia + Google News RSS + DuckDuckGo passes", url: "https://en.wikipedia.org/wiki/Replika", as_of: "2026-07-28", confidence: low}
  in:
    value: "Legacy VC (~$11M closed years ago, Khosla Ventures-led) plus ongoing subscription inflows (see operating, disputed range ~$4.8-35M/yr). No new institutional capital found flowing in during the trailing 12 months."
    sources:
      - {figure: "$11M over 4 rounds from 9 investors (Khosla Ventures, ACME Capital, Zillionize, AIX Ventures among them)", label: "Tracxn via DuckDuckGo search results", url: "https://html.duckduckgo.com/html/?q=Replika+Luka+Inc+total+funding+raised+2026", as_of: "2026-07-28", confidence: med}
  out:
    value: "No itemized capital-out disclosed; ordinary operating spend (compute/hosting/payroll) inferred from the ~$4.8-35M ARR range and 115-employee headcount, not broken out."
    sources:
      - {figure: "115 employees", label: "GetLatka via DuckDuckGo search results", url: "https://html.duckduckgo.com/html/?q=Replika+Luka+Inc+total+funding+raised+2026", as_of: "2026-07-28", confidence: low}
thrust:
  value: "~$0-5M/yr (thin, near-zero as a confirmed run-rate) — no disclosed new funding round, capex commitment, datacenter deal, or hiring surge found in the trailing 12 months. The one nearby capital event (Kuyda's $20M pre-seed for Wabi, Nov-2025) is explicitly a SEPARATE company, not Replika/Luka capital, and is excluded here. Point estimate ~$0.003B/yr reflects presumed ordinary compute/engineering opex growth only, not a quantified commitment — treat as a rough floor, not a computed figure."
  basis: "The wave recipe defines thrust as capital committed in the last ~12mo to new positions (compute/model spend, new hiring, new product lines). No source found discloses any such commitment for Replika/Luka in the 2025-2026 window; the company's visible 2025-2026 news is a CEO transition and a regulatory fine, not a buildout. This is consistent with the wave brief's expectation that Replika 'has not raised large rounds recently as far as is publicly known' — confirmed here, and extended to find no disclosed operating buildout either."
  sources:
    - {figure: "no funding round, capex, or hiring-surge news found for Replika/Luka in the 2025-2026 window", label: "absence noted across Wikipedia + Google News RSS + DuckDuckGo passes", url: "https://news.google.com/rss/search?q=Replika+CEO+Dmytro+Klochko+Kuyda", as_of: "2026-07-28", confidence: low}
    - {figure: "Kuyda's $20M pre-seed raise for Wabi (Nov-2025) is a separate company's funding, not Luka/Replika's", label: "TechCrunch via Google News", url: "https://news.google.com/rss/search?q=Replika+subscription+revenue+million", as_of: "2025-11-05", confidence: med}
optionality:
  value: "mixed, leaning constrained — a small early institutional stake (~$11M, Khosla Ventures-led, closed ~2018-2022) rather than the large-and-recent VC dependence typical of frontier-lab peers; the long gap since any new funding round plus continuous subscription revenue (disputed range ~$4.8-35M/yr, ~25% of users paying) suggest the company has been running substantially on its own subscription income for years, pushing toward mixed per the wave recipe's carve-out. Still a private company with original institutional investors presumably holding board seats, so not called free; confidence low given how thin the sourcing is on actual governance/control terms."
  sources:
    - {figure: "$11M over 4 rounds, Khosla Ventures-led, no round found since ~2018-2022", label: "Tracxn via DuckDuckGo search results", url: "https://html.duckduckgo.com/html/?q=Replika+Luka+Inc+total+funding+raised+2026", as_of: "2026-07-28", confidence: med}
    - {figure: "roughly 25% of user base paying an annual subscription fee, sustained since well before the most recent funding gap", label: "Wikipedia — Replika", url: "https://en.wikipedia.org/wiki/Replika", as_of: "2026", confidence: med}
    - {figure: "no governance/board-control details found in any source consulted", label: "absence noted across Wikipedia + DuckDuckGo passes", url: "https://en.wikipedia.org/wiki/Replika", as_of: "2026-07-28", confidence: low}
gravity:
  value: "~$0.005-0.035B/yr ($5-35M) — grounded in disputed subscription-revenue estimates, not Replika's ~40M+ lifetime user/download count, per the wave brief's explicit low-dollar-gravity call for companion-chat apps. Point estimate ~$0.02B/yr (~$20M), splitting the difference between the low GetLatka/Sensor Tower store-revenue read (~$4.8M) and the higher Nikolaroza/CompWorth estimates (~$24-35M) — genuinely wide disagreement across trackers, none of them Replika's own disclosed figures, so this whole axis is low confidence."
  sources:
    - {figure: "2026 estimated ARR $4.8M (Sensor Tower-style store-revenue read, down from $14M 2024)", label: "GetLatka / Sensor Tower via DuckDuckGo search results", url: "https://html.duckduckgo.com/html/?q=Replika+app+revenue+Sensor+Tower+OR+data.ai+annual+2024+2025", as_of: "2026-07-28", confidence: low}
    - {figure: "2023 revenue ~$30M, 2024 ~$24M", label: "Nikolaroza.com via DuckDuckGo search results", url: "https://html.duckduckgo.com/html/?q=Replika+app+revenue+Sensor+Tower+OR+data.ai+annual+2024+2025", as_of: "2026-07-28", confidence: low}
    - {figure: "current annual revenue estimate ~$35.1M", label: "CompWorth via DuckDuckGo search results", url: "https://html.duckduckgo.com/html/?q=Replika+app+revenue+Sensor+Tower+OR+data.ai+annual+2024+2025", as_of: "2026-07-28", confidence: low}
    - {figure: "40M+ users by 2025 (Jan-2018: 2M -> Jan-2023: 10M -> Aug-2024: 30M+ -> 2025: 40M+), explicitly NOT used directly as gravity per the wave recipe (gross headline, not attributable dependent economy)", label: "Wikipedia — Replika", url: "https://en.wikipedia.org/wiki/Replika", as_of: "2026", confidence: med}
