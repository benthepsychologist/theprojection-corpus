axes_num_estimate: { weight: 0.011, thrust: 0.003, gravity: 0.02 }  # agent-derive 2026-07-28 wave G
notes: "pocket: health is used as the closest existing board bucket; Replika sits in the AI-companion-app vertical, adjacent to but distinct from the clinical/telehealth mental-health peers (sondermind, spring-health, talkspace) already tagged double_dependent in that group — Replika is not itself double-dependent on a payer/provider chain the way those are. Biggest correction versus the wave brief: verified cumulative VC raised is ~$11M, not the assumed ~$70M — three independent trackers converge on the lower figure and no source found supports ~$70M. Second-biggest uncertainty: gravity/operating revenue estimates disagree by ~7x across trackers ($4.8M-$35M), none of them Luka Inc.'s own disclosed numbers (none were found) — treat the whole revenue picture as directional only. Notable posture context: Oct-2025 CEO transition (Kuyda -> Klochko) coincides with Kuyda launching an unrelated company (Wabi) that raised its own $20M pre-seed — do not attribute that raise to Replika/Luka. Regulatory history: Italy's Garante banned Replika Feb-2023 (restored partially May-2023), then fined Luka Inc. ~€5M/$5.6M and reaffirmed the ban in May/Jun-2025 over children's-privacy concerns — relevant to posture and a live constraint on the optionality band. WebSearch was exhausted for this entire session before this node's research began; all sourcing here is WebFetch-only (Wikipedia direct fetch + Google News RSS + DuckDuckGo HTML), consistent with the wave's stated fallback."
