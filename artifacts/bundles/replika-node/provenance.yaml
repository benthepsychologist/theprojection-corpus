    value: "~$11-11.2M cumulative raised across 4 rounds (Series A $4.4M led by Khosla Ventures + ACME Capital among 9 total investors); no funding-round news found newer than ~2018-2022. This directly contradicts the wave brief's ~$70M assumption — treat $11M as the verified figure."
    sources:
      - {figure: "Replika has raised a total funding of $11M over 4 rounds from 9 investors", label: "Tracxn — Replika company profile via DuckDuckGo search results", url: "https://html.duckduckgo.com/html/?q=Replika+Luka+Inc+total+funding+raised+2026", as_of: "2026-07-28", confidence: med}
      - {figure: "~$11.2 million across 4 rounds", label: "PitchBook company profile via DuckDuckGo search results (ground.news/AIM Media House cross-refs)", url: "https://html.duckduckgo.com/html/?q=Replika+Luka+Inc+funding+rounds+Crunchbase", as_of: "2026-07-28", confidence: med}
