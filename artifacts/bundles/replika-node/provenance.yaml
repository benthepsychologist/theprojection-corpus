# Bundle — node posture + capital-flow: replika / Replika (Luka, Inc.)
# axes_num rollout wave G (2026-07-28) — 1 of 8 small mental-health-AI actors in
# this wave. Recipe (Ben's spec for the wave): WEIGHT = cumulative VC raised
# ($B, private co.); THRUST = deployment run-rate, $/yr, capital committed in
# the trailing ~12mo to new positions (compute/hiring/product); GRAVITY =
# attributable dependent economy grounded in subscription-revenue estimates,
# NOT gross user-count headlines (companion-chat apps are explicitly flagged
# low-dollar-gravity in the wave brief); OPTIONALITY = how free the commanded
# capital is (VC-backed private => constrained by default, pushed toward
# mixed only with evidence of profitability/self-funding). Buybacks n/a ($0).
# Method: WebSearch was budget-exhausted this session (200/200 used before any
# query for this node landed) — all research below is WebFetch against
# Wikipedia, Google News RSS (headline/snippet passes), and DuckDuckGo HTML
# search-result pages (both used as fallback per the wave instructions).
# getlatka.com and crunchbase.com full-page fetches 404'd/403'd directly; their
# figures are cited via the DuckDuckGo search-results-page URL that surfaced
# them instead (a real, clickable URL, not fabricated) — same pattern as the
# mistral-ai-node bundle uses for Google News.
#
# IMPORTANT CORRECTION TO WAVE BACKGROUND: the brief's "~$70M total raised"
# figure for Replika/Luka Inc did NOT check out. Three independently-sourced
# trackers (Tracxn, PitchBook via a ground.news writeup, and a Sept-2022
# en.ain.ua funding article) converge instead on cumulative funding of
# ~$11-11.2M across 4 rounds, led by Khosla Ventures with ACME Capital,
# Zillionize, AIX Ventures and others (9 investors total per Tracxn). No
# funding-round news newer than ~2018-2022 was found in any source checked.
# WEIGHT below uses the verified ~$11M figure, not the unverified ~$70M one.
node: replika
name: "Replika"
pocket: health
asof: 2026-07-28
posture:
  value: "contracting / under pressure"
  basis: "Founder/CEO Eugenia Kuyda stepped aside Oct-2025 to launch a separate company (Wabi, a $20M pre-seed raise that is NOT Replika/Luka capital); Dmytro Klochko named CEO. Third-party ARR estimate shows revenue falling (~$14M in 2024 -> ~$4.8M estimated 2026, per GetLatka/Sensor Tower store-revenue read), though other revenue trackers disagree sharply (see gravity). Regulatory pressure continues: Italy's Garante fined Luka Inc. ~€5M/$5.6M in May-2025 and reaffirmed its Replika ban in Jun-2025 over children's-privacy concerns, echoing the original Feb-2023 Italy ban/erotic-content pull. No new funding round found since ~2018-2022, so financially the company reads as running on legacy VC + subscription revenue rather than fresh growth capital."
  sources:
    - {figure: "CEO of 'AI companion' startup Replika is stepping aside to launch a new company", label: "Business Insider via Google News", url: "https://news.google.com/rss/search?q=Replika+CEO+Dmytro+Klochko+Kuyda", as_of: "2025-10-09", confidence: med}
    - {figure: "Dmytro Klochko became CEO (after Kuyda stepped aside)", label: "Wikipedia — Replika", url: "https://en.wikipedia.org/wiki/Replika", as_of: "2025", confidence: med}
    - {figure: "Italy's data watchdog fines AI company Replika's developer $5.6 million", label: "Reuters via Google News", url: "https://news.google.com/rss/search?q=Replika+Italy+data+protection+fine+2025", as_of: "2025-05-19", confidence: med}
    - {figure: "Italy's DPA reaffirms ban on Replika over AI and children's privacy concerns", label: "IAPP / Techerati / Silicon UK / BABL AI via Google News", url: "https://news.google.com/rss/search?q=Replika+Italy+data+protection+fine+2025", as_of: "2025-06", confidence: med}
    - {figure: "Replika founder raises $20M pre-seed for Wabi, the 'YouTube of apps' (separate company, launched late 2025)", label: "TechCrunch via Google News", url: "https://news.google.com/rss/search?q=Replika+subscription+revenue+million", as_of: "2025-11-05", confidence: med}
capital:
