method: >
  Whole-pocket triage crawl across all seven insurance-pocket board actors
  (Berkshire Hathaway, Allianz, Ping An, China Life, Prudential Financial,
  MetLife, Nippon Life), each checked for a genuine AI-relevant story from
  roughly the last 2-3 months. Three parallel sonnet-class research passes:
  a deep dive on Ping An (board-flagged as the strongest insurtech-AI
  candidate), a deep dive on Berkshire Hathaway (largest dry powder, real
  chance of an AI-investing stance from Buffett/Abel), and a lighter
  confirmatory pass on the remaining five. GDELT's DOC API was rate-limited
  (HTTP 429, "limit to one every 5 seconds") on every attempt across all
  three passes, including after 8-30s waits between retries — read as a
  session-wide block, not simple under-pacing. All research fell back
  entirely to WebSearch + WebFetch. Two claims were independently
  re-verified by the orchestrating session directly against a primary
  source after the research passes returned (rather than accepted from a
  single secondary report): the Allianz-Anthropic partnership (re-fetched
  from Allianz's own press release) and the Nippon Life v. OpenAI lawsuit
  (re-verified against the actual case docket via CourtListener/PACER).
