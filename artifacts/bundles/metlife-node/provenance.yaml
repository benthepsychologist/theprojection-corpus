notes: "Biggest uncertainty: the 'New Frontier' strategy label (posture basis) is board-sourced, not re-verified from a primary MetLife release this session (low confidence) — but the financial figures (AUM $741.7B, general account $473.1B) are firm. Figures USD. WEIGHT-BASIS FLAG (axes_num rollout, 2026-07-28): axes_num.weight uses own-balance-sheet total assets ~$743B (Mar 2026, stockanalysis) rather than the $741.7B MIM total-AUM figure — the two are numerically close because MIM's third-party (fiduciary) book appears smaller relative to the general account than Allianz/PIMCO or Prudential/PGIM's; still flagged as the same category question (fiduciary AUM vs own balance sheet) even though the dollar gap is small here."
