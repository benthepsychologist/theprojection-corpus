      - {figure: "revenue $402,067M FY25 / $407,905M TTM; OCF $10,639M FY25 / $10,332M TTM (TTM to Mar 31 2026)", label: "stockanalysis.com CVS financials", url: "https://stockanalysis.com/stocks/CVS/financials/", as_of: "2026-03", confidence: high}
  deployed:
    value: "~$2.8B capex + ~$0.4B small acquisitions FY25; buybacks essentially halted (~$158M)"
    sources:
      - {figure: "capex $2,832M FY25; cash acquisitions $436M FY25; buybacks $158M FY25", label: "stockanalysis.com CVS cash-flow statement + financials", url: "https://stockanalysis.com/stocks/CVS/financials/cash-flow-statement/", as_of: "2025-12", confidence: high}
  in:
    value: "inflows — ~$402B FY25 revenue: Aetna premiums + Caremark PBM + CVS Pharmacy retail"
