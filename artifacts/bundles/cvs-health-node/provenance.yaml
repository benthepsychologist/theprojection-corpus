node: cvs-health
name: "CVS Health"
pocket: health
asof: 2026-07-26

posture:
  value: retrenching
  basis: "Digesting the Aetna + Oak Street + Signify debt load under new CEO David Joyner — ~900 store closures, buybacks cut to a token ~$158M, cash steered to debt paydown and the dividend."
  sources:
    - {figure: "CEO David Joyner (from Oct 2024); Oak Street Health acquired 2023 (~$10.6B EV); Signify Health 2022 (~$8B); ~900 stores being closed (~10% of footprint)", label: "Wikipedia — CVS Health (recent developments)", url: "https://en.wikipedia.org/wiki/CVS_Health", as_of: "2026-07", confidence: med}
