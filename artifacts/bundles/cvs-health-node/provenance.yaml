      - {figure: "cash & equivalents $9,542M; short-term investments $2,260M; total investments $34,667M; total debt $78,345M (Mar 31 2026)", label: "stockanalysis.com CVS balance sheet", url: "https://stockanalysis.com/stocks/CVS/financials/balance-sheet/", as_of: "2026-03", confidence: high}
  operating:
    value: "~$402B FY25 revenue (~$408B TTM); operating cash flow ~$10.6B FY25 / ~$10.3B TTM"
