# Bundle — node posture + capital-flow: deepseek / DeepSeek (2026-07-26, thrust pass 2026-07-28)
# Extends board.yaml deepseek axis strings (no prior -axes bundle) with posture
# + the 5-way capital-flow decomposition for the frontier-lab pocket.
# Method: WebFetch primary sources (WebSearch exhausted). Nearly self-funded via
# High-Flyer — capital posture is anomalous (lean, compute-in-hand, export-locked).
# Funding round + valuation are REPORTED, not confirmed. PLA ties reported by NYT.
# 2026-07-28 pass: WEIGHT figures moved a LOT since 2026-07-26 — a $7-7.4B first
# external round (closed Jun-2026, ~$50-52B post-money) supersedes the earlier
# $300M/$10B report, and a second $1.5B round at a reported $71-74B valuation was
# in talks Jul-14/18 then PAUSED Jul-25/27 after founder Liang Wenfeng's leaked
# US-China compute-gap remarks went viral. Added a thrust: block (near-zero/thin —
# no disclosed multi-year compute commitment; the paused $1.5B round was explicitly
# earmarked toward owning compute/data-center infrastructure, which is the closest
# thing to a thrust proxy found, but it's a one-time raise target, not a run-rate,
