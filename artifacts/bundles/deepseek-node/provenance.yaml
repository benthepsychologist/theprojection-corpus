# WebSearch budget was exhausted session-wide (parallel research wave); this pass
# is WebFetch/Google-News-RSS only — treat news-RSS-sourced figures as med/low
# confidence unless corroborated across outlets (Reuters headline for the $7B
# round was directly visible in RSS and is treated as med-high).
