notes: "Biggest uncertainty: capital posture is anomalous — nearly self-funded, lean, compute-in-hand, export-locked, so the usual raise/burn/commitment decomposition barely applies. WEIGHT moved sharply between the 2026-07-26 and 2026-07-28 passes: the earlier $10B valuation and $300M round are REPORTED-not-confirmed and now superseded by a $7-7.4B closed round (~$50-52B valuation, Jun-2026) and an attempted-then-PAUSED $1.5B round at ~$71-74B (Jul-2026) — the pause followed founder Liang Wenfeng's own leaked remarks, not external action, so treat the $71-74B figure as an aspiration interrupted mid-flight, not a floor. THRUST is a genuine near-zero/thin finding (no multi-year commitment sourced) rather than a research gap — consistent with the posture. GRAVITY still has no clean $/yr figure; new market-share proxies (30-46% of enterprise tokens, OpenRouter 70%->30% US-to-China share shift) are directionally strong but not convertible to a defensible dollar estimate without an unsourced total-market baseline, so no such conversion was attempted. PLA affiliation is NYT-reported and unverified. WebSearch was exhausted session-wide before this pass could use it; all 2026-07-28 additions are WebFetch/Google-News-RSS sourced."
