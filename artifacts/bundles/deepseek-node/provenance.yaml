thrust:
  value: "~$0-1.5B (thin), effectively near-zero as a confirmed run-rate — no disclosed multi-year compute/build commitment to divide into a clean $/yr figure, consistent with the 'compute already in hand, export-locked' posture. The closest proxy is the paused $1.5B second-round target, reported as explicitly earmarked toward DeepSeek 'owning infrastructure behind its price advantage' (i.e. compute/data-center buildout) — but it is (a) a one-time capital-raise target, not an annualized multi-year commitment, (b) currently PAUSED/stalled as of 2026-07-27, and (c) not confirmed closed. V4's training cost (the nearest thing to a capex-like proxy event, cf. V3's disclosed $5.576M) was NOT disclosed anywhere found this pass, so it can't even anchor a one-time-event estimate the way V3 did last cycle."
  basis: "Per the board's frontier-lab thrust methodology (commitment run-rate = multi-year compute commitment / years): DeepSeek has NO sourced multi-year external compute/build commitment. Its capital-in-hand strategy (pre-2021 GPU stockpile + newly-conditional H200 access + a nascent domestic-chip program) is explicitly the opposite of the hyperscaler-style multi-year take-or-pay deals this metric is built to capture. Treat thrust here as a genuine near-zero/thin finding, not a gap in research — it reflects DeepSeek's anomalous, largely internally-funded capital posture."
  sources:
    - {figure: "No V4 training-cost figure or multi-year compute-commitment total found in any source reviewed this pass", label: "Google News RSS — DeepSeek V4 training cost sweep", url: "https://news.google.com/rss/search?q=DeepSeek+V4+training+cost", as_of: "2026-07", confidence: low}
    - {figure: "$1.5B second-round target explicitly framed as funding infrastructure/compute ownership; PAUSED as of Jul-25/27-2026", label: "Google News RSS — DeepSeek $71B infrastructure funding sweep", url: "https://news.google.com/rss/search?q=DeepSeek+%2471+billion+own+infrastructure", as_of: "2026-07-27", confidence: med}
    - {figure: "No specific dollar figures, multi-year GPU purchase commitments, or detailed capex announcements directly attributed to DeepSeek data-center construction found in a dedicated capex/data-center sweep", label: "Google News RSS — DeepSeek data-center/capex sweep", url: "https://news.google.com/rss/search?q=DeepSeek+data+center+capex+billion+GPU+purchase", as_of: "2026-07", confidence: low}
buybacks:
  value: "$0 — private company (High-Flyer/Liang Wenfeng-controlled), no share-repurchase mechanism exists; company is in fundraising mode (closed round + paused second round), the opposite of a buyback posture"
