notes: "Biggest uncertainty is the PBM regulatory/legal front — Evernorth/Express Scripts sits in the FTC PBM crosshairs, and the PXDX algorithm is Cigna's entry in the payer-ai-claim-denial thread (batch denials without file review). Behavioral-health arm: Evernorth Behavioral Health. The 185M-relationship / 1.7M-provider figures are board-anchor estimates, not re-fetched primary."
