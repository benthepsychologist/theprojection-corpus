      - {figure: "total revenue $274,900M FY25", label: "stockanalysis.com CI financials", url: "https://stockanalysis.com/stocks/CI/financials/", as_of: "2025-12", confidence: high}
  out:
    value: "outflows — medical + PBM drug costs dominate; then ~$3.6B buybacks + ~$1.6B dividends FY25"
