node: cigna
name: "Cigna"
pocket: health
asof: 2026-07-26

posture:
  value: consolidating
  basis: "Pivoting the whole group onto Evernorth / Express Scripts services — sold the Medicare Advantage book to HCSC ($3.7B, closed Mar 2025), walked away from the Humana merger (Dec 2023), and is buying back stock (~$3.6B) rather than expanding insurance risk."
  sources:
    - {figure: "sold Medicare Advantage / Part D / CareAllies to HCSC for $3.7B (closed Mar 19 2025); Humana merger talks (~$60B) ended Dec 2023; 2023 rebrand to The Cigna Group / Evernorth Health Services", label: "Wikipedia — Cigna (recent developments)", url: "https://en.wikipedia.org/wiki/Cigna", as_of: "2026-07", confidence: med}
    - {figure: "PXDX algorithm denied 300,000+ requests over two months, ~1.2 seconds each, without opening files (ProPublica 2023)", label: "Wikipedia — Cigna (PXDX controversy)", url: "https://en.wikipedia.org/wiki/Cigna", as_of: "2026-07", confidence: med}

