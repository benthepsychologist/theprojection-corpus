      - {figure: "revenue $274,900M FY25 / $277,892M TTM; OCF $9,601M FY25 / $8,812M TTM (TTM to Mar 31 2026)", label: "stockanalysis.com CI financials", url: "https://stockanalysis.com/stocks/CI/financials/", as_of: "2026-03", confidence: high}
  deployed:
    value: "~$1.2B capex + ~$3.6B buybacks committed FY25 — capital returned, not reinvested in insurance"
    sources:
      - {figure: "capex $1,212M FY25; share repurchases $3,621M FY25", label: "stockanalysis.com CI financials + cash-flow statement", url: "https://stockanalysis.com/stocks/CI/financials/cash-flow-statement/", as_of: "2025-12", confidence: high}
  in:
    value: "inflows — ~$274.9B FY25: Evernorth/Express Scripts PBM services revenue now dominant + Cigna Healthcare premiums"
