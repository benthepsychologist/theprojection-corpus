# actual patients/users depending on the product for care, not inflated.
# OPTIONALITY = how free the commanded capital is — VC-backed private co
# defaults to "constrained" absent evidence otherwise. Buybacks N/A ($0).
# Method: WebSearch was budget-exhausted this session (200/200 used
# immediately on the first two queries) — fell back to WebFetch against
# Google News RSS (news.google.com/rss/search) and DuckDuckGo HTML search
# results, plus direct WebFetch of a16z's announcement post and
# slingshotai.com/press. No Wikipedia page exists for Slingshot AI (404).
# All figures below are cross-checked across 2+ independent outlets where
# possible; where only one weak source exists it is flagged confidence: low.
