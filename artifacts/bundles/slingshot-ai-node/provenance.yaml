gravity:
  value: "~$0.05-0.3B/yr (point estimate ~$0.1B/yr), LOW CONFIDENCE, estimate uncited for scale -- no 2026 active-user, revenue, or clinical-outcome figure was found in any source. The only hard public number is the pre-launch beta cohort (50,000 users, as of Jul-2025); Ash has been a free app for a year since with no confirmed current user count, and the UK withdrawal (Jan-2026) reduces rather than grows footprint. The point estimate applies a rough per-user dependent-care-value proxy (a few hundred to ~$1-2K/yr per active user, i.e. the value of the care/support relationship a user depends on) to an assumed post-launch active-user base in the low hundreds of thousands -- this multiplier and user count are BOTH unconfirmed assumptions, not sourced figures. Consistent with wave-G expectation (early-stage co, should read well under $1B, not tens of billions of gross-headline scale)."
  sources:
    - {figure: "50,000-user beta cohort prior to public launch (Jul-2025) -- the only hard, sourced user-count figure found for this actor", label: "Slingshot AI — Press page", url: "https://slingshotai.com/press", as_of: "2025-07-22", confidence: med}
