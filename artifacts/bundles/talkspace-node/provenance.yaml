notes: "board.yaml's talkspace gloss ('Teladoc-owned; double-dependent like its peers') is STALE/WRONG -- flagged above and here, NOT corrected in board.yaml per task scope. Correct current event is the UHS acquisition (pending, expected close Q3 2026, not yet closed as of this 2026-07-28 pass). Weight uses total assets ($136.2M) per the public-company wave-G recipe, not cumulative-raised. Thrust is a proxy (capitalized software + R&D) since Talkspace doesn't disclose a single 'new positions' line; treat the ~$0.024B/yr figure as a reasoned estimate, not an exact run-rate. Gravity anchored on FY2025 audited revenue ($228.9M) rather than the higher single-quarter annualization, to stay conservative. All figures sourced directly from Talkspace's own SEC EDGAR 10-Q/10-K filings (primary, high-confidence) plus Google News RSS corroboration for the deal narrative (WebSearch budget was exhausted this session, per the standard fallback pattern used elsewhere in this repo)."
