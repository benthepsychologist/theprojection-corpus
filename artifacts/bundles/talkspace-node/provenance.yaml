  basis: "Definitive merger agreement with Universal Health Services signed 2026-03-09 ($5.25/share cash, ~$835M); stockholders approved the deal 2026-05-29; expected close Q3 2026 per the company's own 10-Q. The company is executing a sale, not pursuing independent expansion — Q1 2026 G&A already carries ~$7.3M of transaction-related costs, and the board's posture is best read as 'in transition to a strategic acquirer' rather than 'expanding' or 'steady-state.'"
  sources:
    - {figure: "definitive merger agreement with Universal Health Services, Inc.; $5.25/share cash, ~$835M; expected closing Q3 2026; $32.4M termination fee; ~$7.3M transaction costs in Q1 2026 G&A", label: "Talkspace 10-Q (SEC EDGAR, period ended 2026-03-31)", url: "https://www.sec.gov/Archives/edgar/data/1803901/000119312526217060/talk-20260331.htm", as_of: "2026-05-11", confidence: high}
