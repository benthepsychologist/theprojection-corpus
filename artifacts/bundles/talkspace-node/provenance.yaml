    - {figure: "Talkspace Stockholders Approve Acquisition by Universal Health Services", label: "Quiver Quantitative via Google News", url: "https://news.google.com/rss/search?q=Talkspace+UHS+acquisition", as_of: "2026-05-29", confidence: med}
capital:
  available:
    value: "$136.2M total assets (2026-03-31, most recent 10-Q), of which $31.4M cash & cash equivalents (down from $37.4M at 2025-12-31). This IS the weight axis for Talkspace per the wave-G recipe (public co. -> total assets, not cumulative-raised)."
    sources:
      - {figure: "total assets $136,192 thousand at 2026-03-31 vs. $134,863 thousand at 2025-12-31; cash & equivalents $31,411 thousand at 2026-03-31 vs. $37,352 thousand at 2025-12-31", label: "Talkspace 10-Q (SEC EDGAR)", url: "https://www.sec.gov/Archives/edgar/data/1803901/000119312526217060/talk-20260331.htm", as_of: "2026-05-11", confidence: high}
  operating:
    value: "FY2025 revenue $228.9M (vs. $187.6M FY2024, ~22% YoY growth). Q1 2026 revenue $61.7M (vs. $52.2M Q1 2025), an annualized run-rate of ~$247M if Q1 held flat across the year. Segments (Q1 2026): Payor $48.6M, DTE $9.6M, Consumer $3.5M — Payor dominates."
    sources:
      - {figure: "FY2025 revenue $228.9M; FY2024 revenue $187.6M", label: "Talkspace 10-K FY2025 (SEC EDGAR)", url: "https://www.sec.gov/Archives/edgar/data/1803901/000119312526105146/talk-20251231.htm", as_of: "2026-03-13", confidence: high}
      - {figure: "Q1 2026 revenue $61,679 thousand vs. Q1 2025 $52,182 thousand; Payor $48.6M / DTE $9.6M / Consumer $3.5M", label: "Talkspace 10-Q (SEC EDGAR)", url: "https://www.sec.gov/Archives/edgar/data/1803901/000119312526217060/talk-20260331.htm", as_of: "2026-05-11", confidence: high}
  deployed:
    value: "New-position deployment is thin: $3.2M capitalized internal-use software costs in Q1 2026 (vs. $2.0M Q1 2025) + $2.7M R&D expense in Q1 2026 -> annualized ~$23.6M/yr combined, the basis for the thrust estimate below. No new acquisitions, stakes, or capex line items disclosed in the quarter."
    sources:
      - {figure: "capitalized internal-use software costs $3,203 thousand (Q1 2026) vs. $1,988 thousand (Q1 2025, approx per +$1.2M YoY delta reported); R&D expense $2.7M (Q1 2026)", label: "Talkspace 10-Q (SEC EDGAR)", url: "https://www.sec.gov/Archives/edgar/data/1803901/000119312526217060/talk-20260331.htm", as_of: "2026-05-11", confidence: high}
  in:
    value: "No new external capital inflow this period — no financing round, no debt raise disclosed. The only inbound-capital event on the horizon is the UHS acquisition itself (an inflow to shareholders at close, not new operating capital to the company), which is PENDING, not closed."
    sources:
      - {figure: "no new financing/capital-raise activity found in Q1 2026 10-Q", label: "Talkspace 10-Q (SEC EDGAR)", url: "https://www.sec.gov/Archives/edgar/data/1803901/000119312526217060/talk-20260331.htm", as_of: "2026-05-11", confidence: med}
  out:
    value: "Capital returned to shareholders via buyback was active pre-deal but has stopped: $6.975M spent retiring 2.5M shares in Q1 2025; ZERO buybacks in Q1 2026 (paused, consistent with a company under a pending-acquisition agreement, which typically restricts share activity outside the deal). Also outbound: ~$7.3M of merger-transaction costs in Q1 2026 G&A."
    sources:
      - {figure: "Q1 2025: repurchased 2.5 million shares for retirement totaling $6.975 million; Q1 2026: no stock repurchases", label: "Talkspace 10-Q (SEC EDGAR)", url: "https://www.sec.gov/Archives/edgar/data/1803901/000119312526217060/talk-20260331.htm", as_of: "2026-05-11", confidence: high}
      - {figure: "~$7.3 million of transaction-related costs related to the pending UHS merger, included in G&A", label: "Talkspace 10-Q (SEC EDGAR)", url: "https://www.sec.gov/Archives/edgar/data/1803901/000119312526217060/talk-20260331.htm", as_of: "2026-05-11", confidence: high}
thrust:
  value: "~$0.02-0.03B/yr (thin) — capitalized internal-use software ($3.2M/qtr) + R&D expense ($2.7M/qtr) annualized to ~$23.6M/yr as the best proxy for 'new positions' (product/clinical-network/AI-tool spend). Point estimate $0.024B/yr. Already small pre-deal given company size; the pending UHS acquisition (signed 2026-03-09, closing expected Q3 2026) plausibly caps further growth in this figure for the deal's duration, though the one available post-signing quarter (Q1 2026, ~3 weeks post-announcement) does not yet show a sharp visible cut vs. Q1 2025 — flagged as a expected-not-yet-fully-observed suppression, not asserted as already visible in the data."
  basis: "Talkspace does not break out a single 'new positions' capex line; this combines capitalized software development (the closest thing to product/platform investment) with R&D expense (the closest thing to AI-tool/clinical-tech spend), both disclosed in the Q1 2026 10-Q cash-flow and income-statement sections, annualized x4 from the single quarter available."
  sources:
    - {figure: "capitalized internal-use software costs $3.2M (Q1 2026, vs. $2.0M Q1 2025); R&D expense $2.7M (Q1 2026)", label: "Talkspace 10-Q (SEC EDGAR)", url: "https://www.sec.gov/Archives/edgar/data/1803901/000119312526217060/talk-20260331.htm", as_of: "2026-05-11", confidence: high}
    - {figure: "Sentia AI, LLC noted as a wholly-owned subsidiary dedicated to proprietary AI development; no separate $ budget disclosed", label: "Talkspace 10-K FY2025 (SEC EDGAR)", url: "https://www.sec.gov/Archives/edgar/data/1803901/000119312526105146/talk-20251231.htm", as_of: "2026-03-13", confidence: med}
optionality:
  value: "locked (band: constrained-to-locked) — mid-acquisition by a strategic buyer (UHS), stockholder vote ALREADY passed (2026-05-29), expected close Q3 2026, $32.4M termination fee disclosed. Per the wave-G recipe, this is a textbook locked case: the board is executing a sale under a signed, shareholder-approved agreement, not deploying capital independently. The only residual freedom is regulatory/closing-condition risk (a deal could still in principle fail to close), which is why 'locked' is read as the practical state rather than an absolute one."
  sources:
    - {figure: "definitive merger agreement 2026-03-09; stockholders approved 2026-05-29; expected close Q3 2026; $32.4M termination fee", label: "Talkspace 10-Q (SEC EDGAR)", url: "https://www.sec.gov/Archives/edgar/data/1803901/000119312526217060/talk-20260331.htm", as_of: "2026-05-11", confidence: high}
    - {figure: "Talkspace Stockholders Approve Acquisition by Universal Health Services", label: "Quiver Quantitative via Google News", url: "https://news.google.com/rss/search?q=Talkspace+UHS+acquisition", as_of: "2026-05-29", confidence: med}
gravity:
  value: "~$0.23B/yr, grounded directly in disclosed revenue (dependent-economy proxy = the payor/consumer economy that pays for and depends on Talkspace's care access), not gross session/member headlines. FY2025 revenue $228.9M is the anchor figure; Q1 2026 annualized run-rate (~$247M) is a directionally-higher alternate read. Session-volume context (not used as the gravity number itself, per recipe): 1,617,000 payor-covered sessions in 2025 (up from 1,229,200 in 2024), ~5,000 Consumer active members at 2025-12-31."
  basis: "Recipe requires gravity grounded in actual revenue for a public company with disclosed financials, not gross user/member counts. Point estimate uses the audited FY2025 total (more conservative and fully-realized than a single-quarter annualization)."
  sources:
    - {figure: "FY2025 revenue $228.9M (FY2024: $187.6M)", label: "Talkspace 10-K FY2025 (SEC EDGAR)", url: "https://www.sec.gov/Archives/edgar/data/1803901/000119312526105146/talk-20251231.htm", as_of: "2026-03-13", confidence: high}
    - {figure: "Q1 2026 revenue $61.7M, annualized run-rate ~$247M", label: "Talkspace 10-Q (SEC EDGAR)", url: "https://www.sec.gov/Archives/edgar/data/1803901/000119312526217060/talk-20260331.htm", as_of: "2026-05-11", confidence: high}
    - {figure: "1,617,000 Payor-covered sessions in 2025 (vs. 1,229,200 in 2024); ~5,000 Consumer active members at 2025-12-31 (down from 7,200 in 2024) -- context only, not used as the gravity $ figure itself", label: "Talkspace 10-K FY2025 (SEC EDGAR)", url: "https://www.sec.gov/Archives/edgar/data/1803901/000119312526105146/talk-20251231.htm", as_of: "2026-03-13", confidence: high}
buybacks:
  value: "$6.975M in Q1 2025 (2.5M shares repurchased for retirement) -- confirmed small buyback history as the recipe anticipated. ZERO in Q1 2026, consistent with the pending UHS acquisition constraining capital-return activity outside the deal."
