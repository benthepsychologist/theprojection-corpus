# Bundle — node posture + capital-flow: talkspace / Talkspace (2026-07-28)
# axes_num rollout wave G (one of 8 small mental-health-AI actors this wave).
# Talkspace is the ONE actor in wave G that is PUBLIC (NASDAQ: TALK), so it
# follows a different recipe than its 7 (private) wave-mates:
#   - WEIGHT = balance-sheet TOTAL ASSETS from the most recent 10-Q, NOT
#     cumulative-raised (cumulative-raised is the private-company proxy;
#     Talkspace discloses real financials so we use those directly).
#   - Talkspace is MID-ACQUISITION: definitive merger agreement with
#     Universal Health Services (UHS), NASDAQ: UHS, signed 2026-03-09,
#     $5.25/share cash, ~$835M total. Stockholders APPROVED 2026-05-29.
#     Expected close: Q3 2026 (per the 10-Q itself), i.e. PENDING as of
#     this pass (2026-07-28) — not yet closed. This is confirmed directly
#     from Talkspace's own SEC 10-Q (primary source), not just news.
#     $32.4M termination fee disclosed. This materially shapes posture
#     (sale-in-progress, not independent expansion) and optionality
#     (locked — the board is executing a sale, not deploying capital).
#   - THRUST = deployment run-rate is thin and was already thin pre-deal;
#     no sign of a sharp visible cut yet in the one post-announcement
#     quarter available (Q1 2026 covers only ~3 weeks post-signing), but
#     the pending sale plausibly caps any NEW discretionary commitments
#     for the remainder of the deal's pendency — flagged, not overstated.
#   - GRAVITY = grounded in actual disclosed revenue (FY2025 + Q1 2026),
#     not gross member/session counts — per recipe, USERS-IN-CARE /
#     dependent-economy dollar terms.
# Method: SEC EDGAR full-text primary sources (10-Q filed 2026-05-11 for
# Q1 2026 period ended 2026-03-31; 10-K filed 2026-03-13 for FY2025) via
# WebFetch, cross-checked against Google News RSS coverage (WebSearch
# budget was exhausted this session). No figure below is fabricated; the
# merger deal terms and financials are corroborated by both the 10-Q text
# itself (primary/high-confidence) and independent news outlets (Reuters,
# Fierce Healthcare, Healthcare Dive, Modern Healthcare, Yahoo Finance).
#
# FLAG for Ben: board.yaml's talkspace gloss reads "Teladoc-owned; double-
# dependent like its peers." This is STALE/WRONG on both counts as of this
# pass — (1) Talkspace and Teladoc are historically competitors in virtual
# behavioral health, not parent/sub, and no source found supports a
# Teladoc ownership relationship at any point; (2) the CURRENT live
# ownership event is the UHS acquisition (pending, not closed), not
# Teladoc. Not edited here per instructions — board.yaml is out of scope
# for this bundle — but this should be corrected in board.yaml directly.
node: talkspace
name: "Talkspace"
pocket: health
asof: 2026-07-28
axes_num_estimate: { weight: 0.136, thrust: 0.024, gravity: 0.229 }  # agent-derive 2026-07-28 wave G
