method: >
  Four parallel sonnet subagents, one per question (sites/silicon/power/
  payoff), per the crawl skill's preflight (session WebSearch budget may
  already be exhausted by same-day /daily and /week sweeps — none of the
  four used the WebSearch tool). Each agent used WebFetch directly against
  Google News RSS query URLs (news.google.com/rss/search) for
  title/source/date discovery, plus direct WebFetch of Microsoft's own
  blog (blogs.microsoft.com), Microsoft Source (news.microsoft.com/source),
  and Microsoft Investor Relations (microsoft.com/en-us/investor) where
  reachable. Google News RSS article redirect links mostly did not resolve
  to readable article bodies via WebFetch (returned bare headers or
  403/404) — in those cases the RSS-listed title/source/date is cited and
  marked medium/thin rather than treated as a verified article body. One
  agent (power) also used DuckDuckGo HTML search-result snippets (not the
  WebSearch tool) to surface direct-outlet URLs when RSS redirects failed;
  those facts are marked medium and flagged as snippet-sourced, not fully
  fetched. No URL, figure, or date below was fabricated; unconfirmed items
  are marked thin explicitly rather than smoothed into the narrative.
