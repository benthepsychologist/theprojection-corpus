  already flagged for Grok 5 in grok-frontier — worth checking against
  actual ship dates ~2026-08-07 and ~2026-08-21; (4) the Open Secure AI
  Alliance join landing the same week as the Arkansas suit and NCOSE
  demand is a suggestive correlation, NOT a sourced causal hedge — the
  Alliance's own stated trigger is a Hugging Face/OpenAI breach story,
  not child-safety pressure, so no causal claim is made in the finding.
