notes: "Mental-health employer-benefit vertical (B2B benefits platform sold to large employers/health plans), placed in the health pocket. Biggest single finding this pass: the task brief's 'post-close' flag is CONFIRMED real — Spring Health announced (2026-01-29) and CLOSED (2026-05-01) an acquisition of Alma, a clinician-facing mental-health insurance/billing platform, creating a combined 'lifelong mental health platform.' Deal value is NOT officially disclosed; a single secondary source (briefglance.com, unreachable on refetch) cites $1.5B, which is used as a thin/low-confidence thrust estimate pending an official figure. Cumulative VC raised (~$443M across 5 rounds) is solid/medium-confidence (GetLatka + Wikipedia cross-check); note this is somewhat below the background brief's 'well over $400M' framing but consistent with it — the 5-round sum ($443M) is the more complete figure vs. GetLatka's own 4-round subtotal ($372M), which omits the 2023 Series D ($71M) that Wikipedia documents. Series E lead investor (background brief suggested Generation Investment Management) could NOT be corroborated by any source fetched this pass — flagged as unconfirmed, not included as fact in capital.available. Gravity intentionally uses revenue/ARR scale (~$0.3-0.5B/yr) rather than the company's own marketed gross covered-lives figures (50M / 170M lives), per the recipe's dependent-economy-dollars instruction — both ARR inputs (Spring Health's own $281M and Alma's $230M) are third-party estimates (GetLatka-attributed), not audited disclosures, so confidence throughout gravity is low-to-medium."
