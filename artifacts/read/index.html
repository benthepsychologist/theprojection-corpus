source":null,"threads":["cxmt-memory-ipo"],"entities":["cxmt"],"axis":"china","sev":null,"interpretation":null,"interpretation_id":null},{"id":"u:www.bloomberg.com/news/articles/2026-07-28/amazon-data-cente","day":"2026-07-28","lens":"ai","title":"🛰 The buildout became a military target, and now there are pictures.","html":"<strong>🛰 The buildout became a military target, and now there are pictures.<\/strong> Bloomberg reports satellite imagery showing significant damage to <strong>two Amazon data centres in Bahrain<\/strong> (Zallaq and Askar), corroborating IRGC claims released via Tasnim. ⚠ <strong>The imagery is what's new today — not the strikes<\/strong>, which were claimed ~07-21 and follow Shahed drone attacks on AWS sites in the UAE (<strong>03-01<\/strong>) and a further Bahrain strike (<strong>04-01<\/strong>). Iranian state media named Microsoft, Google, Apple, Meta, Oracle, Intel and Nvidia as targets on <strong>03-31<\/strong>. Landing the same day Iran hit a US base in Jordan, it reframes a question every thread in the capex tree assumes away: <strong>the datacentre map has a threat model now.<\/strong> Siting, insurance and sovereign-risk premia are downstream of this, and none of our capex threads price it. (<a href=\"https://www.bloomberg.com/news/articles/2026-07-28/amazon-data-centers-hit-in-iran-strikes-satellite-images-show\">Bloomberg<\/a> · <a href=\"https://www.tomshardware.com/tech-industry/data-centers/amazon-data-center-in-bahrain-struck-and-destroyed-by-iranian-cruise-missiles-state-media-claims-attacks-launched-against-aws-site-in-response-to-alleged-us-strikes-on-an-under-construction-nuclear-plant\">Tom's Hardware<\/a>)","url":"https://www.bloomberg.com/news/articles/2026-07-28/amazon-data-centers-hit-in-iran-strikes-satellite-images-show","source":"Bloomberg","threads":["datacenters-as-targets","ai-datacenter-sites","aws-capex"],"entities":["amazon-aws"],"axis":"china","sev":null,"interpretation":null,"interpretation_id":null},{"id":"u:www.globalbankingandfinance.com/exclusive-china-starts-produ","day":"2026-07-28","lens":"ai","title":"🇨🇳 China has started mass-producing its own immersion DUV lithography tool","html":"<strong>🇨🇳 China has started mass-producing its own immersion DUV lithography tool<\/strong> — Reuters exclusive naming <strong>Shanghai Aishengna Electronic Technology Group<\/strong> (state-owned, built by absorbing lithography-startup teams) as the maker. <strong>~5 units targeted for 2026, ~20 for 2027<\/strong>, with <strong>SMIC, Hua Hong and CXMT<\/strong> the expected first recipients this year. The tools are explicitly \"far from matching\" ASML's competing models and are <strong>unproven at high-volume manufacturing scale<\/strong> — this is a first rung, not parity. But it is the chokepoint thread's load-bearing assumption being tested for the first time with a shipping product rather than a prototype. (<a href=\"https://www.globalbankingandfinance.com/exclusive-china-starts-production-home-grown-immersion-duv/\">Reuters<\/a>)","url":"https://www.globalbankingandfinance.com/exclusive-china-starts-production-home-grown-immersion-duv/","source":"Reuters","threads":["china-duv-lithography","china-stack-independence"],"entities":["cxmt"],"axis":"china","sev":null,"interpretation":null,"interpretation_id":null},{"id":"u:news.skhynix.com/en/q2-2026-business-results/","day":"2026-07-28","lens":"ai","title":"SK Hynix printed a record quarter and still missed.","html":"<strong>SK Hynix printed a record quarter and still missed.<\/strong> PRIMARY (news.skhynix.com): revenue <strong>79.3187T won<\/strong>, operating profit <strong>60.5426T won<\/strong>, margin <strong>76%<\/strong>, net profit <strong>93.9226T won<\/strong> — op profit <strong>+557% YoY<\/strong>, an all-time record in absolute terms, but <strong>below the 63.7–64.1T won consensus<\/strong> the ledger tracked as \"~$43.7B\" (revenue missed too, vs ~83.6–83.9T). The net-profit beat is <strong>non-operating gains<\/strong>, not operations. HBM4 <strong>mass shipments began in Q2<\/strong> with \"full ramp\" guided for 2H26; <strong>~10 customers<\/strong> signed to long-term supply agreements. Management called <strong>Blackwell/HBM3E demand still strong<\/strong> and said <strong>Rubin — which needs HBM4 — is running later than expected<\/strong>. (<a href=\"https://news.skhynix.com/en/q2-2026-business-results/\">SK hynix<\/a>)","url":"https://news.skhynix.com/en/q2-2026-business-results/","source":"SK hynix","threads":["ai-memory-shortage","ai-trade-bear-turn"],"entities":["sk-hynix"],"axis":"china","sev":null,"interpretation":null,"interpretation_id":null},{"id":"u:capex-claim-not-adopted-secondary-outlets","day":"2026-07-28","lens":"ai","title":"⚠ Capex claim NOT adopted:","html":"<strong>⚠ Capex claim NOT adopted:<\/strong> secondary outlets (DigiTimes) reported SK Hynix raising capex to the <strong>high end of ~40T won (~45T/$31B)<\/strong>. The primary release says the opposite in tone — \"capital expenditure discipline,\" investment phased \"based on customer demand and investment efficiency.\" Flagged as unconfirmed rather than folded in; the 07-30 Samsung breakdown is the next read.","url":null,"source":null,"threads":["ai-memory-shortage"],"entities":["sk-hynix"],"axis":"china","sev":null,"interpretation":null,"interpretation_id":null},{"id":"u:www.koreaherald.com/article/10824514","day":"2026-07-28","lens":"ai","title":"Korea round-tripped on the print, then broke again.","html":"<strong>Korea round-tripped on the print, then broke again.<\/strong> KOSPI opened <strong>+1.1%<\/strong>, ran to <strong>+2.76% (6,190.04)<\/strong> on earnings relief, then reversed the whole way to an intraday low of <strong>5,262.77 (−12.63%)<\/strong>, tripping a <strong>second consecutive circuit breaker at 12:32pm KST<\/strong>, and closed <strong>5,663.24, ~−6%<\/strong>. SK Hynix itself: <strong>+3.74% intraday → closed −9.61% at 1,401,000 won<\/strong>. Samsung: <strong>+4.55% → −5.23% (208,500 won)<\/strong>. A market that cannot hold a rally on its own best earnings in history is the bear-turn's clearest tell yet. (<a href=\"https://www.koreaherald.com/article/10824514\">Korea Herald<\/a>)","url":"https://www.koreaherald.com/article/10824514","source":"Korea Herald","threads":["ai-trade-bear-turn","ai-memory-shortage"],"entities":["sk-hynix","samsung"],"axis":"china","sev":null,"interpretation":null,"interpretation_id":null},{"id":"u:finance.yahoo.com/technology/ai/articles/ai-chip-stocks-tumb","day":"2026-07-28","lens":"ai","title":"The 07-28 US chip session was the fourth straight loss:","html":"<strong>The 07-28 US chip session was the fourth straight loss:<\/strong> AMD ~−10%, Micron <strong>−8.85% to $820.53<\/strong>, SK Hynix ADR −8.98%, SOX down as much as 6%, Nasdaq-100 <strong>9.7% off its record<\/strong>. Counterpoint on the tape: Q3 DRAM contracts reportedly settling <strong>20–30% higher<\/strong> this month — the panic and the fundamentals are pointing opposite ways. (<a href=\"https://finance.yahoo.com/technology/ai/articles/ai-chip-stocks-tumble-nvidia-195907285.html\">Yahoo Finance<\/a>)","url":"https://finance.yahoo.com/technology/ai/articles/ai-chip-stocks-tumble-nvidia-195907285.html","source":"Yahoo Finance","threads":["ai-trade-bear-turn","ai-memory-shortage"],"entities":["micron","sk-hynix"],"axis":"china","sev":null,"interpretation":null,"interpretation_id":null},{"id":"u:a-second-cxmt-probe-effort-reported-prospective","day":"2026-07-28","lens":"ai","title":"A second CXMT probe effort, reported prospectively","html":"<strong>A second CXMT probe effort, reported prospectively<\/strong> — at least half a dozen bipartisan members plan letters to the administration \"in the coming days,\" calling CXMT part of \"the Chinese industrial military complex.\" ⚠ Logged as <strong>rumored<\/strong>: the surrounding coverage recycles the exact \"debut triggered a probe\" framing this digest killed earlier today. What would confirm it is a letter with signatories — not another restatement of the 07-16 letter.","url":null,"source":null,"threads":["cxmt-memory-ipo","china-duv-lithography"],"entities":["cxmt"],"axis":"china","sev":null,"interpretation":null,"interpretation_id":null},{"id":"u:openai-google-deepmind-lobbying-against-the-ai","day":"2026-07-28","lens":"ai","title":"OpenAI + Google DeepMind lobbying against the AI Kill Switch Act","html":"<strong>OpenAI + Google DeepMind lobbying against the AI Kill Switch Act<\/strong> (CNBC, headline-tier — full text unreachable, thin).","url":null,"source":null,"threads":["frontier-model-gov-review-precedent"],"entities":["openai","google-deepmind"],"axis":"policy-governance","sev":null,"interpretation":null,"interpretation_id":null},{"id":"u:doe-named-the-genesis-mission-s-first-278-awards","day":"2026-07-28","lens":"ai","title":"DOE named the Genesis Mission's first 278 awards, $800M+ partner commitments","html":"<strong>DOE named the Genesis Mission's first 278 awards, $800M+ partner commitments<\/strong> — primary source pinned (energy.gov, 07-22; late-caught).","url":null,"source":null,"threads":["genesis-mission"],"entities":["doe"],"axis":"policy-governance","sev":null,"interpretation":null,"interpretation_id":null},{"id":"u:rincon-met-on-camellia-in-person-the-local","day":"2026-07-28","lens":"ai","title":"Rincon met on \"Camellia\" in person","html":"<strong>Rincon met on \"Camellia\" in person<\/strong> — the local-opposition track on OpenAI's 3.2GW Georgia site went live (WTOC).","url":null,"source":null,"threads":["camellia","ai-datacenter-sites"],"entities":["openai"],"axis":"policy-governance","sev":null,"interpretation":null,"interpretation_id":null},{"id":"u:legislature.maine.gov/legis/bills/display_ps.asp?LD=2082&snu","day":"2026-07-28","lens":"mental-health","title":"⚖ Maine's AI-therapy statute took effect at midnight — first in the nation to actually bind.","html":"<strong>⚖ Maine's AI-therapy statute took effect at midnight — first in the nation to actually bind.<\/strong> LD 2082, enacted as <strong>Public Law Chapter 687<\/strong> (signed <strong>04-13-2026<\/strong>), bars offering \"therapy or psychotherapy services, including through the use of Internet-based artificial intelligence\" to the public unless delivered by a licensed professional; licensees may use AI only for \"administrative support or supplementary support,\" retaining \"full responsibility for all interactions, outputs and data use.\" Chapter number and signing date are primary-confirmed (legislature.maine.gov); the <strong>07-29 effective date rests on Maine's default 90-days-after-adjournment rule plus convergent legal trackers<\/strong>, not on a date printed in the act. (<a href=\"https://legislature.maine.gov/legis/bills/display_ps.asp?LD=2082&amp;snum=132\">Maine Legislature<\/a>)","url":"https://legislature.maine.gov/legis/bills/display_ps.asp?LD=2082&snum=132","source":"Maine Legislature","threads":["state-therapy-chatbot-bans","ai-therapy-regulatory-reckoning"],"entities":[],"axis":"policy-regulation","sev":null,"interpretation":null,"interpretation_id":null},{"id":"u:www.cnbc.com/2026/07/28/spacexs-xai-sues-minnesota-over-law-","day":"2026-07-28","lens":"mental-health","title":"xAI sued Minnesota's attorney general to block the state's \"nudify\" ban","html":"<strong>xAI sued Minnesota's attorney general to block the state's \"nudify\" ban<\/strong> (effective August 2026), calling it an \"overbroad, content-based ban on free speech\" and putting its own statutory exposure at <strong>\"$50 billion.\"<\/strong> AG Keith Ellison answered publicly the same day: \"AI nudification robs the target of their dignity.\" First time a frontier lab has gone to federal court to stop an AI-harm statute rather than lobby against it. (<a href=\"https://www.cnbc.com/2026/07/28/spacexs-xai-sues-minnesota-over-law-to-ban-nudify-apps-.html\">CNBC<\/a>)","url":"https://www.cnbc.com/2026/07/28/spacexs-xai-sues-minnesota-over-law-to-ban-nudify-apps-.html","source":"CNBC","threads":["grok-companion-harm","ai-therapy-regulatory-reckoning"],"entities":["xai"],"axis":"policy-regulation","sev":null,"interpretation":null,"interpretation_id":null},{"id":"u:www.computerweekly.com/news/366644374/Labour-MP-Jess-Asato-l","day":"2026-07-28","lens":"mental-health","title":"The UK Grok case asked for teeth:","html":"<strong>The UK Grok case asked for teeth:<\/strong> Labour MP Jess Asato, who filed in the High Court in June over non-consensual sexualised Grok deepfakes of herself, moved for an order requiring xAI to \"implement effective and permanent technical measures\" — a remedy aimed at the model, not damages. (<a href=\"https://www.computerweekly.com/news/366644374/Labour-MP-Jess-Asato-launches-legal-action-over-Grok-deepfakes\">Computer Weekly<\/a>)","url":"https://www.computerweekly.com/news/366644374/Labour-MP-Jess-Asato-launches-legal-action-over-Grok-deepfakes","source":"Computer Weekly","threads":["grok-companion-harm"],"entities":["xai"],"axis":"policy-regulation","sev":null,"interpretation":null,"interpretation_id":null},{"id":"u:sb-903-corrected-primary-sourced-the-july-a","day":"2026-07-28","lens":"mental-health","title":"SB 903 corrected, primary-sourced:","html":"<strong>SB 903 corrected, primary-sourced:<\/strong> the \"July Assembly hearing\" we tracked happened <strong>07-01<\/strong> (Privacy &amp; Consumer Protection), re-referred to Appropriations 07-02; legislature in recess until 08-03; fiscal deadline <strong>08-14<\/strong> — the ledger's 07-31 date could never have fired. Rewritten as a correction, not a slip. (leginfo.ca.gov)","url":null,"source":null,"threads":["state-therapy-chatbot-bans"],"entities":[],"axis":"policy-regulation","sev":null,"interpretation":null,"interpretation_id":null},{"id":"u:bloomberg-can-a-chatbot-be-held-responsible-fo","day":"2026-07-28","lens":"mental-health","title":"Bloomberg: \"Can a chatbot be held responsible for a death?\"","html":"<strong>Bloomberg: \"Can a chatbot be held responsible for a death?\"<\/strong> — the liability docket (Raine, Gemini/Miami, OpenAI-must-defend) surveyed in one mainstream feature; the reckoning going wide-audience.","url":null,"source":null,"threads":["ai-therapy-regulatory-reckoning"],"entities":[],"axis":"policy-regulation","sev":null,"interpretation":null,"interpretation_id":null},{"id":"u:unitedhealth-s-two-public-faces-same-quarter","day":"2026-07-28","lens":"mental-health","title":"UnitedHealth's two public faces, same quarter:","html":"<strong>UnitedHealth's two public faces, same quarter:<\/strong> CEO on Q2 call — AI runs \"virtually everything,\" <strong>96% first-pass prior-auth approval<\/strong> — while nH Predict discovery proceeds over an alleged ~90% appeal-reversal rate. Both numbers describe the same adjudication machine; watch for either cited against the other in court. (PYMNTS, 07-15 call, surfaced today)","url":null,"source":null,"threads":["payer-ai-claim-denial"],"entities":["unitedhealth-optum"],"axis":"payers-systems","sev":null,"interpretation":null,"interpretation_id":null},{"id":"u:hitconsultant.net/2026/07/28/sheba-medical-center-openai-cha","day":"2026-07-28","lens":"mental-health","title":"OpenAI got its first hospital-wide deployment:","html":"<strong>OpenAI got its first hospital-wide deployment:<\/strong> Israel's Sheba Medical Center is rolling out ChatGPT for Healthcare across the whole institution — billed as the first global deployment at that scale — with citation-backed clinical reasoning and zero-data-retention terms. Six days after ChatGPT Health went GA, and while a suit seeking to halt it is pending. (<a href=\"https://hitconsultant.net/2026/07/28/sheba-medical-center-openai-chatgpt-for-healthcare-deployment/\">HIT Consultant<\/a>)","url":"https://hitconsultant.net/2026/07/28/sheba-medical-center-openai-chatgpt-for-healthcare-deployment/","source":"HIT Consultant","threads":["openai-health","bigtech-into-health"],"entities":["openai"],"axis":"capital-corporate","sev":null,"interpretation":null,"interpretation_id":null},{"id":"u:alan-raised-780m-8-9b-valuation-to-scale-it","day":"2026-07-28","lens":"mental-health","title":"Alan raised $780M (~$8.9B valuation) to scale its AI-health model in Canada","html":"<strong>Alan raised $780M (~$8.9B valuation) to scale its AI-health model in Canada<\/strong> (The Logic) — a French insurtech entering exactly the AI-triage-vs-care gap canada-ai-vs-care watches. ⚠ <strong>Figure unresolved:<\/strong> outlets report $158M (03-19), $550M and $780M (June), and both $8.9B and $7.8B as the valuation. Sequential tranches vs. reporting drift is not established — the thread opened on the $780M/$8.9B pair and that pair is now flagged, not confirmed.","url":null,"source":null,"threads":["alan-into-canada","canada-ai-vs-care"],"entities":["alan"],"axis":"capital-corporate","sev":null,"interpretation":null,"interpretation_id":null},{"id":"u:chatgpt-health-went-ga-for-all-us-adults-tied-t","day":"2026-07-28","lens":"mental-health","title":"ChatGPT Health went GA for all US adults, tied to Apple Health","html":"<strong>ChatGPT Health went GA for all US adults, tied to Apple Health<\/strong> (TechCrunch 07-23; late-fold into the meta-thread).","url":null,"source":null,"threads":["bigtech-into-health"],"entities":["openai","apple"],"axis":"capital-corporate","sev":null,"interpretation":null,"interpretation_id":null},{"id":"u:stockanalysis.com/stocks/nvda/history/","day":"2026-07-28","lens":"global-capital","title":"CDS record single-day gain","html":"<strong>CDS record single-day gain<\/strong> on the firmed $250B guarantee — the loud-no was a credit-market event. ⚠ <strong>Date corrected at the 5am close:<\/strong> the <strong>−5% equity move was 07-27<\/strong>, not today (07-27 close <strong>$196.51, −4.99%<\/strong>). <strong>07-28 dipped ~2% intraday (low $192.74) and closed +0.25% at $197.01.<\/strong> The \"reversed intraday\" line above collapsed two sessions into one. The real shape: credit broke and equity broke together on 07-27, then on 07-28 <strong>equity refused to follow while CDS stayed wide<\/strong> — a divergence, which is a more useful signal than a same-day round trip. (<a href=\"https://stockanalysis.com/stocks/nvda/history/\">stockanalysis.com<\/a>)","url":"https://stockanalysis.com/stocks/nvda/history/","source":"stockanalysis.com","threads":["ai-trade-bear-turn","nvidia-vendor-financing"],"entities":["nvidia"],"axis":"capital-markets","sev":null,"interpretation":null,"interpretation_id":null},{"id":"u:the-close-16-00-et-intc-5-9-86-30","day":"2026-07-28","lens":"global-capital","title":"The close (16:00 ET):","html":"<strong>The close (16:00 ET):<\/strong> INTC <strong>−5.9%<\/strong> ($86.30, post-print capex concern continuing) · Micron <strong>−8.9%<\/strong> (CXMT read-through, day 2) · CoreWeave −4.9% · SPCX <strong>+2.6%<\/strong> ($116.41, off the ~$100 lows). (Yahoo chart data)","url":null,"source":null,"threads":["ai-trade-bear-turn","intel-rescue","cxmt-memory-ipo","coreweave-backlog-bet","spacexai-public-megacap"],"entities":["intel","micron","coreweave","spacex"],"axis":"capital-markets","sev":null,"interpretation":null,"interpretation_id":null},{"id":"u:the-instrument-panel-fred-07-27-close-hy-oas","day":"2026-07-28","lens":"global-capital","title":"The instrument panel (FRED, 07-27 close): HY OAS 2.81% (3rd session wider, +4bp), IG 0.81, 2s10s +34bp, VIX 18.67, 10Y 4.65, 2Y 4.31, Fed funds 3.63","html":"<strong>The instrument panel (FRED, 07-27 close): HY OAS 2.81% (3rd session wider, +4bp), IG 0.81, 2s10s +34bp, VIX 18.67, 10Y 4.65, 2Y 4.31, Fed funds 3.63<\/strong> — credit leaking wider, not cracking, against the CDS headlines. <strong>The one 07-28 print available: 2s10s steepened a basis point to +35bp.<\/strong> FRED publishes the credit series a day late, so 07-28's HY/IG/VIX aren't out yet — the \"leak, not crack\" read is a 07-27 read, and tonight's run is when it can actually be re-tested against the strike and the FOMC.","url":null,"source":null,"threads":["ai-trade-bear-turn"],"entities":[],"axis":"capital-markets","sev":null,"interpretation":null,"interpretation_id":null},{"id":"u:fomc-eve-as-read-at-16-00-et-hike-odds-25-35","day":"2026-07-28","lens":"global-capital","title":"FOMC-eve, as read at 16:00 ET: hike odds ~25-35% and cooling","html":"<strong>FOMC-eve, as read at 16:00 ET: hike odds ~25-35% and cooling<\/strong> (CME FedWatch ~34.7% options-implied 07-27; prediction markets ~25%; a 77% September read says the bias is real but deferred). The driver looked reversed: Brent cratered to ~$84 (−4.8%, 3rd losing day) as the <strong>US–Iran fighting pause (07-24) held<\/strong> — after Houthis hit Saudi refineries directly 07-25, the first since 2022. ⚠ <strong>This read expired at 17:45 ET<\/strong> — see the overnight section.","url":null,"source":null,"threads":["red-sea-oil-shock","ai-trade-bear-turn"],"entities":[],"axis":"capital-markets","sev":null,"interpretation":null,"interpretation_id":null},{"id":"u:coreweave-30-on-the-month-flow-traders-signed","day":"2026-07-28","lens":"global-capital","title":"CoreWeave −30% on the month; Flow Traders signed as a customer","html":"<strong>CoreWeave −30% on the month; Flow Traders signed as a customer<\/strong>; exec 10b5-1 selling routine, not alarming.","url":null,"source":null,"threads":["coreweave-backlog-bet"],"entities":["coreweave"],"axis":"capital-markets","sev":null,"interpretation":null,"interpretation_id":null},{"id":"u:www.axios.com/2026/07/28/iran-missile-attack-us-base-jordan","day":"2026-07-28","lens":"global-capital","title":"🚨 Iran fired ballistic missiles at a US air base and a CENTCOM facility in Jordan at 5:45pm ET.","html":"<strong>🚨 Iran fired ballistic missiles at a US air base and a CENTCOM facility in Jordan at 5:45pm ET.<\/strong> All intercepted; no casualties. CENTCOM called it \"an attempted surprise attack.\" It is the <strong>first Iranian ballistic-missile attack on a US base since the 07-24 pause<\/strong> — the pause this digest described as holding, eight hours before it didn't. (<a href=\"https://www.axios.com/2026/07/28/iran-missile-attack-us-base-jordan\">Axios<\/a> · <a href=\"https://edition.cnn.com/2026/07/28/world/live-news/iran-trump-news\">CNN<\/a>)","url":"https://www.axios.com/2026/07/28/iran-missile-attack-us-base-jordan","source":"Axios","threads":["red-sea-oil-shock"],"entities":[],"axis":"capital-markets","sev":null,"interpretation":null,"interpretation_id":null},{"id":"u:oil-round-tripped-the-whole-move-brent-4-3-to","day":"2026-07-28","lens":"global-capital","title":"Oil round-tripped the whole move: Brent +4.3% to ~$87.7, WTI +4.2% to ~$82.6","html":"<strong>Oil round-tripped the whole move: Brent +4.3% to ~$87.7, WTI +4.2% to ~$82.6<\/strong> — erasing the crater to $84 that had been cooling FOMC hike odds all afternoon. A <strong>3.3M-barrel US crude draw<\/strong> (week ended 07-24) compounded it. The Fed meets today with its inflation impulse re-armed overnight.","url":null,"source":null,"threads":["red-sea-oil-shock","ai-trade-bear-turn"],"entities":[],"axis":"capital-markets","sev":null,"interpretation":null,"interpretation_id":null},{"id":"u:www.bloomberg.com/news/articles/2026-07-28/amazon-data-cente","day":"2026-07-28","lens":"global-capital","title":"🛰 Satellite imagery corroborated Iran's strikes on Amazon data centres in Bahrain","html":"<strong>🛰 Satellite imagery corroborated Iran's strikes on Amazon data centres in Bahrain<\/strong> — Bloomberg reports imagery showing significant damage to two AWS sites, at <strong>Zallaq and Askar<\/strong>, supporting IRGC claims made via Tasnim last week. ⚠ <strong>What is new today is the EVIDENCE, not the attack<\/strong>: the strikes were claimed ~07-21, and the campaign runs back to Shahed drone attacks on AWS sites in the UAE on <strong>03-01<\/strong> and a further Bahrain strike <strong>04-01<\/strong>. Iranian state media named Microsoft, Google, Apple, Meta, Oracle, Intel and Nvidia as targets on 03-31. This is the <strong>first war in which commercial data centres are deliberately struck<\/strong> — and it prices as an insurance/siting risk across every hyperscaler build, not as a one-country story. (<a href=\"https://www.bloomberg.com/news/articles/2026-07-28/amazon-data-centers-hit-in-iran-strikes-satellite-images-show\">Bloomberg<\/a> · <a href=\"https://www.tomshardware.com/tech-industry/data-centers/amazon-data-center-in-bahrain-struck-and-destroyed-by-iranian-cruise-missiles-state-media-claims-attacks-launched-against-aws-site-in-response-to-alleged-us-strikes-on-an-under-construction-nuclear-plant\">Tom's Hardware<\/a>)","url":"https://www.bloomberg.com/news/articles/2026-07-28/amazon-data-centers-hit-in-iran-strikes-satellite-images-show","source":"Bloomberg","threads":["datacenters-as-targets","red-sea-oil-shock","aws-capex"],"entities":["amazon-aws"],"axis":"capital-markets","sev":null,"interpretation":null,"interpretation_id":null},{"id":"u:an-sk-hynix-flash-crash-happened-in-crypto-no","day":"2026-07-28","lens":"global-capital","title":"🪙 An SK Hynix flash crash happened in crypto, not Korea.","html":"<strong>🪙 An SK Hynix flash crash happened in crypto, not Korea.<\/strong> A tokenized SK Hynix perpetual on Hyperliquid liquidated <strong>~$57-60M<\/strong> after an oracle anomaly; Trade.xyz said it would cover user losses while maintaining its oracle \"worked.\" Not an SK Hynix event — a market-structure one — but it is the memory trade now leaking into venues with no circuit breakers on the day Seoul needed two.","url":null,"source":null,"threads":["ai-memory-shortage","ai-trade-bear-turn"],"entities":["sk-hynix"],"axis":"capital-markets","sev":null,"interpretation":null,"interpretation_id":null},{"id":"u:the-hike-odds-picture-is-not-one-number-c","day":"2026-07-28","lens":"global-capital","title":"⚠ The hike-odds picture is not one number.","html":"<strong>⚠ The hike-odds picture is not one number.<\/strong> <strong>CME FedWatch ~30-38%<\/strong> against <strong>Polymarket ~20-25%<\/strong> and <strong>Kalshi ~27%<\/strong> — a 10-15 point spread with no canonical window-close read. Target range <strong>3.50-3.75%<\/strong>, decision 14:00 ET, presser 14:30 ET. (A ~82% September-hike read exists but dates to <strong>07-23<\/strong> — stale, flagged, not carried.)","url":null,"source":null,"threads":["ai-trade-bear-turn"],"entities":[],"axis":"capital-markets","sev":null,"interpretation":null,"interpretation_id":null},{"id":"u:www.koreaherald.com/article/10824514","day":"2026-07-28","lens":"global-capital","title":"Korea broke a second time — after rallying on good news.","html":"<strong>Korea broke a second time — after rallying on good news.<\/strong> The <strong>07-29 KST session<\/strong> (distinct from the −10.84% session logged above): KOSPI opened <strong>+1.1%<\/strong>, ran to <strong>+2.76%<\/strong> on SK Hynix relief, then fell to an intraday <strong>−12.63% (5,262.77)<\/strong>, tripping its <strong>second consecutive circuit breaker<\/strong> at 12:32pm KST, closing <strong>5,663.24, ~−6%<\/strong>. SK Hynix <strong>+3.74% → −9.61%<\/strong>; Samsung <strong>+4.55% → −5.23%<\/strong>. Nikkei <strong>−1.49% (61,434.19)<\/strong>. Hang Seng <strong>+1.8% (25,762.80)<\/strong> — Hong Kong went the other way, so this is a chip-complex event, not a regional risk-off. (<a href=\"https://www.koreaherald.com/article/10824514\">Korea Herald<\/a>)","url":"https://www.koreaherald.com/article/10824514","source":"Korea Herald","threads":["ai-trade-bear-turn","ai-memory-shortage"],"entities":["sk-hynix","samsung"],"axis":"capital-markets","sev":null,"interpretation":null,"interpretation_id":null},{"id":"u:news.skhynix.com/en/q2-2026-business-results/","day":"2026-07-28","lens":"global-capital","title":"SK Hynix: a record quarter that missed.","html":"<strong>SK Hynix: a record quarter that missed.<\/strong> Op profit <strong>60.5426T won<\/strong> (+557% YoY) vs <strong>63.7-64.1T consensus<\/strong>; revenue <strong>79.3187T<\/strong> vs ~83.6-83.9T. The net-profit beat (93.9226T) is <strong>non-operating gains<\/strong>. Full detail in the AI digest. The market's answer was the round trip above — which is the money-lens point: <strong>the cycle's best-ever print could not hold a bid for three hours.<\/strong> (<a href=\"https://news.skhynix.com/en/q2-2026-business-results/\">SK hynix<\/a>)","url":"https://news.skhynix.com/en/q2-2026-business-results/","source":"SK hynix","threads":["ai-memory-shortage","ai-trade-bear-turn"],"entities":["sk-hynix"],"axis":"capital-markets","sev":null,"interpretation":null,"interpretation_id":null},{"id":"u:the-07-28-us-chip-tape-for-the-record-amd","day":"2026-07-28","lens":"global-capital","title":"The 07-28 US chip tape, for the record:","html":"<strong>The 07-28 US chip tape, for the record:<\/strong> AMD ~−10%, Micron <strong>−8.85% ($820.53)<\/strong>, SK Hynix ADR −8.98%, SOX −6% in a <strong>fourth straight losing session<\/strong>, Nasdaq-100 <strong>9.7% off its record<\/strong>. Counterpoint: Q3 DRAM contracts reportedly settling <strong>20-30% higher<\/strong>. Cited framing (Gil Luria): \"the panic appears to be indiscriminate.\"","url":null,"source":null,"threads":["ai-trade-bear-turn"],"entities":["micron","sk-hynix"],"axis":"capital-markets","sev":null,"interpretation":null,"interpretation_id":null},{"id":"u:into-today-s-prints-meta-closed-593-99","day":"2026-07-28","lens":"global-capital","title":"Into today's prints:","html":"<strong>Into today's prints:<\/strong> Meta closed <strong>$593.99<\/strong> (~8%/$49 move priced; capex guide $125-145B vs $136-138B consensus — it beat twice running and fell 6-7% both times on capex). Qualcomm <strong>$162.88, −4.36%<\/strong> (~12.8% move priced). Arm down another ~5-9% (sources unreconciled) after <strong>−28% on the month<\/strong>.","url":null,"source":null,"threads":["meta-capex","arm-royalty-regime","qualcomm-dragonfly"],"entities":["meta-ai"],"axis":"capital-markets","sev":null,"interpretation":null,"interpretation_id":null},{"id":"u:nvidia-ssi-5b-vendor-capital-into-a-pre-p","day":"2026-07-28","lens":"global-capital","title":"Nvidia → SSI $5B","html":"<strong>Nvidia → SSI $5B<\/strong> — vendor capital into a pre-product lab (~$32B valuation, zero commercial product).","url":null,"source":null,"threads":["nvidia-vendor-financing","ai-circular-financing-risk"],"entities":["nvidia"],"axis":"deals-filings","sev":null,"interpretation":null,"interpretation_id":null},{"id":"u:the-ohio-figure-tangle-resolved-as-three-numbers","day":"2026-07-28","lens":"global-capital","title":"The Ohio figure tangle resolved as three numbers:","html":"<strong>The Ohio figure tangle resolved as three numbers:<\/strong> $250B guarantee · $500B total Piketon-site cost · $350B separate Nvidia chip-financing.","url":null,"source":null,"threads":["nvidia-vendor-financing"],"entities":["nvidia","openai"],"axis":"deals-filings","sev":null,"interpretation":null,"interpretation_id":null},{"id":"u:meta-blackrock-14b-el-paso-jv-80-20-off-ba","day":"2026-07-28","lens":"global-capital","title":"Meta + BlackRock: $14B El Paso JV (80/20, off-balance-sheet) + a completed $12.5B Meta bond","html":"<strong>Meta + BlackRock: $14B El Paso JV (80/20, off-balance-sheet) + a completed $12.5B Meta bond<\/strong> — the day before Meta's print.","url":null,"source":null,"threads":["meta-capex","asset-managers-build-ai"],"entities":["meta","blackrock"],"axis":"deals-filings","sev":null,"interpretation":null,"interpretation_id":null},{"id":"u:intel-printed-its-best-quarter-in-15-years","day":"2026-07-28","lens":"global-capital","title":"Intel printed its best quarter in ~15 years","html":"<strong>Intel printed its best quarter in ~15 years<\/strong> (+25% rev, EPS 2x est., AI ~70% of revenue; 07-23, late-caught) — first real revenue evidence against the thread's \"thrust ≈ 0\" frame. And the federal stake around ws/articles/2026-07-27/softbank-s-40-billion-loan-for-openai-stake-gets-21-new-lenders","source":"Bloomberg","threads":["softbank-all-in","openai-ipo-timing","ai-circular-financing-risk"],"entities":["softbank","openai"],"axis":"deals-filings","sev":null,"interpretation":null,"interpretation_id":null},{"id":"u:the-q2-lobbying-wave-from-the-lda-register-dire","day":"2026-07-28","lens":"global-capital","title":"The Q2 lobbying wave, from the LDA register directly:","html":"<strong>The Q2 lobbying wave, from the LDA register directly:<\/strong> OpenAI's 2nd-Quarter amendment posted 07-23 — <strong>$1.2M<\/strong> own-firm spend — atop its 07-20/21 reports; Microsoft's quarter posted via at least four outside registrants (Hollier $30k · Harbinger $60k · Elevate $60k · Michael Best $50k). 110 filings buffered from watched names.","url":null,"source":null,"threads":["frontier-model-gov-review-precedent"],"entities":["openai","microsoft"],"axis":"deals-filings","sev":null,"interpretation":null,"interpretation_id":null},{"id":"u:fec-monthlies-f3x-through-06-30-filed-07-20","day":"2026-07-28","lens":"global-capital","title":"FEC monthlies (F3X, through 06-30) filed 07-20:","html":"<strong>FEC monthlies (F3X, through 06-30) filed 07-20:<\/strong> Oracle PAC · Micron PAC · Highmark PAC · BlackRock PAC — routine, on file.","url":null,"source":null,"threads":[],"entities":["oracle","micron","blackrock"],"axis":"deals-filings","sev":null,"interpretation":null,"interpretation_id":null},{"id":"u:tldr.tech/ai","day":"2026-07-29","lens":"ai","title":"Grok Build Mode shipped for SuperGrok Heavy subscribers","html":"<strong>Grok Build Mode shipped for SuperGrok Heavy subscribers<\/strong> — generate and publish apps directly from chat. The day's one real product release; corrects an earlier \"nothing shipped\" framing (coverage-critic catch, 07-30). (<a href=\"https://tldr.tech/ai\">TLDR AI<\/a>)","url":"https://tldr.tech/ai","source":"TLDR AI","threads":["grok-frontier"],"entities":["
