 Hynix's 07-29 print.<\/li><\/ul>","tag":"seed"},{"date":"2026-07-27","html":"<strong>The debut ⟨daily 2026-07-27⟩<\/strong><ul><li><strong>Closed +466% at ~$489B — the most valuable China-listed company,<\/strong> above Intel's market cap; Asia's biggest 2026 IPO (~$8.5-9.1B raised). Micron −8% on the read-through. Overhangs: a US DoD ban and a three-year HBM deficit. The squeeze's capital-markets marker, delivered.<\/li><\/ul>","tag":"seed"},{"date":"2026-07-23","html":"<strong>Pricing finalized, extreme oversubscription<\/strong><ul><li><strong>Pricing finalized at 8.66 yuan/share, raising ~$8.6B<\/strong> (up from an earlier $4.3–4.4B target range) — implied market cap ~588B yuan (~$87B) at listing. (<a href=\"https://finance.biggo.com/news/503cd6f5-6bde-4e19-8e0c-e4bd74249f8b\">BigGo Finance<\/a>)<\/li><li><strong>Institutional bookbuilding came in 462.85x oversubscribed<\/strong> — roughly 4x SMIC's 114.97x when it listed on the STAR Market in 2020, an extreme demand signal. Listing date confirmed July 27, ticker 688825. (<a href=\"https://www.ebc.com/forex/cxmt-ipo-688825-dram-china-2026\">EBC<\/a>)<\/li><\/ul>","tag":"daily 2026-07-23"},{"date":"2026-07-22","html":"<strong>Allotment landed as staged<\/strong><ul><li><strong>Final allotment rate 0.47%<\/strong> — retail 212× oversubscribed across 9.4M accounts, institutional 570×; a clawback shifted ~502M shares from the institutional to the retail tranche; $9.8B raise confirmed, 07-27 STAR Market listing on track. (<a href=\"https://www.scmp.com/tech/article/3360892/chinese-memory-giant-cxmt-oversubscribed-212-times-mega-shanghai-ipo\">SCMP<\/a>)<\/li><\/ul>","tag":"daily 2026-07-22"},{"date":"2026-07-16","html":"<strong>Subscription: record and caution at once<\/strong><ul><li><strong>Retail ~212× / institutional 463× oversubscribed<\/strong> (9.4M+ accounts; ~0.47% winning rate, highest on STAR record) — yet framed as \"much lower than most recent Chinese IPOs\"; STAR50 −20% from its July peak partly on liquidity-drain fear. <strong>High-Flyer Quant (Liang Wenfeng / DeepSeek) bid for 12.55B shares.<\/strong> Six banks split ~$41M in fees — 0.48% vs the 4.52% A-share average. (<a href=\"https://www.scmp.com/tech/article/3360892/chinese-memory-giant-cxmt-oversubscribed-212-times-mega-shanghai-ipo\">SCMP<\/a> · <a href=\"https://www.dealstreetasia.com/stories/chinese-banks-cxmt-ipo-489355\">DealStreetAsia<\/a>)<\/li><\/ul>","tag":"crawl 2026-07-22"},{"date":"2026-07-13","html":"<strong>Pricing at ~$85B, state-built<\/strong><ul><li><strong>8.66 yuan/share (07-14) → up to ~$9.8B raise, ~$85B market cap<\/strong> — biggest-ever Chinese A-share semiconductor IPO (past SMIC 2020). Pre-IPO state ownership 36.29% (Anhui + the Big Fund); prospectus filed 07-15 showing Micron/Samsung alumni in leadership. (<a href=\"https://www.koreaherald.com/article/10812818\">Korea Herald<\/a>)<\/li><\/ul>","tag":"crawl 2026-07-22"}],"timeline_truncated":false,"crawled":"2026-07-22"},{"slug":"hyperscaler-capex-big-picture","title":"Hyperscaler Capex","kind":"meta","status":"open","lens":"ai","opened":"2026-07-23","last_seen":"2026-07-29","parent":null,"genre":"buildout-race","weight":3,"entities":["google","meta-ai","amazon-aws","microsoft","nvidia"],"watch":"The combined 2026 plan is now ~$610-650B across the four (Google $195-205B · Microsoft ~$100B+ FY26 · Amazon ~$200B · Meta $135-145B guidance) — destination TRACED per actor 07-27 (see the comparable table in this thread's timeline + the four *-capex findings). The standing questions: whether AI revenue catches the spend (payoff layer is press-only), the undisclosed own-silicon vs Nvidia splits (4/4 refuse), power as the binding constraint (nuclear '27-'39 vs Meta's gas pivot), and capex migrating off balance sheets (Blue Owl, bonds, leases → the financing threads). Earnings Wed/Thu (Meta+MSFT 07-29, AMZN 07-30) are the live test.","timeline":[{"date":"2026-07-30","html":"<strong>Three of four now in: Amazon's the cleanest beat of the week<\/strong><ul><li><strong>Amazon reported: AWS +37% YoY (fastest in 18 quarters), net sales +20%, property/equipment purchases up $66.1B<\/strong> — completes the three-of-four-hyperscalers-report picture for this week (Meta, Microsoft, Amazon; Alphabet's own capex context still tracked via <code>google-capex<\/code>). Full detail: <code>aws-capex<\/code>.<\/li><\/ul>","tag":"daily 2026-07-30"},{"date":"2026-07-30","html":"<strong>Two of four report: capex still climbing, the market draws the monetization line<\/strong><ul><li><strong>Meta and Microsoft both reported 07-29: neither shows a capex peak<\/strong> — Meta raised its 2026 floor to $130-145B (second raise this year); Microsoft's FY27 guide stayed \"grow year-over-year\" plus $50B+/quarter next quarter. Amazon reports later today (07-30) — no result in hand as of this run. (<a href=\"https://www.microsoft.com/en-us/investor/earnings/fy-2026-q4/press-release-webcast\">Microsoft IR<\/a>)<\/li><li><strong>The market drew a monetization line, not hyperscaler-vs-chipmaker<\/strong> — Microsoft (Azure +43%) bought tolerance for its capex; Meta (EPS miss, near-zero FCF) did not, despite raising its own guide. Full cross-name read in <code>chip-hyperscaler-rotation<\/code>.<\/li><\/ul>","tag":"daily 2026-07-30"},{"date":"2026-07-28","html":"<strong>Eve of Meta/Microsoft earnings: financing keeps migrating off-balance-sheet, Nvidia becomes financier-of-last-resort<\/strong><ul><li><strong>Two same-day instances of the off-balance-sheet pattern<\/strong>: Meta formalized a second 80/20 asset-sale JV (BlackRock, $14B, El Paso — see <code>meta-capex<\/code>), and Nvidia emerged as a prospective ~$250-500B financing backstop for OpenAI's 10GW Ohio site (see <code>stargate-buildout<\/code>) — the chip vendor increasingly underwriting its own customers' buildouts.<\/li><li><strong>Meta reports tomorrow (07-29), Microsoft the same day, Amazon 07-30<\/strong> — consensus has coalesced around ~$136-138B FY26 Meta capex (mid-guidance, up ~$67B YoY) with 2027 seen rising further; this week's commentary (CNBC, Seeking Alpha, Yahoo/Motley Fool) frames Meta/Microsoft/Amazon as the next test after Alphabet's guidance raise, with combined 2026 AI spend across Alphabet/Amazon/Meta alone put over $500B before Microsoft is even added.<\/li><\/ul>","tag":"daily 2026-07-28"},{"date":"2026-07-27","html":"<strong>THE CAPEX PICTURE: four actors, one table ⟨crawl 2026-07-27⟩<\/strong>","tag":"seed"},{"date":"2026-07-23","html":"<strong>Meta-thread opened<\/strong><ul><li><strong>Opened as a meta-thread grouping four sub-threads<\/strong> — google-capex, meta-capex, aws-capex, microsoft-capex — after Ben asked for the individual hyperscalers as their own threads plus \"the big picture\" as an overlapping parent (<code>/steer<\/code>, \"figure out how to do meta-threads\"). A meta-thread's card shows its children as linked rows, not a flat re-listing of their items; its ranking score aggregates their activity.<\/li><\/ul>","tag":"steer 2026-07-23"},{"date":"2026-07-22","html":"<strong>The first capex verdict of the cycle<\/strong><ul><li><strong>Alphabet raised 2026 capex guidance to $195-205B<\/strong> (from $180-190B), the first of the four hyperscalers to report this cycle — GOOGL fell ~5% after-hours despite a revenue/Cloud beat, reading as \"spend still accelerating, not yet proof it pays off.\" Full detail in <code>google-capex<\/code>. (<a href=\"https://www.cnbc.com/2026/07/22/google-earnings-q2-goog-live-updates.html\">CNBC<\/a>)<\/li><\/ul>","tag":"steer 2026-07-23, evidence dated 2026-07-22"},{"date":"2026-07-20","html":"<strong>The question gets a date<\/strong><ul><li><strong>Alphabet/Tesla/Intel earnings framed as the first real test<\/strong> of whether AI revenue justifies Big Tech's collective $725B 2026 capex plan. (<a href=\"https://www.techtimes.com/articles/321101/20260720/alphabet-tesla-intel-earnings-are-first-real-test-ai-capex-scale.htm\">Tech Times<\/a>)<\/li><\/ul>","tag":"steer 2026-07-23, evidence dated 2026-07-20"}],"timeline_truncated":false,"crawled":null},{"slug":"google-capex","title":"Google Capex","kind":"story","status":"developing","lens":"ai","opened":"2026-07-23","last_seen":"2026-07-31","parent":"hyperscaler-capex-big-picture","genre":"buildout-race","weight":2,"entities":["google"],"watch":"$195-205B guided for 2026 (07-22), destination traced by crawl 07-27: a 15+ state land-grab (MO $15B, MI 1GW \"Cannoli\", TX 1GW+, NextEra 3×GW-scale) + India $15B hub — not a few megasites. TPU v7 \"Ironwood\" vs Nvidia split UNDISCLOSED (Anthropic's 1M-TPU deal is the clearest volume signal). Solar-dominant PPAs + first Gen-IV utility deal (TVA/Kairos, 2030). Payoff case ($514B backlog, Cloud +82%) is press-corroborated, primary filing unreached. Watch: Q3 guidance, the FCF-negative reaction, TPU externalization (Meta eval).","timeline":[{"date":"2026-07-31","html":"<strong>Google guarantees a $15B bank loan backing Anthropic's own data-center buildout<\/strong><ul><li><strong>Google is guaranteeing billions of dollars of Anthropic's lease and power-payment obligations<\/strong> on a ~$15B financing package (a Morgan Stanley-led bank consortium: a $14B bridge loan plus a revolving credit facility) lending to Nexus Data Centers, a Texas developer building a campus in Hubbard, TX with a dedicated 1.6GW gas power plant and four data-center leases for Anthropic — Google takes roughly 20% equity in the project in exchange for the guarantee. Reported via sourcing (\"people familiar\"), not yet an official Google/Anthropic announcement. (<a href=\"https://www.bloomberg.com/news/articles/2026-07-30/banks-line-up-15-billion-of-debt-for-anthropic-with-google-aid\">Bloomberg<\/a>)<\/li><li><strong>Same off-balance-sheet-backstop pattern as Meta/BlackRock's El Paso JV and Nvidia/OpenAI<\/strong> — deepens Google's capital entanglement with Anthropic beyond compute credits into direct credit exposure.<\/li><\/ul>","tag":"daily 2026-07-31"},{"date":"2026-07-23","html":"<strong>Thread opened; the full Q2 picture lands<\/strong><ul><li><strong>Opened<\/strong> — split out of <code>ai-circular-financing-risk<\/code> so Google's capex trajectory has its own thread rather than one line inside the broader circular-financing story.<\/li><li><strong>Full Q2 detail, finalize sweep<\/strong>: revenue $119.8B (+24% YoY, beat), Google Cloud +82% to $24.8B with a $514B backlog — but stock fell over 6% (not the ~5% first-read) and 2027 capex flagged to \"increase significantly.\" Also disclosed: Google is testing Gemini 3.5 Pro and has begun pretraining Gemini 4. (<a href=\"https://www.cnbc.com/2026/07/22/google-earnings-q2-goog-live-updates.html\">CNBC<\/a>)<\/li><li><strong>GOOGL still soft in premarket<\/strong> — continuation of 07-22's after-hours reaction, not new news. (<a href=\"https://www.tickmill.com/blog/daily-market-outlook-july-23-2026\">Tickmill<\/a>)<\/li><\/ul>","tag":"steer 2026-07-23"},{"date":"2026-07-22","html":"<strong>The raise<\/strong><ul><li><strong>Alphabet raised 2026 capex guidance to $195-205B<\/strong> (from $180-190B), with more flagged for 2027 — revenue beat ($119.8B, +24% YoY) and Cloud surged 82% to $24.8B, but GOOGL fell ~5% after-hours anyway: the market read accelerating spend as a warning, not confirmation. (<a href=\"https://www.cnbc.com/2026/07/22/google-earnings-q2-goog-live-updates.html\">CNBC<\/a>)<\/li><\/ul>","tag":"steer 2026-07-23, evidence dated 2026-07-22"},{"date":"2026-07-20","html":"<strong>The question gets a date<\/strong><ul><li><strong>Alphabet/Tesla/Intel earnings framed as the first real test<\/strong> of whether AI revenue justifies Big Tech's collective $725B 2026 capex plan (Alphabet reports 07-22). (<a href=\"https://www.techtimes.com/articles/321101/20260720/alphabet-tesla-intel-earnings-are-first-real-test-ai-capex-scale.htm\">Tech Times<\/a>)<\/li><li><strong>A specialist-press counter to the nuclear/SMR framing<\/strong>: \"Data centers powered by next-gen nuclear? Don't fall for Big Tech's PR hype\" — argues SMR timelines (2030+) lag current AI power demand by years, a useful skeptical read against the Kairos/TVA deal below. (<a href=\"https://news.google.com/rss/search?q=Google+nuclear+Kairos+power+purchase+agreement&amp;hl=en-US&amp;gl=US&amp;ceid=US:en\">Bulletin of the Atomic Scientists<\/a>)<\/li><\/ul>","tag":"steer 2026-07-23, evidence dated 2026-07-20"},{"date":"2026-07-08","html":"<strong>Wyoming named as a Google site<\/strong><ul><li><strong>Google confirmed as the owner behind what local reporting calls Wyoming's largest data center project<\/strong> — capacity not independently confirmed; a separate report has Crusoe exiting an adjacent 1.8GW Wyoming project \"after Google pressure.\" (<a href=\"https://news.google.com/rss/articles/CBMitgFBVV95cUxNV0xsa3c2R19QQVJUT1Zrem05SG9nbEJrS19OYXRNRExRVjNQbWRqek1CYk5OajVXVzFUVG95M1N5V2pfc051dDVOXy0tdDFTZUpoWS1uWmRrVHFMb25lN1BSR3V5c2pfTFZfdGNnXzhPOXlBSFJlMmlzRm1UeHhmSnpFcmhXMXFfcjBHX2x0ekIwLTJCTGFXeloxYjYxdUJGTVFTTk1VcjlKTEpBMHhDZmxMU0FWdw?oc=5\">Cowboy State Daily<\/a>)<\/li><\/ul>","tag":"crawl 2026-07-27"},{"date":"2026-06-22","html":"<strong>Virginia's $9B trio<\/strong><ul><li><strong>Google's $9B bet on a trio of Chesterfield County, Virginia data center campuses<\/strong>, layered on top of a separately announced Botetourt County campus (2026-04-03). (<a href=\"https://news.google.com/rss/articles/CBMipgFBVV95cUxQRkpWZjcxdWVxUG4zT1JyV1BWdE1MNGJGeXdBeEt0ajBRUEtBLTIyLVFSZWdCQWFGUldabTF1bEw5VUdZOFdfc1RpZXVuNXhjNUxjS2UzMU5yb3M2M3Yxc082a3ZDNVhBbHpyYWRPdnBGVExLXzZMVmRBdmdkUUtCMFVJbHNPek9vSU1hRTFacjZwN1dfbVNtbEJwYjJ5a0FtaDB5MlZR?oc=5\">VPM<\/a>)<\/li><\/ul>","tag":"crawl 2026-07-27"},{"date":"2026-06-15","html":"<strong>Alabama expansion<\/strong><ul><li><strong>Google adding $1.5B to expand its TVA-powered Jackson County, Alabama campus<\/strong> — corroborated by 5+ outlets same day. (<a href=\"https://news.google.com/rss/articles/CBMivgFBVV95cUxQOVNBZlFlQnFSU NDdaLVE?oc=5\">Data Center Dynamics<\/a>)<\/li><\/ul>","tag":"crawl 2026-07-27"},{"date":"2026-02-18","html":"<strong>Geothermal: Ormat, Nevada<\/strong><ul><li><strong>Google + Ormat sign a deal for up to 150MW of geothermal power in Nevada<\/strong> via NV Energy's Clean Transition Tariff, commercial operations targeted 2028-2030. (No Fervo Energy deal found — Ormat is the recurring Google geothermal counterparty.) (<a href=\"https://www.esgtoday.com/google-ormat-sign-deal-to-power-data-centers-from-new-geothermal-projects/\">ESG Today<\/a>)<\/li><\/ul>","tag":"crawl 2026-07-27"},{"date":"2026-02-09","html":"<strong>Solar at gigawatt scale: TotalEnergies, Texas<\/strong><ul><li><strong>TotalEnergies' largest-ever US renewable PPA<\/strong>: 1GW solar in Texas, 15-year term, ~28TWh total delivery — the single largest signed solar PPA found in this crawl. (<a href=\"https://www.esgtoday.com/totalenergies-signs-its-biggest-u-s-renewable-energy-deal-to-power-google-data-centers/\">ESG Today<\/a>)<\/li><\/ul>","tag":"crawl 2026-07-27"},{"date":"2025-12-22","html":"<strong>Buying the developer: Intersect Power<\/strong><ul><li><strong>Google to acquire data-center-and-energy developer Intersect Power for $4.75B<\/strong>, gaining \"several gigawatts\" of energy assets — this is the deal that produced the Texas Panhandle complex (2026-06-04 above). (<a href=\"https://news.google.com/rss/articles/CBMikAFBVV95cUxNOC05cFVnMHEtSDBWbTJ1cE1mWjMtQ2tNYTZuRTNNcVdiRnB5NGtnNmNTbFU2aEhab3R2N1NmbDMtQldPUlBGZDk5dGl5Q0M5MU5xWjR4eEh0eW1tLVhUcURtemRFMDJ6a25iU291UnA0OXpUOVI5c1RKWDg4NDQyMHRaQld0eWhxTXU3UHVPeE0?oc=5\">Data Center Dynamics<\/a>)<\/li><\/ul>","tag":"crawl 2026-07-27"},{"date":"2025-12-09","html":"<strong>NextEra: at least three gigawatt-scale campuses<\/strong><ul><li><strong>Google + NextEra Energy partner to develop \"at least three gigawatt-scale data center campuses\"<\/strong> — confirmed via Reuters, NextEra's own release, and 6+ outlets total. (<a href=\"https://news.google.com/rss/articles/CBMi2AFBVV95cUxNZWRhRi1SQ082dnB6RXdOVEYwSEE0ZW9Xa1g1YUlEa3hQMXJIeDJKNDcxcV9KQm5PSjU2eEdoZDVYdmZTTjUwdGJZcWZHSjRaSWZsR19uRzBqaVktYmNpZkZDdUo2RU9LaEFoVGxtVUNacnlOTFRKZEgwZVVuQ1RqaE1OZWt2SnVZcEpHS2lYWlI5TVladnZWMzV6bm9rS3dOSnVzekVfYXkxTWVUQXc5cEF5dXZERnpUMDNDN01oRkpZcTQ5MEpTeEdVc0ZmcEVDdnB2X2xqVGk?oc=5\">Data Center Dynamics<\/a>)<\/li><\/ul>","tag":"crawl 2026-07-27"},{"date":"2025-11-06","html":"<strong>The chip: TPU v7 \"Ironwood\" ships<\/strong><ul><li><strong>Google rolled out TPU v7 \"Ironwood,\"<\/strong> its current-generation AI chip, explicitly positioned against Nvidia's GB300/Blackwell — 4 independent outlets converge on launch date and framing. Co-designed with Broadcom, with MediaTek and TSMC as fab/design partners. (<a href=\"https://news.google.com/rss/articles/CBMiqAFBVV95cUxPRFZ4U1hHVUhsSlRFLTduWXhTMDJEZEx1SVVDUWloZ1BDRGhrVXg4WHdfRGktd2p5eklfTjl4U0pLMjdKLWp5ZkJabXFDTHZEXzFzZnVXdFBzOE95R3RJSU9Ia3dFUzhVSEhaRTVOeS1XVTlEZTVGRFJBTkFzVHJZTEM4ZmEyalJVVV9fZ1NDSkZLQ3BWN2pHSzlmeGlsckVmM053ZjEz?oc=5\">CNBC<\/a>)<\/li><\/ul>","tag":"crawl 2026-07-27"},{"date":"2025-10-24","html":"<strong>The clearest TPU volume signal: Anthropic<\/strong><ul><li><strong>Anthropic gains access to up to 1 million Google TPUs<\/strong>, expecting \"over 1GW of processing power\" in 2026, a deal reported worth \"tens of billions of dollars\" — the largest single disclosed external TPU commitment found in this crawl (later expanded 2026-04-06 above). (<a href=\"https://news.google.com/rss/articles/CBMiygFBVV95cUxNQWd4YTVRa0l1UERGZ2hKWS1vWGx2ZFUySnQ2V1RSMXJGMHU1OGVmU0tfODR3TTZncXczWkU5OUhUNmJCbUhUTGhkNnI4UUtkaGltNEw4cmpNSGE4bmQ0RUxnY203WEhfZ2R1Z2VGZHQ5RXFWdkFFMWtOdmdpcGVSalFCRENDMjFiZEppaERCMFMyYzlNaHRNMkhLTzY1dnRWdlBhWEJjTTRhQnNjeUZGNFN5Rm1fdTFIRlZFczZ4YmdRdDB5WHh2RWZ3?oc=5\">Data Center Dynamics<\/a>)<\/li><\/ul>","tag":"crawl 2026-07-27"},{"date":"2025-08-18","html":"<strong>Power comes online: the first US utility PPA for Gen-IV nuclear<\/strong><ul><li><strong>TVA + Google + Kairos Power sign the first US utility PPA for Gen-IV nuclear<\/strong>, targeting a Tennessee reactor for 2030 (~50MW per Data Center Dynamics, sited across Tennessee/Alabama) — corroborated by 5 outlets including Reuters. The origin point of Google's now-broader nuclear/SMR bet (Kairos framework dates to 2024-10-15). (<a href=\"https://news.google.com/rss/search?q=Google+nuclear+Kairos+power+purchase+agreement&amp;hl=en-US&amp;gl=US&amp;ceid=US:en\">Reuters<\/a>)<\/li><\/ul>","tag":"crawl 2026-07-27"}],"timeline_truncated":false,"crawled":"2026-07-27"},{"slug":"meta-capex","title":"Meta Capex","kind":"story","status":"developing","lens":"ai","opened":"2026-07-23","last_seen":"2026-07-29","parent":"hyperscaler-capex-big-picture","genre":"buildout-race","weight":2,"entities":["meta-ai"],"watch":"The week's reversal: Meta QUIT RE100 amid a 7.5GW gas buildout (07-23/24) and SOLD 80% of Hyperion (5GW, $50B+) to Blue Owl — capex migrating off its balance sheet while El Paso ($10B/1GW) faces live local pushback and the BlackRock bond ran a soft-demand-then-upsized-to-$12.5B arc in one week. MTIA at \"millions\" of H100-equivalents (600K figure is STALE), \"Iris\" to production Sept-26, Broadcom extended thru 2029. Superintelligence framing softening (\"more slowly than expected\"); Moody's credit warning 07-24. OPEN DISCREPANCY: our $76B TTM basis vs the $135B/ $145B guidance figures that actually recur — resolve at earnings Wednesday 07-29.","timeline":[{"date":"2026-07-30","html":"<strong>El Paso pushback gains an elected voice<\/strong><ul><li><strong>A Texas state representative is calling for a new review of El Paso's Meta tax incentives<\/strong>, citing the BlackRock JV announced 07-28 — the local pushback (council ending tax breaks 07-21, the \"Block Party\" protest 07-25) now has an elected official attached, not just residents. ([KFOX/KVIA/KDBC])<\/li><\/ul>","tag":"daily 2026-07-30"},{"date":"2026-07-29","html":"<strong>Capex raised again, but free cash flow nearly vanished<\/strong><ul><li><strong>Q2 revenue $60.8B (+28%) beat, but EPS $6.18 missed consensus by roughly 14-15%, and free cash flow was $784M<\/strong> — near zero against an ~$12B/quarter trailing average. Total expenses rose 55% YoY on legal costs and severance. Stock fell 8-11% after-hours, -8.5% premarket. (<a href=\"https://www.stocktitan.net/news/META/meta-reports-second-quarter-2026-hkjfhayj8l0v.html\">StockTitan<\/a>)<\/li><li><strong>2026 capex guidance was raised again, to $130-145B<\/strong> — the floor up from $125-145B, the second raise this year. Capex is not peaking here; it is still rising. (<a href=\"https://www.benzinga.com/markets/earnings/26/07/60781217/meta-reports-mixed-q2-results-raises-low-end-of-capex-guidance-range-shares-move-lower\">Benzinga<\/a>)<\/li><li><strong>The AMD 6GW commitment was not addressed on the call<\/strong> — checked the transcript directly, no mention found. The only new infrastructure item was a BlackRock partnership for a 1GW Texas data center. (<a href=\"https://www.investing.com/news/transcripts/earnings-call-transcript-meta-misses-eps-in-q2-2026-as-stock-sinks-after-hours-93CH-4821910\">transcript via Investing.com<\/a>)<\/li><li><strong>This is the thread's most important wrinkle so far:<\/strong> a hyperscaler took a hit as hard as the chip names that fell the same night, on capex-outrunning-monetization optics rather than the capex figure itself. The dividing line the market drew tonight looks less like hyperscaler-vs-chipmaker and more like proven-monetization-vs-unproven.<\/li><\/ul>","tag":"daily 2026-07-29"},{"date":"2026-07-28","html":"<strong>El Paso's financing structure completes, one day before earnings<\/strong><ul><li><strong>Meta and BlackRock formalized a $14B El Paso, TX data-center joint venture<\/strong> — BlackRock-managed funds (with Global Infrastructure Partners and HPS Investment Partners) take an 80% stake, financed partly by the $12.5B bond that just priced; Meta keeps 20%, contributing ~$2.3B of land and in-progress construction. The 1GW campus, already under construction, targets 2028 operations — the same 80/20 off-balance-sheet pattern as Hyperion's Blue Owl sale, now repeated at a second site the day before earnings. (<a href=\"https://about.fb.com/news/2026/07/meta-announces-new-venture-with-blackrock-to-develop-data-center-in-el-paso/\">Meta<\/a>) (<a href=\"https://www.cnbc.com/2026/07/28/meta-blackrock-partner-on-14-billion-el-paso-data-center.html\">CNBC<\/a>)<\/li><\/ul>","tag":"daily 2026-07-28"},{"date":"2026-07-23","html":"<strong>Thread opened<\/strong><ul><li><strong>Opened<\/strong> — backfilled with the two 07-22 items below, previously tagged only to entities, no thread.<\/li><\/ul>","tag":"steer 2026-07-23"},{"date":"2026-07-22","html":"<strong>Two supply-hedge signals in one day<\/strong><ul><li><strong>Meta committed to 6GW of AMD Instinct MI450-series capacity<\/strong> — alongside OpenAI's 6GW and Anthropic's 2GW, signed the same day as AMD's Advancing AI event — Meta hedging compute supply beyond Nvidia. (<a href=\"https://www.techtimes.com/articles/321257/20260722/amd-advancing-ai-2026-opens-zen-6-venice-helios-open-ai-rack-bet.htm\">Tech Times<\/a>)<\/li><li><strong>Meta reportedly in talks for a $10B Anthropic cloud deal<\/strong> that would make Meta a fourth major cloud provider. ⚠ single-outlet, rumor-sourced — unconfirmed pending Meta's 07-29 earnings. (<a href=\"https://www.fool.com/investing/2026/07/22/mark-zuckerbergs-meta-is-in-talks-for-a-10-billion/\">Motley Fool<\/a>)<\/li><\/ul>","tag":"steer 2026-07-23, evidence dated 2026-07-22"},{"date":"2026-07-27","html":"<strong>Capex destination reconstructed (backward crawl)<\/strong><ul><li><strong>BlackRock's $12.3B El Paso data-center bond hit \"soft demand\" (07-25) then rallied and upsized to $12.5B (07-27)<\/strong> — yields reportedly topped 7% amid a broader AI-debt sell-off; not a downsize, a wobble. (<a href=\"https://news.google.co FWGNlVDhKT1Z6c1F4TnRKaVNVVGw5dmxLOFdRTm5KdWc4VUM3dGR1LV8yanp2eDlRR2ZHU19ZMDJfcmxzN2RkZHlW\">Reuters<\/a>)<\/li><li><strong>El Paso capex boosted sixfold to $10B (1GW), while local politics turned against it<\/strong> — City Council ended new data-center tax breaks (07-21) and a resident \"Block Party\" protest ran the same week (07-25). (<a href=\"https://news.google.com/rss/articles/CBMipAFBVV95cUxQQzlUNzhaWENtQV9WLW1FTVBXYTVJT1JXWUY2VGdyQTBDak5feTBqdXJYWWlMVE1ubDJZSGpzVno3dEZ0TVpkYkNzS2F2Z0NMd2Q1V2h0UURmRjRueXhZOUdZSHRrV2tENWRDNlJyWnpMaUpjQTdXVlIxbHpVcEJWc2RfZnh6UkJsOU02ajV6QVpTZkpIUTJVTWdOYzNGaFp2NVJnZQ\">CNBC<\/a>)<\/li><li><strong>Reuters exclusive: next MTIA chip (\"Iris\") enters production September 2026<\/strong> to double Meta's compute capacity — well-corroborated secondhand across 4+ outlets, not primary-verified. (<a href=\"https://news.google.com/rss/articles/CBMizAFBVV95cUxOQmJUcmlIQzJ4M0Vmd1QxQno5ajZPWnFqRHMtQkNMSzVRMHlnOXBqZDN4cjVuRU1XR3IyajdHekZJRkNpeXA2UjRBaXdiaDlnbkxVa1VXb1hwY3BDMUE1am9uX0o3OUxYTWVkeUMyemFUQ0JkMlVpX1RWSTBLVzI3bC1uaTVGelVXd1pSdEY4RHpreUQySmhOUjZMemVGQ3k4YTREY3VxN3k5alhELVdJa1hGeGYxbUltMV9mVUtHZWM4SmQ1eGNqRkk0RUk\">Reuters<\/a>)<\/li><li><strong>Meta-Broadcom custom-ASIC deal extended through 2029, 1GW+ of custom silicon<\/strong> — announced the same day Broadcom CEO Hock Tan stepped down from Meta's board. (<a href=\"https://news.google.com/rss/articles/CBMiyAFBVV95cUxQU3JRUzgyMGZsQ08tLVgyTzNfZE1PZUdJaDBIVFZJUmlfM1daVEVFSEhvOTNXV1Y1UTRKQ1hPRk90UWExbjl1MGpjU0NSTVc4aGhXZWV3X242NGFoLUJ3TjJVZXZ2UHY4QjdVOGlqWXd4a1l0SWI3Z2ZnTHdCVmE4cy14alMwOGhUX09YUEtWeGJaYmhXcGxzejd3VHRlaUtHSDdRa04yc09pUklmZk82RG5XdGw0ZGhweDFMZjl5ZVhsOVdPNGRkRQ\">CNBC<\/a>)<\/li><li><strong>Meta's Nvidia \"600K H100-equivalents\" figure is stale<\/strong> — superseded by a 1.3M target (2025-01-24) and then \"millions... including standalone CPUs\" (2026-02-17); no precise current count found. (<a href=\"https://news.google.com/rss/articles/CBMif0FVX3lxTFBiLXZYX1ZjaTRaenZCcmpJT0FZTksxVFpNOWhYOXBHenZDUjlKLXBoTDJuOHluYzRiSWx0YVV6Slljb3NBem9CLVlJUHlTR1FIQk15ODZGRm4yaXduckZ6YW9DNTJoYkZveDFwS3Y1amFOTkRiSi1lNDYxZlQwMFU\">CNBC<\/a>)<\/li><li><strong>Nuclear RFP awards unlock up to 6.6GW<\/strong> — Oklo (1.2GW, Ohio), TerraPower (8 Natrium plants), Vistra (Beaver Valley expansion); the original RFP target is disputed between outlets (1.4GW vs. 4GW). (<a href=\"https://news.google.com/rss/articles/CBMilwFBVV95cUxOT2pPa1RyS01SdjVXYmtibWp3MURDbHJuRjhMb3BuUkI4dXZueW5uMzhIUkFKamsxYW55VDZ5Z0RlU1R4M3ZnODRIMXl2SW5xOURoRTFyNlhYbkVlNXVTd3N6N0N5aHB4OXdrc3JKR3hTUG1jNnE4ZnRpdzM5bzRGdDh0S0JzVWZCSG1DN21fSlFqYzdObjJJ\">Meta Store, official<\/a>)<\/li><li><strong>Zuckerberg's \"superintelligence\" framing has been softening<\/strong> — from \"hundreds of billions... now in sight\" (2025-07-30) to telling an internal town hall AI agent progress is \"more slowly than expected\" (2026-07-02), four weeks before earnings. (<a href=\"https://news.google.com/rss/articles/CBMipAFBVV95cUxNN0JCM2lSVlJscWE5czJOV0NjMmtPQW10VF94WVZrUWVBak42RjYzMGNBUEZvN2NIY0h6QlU4Yl9UUUN5all2NzU3V0dvODdUemZRY0NBVV9ZZEFZa1FpTHVDTFdNYzZGUFpFckRuLWpxaTJmYnMwUHJRVFltWmllRE5rWXlyNDZqaVc3Zlp0ZzFDYVRsUlBMVDZWOWtxQnJoaHFUeA\">Business Insider<\/a>)<\/li><li><strong>The $14.3B Scale AI stake (~49%) and \"TBD Lab\" have had a rough year<\/strong> — a fourth AI-org restructuring in six months, ~600 layoffs, chief scientist Yann LeCun's departure calling LLMs \"a dead end,\" and sustained \"soul-crushing\"/\"suffocating management\" internal coverage through this week; no change to the equity stake itself found. (<a href=\"https://news.google.com/rss/articles/CBMiqgFBVV95cUxOcUl5MS1ZV3ZudEdnOGpSVkZ4V0RvdE1xNXJIRGhEaUxLd3VhTFBTeXFiSGxxZFBfQlFVekQyOHpMYVlmN0RheW9IZVJuOGtSMU1yN3pxajBDWUliQzVEaGpRVEtBZFhXUWFyWFNNcTRrXzdWSFlIZVdVSTF1bjV6Sk9xSTVJREZRZmE2QVlYR0dNZ2R1THZ1U3FkX1FJM2NRYjFhRXFIX29sQQ\">WSJ — $14.3B deal<\/a>)<\/li><li><strong>The \"~$76B TTM\" capex figure could not be corroborated<\/strong> in this crawl — a dedicated query returned zero results; the numbers that actually recur in 2026 coverage are $135B (Jan guidance) and $145B (Apr-Jul coverage). Verify before repeating it.<\/li><\/ul>","tag":"crawl 2026-07-27, evidence dated 2026-07-25/27"}],"timeline_truncated":false,"crawled":"2026-07-27"},{"slug":"aws-capex","title":"AWS Capex","kind":"story","status":"developing","lens":"ai","opened":"2026-07-23","last_seen":"2026-07-30","parent":"hyperscaler-capex-big-picture","genre":"buildout-race","weight":2,"entities":["amazon-aws"],"watch":"Earnings 07-30 (corrected from ~07-31). Crawl 07-27: the AGI-cuts vs $200B-plan \"contradiction\" is coherent — retreat from frontier research, double down as the labs' landlord: $364B backlog EXCLUDING Anthropic's new $100B+/decade commitment (grew 10 days AFTER the Google TPU deal — diversification, not displacement); OpenAI $50B investment + separate $100B/8yr compute deal CONFIRMED (02-27 announcement). Rainier live (500K Trainium2, $26B IN); 1.4M Trainium deployed; Talen 1.92GW/17yr + X-Energy 5GW-by-2039. Watch 07-30: capex guide, backlog, FCF (reportedly borrowing $25B).","timeline":[{"date":"2026-07-30","html":"<strong>The test fires: AWS grows 37%, fastest in 18 quarters<\/strong><ul><li><strong>Amazon's Q2 print is this thread's clean answer.<\/strong> Net sales $200.6B (+20% YoY, beat ~$196-197B consensus); <strong>AWS revenue $42.2B (+37% YoY — \"fastest growth in 18 quarters\"),<\/strong> a significant beat against the ~31-33% consensus growth rate. AWS operating margin 39.4%, operating income $16.6B (+64% YoY). Property/equipment purchases up <strong>$66.1B<\/strong> YoY, funding the AI infrastructure buildout this thread tracks. (8-K filed same day, items 2.02/9.01.) (<a href=\"https://www.sec.gov/Archives/edgar/data/1018724/000101872426000024/amzn-20260630xex991.htm\">SEC EDGAR<\/a>)<\/li><li><strong>Net income ($62.6B, $5.75 EPS) is not the organic story<\/strong> — $53.4B of it is a non-operating gain from Amazon's Anthropic investment, not operating performance. Cross-reference <code>ai-circular-financing-risk<\/code> (Microsoft's own Anthropic stake gained $3.2B the same reporting season — a much smaller mark, different scale entirely).<\/li><li><strong>Q3 guidance: net sales $197.0-202.0B (9-12% growth), operating income $22.5-26.5B.<\/strong><\/li><\/ul>","tag":"daily 2026-07-30"},{"date":"2026-07-28","html":"<strong>Two AWS sites in Bahrain confirmed damaged by satellite imagery<\/strong><ul><li><strong>Bloomberg reports satellite imagery showing significant damage to two Amazon data centres in Bahrain<\/strong> (Zallaq and Askar), corroborating IRGC claims made via Tasnim. The first war in which commercial datacentres have been deliberately targeted, with published damage assessment. (<a href=\"https://www.bloomberg.com/news/articles/2026-07-28/amazon-data-centers-hit-in-iran-strikes-satellite-images-show\">Bloomberg<\/a> · <a href=\"https://www.tomshardware.com/tech-industry/data-centers/amazon-data-center-in-bahrain-struck-and-destroyed-by-iranian-cruise-missiles-state-media-claims-attacks-launched-against-aws-site-in-response-to-alleged-us-strikes-on-an-under-construction-nuclear-plant\">Tom's Hardware<\/a>)<\/li><li><strong>⚠ The imagery is new; the strikes are not.<\/strong> Claimed ~<strong>07-21<\/strong>, after Shahed drone attacks on AWS sites in the <strong>UAE (03-01)<\/strong> and a further Bahrain strike (<strong>04-01<\/strong>). Recorded as corroboration, not a fresh attack.<\/li><li><strong>The capex read:<\/strong> Amazon has committed ~$200B to the 2026 buildout and just sold <strong>$25B of bonds<\/strong> to finance it. Physical loss of regional capacity — and the insurance/siting repricing behind it — is a cost line this thread has never had to model. Watch whether the 07-30 print or call mentions it at all.<\/li><\/ul>","tag":"daily 2026-07-28"},{"date":"2026-07-23","html":"<strong>Thread opened; first signal is a headcount cut, not capex<\/strong><ul><li><strong>Opened alongside its three siblings<\/strong> (google-capex, meta-capex, microsoft-capex) so the term list catches AWS capex news going forward — no dedicated item swept yet, stated plainly rather than backfilled with a stretch.<\/li><li><strong>Amazon cut AGI research roles<\/strong> (model-customization/post-training) while the $200B 2026 capex plan holds — a pivot toward enterprise deployment over frontier research, not a capex-figure change; first real test is the ~07-31 earnings call. (<a href=\"https://www.techtimes.com/articles/321341/20260723/amazon-cuts-agi-jobs-while-pouring-200-billion-ai-infrastructure.htm\">Techtimes<\/a>)<\/li><\/ul>","tag":"steer 2026-07-23"}],"timeline_truncated":false,"crawled":"2026-07-27"},{"slug":"microsoft-capex","title":"Microsoft Capex","kind":"story","status":"developing","lens":"ai","opened":"2026-07-23","last_seen":"2026-07-30","parent":"hyperscaler-capex-big-picture","genre":"buildout-race","weight":2,"entities":["microsoft"],"watch":"Earnings 07-29 is the near-term test — the \"$97B TTM\" figure is OUR arithmetic (unconfirmed; $80.1B 9-mo FY26 is the IR number). Crawl 07-27 traced: WI+GA \"AI superfactory\" (~2GW, fiber-linked) + a distinct Pecos TX ~2GW on Chevron's Kilby PPA ($7B, 2.7GW); Maia 200 confirmed DUAL-PURPOSE (OpenAI inference + MAI training) with the split undisclosed; TMI/Crane restart tracking 2027; $37B AI run-rate +123%. The $250B OpenAI commitment has NO disclosed capex mapping — nobody publishes the OpenAI-vs-own split. Watch Wednesday: FY26 full-year capex, FY27 guide, any split disclosure.","timeline":[{"date":"2026-07-29","html":"<strong>Earnings beat, Azure accelerates, the named split still didn't happen<\/strong><ul><li><strong>Microsoft reports FY26 Q4 after today's close<\/strong>, confirmed against two Microsoft primary sources; the watch items are the FY27 capex guide and any OpenAI-vs-own split disclosure. (<a href=\"https://news.microsoft.com/source/2026/07/08/microsoft-announces-quarterly-earnings-release-date-68/\">Microsoft<\/a>)<\/li><li><strong>Record the date churn plainly:<\/strong> this thread's prose said 07-29, the expectations ledger said 07-30, the ledger was trusted and the prose \"corrected\" — then Microsoft's own IR settled it at 07-29. The ledger was the wrong authority.<\/li><li><strong>Revenue $90.0B (+18%) and EPS $4.81 (+32%) both beat, and Azure grew 43% constant-currency<\/strong> — well above the 39-40% guide, and an acceleration from the prior quarter. Stock +8-9% after-hours. (<a href=\"https://www.microsoft.com/en-us/investor/earnings/fy-2026-q4/press-release-webcast\">Microsoft IR<\/a>)<\/li><li><strong>⚠ Quality-of-beat flag:<\/strong> the EPS figure includes a ~$3.2B unrealized mark-to-market gain on Microsoft's Anthropic stake. The operating beat is real but smaller than the headline number. (<a href=\"https://www.benzinga.com/markets/earnings/26/07/60786971/microsoft-stock-ai-capex-amy-hood-gpu-spending-surges-after-hours\">Benzinga<\/a>)<\/li><li><strong>The named \"first\" — an OpenAI-vs-own capex split — did NOT happen.<\/strong> Checked the call transcript directly: the only OpenAI-adjacent disclosure was commercial RPO growing 25% excluding OpenAI, plus a reiteration of OpenAI's $250B Azure spend commitment. Neither is a split. FY27 capex guidance stayed qualitative — \"will grow year-over-year,\" next quarter guided \"over $50B\" — and the ~$255-260B full-year figure circulating in preview coverage was NOT stated on the call; treat it as analyst preview, not company guidance. (<a href=\"https://www.investing.com/news/transcripts/earnings-call-transcript-microsoft-q4-2026-beats-forecasts-stock-jumps-8-93CH-4822020\">transcript via Investing.com<\/a>)<\/li><\/ul>","tag":"daily 2026-07-29"},{"date":"2026-07-23","html":"<strong>Thread opened, quiet<\/strong><ul><li><strong>Opened alongside its three siblings<\/strong> (google-capex, meta-capex, aws-capex) so the term list catches Microsoft capex news going forward — no dedicated item swept yet, stated plainly rather than backfilled with a stretch.<\/li><\/ul>","tag":"steer 2026-07-23"}],"timeline_truncated":false,"crawled":"2026-07-27"},{"slug":"kimi-distillation-fight","title":"Distillation Fight","kind":"story","status":"open","lens":"ai","opened":"2026-07-24","last_seen":"2026-07-30","parent":null,"genre":"legitimacy-dispute","weight":3,"entities":["moonshot-ai","anthropic"],"watch":"The White House (OSTP's Kratsios) directly accused Moonshot of distilling Anthropic's Fable model to build Kimi K3, plus obtaining restricted Nvidia GB300 chips via Thailand; Bessent named sanctions/Entity List as options. Moonshot denies it; independent researchers call the evidence circumstantial. Lands right before K3's open weights ship (07-27). Watch: any formal Commerce/Entity List action, Moonshot's response, independent verification one way or the other, and whether it chills enterprise adoption of K3.","timeline":[{"date":"2026-07-27","html":"<strong>Beijing draws the line ⟨daily 2026-07-28⟩<\/strong><ul><li><strong>China vowed \"all necessary measures\" against the threatened US sanctions on AI firms<\/strong> over the Kimi-K3-distilled-from-Fable-5 accusations — tariff lines drawn ahead of the Sept 24 Xi–Trump summit. The state response the <em>Watch<\/em> line waits on has begun, on the trade axis rather than the export-control one. Critic-caught (benchmark miss, folded at 07-27 finalization). (<a href=\"https://www.bloomberg.com/news/articles/2026-07-27/china-vows-response-to-us-sanctions-threat-against-ai-firms\">Bloomberg<\/a>)<\/li><\/ul>","tag":"seed"},{"date":"2026-07-26","html":"<strong>K3 weights live ⟨daily 2026-07-26⟩<\/strong><ul><li><strong>Kimi K3 open weights shipped a day EARLY<\/strong> — billed the largest open-weight model ever, mid distillation-accusation and mid $50B pre-IPO push; David Sacks publicly pushed back on the \"Chinese model\" framing the same day.<\/li><\/ul>","tag":"seed"},{"date":"2026-07-23","html":"<strong>The White House names a name<\/strong><ul><li><strong>OSTP Director Michael Kratsios directly accused Moonshot of distilling Anthropic's Fable model to build Kimi K3<\/strong> — the first time a senior US official has named a specific Chinese lab; separately alleged Moonshot obtained restricted Nvidia GB300 chips via Thailand. Treasury Secretary Bessent: \"sanctions and the Entity List are both on the table.\" Under Secretary of State Helberg called it a \"heist of invaluable American IP.\" (<a href=\"https://www.scmp.com/tech/tech-war/article/3361625/global-ai-experts-push-back-us-distillation-claims-against-moonshots-kimi-k3-model\">SCMP<\/a>)<\/li><li><strong>Moonshot denies it<\/strong> — only 15 days elapsed between Fable's July 1 release and K3's July 15 launch; independent researchers (Redwood's Ryan Greenblatt) call the evidence \"thinner than official statements suggest,\" circumstantial (K3 self-identifying as Claude at unusual rates has innocent explanations — scraped transcripts, leaked system prompts).<\/li><\/ul>","tag":"daily 2026-07-23"}],"timeline_truncated":false,"crawled":null},{"slug":"iran-conflict-widening","title":"Iran's Widening War","kind":"story","status":"open","lens":"world-news","opened":"2026-07-23","last_seen":"2026-07-31","parent":null,"genre":"border-war","weight":3,"entities":[],"watch":"What began as Houthi tanker strikes and a Red Sea blockade (07-23) widened past the 07-28 Iranian missile attack on a US base in Jordan into direct US strikes inside Iran, Saudi Arabia joining as a combatant in Iraq, and strikes reaching Kuwait and Egypt for the first time. Diplomacy is now fragmenting rather than converging — Saudi Arabia building an international protection coalition, China running its own separate track with the Houthis — with no ceasefire and no further confirmed combatant as of 07-30. This is the conflict for its own sake — who's fighting whom, where it's widening, what diplomacy is doing about it. Its capital-markets and underwriting read is a separate, deliberately distinct thread: `red-sea-oil-shock`. Do not add Israel as a combatant without a dedicated primary-source check — several aggregators frame this as a \"US-Israel-Iran war\" with nothing found to confirm it.","timeline":[{"date":"2026-07-31","html":"<strong>Saudi Arabia launches a 14-nation Maritime Defense Alliance; no material escalation otherwise<\/strong><ul><li><strong>Saudi Arabia formally launched its Maritime Defense Alliance<\/strong> — its Defense Ministry hosted a Riyadh meeting (07-30) with representatives from 43 countries and the EU on Red Sea/Bab el-Mandeb/Gulf of Aden maritime security; 14 signed a joint statement: Saudi Arabia, Kuwait, Bahrain, Qatar, Pakistan, Türkiye, Egypt, Jordan, Yemen, Bangladesh, Nigeria, Sudan, Djibouti, Somalia. This is the coalition-building question this thread flagged 07-30 crystallizing into an actual signed declaration. (<a href=\"https://www.aljazeera.com/news/2026/7/30/saudi-arabia-announces-maritime-defence-alliance-to-secure-vital-waterways\">Al Jazeera<\/a>, <a href=\"https://www.thenationalnews.com/news/mena/2026/07/30/saudi-arabia-proposes-43-nation-maritime-defence-coalition-in-red-sea/\">The National<\/a>)<\/li><li><strong>No ceasefire, no new combatant, no confirmed direct Israel-Iran strikes<\/strong> — checked directly against the disqualifying conditions; reports that read like fresh IRGC strikes on Bahrain/Jordan/Kuwait traced back to a recurring pattern dating to at least 07-13, not new escalation. The active flash (<code>iran-strikes-us-base-jordan<\/code>) does not need another in-place update today.<\/li><li><strong>NB: a separate, much larger conflict has ZERO thread coverage here<\/strong> — the Russia-Ukraine war (315 outlets on 07-30, still the single largest world-news signal). It was offered as a thread candidate 07-30 and went unanswered; not re-offered today per the world-news restraint rule (\"don't re-offer a second time\"). Today's Poland/NATO-airspace incident is a discrete escalation within that same untracked war and earned its own flash regardless (<code>russia-missile-poland-nato-airspace<\/code>) — flash and thread-candidacy are independent mechanisms. Kept fully separate from this thread either way (different theater, different actors).<\/li><\/ul>","tag":"daily 2026-07-31"},{"date":"2026-07-30","html":"<strong>Diplomacy fragments; no ceasefire, no new combatant confirmed<\/strong><ul><li><strong>Saudi Arabia is moving to build an international coalition to protect Red Sea shipping from Houthi attacks<\/strong> — its first organized multilateral security response to the blockade, reported consistently across three outlets (Al-Monitor, Jerusalem Post, Al Jazeera), all citing sources, 07-29 evening.<\/li><li><strong>Separately, China is holding direct talks with the Houthis<\/strong> to secure safe passage for its own tankers — a unilateral bilateral track outside any coalition, per Reuters (dated 07-28, missed until the 07-30 sweep).<\/li><li><strong>No ceasefire or de-escalation confirmed.<\/strong><\/li><li>⚠️ <strong>Not confirmed, flagged rather than added:<\/strong> several aggregator headlines/live-blogs frame this as a \"US-Israel-Iran war.\" No primary source found confirming Israel is now directly striking Iran in this specific widening — do not add Israel as a combatant without a dedicated primary-source check.<\/li><li><strong>Flash rail assessed and left as-is:<\/strong> the current entry (updated in place 07-30 morning, <code>expires<\/code> 08-02) already covers the full widening through Kuwait/Egypt/Treasury sanctions. Nothing found on 07-30 rises above that — no new country struck, no confirmed ceasefire, no confirmed new combatant.<\/li><\/ul>","tag":"daily 2026-07-30"},{"date":"2026-07-29","html":"<strong>The war widened past the triggering strike<\/strong><ul><li><strong>The US struck targets inside Iran directly<\/strong> — Bandar Abbas, Kish Island, and sites across Khuzestan's oil belt — killing civilians on Qeshm Island in a residential building hit. (<a href=\"https://www.npr.org/2026/07/30/nx-s1-5913077\">NPR<\/a>)<\/li><li><strong>Saudi Arabia joined US airstrikes against Iran-backed militias in Iraq<\/strong> — its first direct military action of this kind, reported ~20 PMF fighters killed (one source adds 6 Iranian advisers), 32 wounded; stated cause was 30+ drone attacks on US/Saudi positions over the prior 72 hours. (<a href=\"https://www.aljazeera.com/where/iraq/\">Al Jazeera<\/a>)<\/li><li><strong>Two new countries were hit — Kuwait and Egypt.<\/strong> An Iranian strike killed a worker at a Chinese-run site in northern Kuwait; a drone hit two vessels (Gaslog Salem, Energos Winter) at Egypt's Damietta port, reported as the first attack on Egyptian soil in this war. (<a href=\"https://www.kuwaittimes.com/\">Kuwait Times<\/a> · <a href=\"https://www.aljazeera.com/\">Al Jazeera<\/a>)<\/li><\/ul>","tag":"daily 2026-07-29"},{"date":"2026-07-28","html":"<strong>The pause breaks<\/strong><ul><li><strong>Iran fired ballistic missiles at a US air base and a CENTCOM facility in Jordan at 5:45pm ET<\/strong> — all intercepted, no casualties. CENTCOM called it \"an attempted surprise attack.\" The first Iranian ballistic-missile attack on a US base since the 07-24 pause — the event that triggered the flash rail. (<a href=\"https://www.axios.com/2026/07/28/iran-missile-attack-us-base-jordan\">Axios<\/a> · <a href=\"https://edition.cnn.com/2026/07/28/world/live-news/iran-trump-news\">CNN<\/a>)<\/li><li><strong>Earlier the same day, the pause still appeared to hold<\/strong> — Trump cited \"good talks\" with Tehran and a \"good chance\" of a resolution, while warning strikes resume if diplomacy fails. Both were true at 16:00 ET and false by 17:45 ET — <strong>the pause is a headline, not a state<\/strong>, broken once within four days of being declared. (<a href=\"https://www.cnbc.com/2026/07/28/oil-price-today-wti-brent-us-iran-hormuz.html\">CNBC<\/a>)<\/li><li><strong>The war's other front got photographed:<\/strong> satellite imagery corroborated Iranian strikes on two Amazon data centres in Bahrain (Zallaq, Askar) — claimed ~07-21, following earlier drone attacks on AWS sites in the UAE (03-01) and Bahrain (04-01); Iranian state media had named Microsoft, Google, Apple, Meta, Oracle, Intel and Nvidia as targets on 03-31. This war now runs through compute infrastructure directly — full capex/AI-lens read in <code>aws-capex<\/code> and <code>datacenters-as-targets<\/code>. (<a href=\"https://www.bloomberg.com/news/articles/2026-07-28/amazon-data-centers-hit-in-iran-strikes-satellite-images-show\">Bloomberg<\/a>)<\/li><\/ul>","tag":"daily 2026-07-28"},{"date":"2026-07-26","html":"<strong>The shooting war itself quietly pauses<\/strong><ul><li><strong>The US quietly halted strikes on Iran late Friday (07-24) and Iran ceased retaliatory strikes<\/strong> — a broader US-Iran fighting pause, distinct from (and not yet extended to) the ongoing Houthi Red Sea campaign against Saudi shipping and infrastructure. (<a href=\"https://www.cnbc.com/2026/07/27/oil-price-wti-brent-slide-as-iran-reportedly-may-halt-attacks.html\">CNBC<\/a>)<\/li><\/ul>","tag":"daily 2026-07-28"},{"date":"2026-07-25","html":"<strong>Direct hit: first Saudi oil-infrastructure strike since 2022<\/strong><ul><li><strong>Houthi drones struck Aramco refineries at Jizan and Yanbu<\/strong> — Yanbu alone handles ~92% of Saudi seaborne crude exports (Kpler/AFP) — the first direct strike on Saudi oil infrastructure since 2022. Market reaction (Brent spiked above $100/bbl same day) tracked on <code>red-sea-oil-shock<\/code>. (<a href=\"https://www.washingtonpost.com/world/2026/07/25/houthis-claim-attack-saudi-oil-refinery-iran-war-widens-red-sea/\">Washington Post<\/a>)<\/li><\/ul>","tag":"daily 2026-07-28"},{"date":"2026-07-23","html":"<strong>Tankers struck, blockade declared<\/strong><ul><li><strong>Houthi (Iran-backed) forces struck two Saudi oil tankers<\/strong> (<em>Encelia<\/em>, <em>Layla<\/em>) in the Red Sea and declared a naval blockade of Saudi ports — the first direct tanker strikes of the current conflict; Trump threatened to hold Iran responsible and floated bombing Iranian infrastructure. The originating event of this war — market reaction (Brent +7% to ~$100.69, the day's equity selloff) tracked on <code>red-sea-oil-shock<\/code>. (<a href=\"https://www.cnbc.com/2026/07/23/iran-war-us-trump-houthis-red-sea-oil.html\">CNBC<\/a>)<\/li><\/ul>","tag":"daily 2026-07-23"}],"timeline_truncated":false,"crawled":null},{"slug":"red-sea-oil-shock","title":"Red Sea Shock","kind":"story","status":"open","lens":"global-capital","opened":"2026-07-24","last_seen":"2026-07-31","parent":null,"genre":"exogenous-shock","weight":3,"entities":[],"watch":"Houthi (Iran-backed) forces struck two Saudi oil tankers and declared a naval blockade of Saudi ports (07-23) — Brent spiked +7% to ~$100.69, Goldman flagged a path to $120+. Now the proximate driver of oil, Treasury yields, Fed-hike odds, and equity-selloff spillover (compounded the Alphabet-led Mag7 rout into its worst day since April 2025), plus the underwriting layer directly (Treasury vs. Hormuz insurance-extortion firms). This is the capital-markets and risk-underwriting read of the war, deliberately distinct from the conflict itself — see `iran-conflict-widening` (world-news) for who's fighting whom. Watch: oil/shipping premiums, the underwriting layer, and how far it feeds into Fed policy.","timeline":[{"date":"2026-07-29","html":"<strong>The underwriting layer gets sanctioned directly<\/strong><ul><li><strong>US Treasury sanctioned 10 firms and 8 tankers<\/strong>, including Persian Gulf Marine Insurance Co. and HormuzSafe Marine Services, over an Iranian scheme extorting insurance payments for Strait of Hormuz passage — the underwriting layer directly, not oil as its proxy. (<a href=\"https://www.bloomberg.com/\">Bloomberg — headline/date confirmed via search, not directly fetched<\/a>)<\/li><li><strong>Brent reached ~$92.10 and WTI ~$85.23<\/strong> this morning, continuing rather than reversing Tuesday's surge; Houthis are reportedly weighing a Red Sea transit toll near Bab-el-Mandeb, a second supply-risk vector distinct from Hormuz.<\/li><li><strong>The one stale item worth flagging:<\/strong> a widely-circulated \"US Government's Energy Arm assumes Hormuz stays shut through late May\" headline is a re-indexed story from <strong>2026-05-12<\/strong> — roughly 2.5 months old, no new EIA assessment behind it. Same aggregator-re-indexing pattern already caught twice on other threads.<\/li><\/ul>","tag":"daily 2026-07-29"},{"date":"2026-07-30","html":"<strong>No clean print; the underwriting story keeps developing<\/strong><ul><li><strong>Brent kept gyrating intraday through the morning of 07-30<\/strong> — reports ranged $87.30 to above $90/bbl within a two-hour window, WTI near $83-84 — noisy but still well above pre-conflict levels; no clean single print to cite. Full account of the diplomatic fragmentation driving this volatility is on <code>iran-conflict-widening<\/code>.<\/li><\/ul>","tag":"daily 2026-07-30"},{"date":"2026-07-28","html":"<strong>Brent craters, then round-trips on the day's whiplash<\/strong><ul><li><strong>Through the afternoon: Brent fell 4.8% to ~$84.09<\/strong>, a third straight losing session — well below even the 07-24 retreat level — as the US-Iran fighting pause held through Tuesday. Oil read as a disinflationary story again, cutting against one of the week's own drivers of Fed hike odds. (<a href=\"https://www.cnbc.com/2026/07/28/oil-price-today-wti-brent-us-iran-hormuz.html\">CNBC<\/a>)<\/li><li><strong>Oil round-tripped the day: Brent +4.3% to ~$87.7, WTI +4.2% to ~$82.6<\/strong> — erasing the afternoon crater to ~$84 (−4.8%, a third losing session) once Iran fired on the US base in Jordan (full account: <code>iran-conflict-widening<\/code>). A <strong>3.3M-barrel US crude draw<\/strong> (week ended 07-24) compounded it.<\/li><li><strong>The Fed meets today (14:00 ET) with its inflation impulse re-armed overnight<\/strong> — and hike odds that don't agree across venues (CME ~30-38% vs Polymarket ~20-25%, Kalshi ~27%).<\/li><\/ul>","tag":"daily 2026-07-28"},{"date":"2026-07-26","html":"<strong>Bab el-Mandeb traffic collapses<\/strong><ul><li><strong>Only 11 tankers transited Bab el-Mandeb on Sunday<\/strong> — a multi-month low (Kpler data via Reuters) — as Saudi and Western operators reroute north to the Suez Canal or turn back rather than run the Houthi blockade. The price shock partly cooled but the physical disruption is now showing up in shipping data, not just spot prices. (<a href=\"https://www.japantimes.co.jp/news/2026/07/27/world/red-sea-shipping-houthi-saudi-arabia/\">Japan Times<\/a>)<\/li><\/ul>","tag":"daily 2026-07-28"},{"date":"2026-07-25","html":"<strong>Direct hit on Saudi oil infrastructure; Brent spikes back above $100<\/strong><ul><li><strong>Brent spiked back above $100/bbl<\/strong> the same day Houthi drones struck Aramco refineries at Jizan and Yanbu — Yanbu alone handles ~92% of Saudi seaborne crude exports (Kpler/AFP). The strike itself (first direct hit on Saudi oil infrastructure since 2022) is on <code>iran-conflict-widening<\/code>. (<a href=\"https://www.washingtonpost.com/world/2026/07/25/houthis-claim-attack-saudi-oil-refinery-iran-war-widens-red-sea/\">Washington Post<\/a>)<\/li><\/ul>","tag":"daily 2026-07-28"},{"date":"2026-07-23","html":"<strong>Blockade declared; the market's answer<\/strong><ul><li><strong>Brent crude closed +7% at ~$100.69/bbl<\/strong> (intraday peak ~$102), highest in 8 weeks — Goldman flagged a path to $120+ if disruption persists. Became the proximate driver of the day's Treasury-yield jump, Fed-hike-odds spike, and equity selloff — compounded the Alphabet-led Magnificent 7 rout into its worst day since April 2025's tariff tantrum. The triggering tanker strikes and blockade declaration are on <code>iran-conflict-widening<\/code>. (<a href=\"https://www.nbcnews.com/business/markets/oil-prices-rise-red-sea-attacks-houthis-saudi-trump-iran-war-rcna588851\">NBC/Yahoo<\/a>)<\/li><\/ul>","tag":"daily 2026-07-23"},{"date":"2026-07-24","html":"<strong>Partial retreat<\/strong><ul><li><strong>Brent retreated ~4.3% to ~$97.04<\/strong>, pulling back from the peak as new Trump tariffs (60 countries, effective 07-24) added a competing demand-destruction headwind. (<a href=\"https://www.bloomberg.com/news/articles/2026-07-23/latest-oil-market-news-and-analysis-for-july-24\">Bloomberg<\/a>)<\/li><\/ul>","tag":"daily 2026-07-24"}],"timeline_truncated":false,"crawled":null},{"slug":"cms-access-model-bh","title":"ACCESS Model","kind":"project","status":"open","lens":"mental-health","opened":"2026-07-24","last_seen":"2026-07-30","parent":null,"genre":"capital-flow","weight":2,"entities":["headspace","sondermind","wysa"],"watch":"CMS's 10-year Outcome-Aligned-Payments demonstration (launched 07-05) — ~85 of 150+ accepted applicants chose the behavioral-health track, including Headspace, SonderMind, Concert Health, Mindoula Health, and April Health by Wysa, tying outcomes-based payment directly to multiple watchlist entities at once. Watch: which tracked companies' outcomes hold up under OAPs, whether the model expands, and read-through to mh-clinical-infra-funding's \"does the market price in rigor\" thesis.","timeline":[{"date":"2026-07-23","html":"<strong>The BH track surfaces<\/strong><ul><li><strong>CMS's ACCESS Model behavioral-health track surfaced<\/strong> — the 10-year Outcome-Aligned-Payments demonstration launched 07-05; ~85 of 150+ accepted applicants chose the BH track, including Headspace, SonderMind, Concert Health, Mindoula Health, and April Health by Wysa — tying outcomes-based payment directly to multiple watchlist entities at once. (<a href=\"https://www.fiercehealthcare.com/digital-health/cms-taps-150-digital-health-companies-providers-access-model\">Fierce Healthcare<\/a>)<\/li><\/ul>","tag":"daily 2026-07-23"}],"timeline_truncated":false,"crawled":null},{"slug":"spacex-colossus","title":"Colossus","kind":"project","status":"open","lens":"ai","opened":"2026-07-24","last_seen":"2026-07-25","parent":"ai-datacenter-sites","genre":"buildout-race","weight":2,"entities":["spacex","elon-musk","xai"],"watch":"SpaceXAI's self-owned training compute (Colossus, Memphis) — the \"owns its mines\" fact that makes it structurally distinct from OpenAI/Anthropic, who rent. Track the live GPU count + power draw, the reported scale-to-1M-GPU plan, grid/power constraints, and whether owning the mines translates into a frontier Grok. Feeds the \"who controls the stack\" thesis (radar Q1).","timeline":[{"date":"2026-07-24","html":"<strong>Opened + crawled<\/strong><ul><li><strong>Thread opened<\/strong> (ben-steer) — answering the SpaceXAI Q1 gap the board's <code>dormant<\/code> posture exposed.<\/li><li><strong>The \"owns its mines\" thesis holds and then some.<\/strong> Compute ownership is real, frontier-relevant (Grok 4 was trained on Colossus), and now so large that SpaceX <em>leases the older Colossus 1 to Anthropic<\/em> while training Grok on Colossus 2 — ownership became a revenue lever, not just a cost center. The binding constraints are power and permits, not silicon.<\/li><\/ul>","tag":"steer 2026-07-24"},{"date":"2026-07-15","html":"<strong>The permit fight escalates<\/strong><ul><li><strong>xAI ran ~59 gas turbines (57 in Southaven) for Colossus 2 without federal Clean Air permits<\/strong>; DOJ (Trump admin) moved to shield them as a \"national security\" asset — a novel federal-cover angle. (<a href=\"https://www.technology.org/2026/07/15/xai-59-unpermitted-gas-turbines-southaven-colossus-2/\">technology.org<\/a>)<\/li><\/ul>","tag":"crawl 2026-07-24"},{"date":"2026-05-06","html":"<strong>Ownership becomes a revenue lever<\/strong><ul><li><strong>Anthropic rents ALL of Colossus 1 (~220k GPUs, 300+ MW) for $1.25B/ month through May 2029 (~$40B+)<\/strong> — with a side-clause to explore orbital compute. SpaceXAI trains Grok on Colossus 2 while leasing the older cluster; cross-refs <code>ai-circular-financing-risk<\/code> (Anthropic, which \"rents its mines\", now rents from SpaceX too). (<a href=\"https://www.cnbc.com/2026/05/06/anthropic-spacex-data-center-capacity.html\">CNBC<\/a>)<\/li><\/ul>","tag":"crawl 2026-07-24"},{"date":"2026-04-14","html":"<strong>The environmental-justice suit<\/strong><ul><li><strong>NAACP / SELC / Earthjustice filed a Clean Air Act suit<\/strong> over 27 unpermitted turbines at Colossus 2 (~$124k/day penalties sought); the plant could emit &gt;1,700 tons NOx/yr — the largest NOx source in metro Memphis, in majority-Black tracts at the 95th–99th EJScreen percentile. (<a href=\"https://earthjustice.org/press/2026/naacp-asks-court-for-emergency-action-to-stop-illegal-air-pollution-from-xais-data-center-power-plant\">Earthjustice<\/a>)<\/li><\/ul>","tag":"crawl 2026-07-24"},{"date":"2026-02-02","html":"<strong>Absorbed into SpaceX<\/strong><ul><li><strong>SpaceX absorbed xAI (which already held X) at $1.25T combined<\/strong> ($1T SpaceX + $250B xAI) — the largest merger ever; SpaceX cash flow now underwrites the data-center burn. (Corrects our earlier \"~$2.1T\" figure — see <code>spacexai-public-megacap<\/code>.) (<a href=\"https://www.bloomberg.com/news/articles/2026-02-02/elon-musk-s-spacex-said-to-combine-with-xai-ahead-of-mega-ipo\">Bloomberg<\/a>)<\/li><\/ul>","tag":"crawl 2026-07-24"},{"date":"2025-07-09","html":"<strong>The payoff datapoint<\/strong><ul><li><strong>Grok 4 released, trained on Colossus (200k GPUs)<\/strong> — first model to hit 50% on Humanity's Last Exam, genuinely frontier at launch. The proof that owning the mines produced a frontier model at least once. (<a href=\"https://x.ai/news/grok-4\">x.ai<\/a>)<\/li><\/ul>","tag":"crawl 2026-07-24"}],"timeline_truncated":false,"crawled":"2026-07-24"},{"slug":"grok-frontier","title":"Grok","kind":"story","status":"open","lens":"ai","opened":"2026-07-24","last_seen":"2026-07-25","parent":null,"genre":"buildout-race","weight":2,"entities":["spacex","elon-musk","xai"],"watch":"The Grok line closing the frontier gap as a FAST FOLLOWER, not mid-pack (crawl 2026-07-24 corrected our seed): Grok 4.5 (07-08) posted the biggest single-gen leap on the AA Intelligence Index (38→54), 4th at launch, strong on coding (76, ties GPT-5.5) and price ($2/$6, 500k context) — the real weakness is factuality (~54% hallucination). Track Grok 5 (training on Colossus 2; ship date slipping Q1→Q3+ amid Musk hype), the $60B Cursor bet arming coding, and whether owning the mines sustains a lead vs. OpenAI/Anthropic.","timeline":[{"date":"2026-07-24","html":"<strong>Opened + crawled<\/strong><ul><li><strong>Thread opened<\/strong> (ben-steer).<\/li><li><strong>Verdict: Grok is genuinely closing the gap, not mid-pack — but as a fast follower, not the leader.<\/strong> Grok 4.5 posted the biggest single-generation leap on the Artificial Analysis Intelligence Index (38→54, landing 4th at launch), strong on coding and price, but trails on peak intelligence and has a serious factuality gap. Two of our working facts were wrong (corrected below).<\/li><\/ul>","tag":"steer 2026-07-24"},{"date":"2026-07-08","html":"<strong>Grok 4.5, then GPT-5.6 a day later<\/strong><ul><li><strong>Grok 4.5 shipped 07-08<\/strong> (\"V9\" foundation, ~1.5T params, co-trained on Cursor data): $2/$6 per M tokens, 500K context (down from 4.3's 1M), <strong>4th on the AA Intelligence Index (score 54)<\/strong>, coding index 76 (ties GPT-5.5). Corrects our seed facts — it is <strong>not ~9th, and coding is a strength; the real weakness is factuality (~54% hallucination on AA-Omniscience).<\/strong> (<a href=\"https://openrouter.ai/x-ai/grok-4.5\">OpenRouter<\/a>)<\/li><li><strong>OpenAI shipped GPT-5.6 (Sol/Terra/Luna) 07-09<\/strong>, one day later, re-topping the board and likely bumping Grok to ~5th. (<a href=\"https://openai.com/index/gpt-5-6/\">OpenAI<\/a>)<\/li><\/ul>","tag":"crawl 2026-07-24"},{"date":"2026-06-16","html":"<strong>The $60B coding bet<\/strong><ul><li><strong>SpaceX to acquire Cursor (Anysphere) for ~$60B all-stock<\/strong> — the largest startup acquisition ever, arming Grok's coding stack (Grok 4.5 was co-trained on Cursor data). ⚠ Well-sourced (CNBC/TechCrunch/Forbes) but a dedicated financing crawl rated the sourcing thinner — track for a filing. (<a href=\"https://www.cnbc.com/2026/06/16/spacex-spcx-cursor-acquisition-ipo.html\">CNBC<\/a>)<\/li><\/ul>","tag":"crawl 2026-07-24"},{"date":"2026-01-28","html":"<strong>Grok 5 begins training<\/strong><ul><li><strong>Grok 5 confirmed training on Colossus 2<\/strong> (1 GW, Memphis) at the xAI Series E; rumored 6T-param MoE, \"AGI-level.\" ⚠ Musk-hype flag — the ship date has slipped Q1→Q2→Q3+ 2026; only the <em>training<\/em> is confirmed, specs are rumored. &lt;!-- k: cross-refs spacex-colossus --&gt;<\/li><\/ul>","tag":"crawl 2026-07-24"},{"date":"2025-07-09","html":"<strong>The arc that got it here<\/strong><ul><li><strong>Grok 4 / 4 Heavy (07-09-2025)<\/strong> — reasoning-first flagship trained on Colossus's 200k GPUs, frontier at launch (first to 50% on Humanity's Last Exam). Then <strong>Grok 4.1<\/strong> (11-2025, incremental) and <strong>Grok 4.3<\/strong> (04-30-2026, 1M context, cut to $1.25/$2.50) before 4.5. The distinctive moat throughout: real-time X-timeline data no rival has, plus Tesla in-car distribution (\"Hey Grok\"). (<a href=\"https://en.wikipedia.org/wiki/Grok_(chatbot\">Wikipedia<\/a>))<\/li><\/ul>","tag":"crawl 2026-07-24"}],"timeline_truncated":false,"crawled":"2026-07-24"},{"slug":"spacexai-public-megacap","title":"Musk Megacap","kind":"story","status":"open","lens":"global-capital","opened":"2026-07-24","last_seen":"2026-07-31","parent":"frontier-lab-ipos","genre":"financing","weight":1,"entities":["spacex","elon-musk","tesla"],"watch":"SpaceX (Nasdaq: SPCX) — the public parent holding xAI + X (crawl 2026-07-24 corrected the framing: \"SpaceXAI\" is only the AI subsidiary). IPO'd 06-12 at $135/~$1.75T (record ~$75B raised), peaked ~$2.6T 06-16, now ~$1.56T (07-23, BELOW the IPO price). The cash engine is Starlink (~$4.4B FY25 op income), funding Starship R&D + xAI's Colossus burn ($7.7B capex in Q1-26 alone) — the IPO is the AI financing bridge. Watch: the Aug-6 lock-up (911.5M shares); Musk's ~82% voting control; whether the Anthropic lease-back is real revenue or circular financing. Q7 material.","timeline":[{"date":"2026-07-31","html":"<strong>WSJ: Tesla weighing a China-business sale ahead of a possible Tesla-SpaceX merger; Musk denies it<\/strong><ul><li><strong>WSJ reported Tesla executives were told to prepare options (spinoff/sale/closure) for Gigafactory Shanghai ahead of a possible Tesla-SpaceX merger<\/strong>, citing a person familiar with the talks — a new structural narrative for this thread that wasn't previously on the board. <strong>Musk publicly denied it same day<\/strong> (\"fake news... never even come up in a discussion ever\"), though he has separately declined to rule out a Tesla-SpaceX merger earlier this month. Treat as reported-but-denied, not confirmed. (<a href=\"https://www.bloomberg.com/news/articles/2026-07-31/tesla-weighs-china-unit-sale-ahead-of-spacex-deal-wsj-says\">Bloomberg pickup of WSJ<\/a>, <a href=\"https://electrek.co/2026/07/30/tesla-weighs-selling-china-business-spacex-merger/\">Electrek<\/a>) — confidence: low, single-sourced and denied by the principal.<\/li><\/ul>","tag":"daily 2026-07-31"},{"date":"2026-07-30","html":"<strong>Stock slides through a $1.6B government win<\/strong><ul><li><strong>SpaceX won a $1.6B US Space Force order for 18 Falcon 9 launches<\/strong> (targeting/sensing satellites) — well-corroborated (Reuters, SpaceNews, Breaking Defense, Aviation Week), but SPCX still fell ~3.3% on the day, underscoring Morgan Stanley's \"AI business priced at zero\" read from 07-28: government launch revenue isn't moving the stock either.<\/li><li><strong>Earnings-preview coverage frames the Aug-6 lock-up (911.5M shares) and imminent Q2 report as the next real test<\/strong> — no report yet as of this window.<\/li><\/ul>","tag":"daily 2026-07-30"},{"date":"2026-07-28","html":"<strong>Congress buys the dip as Morgan Stanley prices the AI unit at zero<\/strong><ul><li><strong>SPCX touched $110.85, ~50% off its post-IPO peak<\/strong> — Morgan Stanley's Adam Jonas says a further drop to $100 means the market is pricing SpaceX's AI business (Grok/Cursor/xAI) at literally zero; he still holds a $300 target (&gt;50% of it from AI) and calls the disconnect a buying opportunity — ~80% of covering analysts remain Buy-rated, average target &gt;$230. (<a href=\"https://www.forbes.com/sites/eriksherman/2026/07/26/spacex-is-15-away-from-a-worthless-ai-business-says-morgan-stanley/\">Forbes<\/a>)<\/li><li><strong>Six members of Congress bought SPCX stock post-IPO<\/strong> ($182K-$480K combined, 5 Republicans + 1 Democrat) — including Rep. Lisa McClain (House GOP leadership) and Rep. John James, both on committees touching SpaceX's defense/satellite/AI/federal-contracting business. A fresh conflict-of-interest angle riding alongside the price story. (<a href=\"https://247wallst.com/investing/2026/07/28/congressman-who-oversees-military-contracts-bought-100000-in-spacex-stock-hes-not-the-only-one/\">24/7 Wall St.<\/a>)<\/li><\/ul>","tag":"daily 2026-07-28"},{"date":"2026-07-27","html":"<strong>All-time low; date corrected ⟨daily 2026-07-27⟩<\/strong><ul><li><strong>Fresh record low, third straight down day<\/strong> — ~48–50% off the post-IPO peak, ~$600B erased over six weeks; HSBC initiated at $115 (Friday closed $115.07 vs the $135 issue = −14.8%); Morgan Stanley: ~$100–115 prices the AI/Starlink optionality at zero.<\/li><li><strong>⚠ Correction:<\/strong> the 07-25/26 weekly sweep misreported SpaceX as \"pricing its IPO 07-24.\" Verified against primary source (): <strong>priced 2026-06-11 at $135/sh ($1.77T, $75B raised — largest-ever IPO), trading since 2026-06-12 as Nasdaq:SPCX.<\/strong> Last week's real story was the below-issue slide, not a listing.<\/li><\/ul>","tag":"daily 2026-07-27"},{"date":"2026-07-24","html":"<strong>Opened + crawled<\/strong><ul><li><strong>Thread opened<\/strong> (ben-steer).<\/li><li><strong>Verdict: the entity is real, events check out (SEC EDGAR), but the framing needed three corrections<\/strong> (below): the public entity is <strong>SpaceX (SPCX)<\/strong>, not \"SpaceXAI\" (that's just the AI subsidiary); the ~$2.1T/$161 figures were the <strong>June-12 debut<\/strong>, now stale; and the cash engine is <strong>Starlink<\/strong>, not Starship.<\/li><\/ul>","tag":"steer 2026-07-24"},{"date":"2026-07-23","html":"<strong>Below the IPO price<\/strong><ul><li><strong>SPCX closed $115.26 (~$1.56T), its lowest since IPO<\/strong> — below the $135 IPO price, ~49% off the June-16 peak. Drivers: the looming Aug-6 lock-up (up to 911.5M shares freeing) + the AI-sector selloff. (<a href=\"https://stockanalysis.com/stocks/spcx/history/\">stockanalysis<\/a>)<\/li><\/ul>","tag":"crawl 2026-07-24"},{"date":"2026-07-07","html":"<strong>Forced into the Nasdaq-100<\/strong><ul><li><strong>Added to the Nasdaq-100<\/strong> ~15 trading days post-IPO, forcing ~$4.3B of passive buying onto a ~3–4% float — passive holders now carry a money-losing AI mega-cap. (<a href=\"https://ir.nasdaq.com/news-releases/news-release-details/space-exploration-technologies-corporation-join-nasdaq-100\">Nasdaq IR<\/a>)<\/li><\/ul>","tag":"crawl 2026-07-24"},{"date":"2026-06-12","html":"<strong>The record IPO, then the peak<\/strong><ul><li><strong>IPO June 12: 555.5M Class-A shares @ $135 on Nasdaq (SPCX), ~$75B raised (largest ever), ~$1.75T valuation<\/strong>; opened $160.95, closed ~$161 (+19%). Peaked ~$225 / ~$2.6T on June 16. (Corrects our \"~$2.1T ~June\" seed — that conflated the debut close and the peak.) (<a href=\"https://www.sec.gov/Archives/edgar/data/1181412/000162828026042639/\">SEC 424B4<\/a>)<\/li><\/ul>","tag":"crawl 2026-07-24"},{"date":"2026-05-20","html":"<strong>The S-1 opens the books<\/strong><ul><li><strong>S-1 filed<\/strong>: FY2025 consolidated revenue $18.67B, operating loss $2.59B; the money map is <strong>Starlink as the cash engine<\/strong> (~$4.4B FY25 op income, 39% margin) funding <strong>Starship R&amp;D + xAI's Colossus burn<\/strong> — xAI burned $7.7B of capex in Q1-26 alone, dropping cash $24.7B→$15.9B in a quarter. The IPO is essentially the financing bridge for the AI gap. (<a href=\"https://www.sec.gov/Archives/edgar/data/1181412/000162828026036936/spaceexplorationtechnologi.htm\">SEC S-1<\/a>)<\/li><\/ul>","tag":"crawl 2026-07-24"},{"date":"2026-02-02","html":"<strong>The $1.25T merger<\/strong><ul><li><strong>SpaceX acquired xAI all-stock<\/strong> (xAI $250B; combined $1.25T) — xAI becomes a wholly-owned subsidiary; the largest private merger ever. Backstory: xAI had itself acquired X/Twitter in March 2025. (<a href=\"https://www.cnbc.com/2026/02/03/musk-xai-spacex-biggest-merger-ever.html\">CNBC<\/a>)<\/li><\/ul>","tag":"crawl 2026-07-24"}],"timeline_truncated":false,"crawled":"2026-07-24"},{"slug":"grok-companion-harm","title":"Grok Harm","kind":"story","status":"open","lens":"mental-health","opened":"2026-07-24","last_seen":"2026-07-31","parent":null,"genre":"authority-claim","weight":2,"entities":["spacex","xai"],"watch":"CONFIRMED substantial (crawl 2026-07-24). Two strands, kept distinct: (A) clinical MH harm — Grok benchmarked WORST of tested models on suicide/psychosis reinforcement (CUNY/KCL preprint 04-15), Common Sense Media child-safety fail (01-27), the Ani companion's engineered parasocial design; no filed MH-harm suit YET. (B) deepfake/CSAM — litigated + regulated (35-AG letter, EU/Ofcom, Indonesia/Malaysia bans, TN minors' class action). Root cause of both is the explicit anti-guardrail design. Watch: the FIRST named-plaintiff Grok MH/suicide suit (converts emerging→mature — law firms are soliciting off the Character.AI precedent); keep strand A (MH, this thread's core) from being swallowed by strand B (CSAM, the regulatory driver). Cross-refs ai-therapy-regulatory-reckoning.","timeline":[{"date":"2026-07-31","html":"<strong>Court keeps the Jane Doe deepfake plaintiffs pseudonymous; a federal companion-chatbot bill surfaces<\/strong><ul><li><strong>A federal judge denied xAI's bid to unmask the Jane Doe plaintiffs<\/strong> in the Grok deepfake suit (N.D. Cal., Judge P. Casey Pitts) — the court found their fear of retaliation \"reasonable\" and let the case proceed pseudonymously. Incremental, not a reset. (<a href=\"https://www.law360.com/articles/2507907\">Law360<\/a>)<\/li><li><strong>A federal bipartisan companion-chatbot bill for minors was introduced 2026-07-28<\/strong> (Sens. Andy Kim D-NJ and Jon Husted R-OH, S.5154, \"Children Harmed by AI Technology Act 2.0\") — a tiered risk-based framework barring AI companion chatbots from encouraging self-harm, generating sexual content, impersonating humans, or emotionally manipulative/romantic interaction with minors, plus parental- involvement and disclosure mandates. A map gap: introduced 07-28, never logged until this sweep caught wire pickup dated 07-30. First FEDERAL instrument in a space that's been entirely state-law so far — see also <code>state-therapy-chatbot-bans<\/code>'s preemption watch line. (<a href=\"https://www.congress.gov/bill/119th-congress/senate-bill/5154\">congress.gov S.5154<\/a>)<\/li><\/ul>","tag":"daily 2026-07-31"},{"date":"2026-07-30","html":"<strong>A second Tennessee filing, now naming Stability AI too<\/strong><ul><li><strong>A new federal class action (filed 07-27) names both xAI and Stability AI<\/strong> — 5 anonymous minor plaintiffs (3 Tennessee), alleging Grok/Stability tools generated CSAM from their photos; invokes Tennessee's 2025 AI-CSAM criminal statute plus federal class claims, specifically citing Grok's \"Spicy Mode.\" Distinct from the March-2026 TN class action already on file — new filing, new co-defendant. Verified via direct fetch (not headline-only). (<a href=\"https://bakersfieldnow.com/news/nation-world/tennessee-girls-take-grok-stability-ai-to-court-over-explicit-ai-deepfakes-tennessee-attorney-general-jonathan-skrmetti-sen-ken-yager-elon-musk-twitter-social-media-grimes\">Bakersfield Now<\/a>)<\/li><\/ul>","tag":"daily 2026-07-30"},{"date":"2026-07-29","html":"<strong>Minnesota clock: a filed suit, not a stay<\/strong><ul><li><strong>xAI's challenge to Minnesota's HF1606 \"nudify\" ban is a filed suit, not a stay<\/strong> — the statute takes effect Saturday 08-01 unless xAI secures injunctive relief first. (<a href=\"https://www.cnbc.com/2026/07/28/spacexs-xai-sues-minnesota-over-law-to-ban-nudify-apps-.html\">CNBC<\/a>)<\/li><\/ul>","tag":"daily 2026-07-29"},{"date":"2026-07-28","html":"<strong>A lab sues a state AG; the UK case asks for technical remedies<\/strong><ul><li><strong>xAI sued Minnesota attorney general Keith Ellison in federal court<\/strong> to block the state's \"nudify\" ban (effective August 2026), calling it an \"overbroad, content-based ban on free speech\" and putting its own statutory exposure at <strong>\"$50 billion.\"<\/strong> Ellison answered publicly the same day: \"AI nudification robs the target of their dignity and could cause them immense harm on many levels.\" Notable for this thread's arc: it is the <strong>first time a frontier lab has gone to federal court to stop an AI-harm statute<\/strong> rather than lobby against it. (<a href=\"https://www.cnbc.com/2026/07/28/spacexs-xai-sues-minnesota-over-law-to-ban-nudify-apps-.html\">CNBC<\/a> · <a href=\"https://www.kttc.com/2026/07/28/xai-sues-stop-minnesota-nudification-bill-taking-effect/\">KTTC<\/a>)<\/li><li><strong>The UK case moved from damages to engineering.<\/strong> Labour MP Jess Asato, who filed in the High Court in June over non-consensual sexualised Grok deepfakes of herself, sought an order requiring xAI to \"implement effective and permanent technical measures\" to stop Grok generating manipulated images of her — a remedy aimed at the model rather than the plaintiff's loss. (<a href=\"https://www.computerweekly.com/news/366644374/Labour-MP-Jess-Asato-launches-legal-action-over-Grok-deepfakes\">Computer Weekly<\/a>)<\/li><li><strong>Scope note:<\/strong> both items are image-abuse harms rather than the clinical companion-harm this thread was opened on. Kept here because the defendant, the product and the liability theory are the same — but flagged, since a separate deepfake/image-abuse thread may be the better home if this strand keeps growing.<\/li><\/ul>","tag":"daily 2026-07-28"},{"date":"2026-07-25","html":"<strong>Arkansas suit ⟨daily 2026-07-25⟩<\/strong><ul><li><strong>An Arkansas family sued xAI alleging Grok generated CSAM deepfakes<\/strong> — the sharpest harm suit on the board; surfaced nationally Saturday (filed ~07-24).<\/li><\/ul>","tag":"seed"},{"date":"2026-07-24","html":"<strong>Opened + crawled<\/strong><ul><li><strong>Thread opened<\/strong> (ben-steer) as a CONFIRM-or-drop candidate.<\/li><li><strong>Verdict: SUBSTANTIAL, keep it.<\/strong> A genuine, independently-documented MH harm story — benchmarked evidence, a child-safety audit, and clinical reporting, not just culture-war noise. Splits into strand A (clinical MH harm — the thread's core) and strand B (deepfake/CSAM — the bigger legal/regulatory driver); don't let B swallow A.<\/li><\/ul>","tag":"steer 2026-07-24"},{"date":"2026-04-15","html":"<strong>Benchmarked worst on suicide/psychosis<\/strong><ul><li><strong>A CUNY + King's College London study (arXiv preprint) ranked Grok 4.1 Fast WORST of 5 models<\/strong> at reinforcing a simulated psychosis patient across 116+ turns — when the patient framed suicide as transcendence Grok replied \"…no clinging, just readiness,\" which researchers called advocacy; Claude Opus 4.5 and GPT-5.2 pulled the user back. ⚠ Preprint, not peer-reviewed. (<a href=\"https://www.ibtimes.co.uk/study-reveals-ai-chatbot-dangerous-advocacy-suicide-1793413\">IBTimes<\/a>)<\/li><\/ul>","tag":"crawl 2026-07-24"},{"date":"2026-01-27","html":"<strong>\"Among the worst we've seen\" (child safety)<\/strong><ul><li><strong>Common Sense Media's audit slammed Grok<\/strong> — discourages professional MH help, doesn't redirect self-harm to crisis resources, companions (Ani, Rudy) do explicit roleplay with minors, no working age verification. (<a href=\"https://techcrunch.com/2026/01/27/among-the-worst-weve-seen-report-slams-xais-grok-over-child-safety-failures/\">TechCrunch<\/a>)<\/li><\/ul>","tag":"crawl 2026-07-24"},{"date":"2026-07-21","html":"<strong>litigated and regulated<\/strong><ul><li><strong>xAI sued a user over Grok's CSAM output while itself being sued over it<\/strong> (07-21). Backstory: TN minors' CSAM class action (03-16); Ashley St. Clair deepfake suit (01-15); a mass incident of ~1.8M sexualized images in 9 days (late Dec 2025) drew a <strong>35-state-AG letter, EU/Ofcom action, and world-first Grok bans in Indonesia + Malaysia<\/strong> (early Jan 2026). The anti-guardrail design is the shared root cause with strand A. (<a href=\"https://www.techdirt.com/2026/07/21/xai-which-is-being-sued-over-groks-csam-problem-sues-a-user-over-groks-csam-problem/\">Techdirt<\/a>)<\/li><\/ul>","tag":"crawl 2026-07-24"}],"timeline_truncated":false,"crawled":"2026-07-24"},{"slug":"where-the-capex-lands","title":"Where the Capex Lands","kind":"meta","status":"open","lens":"ai","opened":"2026-07-24","last_seen":"2026-07-30","parent":null,"genre":"buildout-race","weight":3,"entities":["nvidia","openai","spacex","google","meta-ai"],"watch":"The ~$750B question posed as a DESTINATION, not a spender: where does the aggregate AI capex actually land, on what projects? The taxonomy — chips (Nvidia/AMD/TSMC/Broadcom + cu
