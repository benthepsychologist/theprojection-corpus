stom silicon like Jalapeño), datacenters (Stargate, Camellia, Colossus + the 100s of sites), power (gas turbines, nuclear-for-AI, grid), land/cooling/water. Sibling to hyperscaler-capex-big-picture, which cuts the SAME money by spender; this one follows it to where it physically lands. Most destinations have no thread yet — that's the worklist.","timeline":[{"date":"2026-07-24","html":"<strong>Opened (meta-thread)<\/strong><ul><li><strong>Opened as the destination cut of AI capex<\/strong> (ben-steer) — gathers the clear destination-projects (Stargate, Colossus, Jalapeño) and frames the gaps (the chip-spend itself, power/nuclear-for-AI deals, the specific sites) as the collection worklist.<\/li><\/ul>","tag":"steer 2026-07-24"}],"timeline_truncated":false,"crawled":null},{"slug":"ai-compute-spend","title":"Compute Spend","kind":"meta","status":"open","lens":"ai","opened":"2026-07-24","last_seen":null,"parent":"where-the-capex-lands","genre":"resource-move","weight":3,"entities":["nvidia","google","amazon-aws","microsoft","openai"],"watch":"Where the capex lands in SILICON — the $ flowing to Nvidia/AMD/TSMC/ Broadcom, plus the custom-silicon revolt (Jalapeño, Trainium, Maia, TPU) as the giants try to stop renting from Nvidia. Category meta under where-the-capex-lands.","timeline":[{"date":"2026-07-30","html":"<strong>Samsung's earnings put a number on the memory side of the silicon spend<\/strong><ul><li><strong>Samsung posted record Q2 chip-division profit<\/strong> (~250x YoY per multiple outlets), driven by AI-linked HBM/DRAM shortage pricing — the clearest fresh data point on where AI silicon dollars land outside the GPU line itself. ([CNBC] · [WSJ])<\/li><li><strong>Samsung locked ~70% of memory output into long-term deals with \"5 major Big Tech firms\"<\/strong> (unnamed) and sees the shortage extending to 2028 — direct evidence of hyperscalers contracting AI memory supply years out. ([finance.biggo.com])<\/li><\/ul>","tag":"daily 2026-07-30"},{"date":"2026-07-27","html":"<strong>The silicon split: undisclosed at all four ⟨crawl 2026-07-27⟩<\/strong><ul><li><strong>The industry's common non-disclosure:<\/strong> none of Google / Microsoft / Amazon / Meta publishes its own-chip vs Nvidia dollar or unit split — confirmed independently by all four capex crawls.<\/li><li>Own-silicon state: Google TPU v7 \"Ironwood\" (+8t/8i next-gen) · Microsoft Maia 200 (dual-purpose: OpenAI inference + MAI training) · Amazon 1.4M Trainium deployed, T3 claims ~50% cost edge · Meta MTIA at \"millions\" of H100-equivalents (600K is stale), \"Iris\" to production Sept-26, Broadcom extended thru 2029.<\/li><li>Clearest external volume signals: Anthropic on 1M+ Google TPUs (&gt;1GW) AND 1M+ Trainium2 — the labs disclose what the hyperscalers won't.<\/li><\/ul>","tag":"seed"},{"date":"2026-07-24","html":"<strong>Opened<\/strong><ul><li><strong>Thread opened<\/strong> (ben-steer) — meta-thread — groups the child threads below.<\/li><\/ul>","tag":"steer 2026-07-24"}],"timeline_truncated":false,"crawled":null},{"slug":"ai-power-buildout","title":"Power Buildout","kind":"meta","status":"open","lens":"ai","opened":"2026-07-24","last_seen":null,"parent":"where-the-capex-lands","genre":"resource-move","weight":3,"entities":["spacex","microsoft","amazon-aws","oracle"],"watch":"Where the capex lands in POWER — the real bottleneck. Nuclear-for-AI (SMRs, Oklo/X-Energy), gas turbines (the Colossus permit fights), grid deals, and the energy-justice/permitting battles. Category meta under where-the-capex-lands.","timeline":[{"date":"2026-07-30","html":"<strong>Catch-up: a second Cold War DOE site becomes a $100B AI power build (event 07-28/29, missed at the time)<\/strong><ul><li><strong>NextEra and Brookfield will develop a $100B AI data-center campus at DOE's Paducah, KY site<\/strong> — a former Cold War uranium-enrichment plant — paired with 4.6GW of dedicated power generation. Announced via DOE's own release 07-29, corroborated same-day by Reuters/WSJ/FT/Bloomberg; this thread's most recent entry (07-27 crawl) doesn't have it. ([POWER Magazine])<\/li><li><strong>No hyperscaler/lab tenant named<\/strong> — unlike Stargate/Portsmouth (OpenAI), every account frames this as a NextEra/Brookfield-led speculative build. Open gap.<\/li><li>💡 <strong>Worth the curator's own eyes:<\/strong> this is a <em>second<\/em> former-DOE- nuclear-site-to-AI-campus conversion inside one week (after Portsmouth/Piketon, 10GW/OpenAI, flagged 07-28) — a possible pattern, not tagged <code>sev=<\/code> per the rarity discipline but flagged plainly.<\/li><\/ul>","tag":"daily 2026-07-30"},{"date":"2026-07-27","html":"<strong>The power book, four actors ⟨crawl 2026-07-27⟩<\/strong><ul><li><strong>Google:<\/strong> solar-dominant (TotalEnergies 1GW/28TWh · Clearway 1.17GW) + TVA/Kairos — the first US Gen-IV utility PPA (2030).<\/li><li><strong>Microsoft:<\/strong> TMI/Crane restart tracking 2027 (DOE $1B loan, NRC/FERC cleared) · Chevron Kilby $7B/2.7GW/20yr · ~40GW renewables claimed (secondary, unreconciled vs a 34GW figure).<\/li><li><strong>Amazon:<\/strong> Talen/Susquehanna 1.92GW firm 17-yr (~$18B, restructured to dodge the FERC kill) · X-Energy SMR option to 5GW-by-2039.<\/li><li><strong>Meta — the reversal:<\/strong> QUIT RE100, pivoting to a 7.5GW GAS buildout (07-23/24) even while holding a ≤6.6GW nuclear RFP (Oklo/TerraPower/ Vistra) + NextEra 2.3GW solar. The clean-power consensus broke first at Meta.<\/li><\/ul>","tag":"seed"},{"date":"2026-07-24","html":"<strong>Opened<\/strong><ul><li><strong>Thread opened<\/strong> (ben-steer) — meta-thread — groups the child threads below.<\/li><\/ul>","tag":"steer 2026-07-24"}],"timeline_truncated":false,"crawled":null},{"slug":"ai-datacenter-sites","title":"Datacenter Sites","kind":"meta","status":"open","lens":"ai","opened":"2026-07-24","last_seen":"2026-07-28","parent":"where-the-capex-lands","genre":"buildout-race","weight":3,"entities":["openai","spacex","softbank","oracle"],"watch":"Where the capex lands in CONCRETE — the specific gigawatt campuses. Stargate, Colossus, Camellia + the 100s of sites. Category meta under where-the-capex-lands; the specific-sites worklist lives here.","timeline":[{"date":"2026-07-30","html":"<strong>Catch-up: Paducah, KY joins the megasite map (event 07-28/29)<\/strong><ul><li><strong>A second former DOE Cold War nuclear site converts to an AI campus<\/strong> — Paducah, KY, $100B, NextEra + Brookfield, 4.6GW dedicated power — same pattern as Portsmouth/Piketon, OH (10GW, OpenAI/SB Energy, flagged 07-28), a second instance inside one week. No tenant named yet. ([WSJ])<\/li><li><strong>Missed at the time<\/strong> — broke 07-28 (HPCwire), went wide 07-29 (DOE PR Newswire, Reuters, Bloomberg, FT, WSJ); this thread's last entry (07-28) doesn't have it. Backfill, not new-today.<\/li><\/ul>","tag":"daily 2026-07-30"},{"date":"2026-07-28","html":"<strong>Datacentres get a threat model ⟨daily 2026-07-28⟩<\/strong><ul><li><strong>Satellite imagery corroborated Iranian strikes on two Amazon data centres in Bahrain<\/strong> — Zallaq and Askar — supporting IRGC claims released via Tasnim. Bloomberg reports significant damage at both. (<a href=\"https://www.bloomberg.com/news/articles/2026-07-28/amazon-data-centers-hit-in-iran-strikes-satellite-images-show\">Bloomberg<\/a>)<\/li><li><strong>⚠ Date discipline: the imagery is the 07-28 development, not the attack.<\/strong> The strikes were claimed around <strong>07-21<\/strong>; the campaign runs back to Shahed drone attacks on AWS sites in the <strong>UAE on 03-01<\/strong> and a further Bahrain strike on <strong>04-01<\/strong>. Iranian state media named Microsoft, Google, Apple, Meta, Oracle, Intel and Nvidia as targets on <strong>03-31<\/strong>. Reported here as corroboration of an older event.<\/li><li><strong>Why it belongs on this thread and not just the war thread:<\/strong> this timeline tracks where the capex physically lands — and siting has now acquired a variable it did not have. Commercial datacentres have been deliberately struck in wartime, with published damage assessment. Every megasite entry above (Portsmouth, Camellia, El Paso, the Gulf builds) carries an unpriced sovereign-risk term as a result.<\/li><li><strong>Caught by the collectors, not the cluster agents<\/strong> — the tier-2 sweeps were pointed at memory, macro and mental health, and missed it entirely. Logged as a recall note.<\/li><\/ul>","tag":"daily 2026-07-28"},{"date":"2026-07-28","html":"<strong>A fifth megasite enters the map: Ohio's 10GW Portsmouth campus<\/strong><ul><li><strong>OpenAI/SB Energy's planned 10GW Piketon, OH campus (the former Portsmouth uranium site) got a financing-backstop story<\/strong> — Nvidia weighing ~$250B toward the lease/construction, pushing total project cost toward $500B; full detail and sourcing in <code>stargate-buildout<\/code>. If it holds, this is the single largest site figure in this thread's tracker — bigger than any of the four hyperscalers' named individual sites.<\/li><\/ul>","tag":"daily 2026-07-28"},{"date":"2026-07-27","html":"<strong>The site map, four actors traced ⟨crawl 2026-07-27⟩<\/strong><ul><li><strong>Google:<\/strong> 15+ US states + India — MO $15B · MI 1GW \"Cannoli\" · TX Panhandle 1GW+ · NextEra ≥3 GW-scale campuses · India $15B Visakhapatnam (one outlet: 5GW, thin). A land-grab, not megasites.<\/li><li><strong>Microsoft:<\/strong> two named ~2GW builds — the WI+GA fiber-linked \"AI superfactory\" + Pecos TX (Chevron co-located). No company-wide GW total exists.<\/li><li><strong>Amazon:<\/strong> Rainier live (New Carlisle IN, 500K Trainium2, $26B) · MS $25B · PA $20B · NC $10B (07-20).<\/li><li><strong>Meta:<\/strong> Hyperion 5GW/$50B+ — <strong>80% sold to Blue Owl<\/strong> · El Paso $10B/1GW under live local pushback · Prometheus GW-figure unclear · the 3-month tent builds are real.<\/li><\/ul>","tag":"seed"},{"date":"2026-07-24","html":"<strong>Opened<\/strong><ul><li><strong>Thread opened<\/strong> (ben-steer) — meta-thread — groups the child threads below.<\/li><\/ul>","tag":"steer 2026-07-24"}],"timeline_truncated":false,"crawled":null},{"slug":"nvidia-order-book","title":"Nvidia's Order Book","kind":"story","status":"open","lens":"ai","opened":"2026-07-24","last_seen":"2026-07-26","parent":"ai-compute-spend","genre":"capital-flow","weight":2,"entities":["nvidia","openai","meta-ai"],"watch":"The demand side of the chip spend — a ~$1T Blackwell+Rubin book (a management aggregate, not audited backlog); the $100B OpenAI deal is dead, and the constraint has shifted to supply (HBM4). Watch the per- customer concentration and the circular-financing stakes (Nvidia's 10-Q investments in its own buyers).","timeline":[{"date":"2026-07-24","html":"<strong>Opened + crawled<\/strong><ul><li><strong>Thread opened<\/strong> (ben-steer).<\/li><li><strong>Verdict: the strongest demand book ever reported — ~$1T in Blackwell+ Rubin orders through 2027 — but it's Huang's own aggregate figure, not an audited backlog, and the flashiest pillar (the $100B OpenAI deal) COLLAPSED in early 2026.<\/strong> The binding constraint has shifted from demand to supply (an HBM4 drought). ⚠ WebSearch budget was exhausted (9-crawl fan-out) — built from targeted fetches; a few figures are soft.<\/li><\/ul>","tag":"steer 2026-07-24"},{"date":"2026-05-13","html":"<strong>First-ever $5.5T<\/strong><ul><li><strong>Nvidia hit $5.5T market cap<\/strong> — the first company ever — on news Huang would join Trump's China trip (~$5T as of late July). (<a href=\"https://www.forbes.com/sites/antoniopequenoiv/2026/05/13/nvidia-hits-record-55-trillion-value-first-company-to-ever-reach-mark/\">Forbes<\/a>)<\/li><\/ul>","tag":"crawl 2026-07-24"},{"date":"2026-04-09","html":"<strong>The constraint flips to supply<\/strong><ul><li><strong>A Rubin supply squeeze<\/strong> — HBM4 shortage pushed SK Hynix's ramp to Q3'26; TrendForce cut its 2026 Rubin shipment share 29%→22%. Demand isn't the bottleneck anymore; memory is. ⚠ reported (TrendForce). (<a href=\"https://www.sdxcentral.com/news/nvidias-rubin-gpus-hit-the-brakes-as-hbm4-memory-drought-threatens-jensens-supply-chain-magic-report/\">SDxCentral<\/a>)<\/li><\/ul>","tag":"crawl 2026-07-24"},{"date":"2026-03-16","html":"<strong>The $1T claim<\/strong><ul><li><strong>GTC: Huang says ~$1T in Blackwell+Rubin orders through 2027<\/strong> — up from the $500B-through-2026 figure a year prior. It's a demand/visibility number, NOT audited RPO/backlog — no public per-customer breakdown exists. (<a href=\"https://techcrunch.com/2026/03/16/jensen-just-put-nvidias-blackwell-and-vera-rubin-sales-projections-into-the-1-trillion-stratosphere/\">TechCrunch<\/a>)<\/li><\/ul>","tag":"crawl 2026-07-24"},{"date":"2026-03-04","html":"<strong>The $100B OpenAI deal dies<\/strong><ul><li><strong>The OpenAI–Nvidia $100B / 10GW partnership is dead<\/strong> — Huang confirms it's not proceeding (citing OpenAI's IPO plans); FT reported the abandonment in Feb. Corrects the circular-financing picture: Nvidia's actual OpenAI exposure is the ~$30B equity stake from the $110B round, not the $100B LOI. Cross-refs <code>ai-circular-financing-risk<\/code>. (<a href=\"https://gizmodo.com/the-100-billion-openai-nvidia-deal-is-not-happening-2000729749\">Gizmodo<\/a>)<\/li><\/ul>","tag":"crawl 2026-07-24"}],"timeline_truncated":false,"crawled":"2026-07-24"},{"slug":"inhouse-silicon","title":"In-House Silicon","kind":"story","status":"open","lens":"ai","opened":"2026-07-24","last_seen":"2026-07-25","parent":"ai-compute-spend","genre":"resource-move","weight":2,"entities":["google","amazon-aws","microsoft","meta-ai","openai","broadcom"],"watch":"The custom-silicon revolt (TPU/Trainium/Maia/MTIA) — real but INFERENCE- only, anchored by Anthropic running mostly off Nvidia on Trainium + TPU. Nvidia's absolute demand still grows; the clearest winners are the co- design houses (Broadcom, Marvell). Watch whether displacement reaches frontier training.","timeline":[{"date":"2026-07-27","html":"<strong>Four programs, one wall ⟨crawl 2026-07-27⟩<\/strong><ul><li>TPU v7 Ironwood (Broadcom/MediaTek/TSMC co-design) · Maia 200 (dual-purpose, volumes undisclosed) · Trainium 1.4M deployed · MTIA \"millions\" H100-eq, Iris Sept-26. All four decline to state the own-vs-Nvidia split — the wall every capex crawl hit.<\/li><\/ul>","tag":"seed"},{"date":"2026-07-24","html":"<strong>Opened + crawled<\/strong><ul><li><strong>Thread opened<\/strong> (ben-steer).<\/li><li><strong>Verdict: diversification at the margin and on inference, not a rout.<\/strong> The CUDA-vs-XLA software moat keeps Nvidia the default for anyone without a captive anchor customer; the \"in-house\" silicon is largely outsourced to Broadcom/Marvell. ⚠ WebSearch budget exhausted (fan-out) — primary-doc fetch path; Maia 200 + some codenames single-sourced, flagged.<\/li><\/ul>","tag":"steer 2026-07-24"}],"timeline_truncated":false,"crawled":"2026-07-24"},{"slug":"nuclear-for-ai","title":"Nuclear for AI","kind":"story","status":"open","lens":"ai","opened":"2026-07-24","last_seen":"2026-07-25","parent":"ai-power-buildout","genre":"resource-move","weight":2,"entities":["amazon-aws","microsoft","oracle"],"watch":"The nuclear-for-AI wave — but ~0 net-new MW power any AI datacenter before 2027, and the first firm power is a RESTART (TMI-1), not a new build. The ~13GW announced is <20% of projected demand; every genuinely new SMR/Gen-IV project is 2030s-weighted. Watch which actually clear licensing.","timeline":[{"date":"2026-07-27","html":"<strong>The nuclear book across the four ⟨crawl 2026-07-27⟩<\/strong><ul><li>Microsoft: TMI/Crane 2027 (DOE $1B, NRC draft + FERC cleared) · Amazon: Talen 1.92GW/17yr firm + X-Energy 5GW-by-2039 · Google: TVA/Kairos Gen-IV (2030) · Meta: RFP awards ≤6.6GW (Oklo/TerraPower/ Vistra) — but hedged with a 7.5GW gas pivot. Skeptical note: SMR timelines lag near-term demand (Bulletin, 07-20).<\/li><\/ul>","tag":"seed"},{"date":"2026-07-25","html":"<strong>First federal dollar ⟨daily 2026-07-25⟩<\/strong><ul><li><strong>DOE tapped Oklo/X-Energy for a $200M nuclear-for-AI push<\/strong>; aggregate nuclear deals signed by AI companies now ≈ 7M homes of power (07-26 figure). The thread's first real items since opening quiet.<\/li><\/ul>","tag":"seed"},{"date":"2026-07-24","html":"<strong>Opened + crawled<\/strong><ul><li><strong>Thread opened<\/strong> (ben-steer).<\/li><li><strong>Verdict: power is the binding constraint, and nuclear is a real but 2030s-weighted marathon.<\/strong> Carnegie (06-2026) pegs the ~13GW of announced hyperscaler nuclear at &lt;20% of projected datacenter demand through 2035; a single year of planned US solar (43GW) dwarfs the whole mid-2030s nuclear pipeline. The near-term \"firm\" adds are restarts/uprates that <em>re-label<\/em> existing MW, not new generation. ⚠ WebSearch budget exhausted (fan-out) — some 2026 items aggregator-only, flagged.<\/li><\/ul>","tag":"steer 2026-07-24"}],"timeline_truncated":false,"crawled":"2026-07-24"},{"slug":"datacenter-power-grid","title":"Grid & Turbines","kind":"story","status":"open","lens":"ai","opened":"2026-07-24","last_seen":"2026-07-25","parent":"ai-power-buildout","genre":"resource-move","weight":1,"entities":["spacex"],"watch":"The grid is the binding constraint (not chips) — interconnection queues exploding, hyperscalers self-supplying via gigawatt-scale gas, an equipment ceiling (turbines sold out to 2030, transformers ~3yr), and the ratepayer + environmental-justice fights. Watch the DOJ national- security shield over xAI's unpermitted turbines — the improvisation has outrun the regulatory system.","timeline":[{"date":"2026-07-24","html":"<strong>Opened + crawled<\/strong><ul><li><strong>Thread opened<\/strong> (ben-steer).<\/li><li><strong>Verdict: severe, worsening, multi-dimensional — power is the gating factor.<\/strong> The defining escalation is legal-political: the DOJ now invokes national security to keep unpermitted turbines running against a citizen Clean Air Act suit — the improvisation has outrun the regulatory system. ⚠ WebSearch budget exhausted (fan-out) — flagship + high-value claims re-verified via fetch; some figures RSS-only, flagged.<\/li><\/ul>","tag":"steer 2026-07-24"},{"date":"2026-06-16","html":"<strong>The DOJ national-security shield<\/strong><ul><li><strong>The Trump DOJ moved to dismiss the NAACP Clean Air Act suit on national-security grounds<\/strong> — arguing shutting the 57 unpermitted Southaven turbines threatens security because Grok \"supports Department of War operations\" (a DoD official called Grok \"paramount national security,\" citing the Iran strikes). Converts an environmental-permitting fight into a federal-power question. Cross-refs <code>spacex-colossus<\/code>. (<a href=\"https://www.nytimes.com/2026/06/16/climate/\">NYT<\/a>)<\/li><\/ul>","tag":"crawl 2026-07-24"}],"timeline_truncated":false,"crawled":"2026-07-24"},{"slug":"camellia","title":"Camellia","kind":"project","status":"open","lens":"ai","opened":"2026-07-24","last_seen":"2026-07-28","parent":"ai-datacenter-sites","genre":"buildout-race","weight":1,"entities":["openai"],"watch":"OpenAI-direct build (Octans GA LLC/Butler Snow — no named GC or Stargate-JV backer): Savannah Gateway Industrial Hub, Rincon, Effingham County GA; 3.2GW/25yr Georgia Power PPA phased 2028-2032; $20-30B cost unreconciled across outlets; pre-construction, DRI filed 07-24, Coastal Regional Commission review (≤30d) pending. DISTINCT from SoftBank's ~10GW Ohio (Portsmouth) campus. Track: the local secrecy backlash (10K+ petition), generation-mix disclosure, and whether a GC/financing partner surfaces.","timeline":[{"date":"2026-07-30","html":"<strong>Local press keeps digging into process and disclosure<\/strong><ul><li><strong>Effingham Herald: \"How OpenAI's Effingham Data Center Moved Forward Without Public Input\"<\/strong> — a process/accountability angle distinct from the secrecy-backlash coverage already on file.<\/li><li><strong>WTOC flagged a \"water warning gap\"<\/strong> raising fresh transparency questions, and separately reported on the deal's tax/financial \"discount\" terms — both go directly to this thread's blank generation-mix/disclosure watch item; headline-level only, body text not independently fetched.<\/li><\/ul>","tag":"daily 2026-07-30"},{"date":"2026-07-28","html":"<strong>Rincon meets on the plan ⟨daily 2026-07-28⟩<\/strong><ul><li><strong>The local-opposition track went live in person<\/strong> — WTOC: \"Coffee, concerns and 'Camellia'\" — Rincon residents met today on the OpenAI plan, capping a week of organizing coverage (WJCL 07-22, WTOC 07-24); directly on the watch line's \"local secrecy backlash\" item. Georgia Power's 25-yr PPA signing (07-23) also recirculated — already on file, not new. (WTOC 07-28, via cold-rotation sweep)<\/li><\/ul>","tag":"seed"},{"date":"2026-07-24","html":"<strong>Opened<\/strong><ul><li><strong>Thread opened<\/strong> (ben-steer) — opened; /crawl pending for backstory.<\/li><\/ul>","tag":"steer 2026-07-24"}],"timeline_truncated":false,"crawled":"2026-07-28"},{"slug":"bigtech-into-health","title":"Big Tech into Health","kind":"meta","status":"open","lens":"mental-health","opened":"2026-07-24","last_seen":"2026-07-28","parent":null,"genre":"partnership","weight":3,"entities":["microsoft","google","apple","amazon-aws","openai"],"watch":"The wave of the AI giants moving into health/MH — the cross-actor narrative Ben's lens most wants and had zero coverage of. Groups the per-giant health-arm threads below; watch which giant's health push is real vs. announced, and where MH specifically shows up.","timeline":[{"date":"2026-07-28","html":"<strong>OpenAI's health push goes institutional; a HIPAA gap flagged<\/strong><ul><li><strong>Sheba Medical Center (Israel) partnered with OpenAI on what multiple outlets independently headline as the first international ChatGPT-for-healthcare deployment<\/strong> — the first global, hospital-wide rollout of ChatGPT for Healthcare, giving physicians, nurses, researchers and operational staff access to models that synthesize peer-reviewed literature, clinical guidelines and internal protocols with verifiable citations. Moves the 07-23 GA consumer launch into actual institutional/enterprise healthcare delivery — the concrete \"is this push real\" answer this thread has been watching for. Confirmed via direct fetch of HIT Consultant + corroborated by MobiHealthNews and a press release. (<a href=\"https://hitconsultant.net/\">HIT Consultant<\/a>)<\/li><li><strong>A single, lower-reliability outlet claims ChatGPT Health carries no HIPAA coverage as of 2026<\/strong> — consistent with this thread's own evidence-gap framing (a health layer that walls off liability rather than becoming a regulated clinical product), but single-sourced — flag, not confirmed.<\/li><li><strong>One low-confidence report of a second entrant<\/strong> — Perplexity launching a health platform with Apple Health integration — single non-major outlet, worth a follow-up crawl before adding a sixth entity to this meta-thread's tracked list.<\/li><\/ul>","tag":"daily 2026-07-30"},{"date":"2026-07-23","html":"<strong>First real entry: OpenAI's health layer goes live, MH still absent<\/strong><ul><li><strong>OpenAI's ChatGPT Health went GA to all US users 18+<\/strong> (07-23), linking Apple Health data — the same week as a wave of suicide/ psychosis-reinforcement suits and a 42-state AG probe of the general model. Reads as the evidence-gap thesis in miniature: a frontier lab building a formal \"health\" layer precisely because unmanaged de-facto health use (&gt;1M/week suicidal-planning signals on the general model) is the liability. MH specifically is not a named feature of the launch — it walls off general physical-health tracking while the companion-chatbot harm keeps accruing on the same underlying model. Cross-refs <code>openai-health<\/code> and <code>ai-therapy-regulatory-reckoning<\/code> (where this was first logged 07-24 but not yet folded into this meta-thread). (<a href=\"https://techcrunch.com/2026/07/23/openai-makes-chatgpt-health-available-to-all-u-s-users/\">TechCrunch<\/a>)<\/li><\/ul>","tag":"daily 2026-07-28"},{"date":"2026-07-24","html":"<strong>Opened<\/strong><ul><li><strong>Thread opened<\/strong> (ben-steer) — meta-thread — groups the child threads below.<\/li><\/ul>","tag":"steer 2026-07-24"}],"timeline_truncated":false,"crawled":null},{"slug":"microsoft-health","title":"Microsoft Health","kind":"story","status":"open","lens":"mental-health","opened":"2026-07-24","last_seen":"2026-07-30","parent":"bigtech-into-health","genre":"partnership","weight":2,"entities":["microsoft"],"watch":"Large and fast, but somatic-first (Dragon Copilot, MAI-DxO, Copilot Health, a Mayo frontier model). MH is thin; the sharp signal is a tension — Suleyman is the loudest Big-Tech voice on chatbot 'AI psychosis' harm while shipping companions — and MH is conspicuously absent from the flagship products.","timeline":[{"date":"2026-07-24","html":"<strong>Opened + crawled<\/strong><ul><li><strong>Thread opened<\/strong> (ben-steer).<\/li><li><strong>Verdict: a genuine strategic pivot (health as the proof-point for AI self-sufficiency from OpenAI), but MH relevance is weak.<\/strong> The notable finding for the lens is the ABSENCE of a behavioral-health module in the marquee products (MAI-DxO, Copilot Health). ⚠ WebSearch budget exhausted (fan-out) — News-RSS + two Microsoft pages; scale numbers unverified.<\/li><\/ul>","tag":"steer 2026-07-24"},{"date":"2026-03-12","html":"<strong>Copilot Health (consumer) — but no MH<\/strong><ul><li><strong>\"Copilot Health\" launched<\/strong> — a consumer AI health assistant (upload records + wearable data for insights). Physical-medicine focused; no MH features/safeguards/partners surfaced — the gap worth watching. (<a href=\"https://fortune.com\">Fortune<\/a>)<\/li><\/ul>","tag":"crawl 2026-07-24"}],"timeline_truncated":false,"crawled":"2026-07-24"},{"slug":"google-health","title":"Google Health","kind":"story","status":"open","lens":"mental-health","opened":"2026-07-24","last_seen":"2026-07-30","parent":"bigtech-into-health","genre":"partnership","weight":2,"entities":["google"],"watch":"Google mid-pivot — Verily spun OUT to independence (not wound down); energy moved to AI (AMIE, a Gemini 'Google Health' coach, DeepMind bio models). Its MH footprint is mostly defensive (Gemini suicide/self-harm safeguards after wrongful-death suits); genuine behavioral-health capability is upstream in research, not shipped.","timeline":[{"date":"2026-07-24","html":"<strong>Opened + crawled<\/strong><ul><li><strong>Thread opened<\/strong> (ben-steer).<\/li><li><strong>Verdict: reshaping, not retreating — but direct MH product work is thin and mostly reactive.<\/strong> Google's biggest MH footprint right now is AI-safety-and-liability (Gemini guardrails after wrongful-death suits); genuine behavioral-health capability is still upstream in research (AMIE-style dialogue), not shipped. ⚠ WebSearch budget exhausted (fan-out) — built via News-RSS/Wikipedia fetch; lower-confidence dates approximate.<\/li><\/ul>","tag":"steer 2026-07-24"},{"date":"2026-04-07","html":"<strong>The MH-relevant move: Gemini safeguards<\/strong><ul><li><strong>Google added mental-health safeguards to Gemini after a wave of AI lawsuits<\/strong> — suicide/self-harm guardrails, one-tap crisis support, crisis-hotline integration (a ~$30M pledge cited by one outlet); driven by a 03-04 wrongful-death suit alleging Gemini \"coached\" a man toward suicide. The single most MH-relevant item. Cross-refs <code>ai-therapy-regulatory-reckoning<\/code>. (<a href=\"https://www.bloomberg.com\">Bloomberg<\/a>)<\/li><\/ul>","tag":"crawl 2026-07-24"},{"date":"2026-03-19","html":"<strong>Verily set loose<\/strong><ul><li><strong>Verily raised $300M and became independent<\/strong> — Alphabet dropped to a minority stake; refocused on \"precision health AI.\" A genuine spin-out, NOT a wind-down. (<a href=\"https://www.fiercehealthcare.com\">Fierce Healthcare<\/a>)<\/li><\/ul>","tag":"crawl 2026-07-24"}],"timeline_truncated":false,"crawled":"2026-07-24"},{"slug":"apple-health-arm","title":"Apple Health","kind":"story","status":"open","lens":"mental-health","opened":"2026-07-24","last_seen":"2026-07-30","parent":"bigtech-into-health","genre":"partnership","weight":2,"entities":["apple"],"watch":"Apple's AI coach ('Mulberry') keeps slipping — no AI, and no AI mental- health, coach ships in 2026. The only shipped MH feature is 2023's self- reported State of Mind; the load-bearing caution is that Apple markets 'wellbeing' on self-report/HRV proxies, not validated measurement. Third-party chatbots (ChatGPT/Perplexity) now eat the Apple Health data.","timeline":[{"date":"2026-07-24","html":"<strong>Opened + crawled<\/strong><ul><li><strong>Thread opened<\/strong> (ben-steer).<\/li><li><strong>Verdict: no AI health coach — and no AI mental-health coach — ships in 2026.<\/strong> The load-bearing caution for a clinical lens: Apple markets \"mental wellbeing\" while its mood/stress signals stay self-report or crude HRV proxies, not validated affective measurement. ⚠ WebSearch budget exhausted + GDELT throttled (fan-out) — sourced via 9to5Mac summarizing Bloomberg/Gurman.<\/li><\/ul>","tag":"steer 2026-07-24"}],"timeline_truncated":false,"crawled":"2026-07-24"},{"slug":"amazon-health","title":"Amazon Health","kind":"story","status":"open","lens":"mental-health","opened":"2026-07-24","last_seen":"2026-07-30","parent":"bigtech-into-health","genre":"partnership","weight":2,"entities":["amazon-aws"],"watch":"Amazon's push is primary-care + pharmacy + a Bedrock 'Health AI' agent layer; MH is adjacent, not headline. The MH-native move is UPSTREAM in AWS (HealthScribe's behavioral-health scribe, Netsmart-integrated) — Amazon as the documentation infrastructure the therapy industry runs on.","timeline":[{"date":"2026-07-24","html":"<strong>Opened + crawled<\/strong><ul><li><strong>Thread opened<\/strong> (ben-steer).<\/li><li><strong>Verdict: primary-care + pharmacy + AI-infra led; the MH angle is mostly adjacent.<\/strong> For a clinical-MH lens the thread to watch is AWS-as-behavioral-health-infrastructure (HealthScribe/Netsmart) — quieter but more structural than the consumer One Medical headlines. ⚠ WebSearch budget exhausted (fan-out) — fetched via DDG + primary press.<\/li><\/ul>","tag":"steer 2026-07-24"}],"timeline_truncated":false,"crawled":"2026-07-24"},{"slug":"openai-health","title":"OpenAI Health","kind":"story","status":"open","lens":"mental-health","opened":"2026-07-24","last_seen":"2026-07-30","parent":"bigtech-into-health","genre":"partnership","weight":2,"entities":["openai"],"watch":"OpenAI formalizing consumer health (ChatGPT Health went GA to all US 18+ on 07-23) exactly as its worst MH-harm litigation crystallizes (suicide/psychosis suits, a 42-state AG probe, Altman named personally). The open question: does a formal health layer RAISE the standard of care, or wall off 'health' while the general model keeps causing harm? Its own numbers — >1M/week showing suicidal-planning signals — are the liability.","timeline":[{"date":"2026-07-28","html":"<strong>The first hospital-wide deployment, with a suit pending<\/strong><ul><li><strong>Israel's Sheba Medical Center is rolling out ChatGPT for Healthcare across the whole institution<\/strong> — billed as the first global deployment at that scale — with citation-backed clinical reasoning and zero-data-retention terms. (<a href=\"https://hitconsultant.net/2026/07/28/sheba-medical-center-openai-chatgpt-for-healthcare-deployment/\">HIT Consultant<\/a>)<\/li><li><strong>The timing is the thread's whole tension in one week:<\/strong> ChatGPT Health went GA to all US adults on <strong>07-23<\/strong>; a suit seeking to pull GPT-4o and halt Health pending an independent safety review was filed <strong>07-22<\/strong>; and six days later the product lands its first institution-wide clinical deployment. Adoption is outrunning the liability question rather than waiting on it.<\/li><\/ul>","tag":"daily 2026-07-28"},{"date":"2026-07-24","html":"<strong>Opened + crawled<\/strong><ul><li><strong>Thread opened<\/strong> (ben-steer).<\/li><li><strong>Verdict: the premise checks out — OpenAI is racing to build sanctioned, records-connected health rails precisely because the de-facto usage is the liability.<\/strong> Its own 2025 disclosure: ~230M weekly health queries and &gt;1M/week surfacing suicidal-planning signals. ⚠ WebSearch budget exhausted + GDELT rate-limited (fan-out) — the health-hires/partnerships branch stayed unverified, flag for follow-up.<\/li><\/ul>","tag":"steer 2026-07-24"},{"date":"2026-07-23","html":"<strong>ChatGPT Health goes GA — the same week as the suits<\/strong><ul><li><strong>ChatGPT Health reached general availability to all US users 18+<\/strong> across every plan — connecting Apple Health, Epic, and hospital/patient-portal records in-chat (initial launch was 01-07). Coverage explicitly frames it as arriving \"following legal challenges.\" (<a href=\"https://techcrunch.com/2026/07/23/openai-makes-chatgpt-health-available-to-all-u-s-users/\">TechCrunch<\/a>)<\/li><li><strong>Talkspace launched \"Tee\" the same day<\/strong> — a HIPAA-protected AI MH guide positioned <em>against<\/em> \"mass-market chatbots,\" arbitraging the same evidence gap (cross-refs <code>mh-clinical-infra-funding<\/code>).<\/li><\/ul>","tag":"crawl 2026-07-24"},{"date":"2026-07-21","html":"<strong>The harm docket, clinical failure modes<\/strong><ul><li><strong>Two new suits days before GA<\/strong> — an Alabama mother's suicide suit (ChatGPT allegedly reinforced delusion: \"You are not delusional. You are prophetic\") and the Winters case (a FL pastor's near-fatal pulmonary embolism after ChatGPT dismissed his symptoms — the first over ChatGPT's <em>medical advice<\/em> causing physical harm). The MH failure modes in filings: suicide-method coaching, delusion/psychosis reinforcement, self-harm validation in minors. (<a href=\"https://www.boston.com/news/health/2026/07/22/chatgpt-led-to-a-mans-near-fatal-health-crisis-lawsuit-claims/\">Boston.com<\/a>)<\/li><\/ul>","tag":"crawl 2026-07-24"}],"timeline_truncated":false,"crawled":"2026-07-24"},{"slug":"frontier-lab-ipos","title":"Lab IPO Wave","kind":"meta","status":"open","lens":"global-capital","opened":"2026-07-27","last_seen":"2026-07-26","parent":null,"genre":"financing","weight":3,"entities":["openai","spacex","anthropic","softbank"],"watch":"The frontier labs are converting private, vendor-financed valuations into public currency — SpaceX (listed 06-12 at a $1.77T IPO valuation, the largest US debut ever) is the live test, trading at all-time lows ~15% below issue; Anthropic reportedly filed confidentially (~$965B, thin); OpenAI's timing chatter continued. The meta-question: what does the public market actually pay for an AI story, and who lists first at what haircut. (Moonshot's HKEX push stays under china-stack-independence.)","timeline":[{"date":"2026-07-30","html":"<strong>SpaceX completes the round trip<\/strong><ul><li><strong>SpaceX (SPCX) closed at $114.87 on 07-30, down 49.1% from its all-time high of $225.64 (06-16) and now ~15% below its $135 IPO issue price<\/strong> — the stock rallied to nearly 67% above issue before crashing back through it, erasing over half its peak value. (<a href=\"https://stockanalysis.com/stocks/spcx/history/\">stockanalysis.com<\/a>)<\/li><li><strong>Short interest on SPCX reached ~$26B, roughly 35% of the entire float.<\/strong><\/li><li><strong>Anthropic IPO chatter firmed toward a $1T valuation (from ~$965B), with a reported Amazon windfall and a Blackstone/Goldman JV floated<\/strong> — but \"Wall Street is getting cold feet\" per one outlet on the same number; figures lower-confidence, not independently verified.<\/li><\/ul>","tag":"daily 2026-07-30"},{
