,"status":"open","lens":"ai","opened":"2026-07-24","last_seen":"2026-07-30","parent":"where-the-capex-lands","genre":"resource-move","weight":3,"entities":["nvidia","google","amazon-aws","microsoft","openai"],"watch":"Where the capex lands in SILICON — the $ flowing to Nvidia/AMD/TSMC/ Broadcom, plus the custom-silicon revolt (Jalapeño, Trainium, Maia, TPU) as the giants try to stop renting from Nvidia. Category meta under where-the-capex-lands.","timeline":[{"date":"2026-07-30","html":"<strong>Samsung's earnings put a number on the memory side of the silicon spend<\/strong><ul><li><strong>Samsung posted record Q2 chip-division profit<\/strong> (~250x YoY per multiple outlets), driven by AI-linked HBM/DRAM shortage pricing — the clearest fresh data point on where AI silicon dollars land outside the GPU line itself. ([CNBC] · [WSJ])<\/li><li><strong>Samsung locked ~70% of memory output into long-term deals with \"5 major Big Tech firms\"<\/strong> (unnamed) and sees the shortage extending to 2028 — direct evidence of hyperscalers contracting AI memory supply years out. ([finance.biggo.com])<\/li><\/ul>","tag":"daily 2026-07-30"},{"date":"2026-07-27","html":"<strong>The silicon split: undisclosed at all four ⟨crawl 2026-07-27⟩<\/strong><ul><li><strong>The industry's common non-disclosure:<\/strong> none of Google / Microsoft / Amazon / Meta publishes its own-chip vs Nvidia dollar or unit split — confirmed independently by all four capex crawls.<\/li><li>Own-silicon state: Google TPU v7 \"Ironwood\" (+8t/8i next-gen) · Microsoft Maia 200 (dual-purpose: OpenAI inference + MAI training) · Amazon 1.4M Trainium deployed, T3 claims ~50% cost edge · Meta MTIA at \"millions\" of H100-equivalents (600K is stale), \"Iris\" to production Sept-26, Broadcom extended thru 2029.<\/li><li>Clearest external volume signals: Anthropic on 1M+ Google TPUs (&gt;1GW) AND 1M+ Trainium2 — the labs disclose what the hyperscalers won't.<\/li><\/ul>","tag":"seed"},{"date":"2026-07-24","html":"<strong>Opened<\/strong><ul><li><strong>Thread opened<\/strong> (ben-steer) — meta-thread — groups the child threads below.<\/li><\/ul>","tag":"steer 2026-07-24"}],"timeline_truncated":false,"crawled":null},{"slug":"ai-power-buildout","title":"Power Buildout","kind":"meta","status":"open","lens":"ai","opened":"2026-07-24","last_seen":"2026-08-04","parent":"where-the-capex-lands","genre":"resource-move","weight":3,"entities":["spacex","microsoft","amazon-aws","oracle"],"watch":"Where the capex lands in POWER — the real bottleneck. Nuclear-for-AI (SMRs, Oklo/X-Energy), gas turbines (the Colossus permit fights), grid deals, and the energy-justice/permitting battles. Category meta under where-the-capex-lands.","timeline":[{"date":"2026-08-04","html":"<strong>Datacenter operators tap banks for billions to unlock grid connections<\/strong><ul><li><strong>Letters-of-credit deals (~$10B currently in discussion)<\/strong> meant to reassure utilities that ratepayers won't be left holding infrastructure costs if an AI-datacenter project fails — real financing stress underneath the buildout, and a direct echo of the Texas PUCT/ERCOT freeze below. (<a href=\"https://www.bloomberg.com/news/articles/2026-08-04/ai-power-demands-spur-builders-to-seek-billions-in-bank-pledges\">Bloomberg<\/a>)<\/li><\/ul>","tag":"daily 2026-08-04"},{"date":"2026-08-03","html":"<strong>Texas freezes new AI-datacenter grid connections pending an audit (caught 08-04, missed on the day)<\/strong><ul><li><strong>Governor Abbott ordered the Public Utility Commission of Texas and ERCOT to audit every data centre seeking a grid connection before it can energise<\/strong> — covering tax incentives, power consumption, water use, community-impact mitigation and ownership — with the directive that \"any project that fails to comply... must be denied connection to the Texas grid.\" (<a href=\"https://www.texastribune.org/2026/08/03/texas-data-center-project-audit-greg-abbott/\">Texas Tribune<\/a>)<\/li><li><strong>ERCOT paused its \"Batch Zero\" transmission planning study in response<\/strong> — the first cohort already moving through its revised approval process, now halted mid-review.<\/li><li><strong>The queue this lands on: 1,800+ projects requesting 474+ GW, ~90% of it data centres — more than five times the grid's all-time peak-demand record<\/strong>, against 335 operating and 248 planned facilities statewide.<\/li><li>💡 <strong>Why this thread should treat it as a step-change, not another permitting fight:<\/strong> every prior entry here tracked power being <em>procured<\/em> — nuclear PPAs, gas turbines, DOE site conversions. This is the first time the <em>interconnection itself<\/em> has been withheld as policy, by the state hosting the largest share of the queue. The binding constraint moved from generation to permission.<\/li><li>⚠️ <strong>Process note, kept deliberately:<\/strong> this published 08-03 13:12 CT and <strong>12 items on it sat in that day's own collector buffer routed to no thread<\/strong>. Curation missed it; the overnight extension pass caught it. A detection failure, not a sourcing one.<\/li><\/ul>","tag":"daily 2026-08-03"},{"date":"2026-07-30","html":"<strong>Catch-up: a second Cold War DOE site becomes a $100B AI power build (event 07-28/29, missed at the time)<\/strong><ul><li><strong>NextEra and Brookfield will develop a $100B AI data-center campus at DOE's Paducah, KY site<\/strong> — a former Cold War uranium-enrichment plant — paired with 4.6GW of dedicated power generation. Announced via DOE's own release 07-29, corroborated same-day by Reuters/WSJ/FT/Bloomberg; this thread's most recent entry (07-27 crawl) doesn't have it. ([POWER Magazine])<\/li><li><strong>No hyperscaler/lab tenant named<\/strong> — unlike Stargate/Portsmouth (OpenAI), every account frames this as a NextEra/Brookfield-led speculative build. Open gap.<\/li><li>💡 <strong>Worth the curator's own eyes:<\/strong> this is a <em>second<\/em> former-DOE- nuclear-site-to-AI-campus conversion inside one week (after Portsmouth/Piketon, 10GW/OpenAI, flagged 07-28) — a possible pattern, not tagged <code>sev=<\/code> per the rarity discipline but flagged plainly.<\/li><\/ul>","tag":"daily 2026-07-30"},{"date":"2026-07-27","html":"<strong>The power book, four actors ⟨crawl 2026-07-27⟩<\/strong><ul><li><strong>Google:<\/strong> solar-dominant (TotalEnergies 1GW/28TWh · Clearway 1.17GW) + TVA/Kairos — the first US Gen-IV utility PPA (2030).<\/li><li><strong>Microsoft:<\/strong> TMI/Crane restart tracking 2027 (DOE $1B loan, NRC/FERC cleared) · Chevron Kilby $7B/2.7GW/20yr · ~40GW renewables claimed (secondary, unreconciled vs a 34GW figure).<\/li><li><strong>Amazon:<\/strong> Talen/Susquehanna 1.92GW firm 17-yr (~$18B, restructured to dodge the FERC kill) · X-Energy SMR option to 5GW-by-2039.<\/li><li><strong>Meta — the reversal:<\/strong> QUIT RE100, pivoting to a 7.5GW GAS buildout (07-23/24) even while holding a ≤6.6GW nuclear RFP (Oklo/TerraPower/ Vistra) + NextEra 2.3GW solar. The clean-power consensus broke first at Meta.<\/li><\/ul>","tag":"seed"},{"date":"2026-07-24","html":"<strong>Opened<\/strong><ul><li><strong>Thread opened<\/strong> (ben-steer) — meta-thread — groups the child threads below.<\/li><\/ul>","tag":"steer 2026-07-24"}],"timeline_truncated":false,"crawled":null},{"slug":"ai-datacenter-sites","title":"Datacenter Sites","kind":"meta","status":"open","lens":"ai","opened":"2026-07-24","last_seen":"2026-08-04","parent":"where-the-capex-lands","genre":"buildout-race","weight":3,"entities":["openai","spacex","softbank","oracle"],"watch":"Where the capex lands in CONCRETE — the specific gigawatt campuses. Stargate, Colossus, Camellia + the 100s of sites. Category meta under where-the-capex-lands; the specific-sites worklist lives here.","timeline":[{"date":"2026-08-04","html":"<strong>Datacenter operators tap banks for billions to unlock grid connections<\/strong><ul><li><strong>Letters-of-credit deals (~$10B currently in discussion)<\/strong> to reassure utilities that ratepayers won't absorb infrastructure costs if a project fails — real financing stress underneath the site pipeline, echoing the Texas PUCT/ERCOT audit gate below. (<a href=\"https://www.bloomberg.com/news/articles/2026-08-04/ai-power-demands-spur-builders-to-seek-billions-in-bank-pledges\">Bloomberg<\/a>)<\/li><\/ul>","tag":"daily 2026-08-04"},{"date":"2026-08-03","html":"<strong>Texas puts the whole site pipeline behind an audit gate (caught 08-04, missed on the day)<\/strong><ul><li><strong>Texas halted new data-centre grid connections pending a PUCT/ERCOT audit of every project in the queue<\/strong> — tax breaks, power, water, community impact and ownership all in scope, with non-compliant projects to be denied connection outright. (<a href=\"https://www.texastribune.org/2026/08/03/texas-data-center-project-audit-greg-abbott/\">Texas Tribune<\/a>)<\/li><li><strong>335 operating and 248 planned Texas facilities sit behind this gate<\/strong>, inside an ERCOT queue of 1,800+ projects and 474+ GW.<\/li><li>💡 <strong>The siting question changes shape:<\/strong> this thread has tracked <em>where<\/em> capacity gets sited. Texas has just made the answer contingent on disclosure a developer may not want to give — ownership and tax-incentive transparency are now preconditions of energising, which is a different filter than land, water or fibre.<\/li><\/ul>","tag":"daily 2026-08-03"},{"date":"2026-07-30","html":"<strong>Catch-up: Paducah, KY joins the megasite map (event 07-28/29)<\/strong><ul><li><strong>A second former DOE Cold War nuclear site converts to an AI campus<\/strong> — Paducah, KY, $100B, NextEra + Brookfield, 4.6GW dedicated power — same pattern as Portsmouth/Piketon, OH (10GW, OpenAI/SB Energy, flagged 07-28), a second instance inside one week. No tenant named yet. ([WSJ])<\/li><li><strong>Missed at the time<\/strong> — broke 07-28 (HPCwire), went wide 07-29 (DOE PR Newswire, Reuters, Bloomberg, FT, WSJ); this thread's last entry (07-28) doesn't have it. Backfill, not new-today.<\/li><\/ul>","tag":"daily 2026-07-30"},{"date":"2026-07-28","html":"<strong>Datacentres get a threat model ⟨daily 2026-07-28⟩<\/strong><ul><li><strong>Satellite imagery corroborated Iranian strikes on two Amazon data centres in Bahrain<\/strong> — Zallaq and Askar — supporting IRGC claims released via Tasnim. Bloomberg reports significant damage at both. (<a href=\"https://www.bloomberg.com/news/articles/2026-07-28/amazon-data-centers-hit-in-iran-strikes-satellite-images-show\">Bloomberg<\/a>)<\/li><li><strong>⚠ Date discipline: the imagery is the 07-28 development, not the attack.<\/strong> The strikes were claimed around <strong>07-21<\/strong>; the campaign runs back to Shahed drone attacks on AWS sites in the <strong>UAE on 03-01<\/strong> and a further Bahrain strike on <strong>04-01<\/strong>. Iranian state media named Microsoft, Google, Apple, Meta, Oracle, Intel and Nvidia as targets on <strong>03-31<\/strong>. Reported here as corroboration of an older event.<\/li><li><strong>Why it belongs on this thread and not just the war thread:<\/strong> this timeline tracks where the capex physically lands — and siting has now acquired a variable it did not have. Commercial datacentres have been deliberately struck in wartime, with published damage assessment. Every megasite entry above (Portsmouth, Camellia, El Paso, the Gulf builds) carries an unpriced sovereign-risk term as a result.<\/li><li><strong>Caught by the collectors, not the cluster agents<\/strong> — the tier-2 sweeps were pointed at memory, macro and mental health, and missed it entirely. Logged as a recall note.<\/li><\/ul>","tag":"daily 2026-07-28"},{"date":"2026-07-28","html":"<strong>A fifth megasite enters the map: Ohio's 10GW Portsmouth campus<\/strong><ul><li><strong>OpenAI/SB Energy's planned 10GW Piketon, OH campus (the former Portsmouth uranium site) got a financing-backstop story<\/strong> — Nvidia weighing ~$250B toward the lease/construction, pushing total project cost toward $500B; full detail and sourcing in <code>stargate-buildout<\/code>. If it holds, this is the single largest site figure in this thread's tracker — bigger than any of the four hyperscalers' named individual sites.<\/li><\/ul>","tag":"daily 2026-07-28"},{"date":"2026-07-27","html":"<strong>The site map, four actors traced ⟨crawl 2026-07-27⟩<\/strong><ul><li><strong>Google:<\/strong> 15+ US states + India — MO $15B · MI 1GW \"Cannoli\" · TX Panhandle 1GW+ · NextEra ≥3 GW-scale campuses · India $15B Visakhapatnam (one outlet: 5GW, thin). A land-grab, not megasites.<\/li><li><strong>Microsoft:<\/strong> two named ~2GW builds — the WI+GA fiber-linked \"AI superfactory\" + Pecos TX (Chevron co-located). No company-wide GW total exists.<\/li><li><strong>Amazon:<\/strong> Rainier live (New Carlisle IN, 500K Trainium2, $26B) · MS $25B · PA $20B · NC $10B (07-20).<\/li><li><strong>Meta:<\/strong> Hyperion 5GW/$50B+ — <strong>80% sold to Blue Owl<\/strong> · El Paso $10B/1GW under live local pushback · Prometheus GW-figure unclear · the 3-month tent builds are real.<\/li><\/ul>","tag":"seed"},{"date":"2026-07-24","html":"<strong>Opened<\/strong><ul><li><strong>Thread opened<\/strong> (ben-steer) — meta-thread — groups the child threads below.<\/li><\/ul>","tag":"steer 2026-07-24"}],"timeline_truncated":false,"crawled":null},{"slug":"nvidia-order-book","title":"Nvidia's Order Book","kind":"story","status":"open","lens":"ai","opened":"2026-07-24","last_seen":"2026-08-04","parent":"ai-compute-spend","genre":"capital-flow","weight":2,"entities":["nvidia","openai","meta-ai"],"watch":"The demand side of the chip spend — a ~$1T Blackwell+Rubin book (a management aggregate, not audited backlog); the $100B OpenAI deal is dead, and the constraint has shifted to supply (HBM4). Watch the per- customer concentration and the circular-financing stakes (Nvidia's 10-Q investments in its own buyers).","timeline":[{"date":"2026-07-24","html":"<strong>Opened + crawled<\/strong><ul><li><strong>Thread opened<\/strong> (ben-steer).<\/li><li><strong>Verdict: the strongest demand book ever reported — ~$1T in Blackwell+ Rubin orders through 2027 — but it's Huang's own aggregate figure, not an audited backlog, and the flashiest pillar (the $100B OpenAI deal) COLLAPSED in early 2026.<\/strong> The binding constraint has shifted from demand to supply (an HBM4 drought). ⚠ WebSearch budget was exhausted (9-crawl fan-out) — built from targeted fetches; a few figures are soft.<\/li><\/ul>","tag":"steer 2026-07-24"},{"date":"2026-05-13","html":"<strong>First-ever $5.5T<\/strong><ul><li><strong>Nvidia hit $5.5T market cap<\/strong> — the first company ever — on news Huang would join Trump's China trip (~$5T as of late July). (<a href=\"https://www.forbes.com/sites/antoniopequenoiv/2026/05/13/nvidia-hits-record-55-trillion-value-first-company-to-ever-reach-mark/\">Forbes<\/a>)<\/li><\/ul>","tag":"crawl 2026-07-24"},{"date":"2026-04-09","html":"<strong>The constraint flips to supply<\/strong><ul><li><strong>A Rubin supply squeeze<\/strong> — HBM4 shortage pushed SK Hynix's ramp to Q3'26; TrendForce cut its 2026 Rubin shipment share 29%→22%. Demand isn't the bottleneck anymore; memory is. ⚠ reported (TrendForce). (<a href=\"https://www.sdxcentral.com/news/nvidias-rubin-gpus-hit-the-brakes-as-hbm4-memory-drought-threatens-jensens-supply-chain-magic-report/\">SDxCentral<\/a>)<\/li><\/ul>","tag":"crawl 2026-07-24"},{"date":"2026-03-16","html":"<strong>The $1T claim<\/strong><ul><li><strong>GTC: Huang says ~$1T in Blackwell+Rubin orders through 2027<\/strong> — up from the $500B-through-2026 figure a year prior. It's a demand/visibility number, NOT audited RPO/backlog — no public per-customer breakdown exists. (<a href=\"https://techcrunch.com/2026/03/16/jensen-just-put-nvidias-blackwell-and-vera-rubin-sales-projections-into-the-1-trillion-stratosphere/\">TechCrunch<\/a>)<\/li><\/ul>","tag":"crawl 2026-07-24"},{"date":"2026-03-04","html":"<strong>The $100B OpenAI deal dies<\/strong><ul><li><strong>The OpenAI–Nvidia $100B / 10GW partnership is dead<\/strong> — Huang confirms it's not proceeding (citing OpenAI's IPO plans); FT reported the abandonment in Feb. Corrects the circular-financing picture: Nvidia's actual OpenAI exposure is the ~$30B equity stake from the $110B round, not the $100B LOI. Cross-refs <code>ai-circular-financing-risk<\/code>. (<a href=\"https://gizmodo.com/the-100-billion-openai-nvidia-deal-is-not-happening-2000729749\">Gizmodo<\/a>)<\/li><\/ul>","tag":"crawl 2026-07-24"}],"timeline_truncated":false,"crawled":"2026-07-24"},{"slug":"inhouse-silicon","title":"In-House Silicon","kind":"story","status":"open","lens":"ai","opened":"2026-07-24","last_seen":"2026-07-25","parent":"ai-compute-spend","genre":"resource-move","weight":2,"entities":["google","amazon-aws","microsoft","meta-ai","openai","broadcom"],"watch":"The custom-silicon revolt (TPU/Trainium/Maia/MTIA) — real but INFERENCE- only, anchored by Anthropic running mostly off Nvidia on Trainium + TPU. Nvidia's absolute demand still grows; the clearest winners are the co- design houses (Broadcom, Marvell). Watch whether displacement reaches frontier training.","timeline":[{"date":"2026-07-27","html":"<strong>Four programs, one wall ⟨crawl 2026-07-27⟩<\/strong><ul><li>TPU v7 Ironwood (Broadcom/MediaTek/TSMC co-design) · Maia 200 (dual-purpose, volumes undisclosed) · Trainium 1.4M deployed · MTIA \"millions\" H100-eq, Iris Sept-26. All four decline to state the own-vs-Nvidia split — the wall every capex crawl hit.<\/li><\/ul>","tag":"seed"},{"date":"2026-07-24","html":"<strong>Opened + crawled<\/strong><ul><li><strong>Thread opened<\/strong> (ben-steer).<\/li><li><strong>Verdict: diversification at the margin and on inference, not a rout.<\/strong> The CUDA-vs-XLA software moat keeps Nvidia the default for anyone without a captive anchor customer; the \"in-house\" silicon is largely outsourced to Broadcom/Marvell. ⚠ WebSearch budget exhausted (fan-out) — primary-doc fetch path; Maia 200 + some codenames single-sourced, flagged.<\/li><\/ul>","tag":"steer 2026-07-24"}],"timeline_truncated":false,"crawled":"2026-07-24"},{"slug":"nuclear-for-ai","title":"Nuclear for AI","kind":"story","status":"open","lens":"ai","opened":"2026-07-24","last_seen":"2026-07-25","parent":"ai-power-buildout","genre":"resource-move","weight":2,"entities":["amazon-aws","microsoft","oracle"],"watch":"The nuclear-for-AI wave — but ~0 net-new MW power any AI datacenter before 2027, and the first firm power is a RESTART (TMI-1), not a new build. The ~13GW announced is <20% of projected demand; every genuinely new SMR/Gen-IV project is 2030s-weighted. Watch which actually clear licensing.","timeline":[{"date":"2026-07-27","html":"<strong>The nuclear book across the four ⟨crawl 2026-07-27⟩<\/strong><ul><li>Microsoft: TMI/Crane 2027 (DOE $1B, NRC draft + FERC cleared) · Amazon: Talen 1.92GW/17yr firm + X-Energy 5GW-by-2039 · Google: TVA/Kairos Gen-IV (2030) · Meta: RFP awards ≤6.6GW (Oklo/TerraPower/ Vistra) — but hedged with a 7.5GW gas pivot. Skeptical note: SMR timelines lag near-term demand (Bulletin, 07-20).<\/li><\/ul>","tag":"seed"},{"date":"2026-07-25","html":"<strong>First federal dollar ⟨daily 2026-07-25⟩<\/strong><ul><li><strong>DOE tapped Oklo/X-Energy for a $200M nuclear-for-AI push<\/strong>; aggregate nuclear deals signed by AI companies now ≈ 7M homes of power (07-26 figure). The thread's first real items since opening quiet.<\/li><\/ul>","tag":"seed"},{"date":"2026-07-24","html":"<strong>Opened + crawled<\/strong><ul><li><strong>Thread opened<\/strong> (ben-steer).<\/li><li><strong>Verdict: power is the binding constraint, and nuclear is a real but 2030s-weighted marathon.<\/strong> Carnegie (06-2026) pegs the ~13GW of announced hyperscaler nuclear at &lt;20% of projected datacenter demand through 2035; a single year of planned US solar (43GW) dwarfs the whole mid-2030s nuclear pipeline. The near-term \"firm\" adds are restarts/uprates that <em>re-label<\/em> existing MW, not new generation. ⚠ WebSearch budget exhausted (fan-out) — some 2026 items aggregator-only, flagged.<\/li><\/ul>","tag":"steer 2026-07-24"}],"timeline_truncated":false,"crawled":"2026-07-24"},{"slug":"datacenter-power-grid","title":"Grid & Turbines","kind":"story","status":"open","lens":"ai","opened":"2026-07-24","last_seen":"2026-07-25","parent":"ai-power-buildout","genre":"resource-move","weight":1,"entities":["spacex"],"watch":"The grid is the binding constraint (not chips) — interconnection queues exploding, hyperscalers self-supplying via gigawatt-scale gas, an equipment ceiling (turbines sold out to 2030, transformers ~3yr), and the ratepayer + environmental-justice fights. Watch the DOJ national- security shield over xAI's unpermitted turbines — the improvisation has outrun the regulatory system.","timeline":[{"date":"2026-07-24","html":"<strong>Opened + crawled<\/strong><ul><li><strong>Thread opened<\/strong> (ben-steer).<\/li><li><strong>Verdict: severe, worsening, multi-dimensional — power is the gating factor.<\/strong> The defining escalation is legal-political: the DOJ now invokes national security to keep unpermitted turbines running against a citizen Clean Air Act suit — the improvisation has outrun the regulatory system. ⚠ WebSearch budget exhausted (fan-out) — flagship + high-value claims re-verified via fetch; some figures RSS-only, flagged.<\/li><\/ul>","tag":"steer 2026-07-24"},{"date":"2026-06-16","html":"<strong>The DOJ national-security shield<\/strong><ul><li><strong>The Trump DOJ moved to dismiss the NAACP Clean Air Act suit on national-security grounds<\/strong> — arguing shutting the 57 unpermitted Southaven turbines threatens security because Grok \"supports Department of War operations\" (a DoD official called Grok \"paramount national security,\" citing the Iran strikes). Converts an environmental-permitting fight into a federal-power question. Cross-refs <code>spacex-colossus<\/code>. (<a href=\"https://www.nytimes.com/2026/06/16/climate/\">NYT<\/a>)<\/li><\/ul>","tag":"crawl 2026-07-24"}],"timeline_truncated":false,"crawled":"2026-07-24"},{"slug":"camellia","title":"Camellia","kind":"project","status":"open","lens":"ai","opened":"2026-07-24","last_seen":"2026-07-28","parent":"ai-datacenter-sites","genre":"buildout-race","weight":1,"entities":["openai"],"watch":"OpenAI-direct build (Octans GA LLC/Butler Snow — no named GC or Stargate-JV backer): Savannah Gateway Industrial Hub, Rincon, Effingham County GA; 3.2GW/25yr Georgia Power PPA phased 2028-2032; $20-30B cost unreconciled across outlets; pre-construction, DRI filed 07-24, Coastal Regional Commission review (≤30d) pending. DISTINCT from SoftBank's ~10GW Ohio (Portsmouth) campus. Track: the local secrecy backlash (10K+ petition), generation-mix disclosure, and whether a GC/financing partner surfaces.","timeline":[{"date":"2026-07-30","html":"<strong>Local press keeps digging into process and disclosure<\/strong><ul><li><strong>Effingham Herald: \"How OpenAI's Effingham Data Center Moved Forward Without Public Input\"<\/strong> — a process/accountability angle distinct from the secrecy-backlash coverage already on file.<\/li><li><strong>WTOC flagged a \"water warning gap\"<\/strong> raising fresh transparency questions, and separately reported on the deal's tax/financial \"discount\" terms — both go directly to this thread's blank generation-mix/disclosure watch item; headline-level only, body text not independently fetched.<\/li><\/ul>","tag":"daily 2026-07-30"},{"date":"2026-07-28","html":"<strong>Rincon meets on the plan ⟨daily 2026-07-28⟩<\/strong><ul><li><strong>The local-opposition track went live in person<\/strong> — WTOC: \"Coffee, concerns and 'Camellia'\" — Rincon residents met today on the OpenAI plan, capping a week of organizing coverage (WJCL 07-22, WTOC 07-24); directly on the watch line's \"local secrecy backlash\" item. Georgia Power's 25-yr P weight":2,"entities":["openai"],"watch":"OpenAI formalizing consumer health (ChatGPT Health went GA to all US 18+ on 07-23) exactly as its worst MH-harm litigation crystallizes (suicide/psychosis suits, a 42-state AG probe, Altman named personally). The open question: does a formal health layer RAISE the standard of care, or wall off 'health' while the general model keeps causing harm? Its own numbers — >1M/week showing suicidal-planning signals — are the liability.","timeline":[{"date":"2026-07-28","html":"<strong>The first hospital-wide deployment, with a suit pending<\/strong><ul><li><strong>Israel's Sheba Medical Center is rolling out ChatGPT for Healthcare across the whole institution<\/strong> — billed as the first global deployment at that scale — with citation-backed clinical reasoning and zero-data-retention terms. (<a href=\"https://hitconsultant.net/2026/07/28/sheba-medical-center-openai-chatgpt-for-healthcare-deployment/\">HIT Consultant<\/a>)<\/li><li><strong>The timing is the thread's whole tension in one week:<\/strong> ChatGPT Health went GA to all US adults on <strong>07-23<\/strong>; a suit seeking to pull GPT-4o and halt Health pending an independent safety review was filed <strong>07-22<\/strong>; and six days later the product lands its first institution-wide clinical deployment. Adoption is outrunning the liability question rather than waiting on it.<\/li><\/ul>","tag":"daily 2026-07-28"},{"date":"2026-07-24","html":"<strong>Opened + crawled<\/strong><ul><li><strong>Thread opened<\/strong> (ben-steer).<\/li><li><strong>Verdict: the premise checks out — OpenAI is racing to build sanctioned, records-connected health rails precisely because the de-facto usage is the liability.<\/strong> Its own 2025 disclosure: ~230M weekly health queries and &gt;1M/week surfacing suicidal-planning signals. ⚠ WebSearch budget exhausted + GDELT rate-limited (fan-out) — the health-hires/partnerships branch stayed unverified, flag for follow-up.<\/li><\/ul>","tag":"steer 2026-07-24"},{"date":"2026-07-23","html":"<strong>ChatGPT Health goes GA — the same week as the suits<\/strong><ul><li><strong>ChatGPT Health reached general availability to all US users 18+<\/strong> across every plan — connecting Apple Health, Epic, and hospital/patient-portal records in-chat (initial launch was 01-07). Coverage explicitly frames it as arriving \"following legal challenges.\" (<a href=\"https://techcrunch.com/2026/07/23/openai-makes-chatgpt-health-available-to-all-u-s-users/\">TechCrunch<\/a>)<\/li><li><strong>Talkspace launched \"Tee\" the same day<\/strong> — a HIPAA-protected AI MH guide positioned <em>against<\/em> \"mass-market chatbots,\" arbitraging the same evidence gap (cross-refs <code>mh-clinical-infra-funding<\/code>).<\/li><\/ul>","tag":"crawl 2026-07-24"},{"date":"2026-07-21","html":"<strong>The harm docket, clinical failure modes<\/strong><ul><li><strong>Two new suits days before GA<\/strong> — an Alabama mother's suicide suit (ChatGPT allegedly reinforced delusion: \"You are not delusional. You are prophetic\") and the Winters case (a FL pastor's near-fatal pulmonary embolism after ChatGPT dismissed his symptoms — the first over ChatGPT's <em>medical advice<\/em> causing physical harm). The MH failure modes in filings: suicide-method coaching, delusion/psychosis reinforcement, self-harm validation in minors. (<a href=\"https://www.boston.com/news/health/2026/07/22/chatgpt-led-to-a-mans-near-fatal-health-crisis-lawsuit-claims/\">Boston.com<\/a>)<\/li><\/ul>","tag":"crawl 2026-07-24"}],"timeline_truncated":false,"crawled":"2026-07-24"},{"slug":"frontier-lab-ipos","title":"Lab IPO Wave","kind":"meta","status":"open","lens":"global-capital","opened":"2026-07-27","last_seen":"2026-07-31","parent":null,"genre":"financing","weight":3,"entities":["openai","spacex","anthropic","softbank"],"watch":"The frontier labs are converting private, vendor-financed valuations into public currency — SpaceX (listed 06-12 at a $1.77T IPO valuation, gle-source — Briefs Finance; thin, needs a second source), with an IR-director job posting read as fall-2026 prep. Days after Opus 5 shipped and the AMD deal finalized.<\/li><\/ul>","tag":"seed"}],"timeline_truncated":false,"crawled":null},{"slug":"nvidia-vendor-financing","title":"Nvidia as Lender","kind":"story","status":"open","lens":"global-capital","opened":"2026-07-27","last_seen":"2026-08-04","parent":null,"genre":"financing","weight":3,"entities":["nvidia","openai"],"watch":"Nvidia's turn from chip vendor to the buildout's lender of last resort: the $250-500B OpenAI financing guarantee (figure unresolved), equity stakes across its own customer base (Nebius 9.3%, Naver $1B, Intel $5B, Groq ~$20B licensing), and the first market pushback (NVDA -4%, CDS wider, 07-27). Track: the guarantee's actual structure and figure, whether rating agencies treat it as debt-equivalent, and each new customer-equity position. Sits inside the circular-financing story but is its own actor-move.","timeline":[{"date":"2026-08-04","html":"<strong>Reported scale jumps an order of magnitude: up to $750B in talks<\/strong><ul><li><strong>Nvidia reportedly in talks for up to $750B in new AI-infrastructure deals<\/strong> — $500B+ with SK Group, and up to $250B in lease guarantees to help OpenAI finance data-center compute (the same guarantee this thread has tracked since 07-27, now at roughly 3x the previously reported $250B figure on the OpenAI leg alone once the SK Group component is included). Terms still in flux, unconfirmed by either company. (<a href=\"https://finance.yahoo.com/technology/ai/articles/nvidia-750-billion-deals-revive-102003935.html\">Yahoo Finance<\/a>)<\/li><\/ul>","tag":"daily 2026-08-04"},{"date":"2026-07-29","html":"<strong>CDS eases from the record; the record's date gets corrected<\/strong><ul><li><strong>The $250B guarantee remains unconfirmed by any company, with terms unfinalized.<\/strong> (<a href=\"https://www.tomshardware.com/tech-industry/data-centers/nvidia-weighs-250-billion-guarantee-so-openai-can-lease-softbanks-10-gigawatt-ohio-campus\">Tom's Hardware<\/a>)<\/li><li><strong>The separate ~$350B chip-financing negotiation is a distinct instrument from the guarantee.<\/strong><\/li><li><strong>Nvidia's CDS eased to ~78bp from Monday's 82bp record.<\/strong> (<a href=\"https://seekingalpha.com/news/4620575-oracle-leads-record-widening-in-hyperscaler-cds-spreads\">Seeking Alpha<\/a>)<\/li><li><strong>Correction, stated plainly: the record CDS widening was Monday 2026-07-27 (Bloomberg), not 07-28 as this repo's 07-28 digest recorded it<\/strong> — an aggregator re-indexing error. (<a href=\"https://www.bloomberg.com/news/articles/2026-07-27/nvidia-credit-risk-jumps-in-swaps-market-on-ai-deal-talk-reports\">Bloomberg<\/a>)<\/li><\/ul>","tag":"daily 2026-07-29"},{"date":"2026-07-28","html":"<strong>Record CDS day ⟨daily 2026-07-28⟩<\/strong><ul><li><strong>The guarantee firmed to $250B<\/strong> (WSJ tier-1; the $500B print didn't verify) — CDS record single-day widening. <strong>+ $5B into pre-product SSI<\/strong> the same day: the lender now backs companies with no product at all.<\/li><li><strong>⚠ Date corrected (cross-sweep catch, 5am close 07-29):<\/strong> this entry originally read \"NVDA −5%\" as a 07-28 move. It was <strong>07-27<\/strong> — close <strong>$196.51, −4.99%<\/strong>. <strong>07-28<\/strong> dipped ~2% intraday (low $192.74) and closed <strong>+0.25% at $197.01<\/strong>. The correction sharpens the thread rather than weakening it: credit and equity broke together on 07-27, then on 07-28 <strong>equity refused to follow while the CDS stayed wide<\/strong>. A divergence between what the lender's debt costs and what its equity says is more informative than a one-day round trip. (<a href=\"https://stockanalysis.com/stocks/nvda/history/\">stockanalysis.com<\/a>)<\/li><li><strong>Figure resolved, not contradicted:<\/strong> NYT/Forbes's \"$500 billion\" headlines (07-27/28) refer to the <strong>total project cost<\/strong> of the Piketon, Ohio site (a former uranium-enrichment plant SoftBank is redeveloping with US/Japan government support) — Nvidia's own backstop stays $250B across every outlet. A <strong>third, separate figure<\/strong> also surfaced: Nvidia is weighing financing $350B of its own chip purchases for the same site. Deal isn't final until Commerce Secretary Lutnick signs off; Anthropic, Microsoft, and Google are named as competing bidders for the same capacity. (<a href=\"https://www.forbes.com/sites/tylerroush/2026/07/27/nvidia-and-openai-discussing-500-billion-data-center-heres-what-we-know/\">Forbes<\/a> / <a href=\"https://www.bloomberg.com/news/articles/2026-07-26/nvidia-in-talks-on-250-billion-backing-for-openai-hub-wsj-says\">Bloomberg<\/a>)<\/li><\/ul>","tag":"daily 2026-07-28"},{"date":"2026-07-27","html":"<strong>The market answers ⟨daily 2026-07-27⟩<\/strong><ul><li><strong>NVDA −4%, CDS wider on the guarantee reports<\/strong> — the first time the market priced Nvidia's own credit as the risk.<\/li><\/ul>","tag":"seed"},{"date":"2026-07-26","html":"<strong>The guarantee ⟨daily 2026-07-26⟩<\/strong><ul><li><strong>WSJ: Nvidia in talks to guarantee $250–500B of OpenAI financing<\/strong> for the 10GW Ohio campus (figure unresolved across outlets).<\/li><\/ul>","tag":"seed"}],"timeline_truncated":false,"crawled":null},{"slug":"ai-trade-bear-turn","title":"AI Bear Turn","kind":"story","status":"open","lens":"global-capital","opened":"2026-07-27","last_seen":"2026-07-31","parent":null,"genre":"capital-flow","weight":2,"entities":[],"watch":"Is the tape turning against the AI trade as a whole? Distinct from the circular-financing mechanics (Ben, 2026-07-27: \"it's its own thing\") — this tracks the market's aggregate verdict: the AI-heavy index into bear territory (07-27), the Mag7 -$797B day (07-23), SpaceX ~50% off its high, soft demand on AI-infra debt, hike odds rising. Track breadth (is it AI-specific or macro), the earnings verdicts, and whether the drawdown changes actual capex behavior.","timeline":[{"date":"2026-08-01","html":"<strong>July's real number was the semis index, not the Nasdaq<\/strong><ul><li><strong>The iShares Semiconductor ETF (SOXX) fell 22.1% in July, its worst month since December 2002 (−23.3%), while still holding +67.7% year-to-date.<\/strong> (<a href=\"https://www.cnbc.com/2026/07/28/chip-stocks-head-for-one-of-their-worst-months-ever-is-it-the-end.html\">CNBC<\/a>)<\/li><li><strong>The S&amp;P 500 posted its first negative July since 2014<\/strong> — outlets confirmed the direction but none gave a precise monthly percentage, so the magnitude is recorded as slight and unquantified. (<a href=\"https://finance.yahoo.com/markets/live/stock-market-today-friday-july-31-dow-sp-500-nasdaq-081227738.html\">Yahoo Finance<\/a>)<\/li><li><strong>This map had no record of the SOXX figure at all, which is the cleanest single number on the rotation thesis it has been tracking.<\/strong><\/li><\/ul>","tag":"daily 2026-08-01"},{"date":"2026-07-31","html":"<strong>July closes with the AI complex carrying the month's losses almost alone<\/strong><ul><li><strong>July finished with the Nasdaq down 3.2%, the S&amp;P 500 roughly flat at -0.1%, and the Dow up 0.32%<\/strong> — a fourth straight monthly gain for the Dow. The spread between a flat S&amp;P and a -3.2% Nasdaq is the single cleanest number on what the month did: the damage was concentrated in the AI complex rather than distributed across the market, which is this thread's whole question stated as one figure. Deltas computed from index levels directly and cross-checked against independently stated monthly percentages.<\/li><li><strong>Friday itself closed higher — S&amp;P 7,489.72 (+0.70%), Nasdaq 25,373.85 (+1.00%), Dow 52,485.03 (+0.53%)<\/strong> — but on single-name earnings (Amazon +15.3%, Apple -7.4%) rather than a chip-led bid; the AI/semi complex was mixed, not uniformly rallying. A strong last session only partly repaired the month. (<a href=\"https://finance.yahoo.com/markets/live/stock-market-today-friday-july-31-dow-sp-500-nasdaq-081227738.html\">Yahoo Finance<\/a>)<\/li><li><strong>Micron fell 4.3-6.0%<\/strong>, tied to forced-liquidation selling out of the Situational Awareness unwind (see <code>ai-circular-financing-risk<\/code>) and Michael Burry adding to a short — a direct, traceable line from one leveraged fund's failure into a specific name's tape. ⚠ Friday closes for Nvidia, AMD and TSMC could not be verified and are deliberately omitted rather than approximated.<\/li><\/ul>","tag":"daily 2026-07-31"},{"date":"2026-07-30","html":"<strong>The four prints landed: rewarded for returns, punished for the bet<\/strong><ul><li><strong>Microsoft: broad beat, stock +8-9%<\/strong> — FY2026 revenue tops $331B, Azure crosses $100B annualized, cloud growth accelerated to its fastest since 2022, Copilot paid seats hit 30M; Q4 AI-infra capex hit ~$41B, full-year capex guidance held steady. Rewarded for capex with visible cloud-revenue conversion.<\/li><li><strong>Meta: revenue +28% to $60.8B, but free cash flow collapsed 91% to $784M<\/strong>, stock fell ~10% — Q2 AI capex alone was $31.1B, and Meta raised the LOW end of full-year capex guidance. Punished for capex without a near-term return story.<\/li><li><strong>Qualcomm: EPS missed by $0.02 despite a revenue beat<\/strong>, guided to a faster Apple-modem revenue decline, announced a Sept-1 price hike tied to memory-cost inflation. Grouped by outlets with Arm as the two \"outlooks rattle markets\" prints of the night (Arm's own result: beat-and-raise, stock fell further on the smartphone-royalty guidance cut — full detail in <code>arm-royalty-regime<\/code>).<\/li><li><strong>The verdict, stated plainly:<\/strong> hyperscaler capex with visible cloud-revenue conversion (Microsoft) got bought; capex framed as a bet without near-term return (Meta) and legacy/smartphone-exposed chip revenue (Qualcomm, Arm) got sold. The bifurcation this thread's \"AI-specific vs. macro\" watch predicted — not a clean turn, not a clean relief rally.<\/li><li><strong>Macro crosscurrent stacked on top:<\/strong> Fed Chair Kevin Warsh's credibility was publicly questioned after Tuesday's 9-3 split vote; oil back above $90 on the widening Iran conflict — both pulling on the same tape as the earnings verdicts.<\/li><\/ul>","tag":"daily 2026-07-30"},{"date":"2026-07-29","html":"<strong>FOMC holds 9-3, dissents replace unanimity, credit leg eases<\/strong><ul><li><strong>The Fed held at 3.50%-3.75% on a 9-3 vote, with three dissents for a quarter-point hike — Hammack, Kashkari and Logan<\/strong> — six weeks after a unanimous 12-0 decision. (<a href=\"https://www.federalreserve.gov/newsevents/pressreleases/monetary20260729a.htm\">Federal Reserve<\/a>)<\/li><li><strong>The statement's language barely moved from June; the committee did.<\/strong> The descriptive text is essentially unchanged — the split is in the votes, not the prose.<\/li><li><strong>The Dow fell roughly 800 points into the close<\/strong>, ahead of the decision and four major earnings prints. (<a href=\"https://www.thestreet.com/stock-market-today/stock-market-today-dow-jones-sp-500-nasdaq-updates-july-29-2026stock-market-today-july-29-2026\">TheStreet<\/a>)<\/li><li><strong>Nvidia fell about 2.1% intraday on the standing $250B guarantee reports<\/strong>, not any new disclosure — old news repricing again.<\/li><li><strong>The bear turn's credit leg eased today rather than extended<\/strong> — the pressure rotated to Oracle instead of Nvidia — and tonight's four prints are the real test of whether this was a pause or a turn.<\/li><\/ul>","tag":"daily 2026-07-29"},{"date":"2026-07-28","html":"<strong>Korea rallies on the print, then breaks again ⟨daily 2026-07-28⟩<\/strong><ul><li><strong>The second circuit breaker in two sessions — this time after good news.<\/strong> The 07-29 KST session opened <strong>+1.1%<\/strong>, ran to <strong>+2.76% (6,190.04)<\/strong> on SK Hynix earnings relief, then reversed the whole way to an intraday <strong>−12.63% (5,262.77)<\/strong>, tripping a Level-1 breaker at <strong>12:32pm KST<\/strong>, and closed <strong>5,663.24, ~−6%<\/strong>. SK Hynix itself: <strong>+3.74% → −9.61% (1,401,000 won)<\/strong>; Samsung <strong>+4.55% → −5.23%<\/strong>. (<a href=\"https://www.koreaherald.com/article/10824514\">Korea Herald<\/a>)<\/li><li><strong>That is the sharper version of this thread's thesis.<\/strong> A market that cannot hold a bid for three hours on the best operating quarter in its lead company's history is not repricing earnings — it is repricing the <em>durability<\/em> of the earnings. The bear turn's Asia leg no longer needs bad news to fire.<\/li><li><strong>The divergence says it is a chip event, not regional risk-off:<\/strong> Nikkei <strong>−1.49% (61,434.19)<\/strong> but Hang Seng <strong>+1.8% (25,762.80)<\/strong>. US tape the same day: AMD ~−10%, Micron <strong>−8.85% ($820.53)<\/strong>, SOX −6% in a <strong>fourth straight losing session<\/strong>, Nasdaq-100 <strong>9.7% off its record<\/strong>.<\/li><li><strong>⚠ NVDA date corrected:<\/strong> the <strong>−5% was 07-27<\/strong>, not 07-28 (07-28 closed <strong>+0.25%, $197.01<\/strong>, after a ~2% intraday dip). The US leg of this thread is a <strong>credit/equity divergence<\/strong>, not a synchronized break — see <code>nvidia-vendor-financing<\/code>. (<a href=\"https://stockanalysis.com/stocks/nvda/history/\">stockanalysis.com<\/a>)<\/li><li><strong>Counterpoint kept on the record:<\/strong> Q3 DRAM contracts reportedly settling <strong>20-30% higher<\/strong> this month, and analyst framing that \"the panic appears to be indiscriminate.\" The tape and the contracts are pointing opposite ways.<\/li><\/ul>","tag":"daily 2026-07-28"},{"date":"2026-07-28","html":"<strong>the loud-no faded by the bell ⟨daily 2026-07-28⟩<\/strong><ul><li><strong>NVDA closed +0.3% ($197.01)<\/strong> — the −5% morning move on the record CDS widening fully reversed intraday. The day's bear signal was a <em>credit<\/em>-market event (CDS record hold); the equity leg didn't ratify it. Divergence worth watching into tomorrow's FOMC + four prints. Elsewhere at the close: INTC −5.9% ($86.30) · MU −8.9% (CXMT read-through day 2) · CRWV −4.9% · SPCX +2.6% ($116.41). (Yahoo chart data, 16:00 ET)<\/li><\/ul>","tag":"seed"},{"date":"2026-07-28","html":"<strong>FOMC eve: mixed tape, rate odds still elevated<\/strong><ul><li><strong>Going into tomorrow's 2pm ET decision, the tape is mixed rather than uniformly bearish:<\/strong> CoreWeave −30% in a month, SpaceX touching a fresh post-IPO low (~$110.85, Morgan Stanley pricing its AI unit at zero), and Nvidia's own CDS still wide — but Intel just posted its best quarter in 15 years (+25% revenue) and oil is now falling sharply (Brent −4.8% to ~$84 on the US-Iran pause), which cuts against one of the week's own drivers of Fed hike odds. Breadth question from 07-27 stays open: still AI-specific + macro-crosswind, not one clean story.<\/li><li><strong>Fed hike odds sit ~25-35%<\/strong> across trackers (CME FedWatch ~34.7% as of 07-27; a same-day FinanceFeeds read has it at 25%) — up from ~24% on 07-21, but consensus still points to a HOLD tomorrow with odds shifting to a September hike instead (77% per one prediction-market read). See the FOMC brief for detail.<\/li><\/ul>","tag":"daily 2026-07-28"},{"date":"2026-07-28","html":"<strong>Circuit breakers ⟨daily 2026-07-28⟩<\/strong><ul><li><strong>Korea's session closed −10–11% with circuit breakers triggered<\/strong> — SK Hynix below $140 into its own earnings; NVDA −5% + record CDS move the same day. Both legs of the turn fired at once, the day before FOMC.<\/li><\/ul>","tag":"seed"},{"date":"2026-07-28","html":"<strong>The Seoul leg ⟨crawl 2026-07-28⟩<\/strong><ul><li><strong>The turn went global: KOSPI −10.84% (\"Black Tuesday\"), SK Hynix −14.65%<\/strong> — triggered by CXMT's debut rather than US capex anxiety, but the same repricing impulse. The bear-turn now has US (index bear territory, NVDA CDS) and Asia (Seoul) legs in the same week.<\/li><\/ul>","tag":"seed"},{"date":"2026-07-27","html":"<strong>Opened ⟨steer 2026-07-27⟩<\/strong><ul><li><strong>The AI-heavy index slid into bear-market territory<\/strong> (IBD); ASML plunged on China news; NVDA −4% on its own guarantee. Running tally into the turn: Mag7 −$797B (07-23), SpaceX ~50% off high, soft AI-debt demand (07-24), hike odds ~40% into Wednesday's FOMC. Ben: distinct from circular-financing — \"it's its own thing.\"<\/li><\/ul>","tag":"seed"}],"timeline_truncated":false,"crawled":null},{"slug":"meta-gas-pivot","title":"Meta Gas Pivot","kind":"story","status":"open","lens":"ai","opened":"2026-07-28","last_seen":"2026-07-27","parent":"ai-power-buildout","genre":"resource-move","weight":2,"entities":["meta-ai"],"watch":"Meta quit RE100 amid a 7.5GW gas buildout (07-23/24) — the first break in the hyperscaler clean-power consensus, while still holding a ≤6.6GW nuclear RFP and 2.3GW NextEra solar. Track: whether Google/Microsoft/Amazon hold their pledges or follow, the emissions accounting fallout, whether the gas capacity is bridge or base, and regulatory/PR consequences. (Both W1 crawl agents flagged this independently; ben-steer: \"thread it.\")","timeline":[{"date":"2026-07-23","html":"<strong>The break ⟨crawl 2026-07-27⟩<\/strong><ul><li><strong>Meta quit RE100 amid a 7.5GW gas buildout<\/strong> — the first hyperscaler to exit the clean-power pact, while simultaneously holding a ≤6.6GW nuclear RFP (Oklo/TerraPower/Vistra) and 2.3GW of NextEra solar. Surfaced by the meta-capex destination crawl; both W1 agents flagged it independently as the week's highest-signal reversal. Context: Hyperion (5GW) 80%-sold to Blue Owl the same week — spend at guidance, assets and emissions both moving off the books.<\/li><\/ul>","tag":"seed"}],"timeline_truncated":false,"crawled":null},{"slug":"tsmc-capacity-race","title":"TSMC Capacity Race","kind":"story","status":"open","lens":"ai","opened":"2026-07-28","last_seen":"2026-07-29","parent":null,"genre":"buildout-race","weight":3,"entities":["tsmc"],"watch":"The chokepoint is cashing in: capex raised 15% to $60-64B + another $100B onto Arizona ($265B total US, 12 facilities — no per-fab breakdown public) at the 07-16 Q2 print; 2027 price talks run 5-10% baseline + up to 25% AI surcharge, Apple/Nvidia named. The REAL constraint is CoWoS packaging (Nvidia holds >half of 2026-27), not wafers; Taiwan keeps ~85% of sub-5nm through 2030 (MOEA). China friction now runs BOTH directions (Taiwan export curbs weighed; China reportedly weighing a local-use ban, 07-21). \"Nvidia overtook Apple as top customer\" is contested, not settled. Our ~90% advanced-node anchor is carried, not re-verified. Next: Q3 earnings.","timeline":[{"date":"2026-08-04","html":"<strong>the human toll, missing from this record for a week<\/strong>","tag":"steer 2026-08-04"},{"date":"2026-07-30","html":"<strong>\"Limited impact\" verdict lands, not unanimous; Tokyo Electron's exposure gets a number; 1.4nm pulls ahead<\/strong><ul><li><strong>A \"limited impact\" verdict on the Kumamoto quake lands<\/strong> (Focus Taiwan, GuruFocus) — JASM utilities back to normal, construction resumed (Digitimes, 07-29) — but not unanimous: Korea JoongAng Daily still frames full-normal-production as delayed.<\/li><li><strong>Tokyo Electron's Kyushu exposure now has a number: ~91% global share<\/strong> of an equipment category (XenoSpectrum) — sharper than the 07-29 entry's vague \"some equipment categories.\"<\/li><li><strong>Separately, not quake-related: TSMC's 1.4nm (A14) fab is ahead of schedule<\/strong> — first building before April 2027, mass production mid-2028 (TrendForce/Wccftech) — a real roadmap acceleration.<\/li><\/ul>","tag":"daily 2026-07-30"},{"date":"2026-07-29","html":"<strong>Kumamoto restoration in stages; the bigger exposure is Tokyo Electron's, not TSMC's<\/strong><ul><li><strong>TSMC's Kumamoto fab is structurally intact, with employees safe and operations being restored in stages after Tuesday's M7.1 quake<\/strong> — no resumption date was given. (<a href=\"https://www.taipeitimes.com/News/taiwan/archives/2026/07/29/2003861588\">Taipei Times<\/a>)<\/li><li><strong>The site is under 3% of TSMC's total capacity<\/strong>; the larger supply-chain exposure flagged is Tokyo Electron Kyushu's share of some equipment categories, not TSMC output.<\/li><\/ul>","tag":"daily 2026-07-29"},{"date":"2026-07-28","html":"<strong>7.1 earthquake hits TSMC's Kumamoto plant<\/strong><ul><li><strong>A 7.1-magnitude earthquake struck Kumamoto, Japan<\/strong>, prompting a tsunami warning and a precautionary staff evacuation at TSMC's JASM fab; TSMC confirmed all personnel safe and structural integrity intact after inspection, with operations \"gradually resuming\" the same day. TSM shares fell ~3.6% on 07-28, though coverage splits the cause between the earthquake and separate export-control/macro concerns — not a clean single-cause read. (<a href=\"https://focustaiwan.tw/business/202607280018\">Focus Taiwan<\/a> · <a href=\"https://www.tradingkey.com/news/market-movers/262059040-market-movers-tsm-20260728\">TradingKey<\/a>)<\/li><\/ul>","tag":"daily 2026-07-28"}],"timeline_truncated":false,"crawled":"2026-07-28"},{"slug":"arm-royalty-regime","title":"Arm Royalty Regime","kind":"story","status":"open","lens":"ai","opened":"2026-07-28","last_seen":"2026-07-31","parent":null,"genre":"authority-claim","weight":2,"entities":["arm","softbank","qualcomm"],"watch":"The ~$800B-gravity ISA chokepoint: SoftBank's 87.1% leaned on as LOAN COLLATERAL, not sold. Post-Qualcomm-trial (Arm's last claim rejected 2025-10-01; appealing) the design-around threat is funded in the open — Qualcomm bought Ventana, chased Tenstorrent $8-10B. Arm answered by ending pure-rentier status: first in-house chip in 35 years (the \"AGI CPU,\" Mar-26, Meta launch customer) — now competing with its own licensees. Royalties real (4 straight >$1B quarters, v9+CSS). Stock -28% into earnings 07-29 — the live test.","timeline":[{"date":"2026-07-31","html":"<strong>A one-day snapback: Arm +9% on the broad Tokyo chip rally<\/strong><ul><li><strong>Arm rose 9% overnight<\/strong> as part of a broad Tokyo AI/semiconductor rally (Nikkei 225 +4.37%) triggered by strong US tech earnings — reversing, at least for one session, the guidance-cut selloff that closed out 07-29's beat-and-raise coverage. See <code>softbank-all-in<\/code> for the fuller Tokyo-session read (SoftBank itself hit limit-up the same day, still ahead of its own 08-06 earnings). (<a href=\"https://www.bloomberg.com/jp/news/articles/2026-07-31/TJ0K57KJH6V400\">Bloomberg Japan<\/a>)<\/li><\/ul>","tag":"daily 2026-07-31"},{"date":"2026-07-29","html":"<strong>A clean beat-and-raise, and the stock fell anyway<\/strong><ul><li><strong>Q1 FY2027: revenue $1.289B (+22%), royalty $715M (a Q1 record), licensing $574M (a Q1 record), non-GAAP EPS $0.45<\/strong> — all above consensus, with Q2 guidance ($1.38B / $0.47) also above estimates. (<a href=\"https://newsroom.arm.com/news/arm-q1-fye27-results\">Arm Newsroom<\/a>)<\/li><li><strong>AGI-CPU demand now exceeds $2B across FY27-FY28, double the initial forecast<\/strong>, with capacity already sold out and data-center royalty revenue more than doubling year-over-year — the AI-specific story genuinely strengthened. (<a href=\"https://newsroom.arm.com/news/arm-q1-fye27-results\">Arm Newsroom<\/a>)<\/li><li><strong>What actually moved the stock: full-year royalty growth guidance was cut to \"high teens\" from roughly 20%<\/strong>, on expected double-digit smartphone-market weakness. The stock fell further after-hours (-7 to -8%) and stayed down premarket (-4.95%), extending the pre-earnings -28% run rather than reversing it. (<a href=\"https://www.marketscreener.com/news/arm-shares-dive-after-hours-despite-forecasts-above-estimates-ce7f51d3dc81f726\">MarketScreener<\/a>)<\/li><li><strong>This is the sharpest rotation-away-from-chips signal of the four prints tonight<\/strong> — a genuinely good AI-specific number was not enough to buy relief once a legacy-business guidance cut sat next to it.<\/li><\/ul>","tag":"daily 2026-07-29"}],"timeline_truncated":false,"crawled":"2026-07-28"},{"slug":"intel-rescue","title":"Intel Rescue","kind":"story","status":"open","lens":"global-capital","opened":"2026-07-28","last_seen":"2026-07-28","parent":null,"genre":"financing","weight":2,"entities":["intel"],"watch":"The subsidized-builder paradox, filing-pinned: $10.9B outside equity (US $8.9B/9.9%-at-announce, 8.6% now — crawl 07-28; the real mechanism is a 240.5M-share WARRANT that triggers only if foundry ownership drops below 51%, a breakup poison pill; Nvidia $5B + real x86/NVLink co-design; SoftBank $2B, now pinned) taken in the SAME six-week window as 24k layoffs and the DE/PL fab kills. Thrust ≈ 0 stands. Turnaround thesis = 18A/14A: risk production 06-26, \"running smoothly,\" no yield % anywhere; customers accumulating (Maia 2, Tesla $20B Terafab, Apple prelim Trump-confirmed, Fortinet), none lost. Ohio slipped to 2030-31. CXMT's cap passed Intel's the week Intel shed ~$90B.","timeline":[{"date":"2026-07-26","html":"<strong>The stake, marked to market: $8.9B → $36-42B<\/strong><ul><li><strong>The government's Intel stake is now worth $36-42B<\/strong>, up from the $8.9B paid — cited alongside a wider, uncoordinated federal equity portfolio: ~$26.7B across ~30 equity/quasi-equity deals scattered across Commerce (17), Defense (7), DFC (6), and Energy (2), with <strong>no centralized oversight<\/strong> (no TARP-style inspector general or GAO audit equivalent). Directly answers this thread's \"does the state stake change behavior\" watch: so far, no — it's accumulating with no visible governance layer. (<a href=\"https://fortune.com/2026/07/26/the-u-s-government-invested-27-billion-in-corporate-stakes-good-luck-finding-them/\">Fortune<\/a>)<\/li><li><strong>⚠ Contradiction, unresolved — three figures, one stake:<\/strong> Trump says the position \"made about $70 billion in eight or nine months\"; a separate Yahoo Finance/Treasury-sourced figure puts unrealized gains at \"roughly $47.6 billion\" (implying ~$56.5B current value); Fortune/ TheNextWeb/Biggo separately size the whole position at $36-42B. None of the three reconcile with each other on the same $8.9B cost basis. Flagging, not resolving — worth a dedicated crawl if Ben wants the real number. (<a href=\"https://finance.yahoo.com/economy/policy/articles/trump-says-government-intel-stake-143115077.html\">Yahoo Finance<\/a>)<\/li><\/ul>","tag":"daily 2026-07-28"},{"date":"2026-07-23","html":"<strong>Q2 2026: the best quarter in ~15 years<\/strong><ul><li><strong>Revenue $16.13B (+25% YoY, fastest growth in ~15 years), adjusted EPS $0.42 vs $0.21 expected<\/strong> — AI-driven business (Foundry + AI-adjacent products) grew 70%+ YoY and now runs ~70% of revenue; gross margin 41.8%, ~280bp above guidance. Stock fell 2.46% in the regular session to $100.10, then rose 3.44% after-hours as investors digested the beat. 2026 capex guidance raised to $20B+. (<a href=\"https://www.tradingkey.com/analysis/stocks/us-stocks/262050823-intel-earnings-report-q2-2026-intc-ai-data-center-intel-foundry-tradingkey\">TradingKey<\/a>)<\/li><li><strong>This is the first real revenue evidence behind the turnaround thesis<\/strong> this thread tracks (18A/14A execution, foundry customer wins) — thrust was reading ≈0 in the crawl; today's print is the first print that argues otherwise, pending confirmation the AI-segment growth holds.<\/li><\/ul>","tag":"daily 2026-07-28"}],"timeline_truncated":false,"crawled":"2026-07-28"},{"slug":"coreweave-backlog-bet","title":"CoreWeave Bet","kind":"story","status":"open","lens":"global-capital","opened":"2026-07-28","last_seen":"2026-08-04","parent":null,"genre":"financing","weight":2,"entities":["coreweave","nvidia"],"watch":"The neocloud wager, quantified: $99.4B backlog (Q1-26; OpenAI $18.4B + Meta $21B/to-2032 + Jane Street $6B) vs revenue $2.08B and a $740M quarterly loss — everything rides on conversion. Financed at 9.75% GPU-collateralized just as Nvidia CDS widened (07-27) and Moody's named CoreWeave+Oracle \"AI's weakest credit link\" (07-25). Disclosure RETREATED: customers anonymized to A-D in the 10-Q (S-1 said 77% from top two). Nvidia's \"~11%\" stake is journalist-derived, 13F-only. Core Scientific rejection left a 4.5-month capacity gap; plan B is thin. Next print: Q2 earnings 08-11.","timeline":[{"date":"2026-08-04","html":"<strong>+20% on new government and international demand<\/strong><ul><li><strong>A Leidos partnership to supply AI cloud infrastructure to US defense/intelligence agencies, plus a first APAC expansion<\/strong> (three Indonesia data centers, 360MW) — sets up the 08-11 Q2 print. (<a href=\"https://www.fxleaders.com/news/2026/08/04/coreweave-crwv-stock-jumps-20-as-us-government-ai-deal-sparks-massive-rally/\">FX Leaders<\/a>)<\/li><\/ul>","tag":"daily 2026-08-04"},{"date":"2026-07-30","html":"<strong>A rejected suitor's rebound, and a sweetened loan<\/strong><ul><li><strong>AMD signed a $14B infrastructure deal with Core Scientific<\/strong> — up to 2.5GW of AI data-center capacity (530MW initial phase, 15-year term, warrants for 30M CORZ shares) — the same company CoreWeave's $9B all-stock bid was rejected by in Oct-2025. Core Scientific shares rose on the news even as its Q2 print showed a wider-than-expected loss. Directly on this thread's \"plan B is thin\" watch line: the rejected target is thriving without CoreWeave. (Reuters + Core Scientific's own release, event dated 07-28)<\/li><li><strong>CoreWeave sweetened terms on its $2.6B loan tied to Anthropic<\/strong> amid investor caution over its debt load — a concrete instance of the 9.75%-coupon, GPU-collateralized AI-credit repricing this thread already tracks (Bloomberg-sourced via multiple outlets; exact new yield not independently confirmed, event dated 07-29).<\/li><li><strong>Stock extended its slide<\/strong> — ~26% over the past 5 sessions (Trefis), continuing the pattern already on file.<\/li><\/ul>","tag":"daily 2026-07-30"},{"date":"2026-07-28","html":"<strong>Stock slides further despite one new logo<\/strong><ul><li><strong>Shares down ~30% in a month, ~43% over the past year<\/strong> — the sell-off tracks a wider AI-cloud re-rating (bottom-line discipline over growth-at-all-costs) plus a Bloomberg report that Meta is building its own AI cloud-infrastructure business, a potential competitive threat. (<a href=\"https://www.benzinga.com/trading-ideas/movers/26/07/60734642/coreweave-shares-fall-30-in-a-month-as-ai-cloud-valuations-contract\">Benzinga<\/a>)<\/li><li><strong>Flow Traders signed as a new customer<\/strong> — training foundation models for its AI-driven quant trading strategy on CoreWeave Cloud, chosen after a competitive eval of multi-node training performance. Continues the diversification away from the top-two-customer concentration this thread already flags, though not enough to move the stock today. (<a href=\"https://ca.investing.com/news/stock-market-news/flow-traders-selects-coreweave-for-ai-training-workloads-93CH-4756697\">Investing.com<\/a>)<\/li><li><strong>Note, not a new signal:<\/strong> CEO Michael Intrator and CDO Brannin McBee have both been selling stock through July under pre-arranged 10b5-1 plans (Intrator: ~370K shares 07-07/08, ~199K 07-14, ~304K 07-21; McBee: similar cadence) — routine and disclosed, not a fresh pre-earnings signal, but the run-rate is large enough to track into 08-11. (<a href=\"https://www.investing.com/news/insider-trading-news/coreweave-ceo-michael-intrator-sells-2407m-in-company-shares-93CH-4810342\">Investing.com<\/a>)<\/li><\/ul>","tag":"daily 2026-07-28"},{"date":"2025-03-28","html":"<strong>IPO<\/strong><ul><li><strong>Nasdaq debut<\/strong> — CoreWeave IPOs at $40/share, ~$23B initial valuation, the biggest US tech IPO since 2021. (<a href=\"https://news.google.com/rss/search?q=CoreWeave%20IPO%20March%202025%20Nasdaq\">CNBC<\/a>)<\/li><\/ul>","tag":"crawl 2026-07-28"},{"date":"2025-03-10","html":"<strong>OpenAI signs as anchor customer<\/strong><ul><li><strong>$11.9B / 5 years<\/strong> — OpenAI commits to CoreWeave for AI data centers and compute; OpenAI also receives $350M in CoreWeave equity as part of the deal. (<a href=\"https://news.google.com/rss/search?q=CoreWeave%20OpenAI%20%2411.9%20billion%20five%20years\">CNBC/Reuters<\/a>)<\/li><\/ul>","tag":"crawl 2026-07-28"},{"date":"2025-07-07","html":"<strong>the $9B Core Scientific bid<\/strong><ul><li><strong>All-stock acquisition announced<\/strong> — CoreWeave moves to buy bitcoin miner turned datacenter operator Core Scientific for ~$9B, a bid to own real estate outright instead of leasing. (<a href=\"https://news.google.com/rss/search?q=CoreWeave%20Core%20Scientific%20%249%20billion%20acquisition\">CNBC<\/a>)<\/li><li><strong>Shareholder revolt builds<\/strong> — largest holder Two Seas Capital says it will vote against, citing undervaluation; both ISS and Glass Lewis recommend against by late October. (<a href=\"https://news.google.com/rss/search?q=Two%20Seas%20Capital%20Core%20Scientific%20vote%20against\">Reuters<\/a>)<\/li><li><strong>Deal rejected, 2025-10-30<\/strong> — Core Scientific shareholders vote the deal down; termination announced same day. No new-capacity deal surfaces for the following ~4.5 months — the visible \"plan B\" (BCE Canada, Conapto Sweden, EdgeConneX Texas) doesn't start until March 2026, and a separate Poolside Texas deal is later terminated outright. (<a href=\"https://news.google.com/rss/search?q=Core%20Scientific%20shareholders%20reject%20CoreWeave%20deal\">Reuters/Bloomberg/WSJ<\/a>)<\/li><\/ul>","tag":"crawl 2026-07-28"},{"date":"2025-09-25","html":"<strong>OpenAI expands, diversification begins<\/strong><ul><li><strong>+$6.5B<\/strong> — OpenAI-CoreWeave deal expands; Reuters frames the quarter as CoreWeave's active diversification push away from Microsoft concentration. Meta ($21B, through 2032, announced 2026-04-09), Anthropic, and Jane Street ($6B) follow as named customers through mid-2026. (<a href=\"https://news.google.com/rss/search?q=CoreWeave%20OpenAI%20expanded%20deal%20%246.5%20billion\">CNBC/WSJ/Reuters<\/a>)<\/li><\/ul>","tag":"crawl 2026-07-28"},{"date":"2026-03-06","html":"<strong>backlog crosses $66.8B<\/strong><ul><li><strong>Q4 2025 print<\/strong> — backlog reported at $66.8B, up from $55.6B the prior quarter. (<a href=\"https://news.google.com/rss/search?q=CoreWeave%20%2466.8B%20backlog%20Q4%202025\">Yahoo Finance<\/a>)<\/li><\/ul>","tag":"crawl 2026-07-28"},{"date":"2026-05-08","html":"<strong>Q1 2026: backlog to $99.4B, loss doubles<\/strong><ul><li><strong>Backlog $99.4B<\/strong> — as of quarter-end, naming Nvidia, Meta, Microsoft, and OpenAI as contract counterparties. (<a href=\"https://news.google.com/rss/search?q=CoreWeave%20%2499.4B%20backlog%20Q1%202026\">grafa.com/TIKR/Yahoo Finance<\/a>)<\/li><li><strong>Revenue $2.08B (+112% YoY), net loss $740M<\/strong> — loss more than doubled from Q1 2025's $315M; stock fell 10% on the print despite the growth. Confirmed directly from CoreWeave's own 10-Q (SEC EDGAR). (SEC EDGAR 10-Q, accession 0001769628-26-000222)<\/li><\/ul>","tag":"crawl 2026-07-28"},{"date":"2026-05-15","html":"<strong>Nvidia's stake surges (percentage unconfirmed)<\/strong><ul><li><strong>13F shows ~94.5% increase<\/strong> in Nvidia's CoreWeave position; press derives a ~11% ownership figure from the filing (not itself a primary-source-stated percentage — 13Fs disclose share count/value, not %). No SC 13D/13G exists; Nvidia's stake is disclosed institutional-style (13F only), not as an activist position. (<a href=\"https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&amp;CIK=0001045810\">SEC EDGAR 13F<\/a> / <a href=\"https://news.google.com/rss/search?q=Nvidia%20CoreWeave%20stake%20percent%20SEC%20filing\">press<\/a>)<\/li><\/ul>","tag":"crawl 2026-07-28"},{"date":"2026-07-16","html":"<strong>the AI-credit repricing arrives<\/strong><ul><li><strong>Nvidia CDS widens<\/strong> — five-plus outlets converge on Nvidia credit protection costs surging (one report: 69bp, its credit risk now exceeding Google's) the same week bond-market anxiety over AI capex budgets breaks into mainstream coverage (CNBC, 07-24) and Moody's separately flags Oracle and CoreWeave as AI's \"weakest credit link\" (07-25) — the exact backdrop CoreWeave's 9.75%-coupon, GPU-collateralized debt (senior notes, convertibles, an SPV junk bond) sits inside. (<a href=\"https://news.google.com/rss/search?q=Nvidia%20CDS%20credit%20default%20swap%20spreads%20widen%20July%202026\">Crypto Briefing/CNBC/Bitget<\/a>)<\/li><\/ul>","tag":"crawl 2026-07-28"},{"date":"2026-07-27","html":"<strong>Q2 2026 earnings dated<\/strong><ul><li><strong>Call set for 2026-08-11<\/strong>, 5:00 PM ET — consensus estimates run EPS −$1.27, revenue $2.56B. This is the next print for backlog conversion and debt-cost commentary. (<a href=\"https://www.stocktitan.net/news/CRWV/\">stocktitan.net/Benzinga<\/a>)<\/li><\/ul>","tag":"crawl 2026-07-28"}],"timeline_truncated":false,"crawled":"2026-07-28"},{"slug":"asset-managers-build-ai","title":"Asset Managers Build","kind":"story","status":"open","lens":"global-capital","opened":"2026-07-28","last_seen":"2026-07-27","parent":null,"genre":"capital-flow","weight":2,"entities":["blackrock"],"watch":"The capital pools stopped just financing the buildout and started OWNING it: BlackRock's GIP closed the $40B Aligned acquisition (with MGX/AIP), bought 80% of Meta's Hyperion, and ran the $12.5B El Paso bond; KKR launched the $10B Helix venture (Kuwait SWF + Nvidia + Vistra). One cohort thread, not one per manager. Track: who buys the next hyperscaler asset, the SWF co-investor pattern, and whether \"locked\" fiduciary capital keeps sliding into physical AI infra.","timeline":[{"date":"2026-07-27","html":"<strong>KKR joins ⟨seed 2026-07-28⟩<\/strong><ul><li><strong>KKR launched the $10B \"Helix\" AI-infrastructure venture<\/strong> — Kuwait's sovereign fund + Nvidia + Vistra as partners.<\/li><\/ul>","tag":"seed"},{"date":"2026-07-23","html":"<strong>The Meta positions ⟨seed 2026-07-28⟩<\/strong><ul><li><strong>GIP/Blue Owl-adjacent wave:<\/strong> Blue Owl took 80% of Hyperion (5GW, $50B+); <strong>BlackRock's $12.3B El Paso bond<\/strong> drew soft demand (07-24) then rallied and upsized to <strong>$12.5B<\/strong> (07-27) — the live test of debt appetite for hyperscaler assets, passed on the second try.<\/li><\/ul>","tag":"seed"},{"date":"2026-07-21","html":"<strong>The anchor position ⟨seed 2026-07-28⟩<\/strong><ul><li><strong>BlackRock's GIP closed the $40B Aligned Data Centers acquisition<\/strong> (with MGX + AIP) — the largest single asset-manager position in the physical buildout; the 07-21 daily's \"+$5B\" item was incremental to it.<\/li><\/ul>","tag":"seed"}],"timeline_truncated":false,"crawled":null},{"slug":"softbank-all-in","title":"Son All-In","kind":"story","status":"open","lens":"global-capital","opened":"2026-07-28","last_seen":"2026-08-04","parent":null,"genre":"hedge","weight":2,"entities":["softbank","masayoshi-son"],"watch":"The empire's concentration play, assembled from pieces other threads carry singly: the $40B OpenAI-stake loan (21 lenders), the 10GW Ohio Stargate campus (the one Nvidia may guarantee $250-500B against), Arm's 87.1% pledged as loan collateral ($5B sought + a $20B margin loan with an unresolved Dec-25 deadline), the $2B Intel stake, a renewed $10B OpenAI-collateral loan. Everything Son owns now collateralizes everything else. A fourth front, found by the 2026-08-04 crawl: SoftBank is SELF-FUNDING the bet by selling down other holdings (its entire $5.83B Nvidia stake, $9.17B of T-Mobile), while Vision Fund's ~$46B FY2025 gain is confirmed to trace almost entirely to the OpenAI markup — a concentrated bet wearing a diversified-fund wrapper, not a real hedge — against Coupang/DiDi/ Klarna/ByteDance losses in the same period. A new lever entirely: a $5.375B ABB Robotics acquisition feeding a planned ~$100B \"Roze\" physical-AI/data-center-robotics IPO targeted H2 2026. CreditSights sizes a $32B two-year funding gap; rating agencies diverge (Moody's stable Sep-25, S&P negative Mar-26 over buybacks-while-borrowing); stock down ~50% since June on a beat-and-drop earnings pattern. Track: the loan stack's health vs the AI-credit repricing, any forced Arm monetization, Stargate milestones, the funding-gap figure, and whether Roze/ABB actually reaches IPO.","timeline":[{"date":"2026-08-04","html":"<strong>How the bet is funded, the \"Physical AI\" fourth lever, and Vision Fund's real concentration ⟨crawl 2026-08-04⟩<\/strong><ul><li><strong>SoftBank sold its entire Nvidia stake — 32.1M shares, $5.83B — disclosed 2025-11-11 (shares sold Oct 2025), proceeds earmarked toward the OpenAI investment; it also sold part of its T-Mobile stake for $9.17B in the same round.<\/strong> This is the funding side of the loan stack the thread already tracks — SoftBank isn't only pledging assets as collateral, it's actively liquidating legacy holdings. (<a href=\"https://www.cnbc.com/2025/11/11/softbank-sells-its-entire-stake-in-nvidia-for-5point83-billion.html\">CNBC<\/a>)<\/li><li><strong>A self-imposed 25% loan-to-value limit is constraining further margin borrowing<\/strong>, and independent credit research (CreditSights) sizes a <strong>$32B funding gap over the next two years<\/strong>, combining bond maturities with signed obligations including the ABB Robotics deal below; <strong>$30B specifically falls due in H2 2026.<\/strong> (<a href=\"https://www.ad-hoc-news.de/boerse/news/ueberblick/softbank-s-infrastructure-bet-creates-a-32-billion-funding-gap/69276518\">ad-hoc-news.de<\/a>)<\/li><li><strong>A fourth lever alongside OpenAI/Arm/Stargate: SoftBank is acquiring ABB's robotics division for $5.375B<\/strong> (board-approved 2025-09-22, signed 2025-10-08, closing mid-to-late 2026), folding it into a new US-listed spinout called <strong>Roze<\/strong> — autonomous robots building AI data centers — targeting an IPO <strong>as early as H2 2026 at up to a $100B valuation<\/strong> (KPMG engaged; analyst day held July 2026). (<a href=\"https://group.softbank/en/news/press/20251008\">SoftBank Group<\/a>, <a href=\"https://finance.yahoo.com/sectors/technology/articles/softbank-plans-100b-u-ipo-115700056.html\">Yahoo Finance<\/a>)<\/li><li><strong>Vision Fund's FY2025 (year to March 2026) ~$46B gain and the Q4/Q3 gains before it were \"nearly all driven by OpenAI\"<\/strong> — SoftBank took losses in the same periods on Coupang, DiDi Global, Klarna and a ByteDance markdown. CFO Yoshimitsu Goto: <strong>~60% of SoftBank's total assets are now \"ASI-oriented investments.\"<\/strong> Answers this thread's open question on whether Vision Fund is a real hedge: it functions as a single concentrated position wearing a diversified-fund wrapper. (<a href=\"https://www.cnbc.com/2026/05/13/softbank-earnings-fy-2025-vision-fund-openai-stake.html\">CNBC<\/a>)<\/li><li><strong>Credit ratings are diverging, not moving together<\/strong>: Moody's upgraded SoftBank Group to Ba2/stable on 2025-09-17 (leverage reduction, transparency); <strong>S&amp;P instead revised its outlook to negative in March 2026<\/strong>, explicitly over running a ~¥2.5T ($24B) buyback alongside ~$41B of asset-sale fundraising. (<a href=\"https://www.bloomberg.com/news/articles/2025-09-17/moody-s-upgrades-softbank-s-debt-rating-on-credit-fundamentals\">Bloomberg<\/a>, S&amp;P Global Ratings)<\/li><li><strong>Market is pricing real stress ahead of the 08-06 print<\/strong>: stock down ~50% since early June 2026 despite three straight quarters of large EPS beats each followed by a stock decline (\"beat-and-drop\"); Deutsche Bank downgraded to Hold; CDS costs on SoftBank debt have risen; a technical \"dead cross\" formed 2026-07-28 ahead of the 2.6% Arm-sympathy drop already on this thread's 07-30/08-01 entries. (<a href=\"https://www.investing.com/news/stock-market-news/softbank-q1-earnings-preview-low-bar-arm-risk-and-the-beatanddrop-pattern-93CH-4832632\">Investing.com<\/a>)<\/li><li><strong>Confirmed: the 08-06 Group print has not happened yet<\/strong> as of 2026-08-04 (3-day GDELT sweep found no contradicting report); the SoftBank Corp/SoftBank Group entity-guard trap this thread flagged 08-03 is still live in the wires today. Arm ownership, primary-sourced: <strong>Arm's own SEC 6-K filing puts SoftBank's beneficial stake at ~86.4% as of 2026-05-21<\/strong> — close to, but below, the 87.1% currently on the board. (<a href=\"https://www.sec.gov/Archives/edgar/data/0001973239/000197323926000114/arm-20260630.htm\">SEC EDGAR<\/a>)<\/li><li><strong>Son's own framing treats the concentration as deliberate, not incidental<\/strong>: the strategy is branded internally as \"Izanagi\" (single- source, unconfirmed) and at a shareholder meeting Son said \"SoftBank's mission is to drive human evolution and realize ASI,\" predicting ASI \"10,000 times smarter than humans within a decade.\"  Full sourcing and confidence levels: <code>artifacts/findings/softbank-2026-08-04.md<\/code> and <code>artifacts/bundles/softbank-2026-08-04/provenance.yaml<\/code>.<\/li><\/ul>","tag":"crawl 2026-08-04"},{"date":"2026-08-03","html":"<strong>The one OpenAI-collateral loan lenders won't extend, ahead of the 08-06 print<\/strong><ul><li><strong>SoftBank's $6–10B OpenAI-stake margin loan stays stalled<\/strong> — distinct from the funded $40B OpenAI bridge (March 2027 maturity), the separate margin loan against the OpenAI stake remains stalled on \"valuation concerns\" (halted 06-10, renewed talks 07-01, no resolution), a lenders'-eye read on the OpenAI valuation as collateral, as Arm weakness compresses SoftBank's NAV into Thursday's 08-06 print. (Invezz/Investing.com; SoftBank IR, 08-03)<\/li><li>**⚠ Entity guard: the \"record SoftBank Q1\" on the overnight wires is SoftBank <em>Corp<\/em> (9434), not SoftBank <em>Group<\/em> (9984)<strong> — the domestic telecom carrier reported revenue ¥1,814.7B (+9% YoY) and operating income ¥302.3B on AI/cloud/financial-services strength. That is a different listed company from the Vision Fund/Arm/OpenAI holding vehicle this thread tracks, which reported nothing overnight and still prints <\/strong>08-06**. Moderate-confidence sourcing (wire pickups of an earnings-call transcript).<\/li><li>💡 <strong>Worth writing down as a standing trap:<\/strong> the two entities share a brand, a founder and a reporting season, and only one of them is the AI-financing story. Any \"SoftBank beats\" headline needs its ticker checked before it touches this thread.<\/li><\/ul>","tag":"daily 2026-08-03"},{"date":"2026-08-01","html":"<strong>The $40B OpenAI bridge loan's full structure, ahead of the 08-06 print<\/strong><ul><li><strong>The $40B bridge loan splits $30B flowing to OpenAI via Vision Fund 2 and $10B for general corporate use, drawn in $10B tranches on 2026-04-01, 2026-07-01 and a scheduled 2026-10-01.<\/strong> (<a href=\"https://www.bloomberg.com/news/articles/2026-07-27/softbank-s-40-billion-loan-for-openai-stake-gets-21-new-lenders\">Bloomberg<\/a>)<\/li><li><strong>Lead arrangers are JPMorgan, Goldman Sachs, Mizuho, SMBC and MUFG; the 07-27 syndication allocated roughly $7B across 21 new lenders, with First Abu Dhabi Bank, GIC and Standard Chartered each taking about $1B.<\/strong> (<a href=\"https://www.bloomberg.com/news/articles/2026-07-27/softbank-s-40-billion-loan-for-openai-stake-gets-21-new-lenders\">Bloomberg<\/a>)<\/li><li><strong>Effective interest cost is reported at approximately 6.14% (SOFR plus roughly 250bps), with the loan maturing 2027-03-25<\/strong> — the maturity date matches what this thread already had on record; the interest cost is new. (<a href=\"https://www.bloomberg.com/news/articles/2026-07-27/softbank-s-40-billion-loan-for-openai-stake-gets-21-new-lenders\">Bloomberg<\/a>)<\/li><li><strong>Arm's most recent quarterly print — record revenue of $1.289B, +22% — was followed by shares falling about 7% after hours to $209 on GAAP operating margin compression to 7.1% from 10.8%; SoftBank fell 3.2% to ¥6,367 in the following session, compounded by an HSBC downgrade.<\/strong> ⚠ These price moves are secondary-sourced and not exchange-verified.<\/li><\/ul>","tag":"daily 2026-08-01"},{"date":"2026-07-31","html":"<strong>Q1 earnings date was wrong (real date 08-06); stock hits limit-up on the Tokyo AI rally<\/strong><ul><li><strong>The ledger's SoftBank Q1 FY26 earnings date was wrong, not slipped<\/strong> — SoftBank's own IR page shows the Q1 FY2026 briefing scheduled for <strong>2026-08-06<\/strong> (report disclosed 3:30pm JST, briefing 4:30pm JST); all Q1 materials still show placeholders as of this check. The prior 07-30 date traced to a single uncorroborated secondary source. (<a href=\"https://group.softbank/en/event/earnings_2026q1\">SoftBank Group IR<\/a>)<\/li><li><strong>SoftBank shares hit the exchange's daily limit-up (+12-15%, to ~5,322 yen) and Arm rose 9% overnight<\/strong>, part of a broad Tokyo AI/semiconductor rally (Nikkei 225 +4.37%, Advantest and Tokyo Electron also limit-up) triggered by strong US tech earnings — reversing the \"rotation away from chips\" framing that closed out 07-29's Arm earnings coverage one trading day later, independent of SoftBank's own still-unreported results. (<a href=\"https://www.bloomberg.com/jp/news/articles/2026-07-31/TJ0K57KJH6V400\">Bloomberg Japan<\/a>, <a href=\"https://www.nikkei.com/article/DGXZQOFL3119J0R30C26A7000000/\">Nikkei<\/a>)<\/li><\/ul>","tag":"daily 2026-07-31"},{"date":"2026-07-28","html":"<strong>The bridge widens, and gets a maturity date<\/strong><ul><li><strong>SoftBank's $40B bridge loan against its OpenAI stake added 21 new lenders<\/strong> (reported 07-27, caught here by the cold rotation) — the syndicate widening rather than the exposure shrinking. (<a href=\"https://www.bloomberg.com/news/articles/2026-07-27/softbank-s-40-billion-loan-for-openai-stake-gets-21-new-lenders\">Bloomberg<\/a>)<\/li><li><strong>It matures 2027-03-25<\/strong> — now a ledger entry, because that date is a hard clock on the position and it falls <strong>before<\/strong> the 2027 window analysts are converging on for an OpenAI listing. Refinance, repay or extend: whichever happens, it dates the liquidity story this thread tracks.<\/li><\/ul>","tag":"daily 2026-07-28"},{"date":"2026-07-27","html":"<strong>The stack, assembled ⟨seed 2026-07-28⟩<\/strong><ul><li><strong>The concentration picture<\/strong> (pieces from stargate-buildout, openai-ipo-timing, arm-royalty-regime, intel-rescue — first drawn together here): the <strong>$40B OpenAI-stake loan<\/strong> added 21 lenders (Standard Chartered, GIC named; expanding, not closed) · the <strong>10GW Ohio Stargate campus<\/strong> is the asset Nvidia may guarantee $250-500B against · <strong>Arm's 87.1% pledged as collateral<\/strong> ($5B loan sought Oct-25; a $20B margin loan hit a Dec-25 deadline, outcome unresolved) · <strong>$2B into Intel<\/strong> (backing Tan personally) · a <strong>renewed $10B OpenAI-collateral loan<\/strong> (Jul-26). Everything collateralizes everything else — the empire is one correlated bet on AI credit staying open.<\/li><\/ul>","tag":"seed"}],"timeline_truncated":false,"crawled":null},{"slug":"oracle-stargate-bet","title":"Oracle's Stargate Bet","kind":"story","status":"open","lens":"global-capital","opened":"2026-08-04","last_seen":"2026-08-04","parent":null,"genre":"financing","weight":2,"entities":["oracle","larry-ellison","openai","softbank","mgx"],"watch":"Whether the FY27 capex step-up (~$70-95B, depending on source) and a reported (thinly sourced) OpenAI target-miss show up in the 2026-09-14 Q1 FY27 prin
