ndonesia data centers, 360MW) — sets up its 08-11 Q2 print. (<a href=\"https://www.fxleaders.com/news/2026/08/04/coreweave-crwv-stock-jumps-20-as-us-government-ai-deal-sparks-massive-rally/\">FX Leaders<\/a>)","url":"https://www.fxleaders.com/news/2026/08/04/coreweave-crwv-stock-jumps-20-as-us-government-ai-deal-sparks-massive-rally/","source":"FX Leaders","threads":["coreweave-backlog-bet"],"entities":["coreweave"],"axis":"markets-and-flows","sev":null,"interpretation":null,"interpretation_id":null},{"id":"u:www.cnbc.com/2026/08/04/spacex-spcx-earnings-live-updates-q2","day":"2026-08-04","lens":"global-capital","title":"SpaceX beat cleanly, and capex sank it anyway.","html":"<strong>SpaceX beat cleanly, and capex sank it anyway.<\/strong> Revenue $7.8B (+92% YoY, beat ~$6.75-6.9B consensus); EPS -$0.09, far narrower than every tracked compiler's spread; adjusted EBITDA $3.5B (+191% YoY). Starlink led at $4.3B (the only profitable segment); the AI segment nearly tripled to $2.6B revenue but posted a $1.3B operating loss. Capex hit $18.4B, up 6x YoY, with $15.8B specifically AI-infrastructure — that number, not the beat, is what drove shares from +9.4% intraday to as much as -8.6% after-hours. Directly validates the \"zero-AI-value\" framing already on this thread (Morgan Stanley's 07-24 note). Management guided to a $100B annualized revenue run-rate by end of 2026. [Ledger: <code>spacex-q2-earnings<\/code> hit, full detail in upcoming.yaml.] (<a href=\"https://www.cnbc.com/2026/08/04/spacex-spcx-earnings-live-updates-q2-2026.html\">CNBC<\/a>, <a href=\"https://www.npr.org/2026/08/04/nx-s1-5918536/spacex-first-earnings-report-since-ipo\">NPR<\/a>)","url":"https://www.cnbc.com/2026/08/04/spacex-spcx-earnings-live-updates-q2-2026.html","source":"CNBC","threads":["spacexai-public-megacap"],"entities":["spacex"],"axis":"markets-and-flows","sev":"major","interpretation":{"mechanism":"The same night's two biggest earnings prints (SpaceX and AMD) both beat cleanly and both sold off, and the shared mechanism is that investors have stopped rewarding an AI-capex beat on its own terms — they are pricing the capex line itself as a cost center until proven otherwise. SpaceX's AI segment tripled revenue but posted a $1.3B operating loss against $15.8B of AI-infrastructure capex specifically — a six-fold YoY jump — and the stock's intraday +9.4%-to-after-hours -8.6% swing shows the market reacting to the capex number, not the revenue beat. This directly validates the \"zero-AI-value\" framing already tracked on this thread (Morgan Stanley's 07-24 note argued a ~$100 share price implies zero value for the AI segment).","confidence":"plausible","scenarios":[{"direction":"The market's capex-as-cost read hardens across the sector — more beat-and-raise prints get sold off on capex/margin lines rather than rewarded on revenue, becoming the standing rule for how AI-infrastructure names get priced this earnings season.","why":"SpaceX and AMD are two independent, same-night instances of the identical pattern (beat cleanly, sell off on the capex/margin story) — two data points on the same night is a real signal, not noise, especially when the two companies don't compete directly.","precedent":"Oracle's equity-vs-credit divergence (tracked on this map since 07-09/07-17) already showed credit markets pricing distress from AI capex while equity still rewarded growth — SpaceX/AMD's same-night sell-off is the equity market itself starting to adopt the credit market's skepticism."},{"direction":"The AI segment's growth rate (nearly tripled YoY) proves out over the next 1-2 quarters into profitability or a clearer path to it, and the market's capex punishment this print is revealed as premature — a buying opportunity rather than a repricing.","why":"Management guided to a $100B annualized revenue run-rate by end of 2026; if that materializes with the AI segment's loss narrowing, the capex will have been the necessary front-loaded cost of the growth the market wanted, not a red flag.","precedent":null}],"context_note":"First public earnings since SpaceX's IPO, so there is no same-company precedent for how the market treats its prints — the AMD comparison the same night is the closest available reference. The insider-lockup first tranche (up to 20% of ~911.5M restricted shares) follows 08-06, two trading days out, and will test whether this sell-off compounds into real supply pressure."},"interpretation_id":"2026-08-04--spacex-beat-cleanly-and-capex-sank-it-anyway"},{"id":"u:ir.amd.com/news-events/press-releases/detail/1295/amd-report","day":"2026-08-04","lens":"global-capital","title":"AMD beat and raised, fell 8-9% anyway","html":"<strong>AMD beat and raised, fell 8-9% anyway<\/strong> — the same pattern the same night, a different mechanism. Revenue $11.536B (record, +50% YoY) and Data Center $6.718B (+107% YoY) both cleared consensus; Q3 guide ~$13B. Coverage attributes the sell-off to stretched valuation (AMD trading above Nvidia's multiples) and flat 56% margin guidance — Wall Street wanted a blowout Q3 forecast, not an in-line beat. [Ledger: <code>amd-q2-2026-earnings<\/code> hit, full detail in upcoming.yaml.] (<a href=\"https://ir.amd.com/news-events/press-releases/detail/1295/amd-reports-second-quarter-2026-financial-results\">AMD IR<\/a>, <a href=\"https://www.benzinga.com/markets/tech/26/08/60936941/amd-earnings-stock-after-hours-wall-street-forecast\">Benzinga<\/a>)","url":"https://ir.amd.com/news-events/press-releases/detail/1295/amd-reports-second-quarter-2026-financial-results","source":"AMD IR","threads":["amd"],"entities":["amd"],"axis":"markets-and-flows","sev":null,"interpretation":{"mechanism":"Unlike SpaceX, AMD's sell-off is not obviously about capex spend directly — AMD is a chip supplier, not an infrastructure operator, so it does not carry SpaceX's own capex line. Coverage instead attributes the drop to valuation (AMD trading above Nvidia's own multiples despite Nvidia's larger scale and moat) and flat 56% margin guidance into Q3 — the market wanted evidence of margin expansion or a blowout Q3 forecast to justify the multiple, and got an in-line beat instead. The mechanism is adjacent to SpaceX's, not identical: both are the market raising its bar for what counts as good news inside an AI-buildout print, just applied to different line items (capex vs margin/valuation).","confidence":"plausible","scenarios":[{"direction":"AMD's valuation compresses toward Nvidia's historical re-rating pattern as the market demands margin proof before rewarding revenue growth alone — the stock underperforms the sector into Q3 unless margin guidance improves.","why":"Wall Street's explicit ask (a blowout Q3 forecast, not an in-line one) signals the bar has already moved; an unchanged margin guide next quarter would confirm the market's skepticism rather than resolve it.","precedent":null},{"direction":"The Anthropic/Meta/Microsoft/Oracle Helios shipment ramp (beginning later in Q3, per CEO Su) delivers margin expansion as volume scales, and the multiple re-rates back up on realized execution rather than promised deals.","why":"AMD reaffirmed the up-to-2GW Anthropic partnership and named four other hyperscaler recipients for Helios racks — if shipments convert to revenue at the guided pace, the current sell-off reads as a buying window rather than a valuation ceiling.","precedent":"AMD's own Data Center segment already grew 107% YoY this quarter (well above the ~85% implied by consensus modeling of the Anthropic/OpenAI/Meta deal pipeline), so the deals are already converting to revenue at a visible pace — the question is margin, not whether the revenue shows up."}],"context_note":"Read alongside SpaceX's same-night sell-off (spacex-beat-cleanly-and- capex-sank-it-anyway, above) as two instances of the same underlying market mood — AI-infrastructure prints are being graded on a stricter curve than a headline beat alone satisfies."},"interpretation_id":"2026-08-04--amd-beat-and-raised-fell-8-9-anyway"},{"id":"u:finance.yahoo.com/technology/ai/articles/nvidia-750-billion-","day":"2026-08-04","lens":"global-capital","title":"Nvidia in talks for up to $750B in AI deals","html":"<strong>Nvidia in talks for up to $750B in AI deals<\/strong> — $500B+ with SK Group, and up to $250B in lease guarantees to help OpenAI finance data-center compute. Terms still in flux; this is the same circular-financing mechanism already tracked on Oracle (Nvidia funding the buyers of its own chips), at a scale an order of magnitude larger than anything on this map so far. (<a href=\"https://finance.yahoo.com/technology/ai/articles/nvidia-750-billion-deals-revive-102003935.html\">Yahoo Finance<\/a>)","url":"https://finance.yahoo.com/technology/ai/articles/nvidia-750-billion-deals-revive-102003935.html","source":"Yahoo Finance","threads":["nvidia-vendor-financing","ai-circular-financing-risk"],"entities":["nvidia","openai"],"axis":"deals-and-filings","sev":null,"interpretation":{"mechanism":"This is the circular-financing mechanism already tracked on this map via Oracle's credit-vs-equity divergence — Nvidia funding (via lease guarantees, equity stakes, or financing arrangements) the very customers who buy its chips, which inflates near-term reported demand without necessarily reflecting independent end-customer economics. The reported scale here ($750B, split ~$500B+ SK Group and up to $250B in OpenAI lease guarantees) is roughly an order of magnitude larger than any single circular-financing arrangement previously recorded on this map, which is why it revives rather than merely extends the existing scrutiny.","confidence":"speculative","scenarios":[{"direction":"The deals close near the reported scale, and scrutiny of Nvidia's balance-sheet exposure to its own customers' ability to pay intensifies — echoing the Oracle CDS/credit story but for the company sitting at the center of the entire AI-compute supply chain rather than one cloud vendor.","why":"A $750B financing exposure, if real, would make Nvidia's own credit and equity story directly hostage to whether OpenAI and SK Group's AI businesses generate enough revenue to justify the compute they're being financed to buy — the same structural question Oracle's smaller-scale version already raises.","precedent":"Oracle's AI-capex-funded growth story already shows credit markets pricing distress (record CDS) from an equity story credit doesn't believe — a $750B version of the same structural bet at Nvidia's scale would be the largest instance of this pattern this map has tracked."},{"direction":"Terms firm up smaller or more conservatively than the reported headline figure (deal terms are explicitly described as \"still in flux\"), and this settles into an ordinary large vendor- financing arrangement rather than a new circular-financing alarm — the $750B figure was preliminary/aspirational reporting, not a signed structure.","why":"Reported deal talks routinely shrink or restructure between an initial leak and a signed agreement, and no primary-source confirmation (an Nvidia or OpenAI filing/announcement) exists yet for either the SK Group or OpenAI components.","precedent":null}],"context_note":"Confidence held at `speculative` deliberately — this is reported deal talks, not a signed agreement or a company statement, and the terms are explicitly described as still in flux. Read alongside ai-circular-financing-risk (Oracle's CDS, CoreWeave's discounted debt) as the same structural question at a materially larger scale."},"interpretation_id":"2026-08-04--nvidia-in-talks-for-up-to-750b-in-ai-deals"},{"id":"u:oracle-s-5-year-cds-remains-near-an-18-year-reco","day":"2026-08-04","lens":"global-capital","title":"Oracle's 5-year CDS remains near an 18-year/record high","html":"<strong>Oracle's 5-year CDS remains near an 18-year/record high<\/strong> (~2.03 percentage points, up from 144bp at year-start) — unresolved into this window, the live proxy for AI-buildout credit risk this map has tracked since 07-17.","url":null,"source":null,"threads":["ai-circular-financing-risk"],"entities":["oracle"],"axis":"deals-and-filings","sev":null,"interpretation":null,"interpretation_id":null},{"id":"u:fortune.com/2026/08/04/kevin-warsh-forward-guidance-goldman-","day":"2026-08-04","lens":"global-capital","title":"Goldman Sachs publicly warned Fed Chair Warsh's reduced-guidance approach could destabilize markets.","html":"<strong>Goldman Sachs publicly warned Fed Chair Warsh's reduced-guidance approach could destabilize markets.<\/strong> Warsh has stopped giving forward rate guidance and floated cutting policy meetings to six/year; Wall Street says the resulting communications void won't be tolerated the way pre-Warsh silence was. (<a href=\"https://fortune.com/2026/08/04/kevin-warsh-forward-guidance-goldman-sachs-wall-street-framework-inflation/\">Fortune<\/a>)","url":"https://fortune.com/2026/08/04/kevin-warsh-forward-guidance-goldman-sachs-wall-street-framework-inflation/","source":"Fortune","threads":[],"entities":[],"axis":"deals-and-filings","sev":null,"interpretation":null,"interpretation_id":null},{"id":"u:www.briefs.co/news/amazon-to-issue-25b-in-bonds-halts-furthe","day":"2026-08-04","lens":"global-capital","title":"Amazon priced a $25B, 8-tranche bond sale and says it's done issuing debt for 2026","html":"<strong>Amazon priced a $25B, 8-tranche bond sale and says it's done issuing debt for 2026<\/strong> — funding part of its $200B capex plan, part of a broader &gt;$182B Big Tech AI-debt wave year-to-date. (<a href=\"https://www.briefs.co/news/amazon-to-issue-25b-in-bonds-halts-further-debt-issuance-for-2026/\">Briefs.co<\/a>)","url":"https://www.briefs.co/news/amazon-to-issue-25b-in-bonds-halts-further-debt-issuance-for-2026/","source":"Briefs.co","threads":["aws-capex"],"entities":["amazon-aws"],"axis":"deals-and-filings","sev":null,"interpretation":null,"interpretation_id":null},{"id":"u:memory-shortage-thread-intact-no-relief-dram-nan","day":"2026-08-04","lens":"global-capital","title":"Memory shortage thread intact, no relief: DRAM/NAND/HBM supply-demand gaps at wo","html":"Memory shortage thread intact, no relief: DRAM/NAND/HBM supply-demand gaps at worst since 2011; SK Hynix's CEO says the shortage could persist past 2030.","url":null,"source":null,"threads":["ai-memory-shortage"],"entities":["sk-hynix"],"axis":"macro-strip","sev":null,"interpretation":null,"interpretation_id":null},{"id":"u:kyivindependent.com/russian-ballistic-missile-attack-on-kyiv","day":"2026-08-04","lens":"world-news","title":"Kyiv took its heaviest missile barrage in months overnight — 15-17 dead, none of the missiles intercepted.","html":"<strong>Kyiv took its heaviest missile barrage in months overnight — 15-17 dead, none of the missiles intercepted.<\/strong> Russia fired 24+ ballistic/anti-ship missiles plus over a hundred Shahed drones at Kyiv and its region; Ukrainian reporting says none of the missiles were intercepted. Warehouse and building fires burned across Brovary and nearby villages. A real, sourced escalation in scale and interception rate against this thread's already-tracked nightly pattern (the 08-03 digest recorded a 117/136 drone intercept rate the same week) — this barrage's near-zero intercept rate on the missile component is the specific new data point. (<a href=\"https://kyivindependent.com/russian-ballistic-missile-attack-on-kyiv-aug-5/\">Kyiv Independent<\/a>, <a href=\"https://kesq.com/news/national-world/cnn-world/2026/08/05/russian-attack-kills-15-in-kyiv-region-ukraine-emergency-services-say/\">CNN via KESQ<\/a>)","url":"https://kyivindependent.com/russian-ballistic-missile-attack-on-kyiv-aug-5/","source":"Kyiv Independent","threads":["russia-ukraine-war"],"entities":[],"axis":"geopolitics-and-security","sev":"major","interpretation":null,"interpretation_id":null},{"id":"u:www.euronews.com/my-europe/2026/08/04/full-solidarity-with-s","day":"2026-08-04","lens":"world-news","title":"The emergency EU council met, and produced a solidarity statement, not a decision.","html":"<strong>The emergency EU council met, and produced a solidarity statement, not a decision.<\/strong> The Justice and Home Affairs Council videoconference ran as scheduled, chaired by Irish Justice Minister Jim O'Callaghan. Migration Commissioner Magnus Brunner: the EU stands in \"full solidarity\" with Spain, calling it \"a test of our European resilience.\" No Schengen-suspension decision came out of the Council (Italy's unilateral suspension of free movement with Spain remains a national, not EU-level, measure); no Morocco-returns agreement. Matches von der Leyen's own pre-framing exactly — explicitly deferred to the October European Council. Death toll held at 72; by 08-04 all but ~2,000 of the crossers had already returned to Morocco on their own. [Ledger: <code>eu-ceuta-ministers-meeting<\/code> hit, full detail in upcoming.yaml.] (<a href=\"https://www.euronews.com/my-europe/2026/08/04/full-solidarity-with-spain-after-ceuta-as-crisis-tests-eu-resilience-migration-commissione\">Euronews<\/a>)","url":"https://www.euronews.com/my-europe/2026/08/04/full-solidarity-with-spain-after-ceuta-as-crisis-tests-eu-resilience-migration-commissione","source":"Euronews","threads":["europe-migration-schengen"],"entities":[],"axis":"geopolitics-and-security","sev":null,"interpretation":null,"interpretation_id":null},{"id":"u:a-second-outlet-corroborates-the-reported-iran-o","day":"2026-08-04","lens":"world-news","title":"A second outlet corroborates the reported Iran-Oman Hormuz arrangement.","html":"<strong>A second outlet corroborates the reported Iran-Oman Hormuz arrangement.<\/strong> CNN's 08-04 reporting broadly matches the corridor/fee structure already recorded on the 08-03 digest (via NYT/Times of Israel) — Iran and Oman reportedly nearing a deal letting shipping use separate Iran- and Oman-controlled channels. Trump separately said Iran has \"one more opportunity\" to settle before further strikes. Treated as corroboration of an already-tracked development, not a new one.","url":null,"source":null,"threads":["iran-conflict-widening"],"entities":[],"axis":"geopolitics-and-security","sev":null,"interpretation":null,"interpretation_id":null},{"id":"u:www.malaymail.com/news/world/2026/08/04/indonesia-ferry-fire","day":"2026-08-04","lens":"world-news","title":"Indonesia ferry fire: final toll settled at 5 dead","html":"<strong>Indonesia ferry fire: final toll settled at 5 dead<\/strong>, all 238 aboard now accounted for — the toll came in far lower than the earlier \"41 missing\" reports on the 08-02 incident. A closed story as of 08-04, not a new escalation. (<a href=\"https://www.malaymail.com/news/world/2026/08/04/indonesia-ferry-fire-toll-confirmed-at-five-after-all-survivors-accounted-for/230226\">Malay Mail<\/a>)","url":"https://www.malaymail.com/news/world/2026/08/04/indonesia-ferry-fire-toll-confirmed-at-five-after-all-survivors-accounted-for/230226","source":"Malay Mail","threads":[],"entities":[],"axis":"geopolitics-and-security","sev":null,"interpretation":null,"interpretation_id":null},{"id":"u:ethiopia-eritrea-sudan-border-fighting-continues","day":"2026-08-04","lens":"world-news","title":"Ethiopia-Eritrea-Sudan border fighting continues","html":"<strong>Ethiopia-Eritrea-Sudan border fighting continues<\/strong> — clashes between Ethiopian forces and Tigray-aligned fighters spread along the Sudan and Eritrea borders 08-01→04; Ethiopia says it repelled a Sudan-originated incursion at Sherarina. Continuation of the story already offered as a thread candidate 08-03, now with two more days of activity.","url":null,"source":null,"threads":["horn-of-africa-war"],"entities":[],"axis":"geopolitics-and-security","sev":null,"interpretation":null,"interpretation_id":null}],"throughlines":{"2026-08-03":{"ai":"The EO 14409 story moved without anything actually publishing. After the 08-01 deadline passed silent, the White House — specifically the Office of the National Cyber Director under Sean Cairncross — will present the \"finalized\" Sec. 3(b) pre-release framework to staff-level reps from **OpenAI, Google and Anthropic tomorrow, 08-04**, which is the last day of the very grace window this map was counting down. The Information reports \"the policy has been finalized,\" but a White House official would not say whether it is in effect, and — reconfirmed today — there is still no Federal Register notice, no NIST or CISA publication, no OSTP statement. So the passed-silent posture is no longer the whole picture: there is a concrete date and a \"finalized\" claim, and nothing public behind either. Separately, Alibaba shipped a genuinely frontier-scale model, and the OpenAI containment breach turned into a legal matter.","mental-health":"The thing this lens has been holding for finally exists. On the legislature's first day back from recess, **SB 903 landed on the Assembly Appropriations Committee's calendar for a hearing this Wednesday, August 5 at 9am** — the calendar entry naming the bill that the ledger said would upgrade it from `reported` to `confirmed`. It is dual-verified against raw HTML from two primary sources: leginfo's bill-status page (Committee Hearing Date 08/05/26, \"Asm Appropriations\") and the committee's own live Daily File (Wed Aug 5, 9am, Room 1100, Wicks chair, SB 903 named in the day's list). This is a clean sequence, not a contradiction of the 08-02 read: on Sunday, in recess, the entry genuinely did not exist and the summarizer's premature \"Aug 5\" was correctly refused; today it materialized and is confirmed on the record.","global-capital":"Monday was a broad, sharp risk-on day, and it was bought on a claim one of the two governments involved says is false. The **S&P closed 7,600.50 (+1.48%)**, the **Nasdaq +2.13%**, the **Dow at a record**, and **oil cratered ~5%** — Brent to about $83.7, WTI to about $80 — on the *hope* of Iran supply relief, even though Iran denied the deal Trump announced and a second Qatari LNG tanker was hit in Hormuz (Brent touched $90 intraday first). The mechanism is clean: falling oil cut inflation-and-yield fears, which lifted risk assets broadly, and the AI-megacap chip names caught a bigger bounce than the sector average. But this is a sentiment move on an unconfirmed premise, and TIME's own timeline shows a near-identical sequence already ran once this year — a 14-point US-Iran memorandum signed June 17 that reopened the Strait on paper and fell apart within weeks. The Strait is still largely closed today.","world-news":"The Iran \"deal\" Trump announced over the weekend is not holding on the water, and the gap between what Washington says and what Tehran says is widening rather than closing. Trump said Monday talks were resuming and called it Iran's \"last chance\"; **Iran's Foreign Ministry flatly denied any US talks are scheduled** — spokesman Esmaeil Baghaei said \"at present, we are not having any negotiations with the US,\" and Iran said the only channel open is with **Oman**, on safe shipping passage, not with Washington. In the same window a **second Qatari-linked LNG tanker, the GasLog Shanghai, was hit transiting the Strait of Hormuz** — the second such vessel in roughly a month — pushing Brent above $90 intraday before markets chose to read the day as de-escalation anyway. No strikes were executed by either side; Trump's weekend cancellation still holds, conditionally, and Israeli and US military officials reportedly learned of it from his social-media post rather than through channels. This is a claimed peace being priced against a burning tanker in the very strait the claimed deal was meant to reopen.","front":"Monday's markets bought a peace that one of the two governments involved says does not exist. US equities had a broad, sharp risk-on day — the S&P closed 7,600.50 (+1.48%), the Nasdaq +2.13%, the Dow at a record — and oil cratered about 5%, Brent to roughly $83.7, on the hope of Iranian supply relief. The mechanism is clean and worth naming: falling oil cut inflation-and-yield fears, and that eased pressure is what lifted risk assets, with the AI-megacap chip names catching the biggest bounce. What it was priced on is the problem. Trump announced over the weekend that he had cancelled a planned strike because a deal had been agreed to reopen the Strait of Hormuz; on Monday Iran's Foreign Ministry flatly denied any US talks are scheduled, said the only channel open is with Oman on shipping passage, and its acting defense minister called the cancellation \"psychological operations.\" In the same window a second Qatari LNG tanker, the GasLog Shanghai, was hit transiting Hormuz — the second in roughly a month — and Brent touched $90 intraday before the market chose to read the day as de-escalation anyway. This has run once already: a 14-point US-Iran memorandum signed June 17 reopened the Strait on paper and fell apart within weeks, and the Strait is still largely closed today."},"2026-08-04":{"ai":"The White House's EO 14409 framework resolved today, and not by publishing — by a deliberate decision not to. The Sec. 3(b) meeting with OpenAI, Anthropic, Google and Meta staff happened as scheduled, but per Fortune, the administration told attendees directly it has **no plans to publicly release the framework at all**; it will stay known only to the companies invited to review it. Both twin ledger entries this map had been tracking since 08-01 resolve passed-silent today — not from silence, but from a stated policy of non-disclosure. Elsewhere, AMD beat and raised on Q2 earnings and still sold off, the same pattern SpaceX ran the same night (see Global Capital), and China's Grok-competitor field kept moving with Grok 4.6 now pinned to 08-07.","mental-health":"The Minnesota \"nudify\" ban that took effect 08-01 kept generating real legal exposure for xAI today, and two of this lens's biggest expected events — the CHATBOT Act markup and SB 903's Appropriations hearing — are both scheduled for tomorrow, not today, so this digest-day's real content is narrower than the calendar around it suggests.","global-capital":"Two of the night's four highest-profile earnings prints — SpaceX and AMD — both beat cleanly and both sold off hard, and the shared mechanism is the same one: investors are no longer rewarding AI-capex beats on their own terms, they're pricing the capex itself as a cost, not a promise. Underneath that, the broader market had its best two days in months (fresh S&P and Dow records, Palantir's biggest single-day gain since 2024), and Nvidia is reportedly negotiating up to $750B in new AI-infrastructure financing — reviving the circular-financing scrutiny this map has tracked since Oracle's credit story diverged from its equity story in July.","world-news":"The EU's Ceuta emergency meeting produced a solidarity statement and nothing binding, exactly as pre-framed — the real news of the day is Kyiv taking its heaviest missile barrage in months, with zero interceptions reported. A flash was considered for the Kyiv strike and NOT filed: this is a severe escalation inside an already-tracked, ongoing war, not the kind of novel, first-of-its-kind event the rail exists for — logged here as a close call rather than a clean no.","front":"The AI-buildout's two biggest earnings prints of the week both landed the same story from different angles: capex is no longer a free pass. SpaceX and AMD each beat cleanly on revenue and EPS, and both sold off hard after-hours — SpaceX because its AI segment's capex hit $18.4B (six times a year ago) against a $1.3B operating loss, AMD because flat margin guidance didn't clear the bar a stretched valuation now demands. The same pattern, applied to two different companies with no direct competitive relationship, on the same night, is a real signal: investors are pricing AI capex as a cost until it proves otherwise, not rewarding it as a promise. Underneath that, the broader market had its best session in two months (fresh S&P and Dow records) and Nvidia is reportedly negotiating up to $750B in new AI-infrastructure financing — a circular-financing question, at a scale an order of magnitude past anything this map has tracked, sitting directly alongside the market's new skepticism about capex."},"2026-08-05":{"ai":"Nothing yet — too early in the digest-day.","mental-health":"Nothing yet — too early in the digest-day. This lens's biggest expected day in weeks is ahead, not behind: California's SB 903 gets its Assembly Appropriations hearing (9am PT) and Senate Commerce marks up the CHATBOT Act (10am ET) — same morning, one state instrument and one federal. Neither had happened as of this check.","global-capital":"Nothing yet — too early in the digest-day. Three real events are due today and none had happened as of this check: CVS Health Q2 earnings (8am ET), GlobalFoundries Q2 earnings (call 8:30am ET — confirmed via IR page and SEC EDGAR that no release exists yet as of 06:20 ET), and ISM Services PMI + Fed Gov. Cook remarks (10am ET).","world-news":"Nothing yet — too early in the digest-day.","front":"Too early to have one — this digest-day opened at 05:00 ET and this run is curating just 1h45m into it. Five real events are expected today and none had happened as of this run: California's SB 903 gets its Assembly Appropriations hearing (9am PT), Senate Commerce marks up the CHATBOT Act (10am ET), CVS Health reports Q2 earnings (8am ET), GlobalFoundries reports Q2 earnings (call 8:30am ET, no release yet as of this check), and ISM Services PMI + a Fed Governor Cook speech land (10am ET). Tomorrow: SoftBank's Q1 FY26 earnings and SpaceX's first insider-lockup tranche, both 08-06. This is an honestly thin open, not a gap."}},"upcoming":[{"id":"cxmt-star-listing","claim":"CXMT lists on the STAR Market (up to $9.8B)","due":"2026-07-27","due_precision":"day","thread":"cxmt-memory-ipo","entities":["cxmt"],"source":"https://finance.biggo.com/news/503cd6f5-6bde-4e19-8e0c-e4b <script>
(function(){
"use strict";
var P = JSON.parse(document.getElementById("kestrel-payload").textContent);
if (P.__KESTREL_PAYLOAD__) { document.getElementById("app").textContent =
  "Shell has no payload — run tools/render_read.py."; return; }
var app = document.getElementById("app");
var lensFilter = "all";
var LENSES = ["ai","mental-health","global-capital","world-news"];
// "money":"Money" kept in LENS_LABEL only (not LENSES) so archived
// pre-rename items still display a real label instead of the raw slug —
// renamed to global-capital 2026-07-30, not offered as a filter chip.
var LENS_LABEL = {"ai":"Frontier AI","mental-health":"Mental health","global-capital":"Global Capital","money":"Money","frontier-ai":"Frontier AI","world-news":"World News"};

function el(tag, cls, text){ var e=document.createElement(tag); if(cls)e.className=cls;
  if(text!==undefined)e.textContent=text; return e; }
function frag(html){ var d=document.createElement("div"); d.innerHTML=html; return d; }
function entName(slug){ var e=P.entities.find(function(x){return x.slug===slug;});
  return e?e.name:slug; }
function threadBy(slug){ return P.threads.find(function(t){return t.slug===slug;}); }
function lensOk(l){ if(lensFilter==="all")return true;
  return l===lensFilter || (lensFilter==="ai"&&l==="frontier-ai")
    || (lensFilter==="global-capital"&&l==="money"); }
function itemsFor(pred){ return P.items.filter(function(it){return lensOk(it.lens)&&pred(it);}); }
function link(hash, text, cls){ var a=el("a",cls||"",text); a.href=hash; return a; }

function chipRow(parent){
  var row=el("div","row");
  ["all"].concat(LENSES).forEach(function(l){
    var c=el("span","chip"+(lensFilter===l?" on":""), l==="all"?"all lenses":LENS_LABEL[l]||l);
    c.onclick=function(){ lensFilter=l; render(); };
    row.appendChild(c);
  });
  parent.appendChild(row);
}
function entChips(parent, slugs){
  slugs.forEach(function(s){ parent.appendChild(link("#/entity/"+s, entName(s), "chip ent")); });
}
function threadChips(parent, slugs){
  slugs.forEach(function(s){ var t=threadBy(s);
    parent.appendChild(link("#/thread/"+s, t?t.title:s, "chip")); });
}
function itemLi(it, showDay){
  var li=el("li");
  li.appendChild(frag(it.html).firstChild || el("span","",it.title));
  var meta=el("div","item-meta");
  if(showDay) meta.appendChild(el("span","", it.day+" · "));
  if(it.day===P.today) meta.appendChild(el("span","new","NEW · "));
  meta.appendChild(el("span","", (LENS_LABEL[it.lens]||it.lens)+" "));
  var wrap=el("span");
  (it.threads||[]).forEach(function(s){ wrap.appendChild(link("#/thread/"+s,"🧵 "+s,"chip")); });
  (it.entities||[]).forEach(function(s){ wrap.appendChild(link("#/entity/"+s, entName(s),"chip ent")); });
  meta.appendChild(wrap);
  li.appendChild(meta);
  return li;
}
function masthead(sub){
  var h=el("header","masthead");
  h.appendChild(el("div","kicker","kestrel · the read"));
  var t=el("h1","", "Week of "+P.week_start);
  h.appendChild(t);
  h.appendChild(el("div","dateline", sub));
  return h;
}

/* ---------- home: thread-first (Ben, 2026-07-22) ----------
   "Active threads this week" is the highest organizational structure —
   each thread wraps its own evidence, latest move, and expectations.
   Rank = weight × move size (Ben, 2026-07-22): threads.yaml weight (1-3,
   '/steer weight <slug> <n>') × (2×today + week items); importance
   amplifies movement, never fabricates it — weight 3 with zero moves
   still reads as quiet. Ties: weight, then last_seen. */
function renderHome(){
  var upByThread={};
  (P.upcoming||[]).forEach(function(u){
    if(u.thread){ (upByThread[u.thread]=upByThread[u.thread]||[]).push(u); }});

  // ===== 1. FLASH RAIL — general news that lands regardless of lens =====
  // `critical` only (Ben, 2026-07-29). Above everything, including the
  // masthead: the point is that it cannot be scrolled past.
  (P.flash||[]).filter(function(f){return f.severity==="critical";})
    .forEach(function(f){
      var r=el("div","flash");
      r.appendChild(el("div","flash-kicker","⚡ Flash · "+f.date));
      r.appendChild(el("div","flash-head",f.headline));
      if(f.body) r.appendChild(el("div","flash-body",f.body));
      if((f.sources||[]).length){
        var s=el("div","flash-src");
        f.sources.forEach(function(x,i){
          if(i) s.appendChild(document.createTextNode(" · "));
          s.appendChild(link(x.url,x.label));
        });
        r.appendChild(s);
      }
      app.appendChild(r);
    });

  // ===== 1b. WORLD NEWS — quiet, cross-spectrum volume; not an alert =====
  // A mechanical fact (N distinct outlets covered this), never a model or a
  // curator (ROADMAP §World News). Deliberately styled as the OPPOSITE of
  // the flash rail above: small, no color, no card — "on the radar, not
  // drowning out my real targets." A `thread` pointer means the item
  // corroborates something already tracked; its absence means it's a raw
  // candidate with nothing on the map yet.
  if((P.world_news||[]).length){
    var wn=el("div","world-news");
    wn.appendChild(el("div","world-news-kicker","🌍 World news · what's widely covered today"));
    P.world_news.forEach(function(w){
      var row=el("div","world-news-row");
      row.appendChild(el("div","world-news-n",w.distinct_outlets+" outlets"));
      var h=el("div","world-news-h");
      if(w.thread){ h.appendChild(link("#/thread/"+w.thread,w.headline)); }
      else{ h.appendChild(document.createTextNode(w.headline)); }
      row.appendChild(h);
      wn.appendChild(row);
    });
    app.appendChild(wn);
  }

  app.appendChild(masthead("centered on "+P.today+" · generated "+P.generated+
    " · "+P.days.length+"/7 days in"));
  chipRow(app);

  // ===== 2. EXECUTIVE SUMMARY — front first, then the lens roll-ups =====
  var th=(P.throughlines||{})[P.today]||{};
  if(th.front && lensFilter==="all"){
    var fc=el("div","verdict exec");
    fc.appendChild(el("div","kicker","Executive summary · "+P.today));
    fc.appendChild(el("div","small",th.front));
    app.appendChild(fc);
  }
  LENSES.filter(lensOk).forEach(function(l){
    if(th[l]){ var c=el("div","verdict");
      c.appendChild(el("div","kicker",LENS_LABEL[l]+" · today"));
      c.appendChild(el("div","small",th[l])); app.appendChild(c); }
  });

  // ===== 3. TODAY'S CALENDAR — hoisted above the threads =====
  // Everything due today/tomorrow, INCLUDING thread:null entries. Previously
  // these rendered in a flat list below every thread card, which is how the
  // FOMC decision ended up at the bottom of the page (Ben, 2026-07-29).
  var soon=(P.upcoming||[]).filter(function(u){
    if(u.status==="passed-silent") return true;
    if(u.status!=="pending") return false;
    var n=dueDays(String(u.due));
    return n>=0 && n<=1;
  }).sort(function(a,b){return String(a.due)<String(b.due)?-1:1;});
  var soonIds={};
  if(soon.length){
    var cs=el("section");
    cs.appendChild(el("h2","","⏳ Today & tomorrow"+((P.now&&P.now!==P.today)?" (as of "+P.now+")":"")));
    soon.forEach(function(u){
      soonIds[u.id]=1;
      var c=el("div","row card");
      c.appendChild(el("span","tag",dueDays(String(u.due))===0?"TODAY":"tomorrow"));
      var g=el("span","grow"); g.appendChild(document.createTextNode(u.claim));
      if(u.thread){ g.appendChild(document.createTextNode(" · "));
        var ut=threadBy(u.thread);
        g.appendChild(link("#/thread/"+u.thread, ut?ut.title:u.thread, "chip")); }
      c.appendChild(g);
      c.appendChild(el("span","status-"+u.status,
        u.status==="pending"?"pending":u.status.replace("-"," ")));
      cs.appendChild(c);
    });
    app.appendChild(cs);
  }

  var counts={};
  P.items.forEach(function(it){ (it.threads||[]).forEach(function(s){
    counts[s]=counts[s]||{week:0,today:0,mag:0}; counts[s].week++;
    if(it.day===P.today)counts[s].today++;
    if(it.sev==="flash")counts[s].mag+=8; else if(it.sev==="major")counts[s].mag+=3;
  }); });
  // children of a meta-thread, for score aggregation + card rendering
  var kids={};
  P.threads.forEach(function(t){ if(t.parent)(kids[t.parent]=kids[t.parent]||[]).push(t); });

  // SALIENCE (ROADMAP §Salience, 2026-07-29). Was volume-only, which ranked
  // "what got written about most" instead of "what to look at first" — the
  // week's four biggest scheduled events sat 17th/31st/34th/off-list.
  //   score = weight × (V + I) + M
  //   V volume    = 2×today + week items   (unchanged)
  //   I imminence = the thread's pending expectations, by how close they are
  //   M magnitude = curation's sev= flag; ADDITIVE, never weight-multiplied,
  //                 because a major event on a weight-1 thread is still major
  function dueDays(d){ // whole days from the REAL day (P.now) to a due date
    var base=P.now||P.today;
    return Math.round((Date.parse(d+"T00:00:00Z")-Date.parse(base+"T00:00:00Z"))/864e5);
  }
  function imminence(slug){
    return (upByThread[slug]||[]).reduce(function(a,u){
      if(u.status==="passed-silent") return a+5;      // the loud outcome
      if(u.status!=="pending") return a;
      var n=dueDays(String(u.due));
      if(n<0) return a;
      if(n===0) return a+6;
      if(n===1) return a+4;
      if(n<=3)  return a+2;
      if(n<=7)  return a+1;
      return a;
    },0);
  }
  function score(t){
    var c=counts[t.slug]||{week:0,today:0,mag:0};
    var V=c.today*2+c.week, I=imminence(t.slug), M=c.mag;
    (kids[t.slug]||[]).forEach(function(k){         // metas aggregate children
      var ck=counts[k.slug]||{week:0,today:0,mag:0};
      V+=ck.today*2+ck.week; I+=imminence(k.slug);
    });
    return (t.weight||2)*(V+I)+M;
  }
  function dots(t){ return "●●●".slice(0,t.weight||2)+"○○○".slice(0,3-(t.weight||2)); }

  // ===== ACTIVE THREADS THIS WEEK — wraps everything =====
  var ts=el("section");
  ts.appendChild(el("h2","","🧵 Active threads this week"));
  var act=P.threads.filter(function(t){return lensOk(t.lens)&&t.status!=="resolved";})
    .sort(function(a,b){ return (score(b)-score(a))||
      ((b.weight||2)-(a.weight||2))||(b.last_seen<a.last_seen?-1:1); });
  var quiet=[];
  act.forEach(function(t){
    var c=counts[t.slug]||{week:0,today:0};
    var ups=upByThread[t.slug]||[];
    if(!c.week && !ups.length){ quiet.push(t); return; }
    var card=el("div","card");
    var head=el("div","row");
    var g=el("span","grow");
    g.appendChild(link("#/thread/"+t.slug,t.title));
    g.appendChild(el("span","muted small","  · "+(LENS_LABEL[t.lens]||t.lens)));
    head.appendChild(g);
    head.appendChild(el("span","count",dots(t)+" · "+
      (c.today?("+"+c.today+" today · "):"")+c.week+" this wk"));
    card.appendChild(head);
    // latest move (newest timeline entry in this week)
    var tl=(t.timeline||[])[0];
    if(tl && tl.date>=P.week_start){
      var lm=el("div","small muted");
      lm.appendChild(el("span","tl-date",tl.date+" — "));
      lm.appendChild(frag("<span>"+tl.html.replace(/<ul>.*<\/ul>/s,"")+"</span>"));
      card.appendChild(lm);
    }
    // this week's evidence, inside the thread
    var wk=P.items.filter(function(it){return lensOk(it.lens)&&
      (it.threads||[]).indexOf(t.slug)>=0;});
    if(wk.length){ var ul=el("ul");
      wk.forEach(function(it){ul.appendChild(itemLi(it,true));});
      card.appendChild(ul); }
    // the thread's expectations
    ups.forEach(function(u){
      var r=el("div","row small");
      r.appendChild(el("span","tl-date","⏳ "+u.due));
      var gu=el("span","grow",u.claim);
      r.appendChild(gu);
      r.appendChild(el("span","status-"+u.status,
        u.status==="pending"?"pending":u.status.replace("-"," ")));
      card.appendChild(r);
    });
    ts.appendChild(card);
  });
  if(quiet.length){
    var d=el("details","quiet-block"), s=el("summary","",quiet.length+
      " quiet threads (no evidence or dated expectations this week)");
    d.appendChild(s);
    quiet.forEach(function(t){ var r=el("div","thread-row");
      r.appendChild(el("span","count","—"));
      var g2=el("span","grow"); g2.appendChild(link("#/thread/"+t.slug,t.title));
      g2.appendChild(el("span","muted small","  · last seen "+t.last_seen));
      r.appendChild(g2); d.appendChild(r); });
    ts.appendChild(d);
  }
  app.appendChild(ts);

  // ambient: this week's items that belong to no thread
  var loose=itemsFor(function(it){return !(it.threads||[]).length;});
  if(loose.length){
    var ls=el("section");
    ls.appendChild(el("h2","","📎 Not yet a thread"));
    ls.appendChild(el("p","muted small",
      "Entity-tagged items with no thread — candidates if they recur."));
    var ul2=el("ul"); loose.forEach(function(it){ul2.appendChild(itemLi(it,true));});
    ls.appendChild(ul2);
    app.appendChild(ls);
  }

  // calendar: expectations not attached to any thread
  var noThread=(P.upcoming||[]).filter(function(u){return !u.thread && !soonIds[u.id];})
    .sort(function(a,b){return a.due<b.due?-1:1;});
  if(noThread.length){
    var up=el("section");
    up.appendChild(el("h2","","⏳ Also on the calendar"));
    noThread.forEach(function(u){
      var c=el("div","row card");
      c.appendChild(el("span","tl-date",u.due));
      c.appendChild(el("span","grow",u.claim));
      c.appendChild(el("span","status-"+u.status,
        u.status==="pending"?"pending":u.status.replace("-"," ")));
      up.appendChild(c);
    });
    app.appendChild(up);
  }

  // entities
  var es=el("section");
  es.appendChild(el("h2","","👤 Active people & entities"));
  var ec={};
  P.items.filter(function(it){return lensOk(it.lens);}).forEach(function(it){
    (it.entities||[]).forEach(function(s){ec[s]=(ec[s]||0)+1;}); });
  var order=Object.keys(ec).sort(function(a,b){return ec[b]-ec[a];});
  var rowE=el("div");
  order.forEach(function(s){ rowE.appendChild(link("#/entity/"+s, entName(s)+" ×"+ec[s], "chip ent")); });
  if(!order.length) rowE.appendChild(el("span","muted small","None under this filter."));
  es.appendChild(rowE);
  app.appendChild(es);

  // weekly synthesis
  if(P.weekly){ var w=el("section"); w.appendChild(el("h2","","🗓 The week, synthesized"));
    w.appendChild(frag(P.weekly)); app.appendChild(w); }
  if(P.weekly_prior){ var wp=el("details","quiet-block");
    wp.appendChild(el("summary","","Last week's synthesis (carried through Tuesday)"));
    wp.appendChild(frag(P.weekly_prior)); app.appendChild(wp); }

  // map changes + asks
  var mc=el("section");
  mc.appendChild(el("h2","","🔄 Map changes this week"));
  var ulm=el("ul");
  (P.map_changes||[]).forEach(function(m){ var li=el("li","small");
    li.appendChild(el("span","tl-date",m.date+" ")); li.appendChild(el("span","",m.text));
    ulm.appendChild(li); });
  mc.appendChild(ulm);
  app.appendChild(mc);
  if((P.asks||[]).length){
    var as=el("section");
    as.appendChild(el("h2","","💡 Open steering asks"));
    var ol=el("ol");
    P.asks.forEach(function(a){ ol.appendChild(el("li","",a)); });
    as.appendChild(ol);
    as.appendChild(el("p","muted small","Answer in chat — a word each is enough."));
    app.appendChild(as);
  }
  // day links
  var dl=el("p","small");
  dl.appendChild(el("span","muted","Days: "));
  P.days.forEach(function(d){ dl.appendChild(link("#/day/"+d, d, "chip")); });
  app.appendChild(dl);
}

/* ---------- thread ---------- */
function renderThread(slug){
  var t=threadBy(slug);
  app.appendChild(masthead(P.today));
  var back=el("p","back"); back.appendChild(link("#/","← this week")); app.appendChild(back);
  if(!t){ app.appendChild(el("p","","Unknown thread: "+slug)); return; }
  app.appendChild(el("h2","","🧵 "+t.title));
  var meta=el("p","small muted", (LENS_LABEL[t.lens]||t.lens)+" · "+t.kind+" · "+t.status+
    " · opened "+t.opened+" · last seen "+t.last_seen);
  app.appendChild(meta);
  var ch=el("div"); entChips(ch,t.entities||[]); app.appendChild(ch);
  if(t.watch){ var w=el("div","verdict");
    w.appendChild(el("div","kicker","watching for"));
    w.appendChild(el("div","small",t.watch)); app.appendChild(w); }
  app.appendChild(el("h3","","timeline"));
  (t.timeline||[]).forEach(function(e){
    var d=el("div","tl-entry"+(e.date>=P.week_start?" thisweek":""));
    d.appendChild(el("div","tl-date",e.date));
    d.appendChild(frag(e.html));
    d.appendChild(el("div","prov","⟨"+e.tag+"⟩"));
    app.appendChild(d);
  });
  if(!(t.timeline||[]).length) app.appendChild(el("p","muted small","No timeline entries yet."));
  if(t.timeline_truncated) app.appendChild(el("p","muted small",
    "Older entries truncated — full record in artifacts/threads/"+slug+".md"));
  if(!t.crawled) app.appendChild(el("p","muted small",
    "Backstory thin — ask for /crawl "+slug+" to pull what came before."));
  var wk=P.items.filter(function(it){return (it.threads||[]).indexOf(slug)>=0;});
  if(wk.length){ app.appendChild(el("h3","","evidence this week"));
    var ul=el("ul"); wk.forEach(function(it){ul.appendChild(itemLi(it,true));});
    app.appendChild(ul); }
  // siblings via shared entities
  var sib={};
  P.threads.forEach(function(o){ if(o.slug===slug)return;
    if((o.entities||[]).some(function(s){return (t.entities||[]).indexOf(s)>=0;}))
      sib[o.slug]=1; });
  var sk=Object.keys(sib);
  if(sk.length){ app.appendChild(el("h3","","related threads (shared entities)"));
    var d2=el("div"); threadChips(d2,sk); app.appendChild(d2); }
}

/* ---------- entity ---------- */
function renderEntity(slug){
  app.appendChild(masthead(P.today));
  var back=el("p","back"); back.appendChild(link("#/","← this week")); app.appendChild(back);
  var e=P.entities.find(function(x){return x.slug===slug;});
  app.appendChild(el("h2","","👤 "+(e?e.name:slug)));
  if(e) app.appendChild(el("p","small muted", e.kind+" · lenses: "+(e.lenses||[]).join(", ")));
  var ths=P.threads.filter(function(t){
    if((t.entities||[]).indexOf(slug)>=0) return true;
    return P.items.some(function(it){ return (it.entities||[]).indexOf(slug)>=0 &&
      (it.threads||[]).some(function(s){return s===t.slug;}); }); });
  app.appendChild(el("h3","","threads involving "+(e?e.name:slug)));
  if(ths.length){ ths.forEach(function(t){
    var r=el("div","thread-row");
    r.appendChild(el("span","count",t.status==="resolved"?"✓":"•"));
    var g=el("span","grow"); g.appendChild(link("#/thread/"+t.slug,t.title));
    g.appendChild(el("span","muted small","  · "+t.status+" · last seen "+t.last_seen));
    r.appendChild(g); app.appendChild(r); });
  } else app.appendChild(el("p","muted small","No threads tagged to this entity yet."));
  var wk=P.items.filter(function(it){return (it.entities||[]).indexOf(slug)>=0;});
  if(wk.length){ app.appendChild(el("h3","","items this week"));
    var ul=el("ul"); wk.forEach(function(it){ul.appendChild(itemLi(it,true));});
    app.appendChild(ul); }
}

/* ---------- day ---------- */
function renderDay(date){
  app.appendChild(masthead(date+" (digest-day)"));
  var back=el("p","back"); back.appendChild(link("#/","← this week")); app.appendChild(back);
  chipRow(app);
  var th=(P.throughlines||{})[date]||{};
  LENSES.filter(lensOk).forEach(function(l){
    var its=P.items.filter(function(it){return it.day===date&&(it.lens===l||(l==="ai"&&it.lens==="frontier-ai")||(l==="global-capital"&&it.lens==="money"));});
    if(!its.length && !th[l]) return;
    app.appendChild(el("h2","",LENS_LABEL[l]));
    if(th[l]) app.appendChild(el("p","small muted",th[l]));
    var ul=el("ul"); its.forEach(function(it){ul.appendChild(itemLi(it,false));});
    app.appendChild(ul);
  });
}

function render(){
  app.textContent="";
  var h=location.hash||"#/";
  var m;
  if((m=h.match(/^#\/thread\/(.+)$/))) renderThread(decodeURIComponent(m[1]));
  else if((m=h.match(/^#\/entity\/(.+)$/))) renderEntity(decodeURIComponent(m[1]));
  else if((m=h.match(/^#\/day\/(.+)$/))) renderDay(decodeURIComponent(m[1]));
  else renderHome();
  var f=el("footer");
  f.appendChild(el("span","","Archive: artifacts/digests/daily/ · timelines: artifacts/threads/ · steering in chat — \"track X · drop Y · deeper on Z · expect C by D\""));
  app.appendChild(f);
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",render);
render();
})();
</script>
