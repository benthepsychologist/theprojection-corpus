# attention/flash.yaml — the FLASH RAIL. General-news events that must land
# regardless of lens.
#
# WHY THIS EXISTS (Ben, 2026-07-29): "big world news always lands. 9/11?
# front-page. US invades Venezuela? Front-page." The salience score ranks
# what the map already knows to watch; a flash is for the thing the map has
# no thread for and no lens model would surface — and which you would want
# to know even if you had never heard of kestrel.
#
# THE BAR IS DELIBERATELY HIGH.
#   - `critical` ONLY reaches the rail (Ben, 2026-07-29). `major` exists as a
#     severity but is folded into the executive summary, never the rail.
#   - Normally AT MOST ONE active flash. Two is exceptional. Three means the
#     bar has drifted and the rail is worthless — if everything is a flash,
#     nothing is.
#   - A flash is NOT "our biggest story today." The executive summary already
#     carries that. It is "this would lead a general news front page."
#
# VERIFICATION: a flash carries the same primary-source discipline as
# everything else. Speed buys no exemption — a wrong flash is worse than a
# late one. If it is unverified, the body says so on its face.
#
# PUBLIC: flashes DO publish to theprojection (Ben, 2026-07-29: "this is MY
# news feed FIRST. If its big world news it affects finance so its
# cohesive"). Same field allowlist discipline as everything else — nothing
# here is private by construction, but write it as if it is public, because
# it is.
#
# VOICE: neutral register (Ben, 2026-07-29) — the same frame-neutral voice
# the digests use, not first person.
#
# LIFECYCLE — 24 HOURS, ENFORCED IN CODE (Ben, 2026-08-04: "24h and gone").
# A flash renders on its FILING DAY AND NO LONGER. The cap is computed by
# render_read.flash_last_day(), which every surface goes through (the read
# page, the public site adapter, and the readout fingerprints all call
# load_flash), so there is exactly one place this is decided.
#
#   date:     the event's own date.
#   filed:    OPTIONAL — the day the flash was written. Defaults to `date`.
#             Set it explicitly when catching a LATE event, so its 24h runs
#             from the catch rather than from an event you already missed.
#   expires:  OPTIONAL and can only ever SHORTEN the life. A value LONGER
#             than the filing day is IGNORED, not honoured. Do not reach for
#             it to keep something up — that is the exact drift this replaced.
#
# An entry with no parsable `filed`/`date` does NOT render (it used to render
# forever). Writing a longer `expires` is now a no-op, so if a flash needs to
# stay up, the honest move is to file a NEW flash for the NEW event — which
# is what the "new event, never a running state" rule below already requires.
#
# WHY (2026-08-04): from 2026-08-01 the 24h rule lived only in AGENTS.md and
# was violated immediately — `iran-strikes-cancelled-deal-claimed` sat on the
# rail 3 days, `ceuta-mass-border-crossing` 4. The loader trusted a
# hand-written `expires`. It no longer does.
#
# /week still prunes expired entries out of this file for tidiness, but that
# is now cosmetic: an expired entry cannot render regardless. An expired
# flash is not deleted from the record — its substance lives in the digests
# and timelines like any item.
#
# A FLASH IS A NEW EVENT, NEVER A RUNNING STATE (Ben, 2026-08-01):
# "lapse flash, flash only new things, escalate means need flash."
#   - **Flashes cover NEW things only.** A flash describes the discrete event
#     that triggered it. It is NOT a running summary of a conflict, and it is
#     never edited to carry that conflict's evolving state forward.
#   - **Let them lapse.** When a flash's triggering event recedes, the entry
#     expires on its own date. Do not extend `expires` to keep a conflict on
#     the rail — the rail is not a "currently at war" indicator.
#   - **An ESCALATION IS ITSELF A NEW EVENT, and earns its own new flash.**
#     A materially bigger strike, a new theatre, a new combatant, an ordered
#     offensive — file a NEW entry rather than updating the old one. The old
#     one lapses on schedule.
#   - ⚠️ THIS REVERSES the 2026-07-30 precedent, where the Iran flash was
#     "widened in place" via an `updated:` field as the war grew (see that
#     entry below, and coverage-log 2026-07-30). Update-in-place is no longer
#     the pattern. That entry is left as-is to lapse rather than rewritten.
#   - Consequence to accept: during a fast-escalating conflict the rail can
#     briefly carry an old entry and its successor at once. That overlap is
#     expected and self-clears on the old entry's `expires` date — it is not
#     the "bar has drifted" failure the count rule above describes.
#
# 24-HOUR LIFESPAN — "FLASH MEANS TODAY" (Ben, 2026-08-01):
# "flash messages should expire in 24h typically. flash means today."
#   - **Default `expires` is the event date + 1 day.** Not three days, not
#     five. A flash is a TODAY object; if it is still on the rail after a
#     day it has stopped being a flash and become a headline.
#   - **A multi-day `expires` is the exception and needs a reason.** The
#     default is 24h; longer requires a specific justification in a comment.
#   - **Corollary — a flash whose event is not today does not belong on the
#     rail.** If something major surfaces late (found days after it broke),
#     it still gets at most a 24h window from filing, and the lateness is
#     noted on the entry. It does not get a full fresh lifespan to make up
#     for having been missed.
#   - This supersedes the 3-5 day `expires` values used through 2026-07-31.
#
# YAML guardrail: safe_load after every LLM edit, or git revert.
#
# Fields:
#   id          stable slug
#   date        YYYY-MM-DD the event happened (digest-day bucketing)
#   severity    critical (reaches the rail) | major (summary only)
#   headline    one line, plain, no hedging
#   body        two sentences maximum — what happened, what is verified
#   sources     [{label, url}] — primary where one exists
#   lenses      [all] or an explicit subset when it genuinely is scoped
#   expires     YYYY-MM-DD — auto-drops from the rail
#   logged_by   ben-steer | curate-add

flashes:
  # LATE CATCH, filed 2026-08-30 for events that began before dawn on Saturday
  # 2026-08-29 in Niamey — inside the 08-29 digest-day, which this run is
  # finalizing. `filed` is set to today deliberately, per the rule: a late
  # catch gets 24h from the CATCH. flash_last_day() renders this on 08-30 and
  # no longer.
  #
  # WHY THIS CLEARS THE BAR: an armed mutiny that attacked the presidency and
  # the international airport of a national capital, knocked state television
  # and radio off air, and drew no public appearance from the head of state
  # for a full day. It led AP, Reuters, Al Jazeera and NBC through the
  # weekend. It touches no lens on this map and there is no thread anywhere
  # that would have caught it — which is exactly what the rail is for.
  #
  # WHY IT IS LATE, AND THIS ONE IS DIFFERENT FROM THE LAST TWO: the previous
  # two late general-news catches (King Harald V, the Nepal-Tibet flood) were
  # missed because nothing was looking. This one was missed while something
  # WAS looking. Reuters had the story out by 09:30 ET on 08-29; the 08-29
  # run's world-news sweep carried a general front-page scan for the first
  # time, ran at 15:10 ET — roughly six hours later — and returned a king's
  # death from two days earlier without this. The scan is necessary and not
  # yet sufficient. Recorded in coverage-log.md 2026-08-30.
  - id: niger-niamey-mutiny-presidency-attacked
    date: 2026-08-29
    filed: 2026-08-30
    severity: critical
    headline: >-
      Mutinous soldiers attack Niger's presidency and Niamey airport; the
      junta says the mutiny is contained and dozens are under arrest
    body: >-
      Soldiers from a base in Niamey opened fire on "sensitive sites" before
      dawn on Saturday 2026-08-29, attacking the presidency and the
      international airport in hours of gunfire and explosions that briefly
      knocked state television and radio off air; the defence ministry said
      loyalist forces were retaking the seized sites, but security sources
      told Reuters mutineers still held the airport into Saturday afternoon
      and the situation remained unclear that night. By Sunday Al Jazeera
      reported dozens of soldiers arrested and the military-led government
      declaring the mutiny contained. Gen. Abdourahamane Tiani — who himself
      seized power in a 2023 coup — made no public appearance on Saturday,
      and the mutineers reportedly drew on frontline units from Ouallam,
      Tera and Dosso that have taken heavy casualties fighting the regional
      Islamic State affiliate.
    sources:
      - label: NBC News / Reuters, 2026-08-29 13:30 UTC — the ground account
        url: https://www.nbcnews.com/world/africa/mutinous-soldiers-attack-airport-presidency-niger-capital-rcna595006
      - label: Al Jazeera, 2026-08-30 — "Dozens of soldiers arrested after apparent coup attempt in Niger's capital"
        url: https://www.aljazeera.com/where/niger/
    lenses: [all]
    logged_by: curate-add
  # LATE CATCH, filed 2026-08-29 for an event at 06:35 Oslo time on Friday
  # 28 August — 00:35 ET on 08-28, which is the 08-27 digest-day under the
  # 05:00 ET boundary, hence `date: 2026-08-27`. `filed` is set to today
  # deliberately, per the rule: a late catch gets 24h from the CATCH.
  # flash_last_day() renders this on 08-29 and no longer.
  #
  # WHY THIS CLEARS THE BAR: the death of a sitting head of state, announced
  # by the Norwegian Royal House itself and read directly from its site, led
  # AP, NPR and CNN's front pages into Saturday on its own facts. It touches
  # no lens on this map — which is the rail's stated purpose.
  #
  # WHY IT IS LATE: it fell inside a digest-day (08-27) finalized with three
  # coverage critics, none of which reads general news — all twelve
  # benchmarks are AI, health-tech or finance publications — and the
  # mechanical world-news pool (attention/world-news.yaml) has been frozen
  # since 08-25 on an expired BigQuery credential. Same failure shape as
  # nepal-tibet-glacier-collapse-flood four days earlier. It surfaced on the
  # 08-29 world-news sweep's general front-page scan, a step added to that
  # sweep's brief for exactly this reason.
  - id: norway-king-harald-v-dies
    date: 2026-08-27
    filed: 2026-08-29
    severity: critical
    headline: >-
      King Harald V of Norway dies at 89; Crown Prince Haakon accedes as
      King Haakon VIII
    body: >-
      The Norwegian Royal House announced that King Harald V died peacefully
      at Oslo University Hospital Rikshospitalet at 06:35 on Friday 28 August
      (00:35 ET), aged 89 and after 35 years on the throne, and its own site
      now lists his son as His Majesty King Haakon VIII, receiving Prime
      Minister Jonas Gahr Støre at the lying-in-state on 29 August. Read
      directly from royalcourt.no and kongehuset.no; AP, NPR and CNN led with
      it into Saturday, and this map caught it a day late.
    sources:
      - label: The Royal House of Norway (royalcourt.no), announcement
        url: https://www.royalcourt.no/
      - label: Det Norske Kongehus (kongehuset.no), announcement and the 29 August programme
        url: https://www.kongehuset.no/
    lenses: [all]
    logged_by: curate-add
  # LATE CATCH, filed 2026-08-27 for an event dated 2026-08-25 ET.
  # `filed` is set to today deliberately, per the rule: a late catch gets 24h
  # from the CATCH, not a fresh lifespan and not the lifespan it already lost.
  # flash_last_day() therefore renders this on 08-27 and no longer.
  #
  # WHY THIS CLEARS THE BAR: a two-country disaster with a three-figure
  # confirmed death toll and a four-figure missing count, hundreds of them
  # foreign nationals, with China's president ordering an all-out response.
  # It leads a general news front page on its own facts, which is the test.
  # Precedent on this map: colombia-earthquake-m7-4 (281 dead, 379 missing)
  # took the rail on 08-11; this is larger.
  #
  # WHY IT IS LATE: the event fell at 22:52 ET on 08-25, inside a digest-day
  # that was finalized without it. No benchmark critic would have caught it —
  # all twelve benchmarks are AI, health-tech or finance publications — and
  # the mechanical world-news pool could not be rebuilt (bq credential
  # expired). It surfaced only on the 08-27 world-news sweep.
  - id: nepal-tibet-glacier-collapse-flood
    date: 2026-08-25
    filed: 2026-08-27
    severity: critical
    headline: >-
      Glacier collapse on the Nepal-Tibet border triggers a catastrophic
      flood; hundreds confirmed dead and well over a thousand missing
    body: >-
      A glacier section broke away at roughly 5,200m on the Nepal-China
      border at 02:52 UTC on 2026-08-26 (22:52 ET, 2026-08-25), fell about
      1,200m, dammed the Lhende Khola above the Bhote Koshi valley and then
      burst, sending a debris flood through Nepal's Rasuwa district and
      Tibet's Gyirong County; the USGS has formally reclassified the seismic
      signal it first read as a M4.4 earthquake to a M5.2 landslide, stating
      no earthquake occurred. Figures are provisional and rising: Nepal's
      Emergency Operations Centre reported 165 bodies recovered and 826
      missing as of Thursday morning, with wire reports since putting the
      Nepali dead above 350, while Xinhua reports 3 dead and 558 missing on
      the Tibet side.
    sources:
      - label: USGS event us7000tbwb (reclassified to landslide)
        url: https://earthquake.usgs.gov/earthquakes/eventpage/us7000tbwb/executive
      - label: Rising Nepal Daily, citing Nepal's Emergency Operations Centre
        url: https://risingnepaldaily.com/news/85592
      - label: Xinhua, Tibet/Gyirong toll
        url: https://chinaview.cn/20260827/3cff7674f33643dca84cf3b501f8ff1f/c.html
      - label: Al Jazeera, mechanism and downstream path
        url: https://www.aljazeera.com/news/2026/8/27/nepal-tibet-floods-what-happened-what-caused-them-and-who-is-missing
    lenses: [all]
    logged_by: curate-add
