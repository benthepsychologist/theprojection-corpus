# attention/flash.yaml — the FLASH RAIL. General-news events that must land
# regardless of lens.
#
# WHY THIS EXISTS (Ben, 2026-07-29): "big world news always lands. 9/11?
# front-page. US invades Venezuela? Front-page." The salience score ranks
# what the map already knows to watch; a flash is for the thing the map has
# no thread for and no lens model would surface — and which you would want
# to know even if you had never heard of kestrel.
#
# THE BAR IS DELIBERATELY HIGH.
#   - `critical` ONLY reaches the rail (Ben, 2026-07-29). `major` exists as a
#     severity but is folded into the executive summary, never the rail.
#   - Normally AT MOST ONE active flash. Two is exceptional. Three means the
#     bar has drifted and the rail is worthless — if everything is a flash,
#     nothing is.
#   - A flash is NOT "our biggest story today." The executive summary already
#     carries that. It is "this would lead a general news front page."
#
# VERIFICATION: a flash carries the same primary-source discipline as
# everything else. Speed buys no exemption — a wrong flash is worse than a
# late one. If it is unverified, the body says so on its face.
#
# PUBLIC: flashes DO publish to theprojection (Ben, 2026-07-29: "this is MY
# news feed FIRST. If its big world news it affects finance so its
# cohesive"). Same field allowlist discipline as everything else — nothing
# here is private by construction, but write it as if it is public, because
# it is.
#
# VOICE: neutral register (Ben, 2026-07-29) — the same frame-neutral voice
# the digests use, not first person.
#
# LIFECYCLE — 24 HOURS, ENFORCED IN CODE (Ben, 2026-08-04: "24h and gone").
# A flash renders on its FILING DAY AND NO LONGER. The cap is computed by
# render_read.flash_last_day(), which every surface goes through (the read
# page, the public site adapter, and the readout fingerprints all call
# load_flash), so there is exactly one place this is decided.
#
#   date:     the event's own date.
#   filed:    OPTIONAL — the day the flash was written. Defaults to `date`.
#             Set it explicitly when catching a LATE event, so its 24h runs
#             from the catch rather than from an event you already missed.
#   expires:  OPTIONAL and can only ever SHORTEN the life. A value LONGER
#             than the filing day is IGNORED, not honoured. Do not reach for
#             it to keep something up — that is the exact drift this replaced.
#
# An entry with no parsable `filed`/`date` does NOT render (it used to render
# forever). Writing a longer `expires` is now a no-op, so if a flash needs to
# stay up, the honest move is to file a NEW flash for the NEW event — which
# is what the "new event, never a running state" rule below already requires.
#
# WHY (2026-08-04): from 2026-08-01 the 24h rule lived only in AGENTS.md and
# was violated immediately — `iran-strikes-cancelled-deal-claimed` sat on the
# rail 3 days, `ceuta-mass-border-crossing` 4. The loader trusted a
# hand-written `expires`. It no longer does.
#
# /week still prunes expired entries out of this file for tidiness, but that
# is now cosmetic: an expired entry cannot render regardless. An expired
# flash is not deleted from the record — its substance lives in the digests
# and timelines like any item.
#
# A FLASH IS A NEW EVENT, NEVER A RUNNING STATE (Ben, 2026-08-01):
# "lapse flash, flash only new things, escalate means need flash."
#   - **Flashes cover NEW things only.** A flash describes the discrete event
#     that triggered it. It is NOT a running summary of a conflict, and it is
#     never edited to carry that conflict's evolving state forward.
#   - **Let them lapse.** When a flash's triggering event recedes, the entry
#     expires on its own date. Do not extend `expires` to keep a conflict on
#     the rail — the rail is not a "currently at war" indicator.
#   - **An ESCALATION IS ITSELF A NEW EVENT, and earns its own new flash.**
#     A materially bigger strike, a new theatre, a new combatant, an ordered
#     offensive — file a NEW entry rather than updating the old one. The old
#     one lapses on schedule.
#   - ⚠️ THIS REVERSES the 2026-07-30 precedent, where the Iran flash was
#     "widened in place" via an `updated:` field as the war grew (see that
#     entry below, and coverage-log 2026-07-30). Update-in-place is no longer
#     the pattern. That entry is left as-is to lapse rather than rewritten.
#   - Consequence to accept: during a fast-escalating conflict the rail can
#     briefly carry an old entry and its successor at once. That overlap is
#     expected and self-clears on the old entry's `expires` date — it is not
#     the "bar has drifted" failure the count rule above describes.
#
# 24-HOUR LIFESPAN — "FLASH MEANS TODAY" (Ben, 2026-08-01):
# "flash messages should expire in 24h typically. flash means today."
#   - **Default `expires` is the event date + 1 day.** Not three days, not
#     five. A flash is a TODAY object; if it is still on the rail after a
#     day it has stopped being a flash and become a headline.
#   - **A multi-day `expires` is the exception and needs a reason.** The
#     default is 24h; longer requires a specific justification in a comment.
#   - **Corollary — a flash whose event is not today does not belong on the
#     rail.** If something major surfaces late (found days after it broke),
#     it still gets at most a 24h window from filing, and the lateness is
#     noted on the entry. It does not get a full fresh lifespan to make up
#     for having been missed.
#   - This supersedes the 3-5 day `expires` values used through 2026-07-31.
#
# YAML guardrail: safe_load after every LLM edit, or git revert.
#
# Fields:
#   id          stable slug
#   date        YYYY-MM-DD the event happened (digest-day bucketing)
#   severity    critical (reaches the rail) | major (summary only)
#   headline    one line, plain, no hedging
#   body        two sentences maximum — what happened, what is verified
#   sources     [{label, url}] — primary where one exists
#   lenses      [all] or an explicit subset when it genuinely is scoped
#   expires     YYYY-MM-DD — auto-drops from the rail
#   logged_by   ben-steer | curate-add

flashes: []
