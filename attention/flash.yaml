# attention/flash.yaml — the FLASH RAIL. General-news events that must land
# regardless of lens.
#
# WHY THIS EXISTS (Ben, 2026-07-29): "big world news always lands. 9/11?
# front-page. US invades Venezuela? Front-page." The salience score ranks
# what the map already knows to watch; a flash is for the thing the map has
# no thread for and no lens model would surface — and which you would want
# to know even if you had never heard of kestrel.
#
# THE BAR IS DELIBERATELY HIGH.
#   - `critical` ONLY reaches the rail (Ben, 2026-07-29). `major` exists as a
#     severity but is folded into the executive summary, never the rail.
#   - Normally AT MOST ONE active flash. Two is exceptional. Three means the
#     bar has drifted and the rail is worthless — if everything is a flash,
#     nothing is.
#   - A flash is NOT "our biggest story today." The executive summary already
#     carries that. It is "this would lead a general news front page."
#
# VERIFICATION: a flash carries the same primary-source discipline as
# everything else. Speed buys no exemption — a wrong flash is worse than a
# late one. If it is unverified, the body says so on its face.
#
# PUBLIC: flashes DO publish to theprojection (Ben, 2026-07-29: "this is MY
# news feed FIRST. If its big world news it affects finance so its
# cohesive"). Same field allowlist discipline as everything else — nothing
# here is private by construction, but write it as if it is public, because
# it is.
#
# VOICE: neutral register (Ben, 2026-07-29) — the same frame-neutral voice
# the digests use, not first person.
#
# LIFECYCLE: `expires` drops it off the rail automatically; /week prunes
# expired entries out of this file. An expired flash is not deleted from the
# record — its substance lives in the digests and timelines like any item.
#
# A FLASH IS A NEW EVENT, NEVER A RUNNING STATE (Ben, 2026-08-01):
# "lapse flash, flash only new things, escalate means need flash."
#   - **Flashes cover NEW things only.** A flash describes the discrete event
#     that triggered it. It is NOT a running summary of a conflict, and it is
#     never edited to carry that conflict's evolving state forward.
#   - **Let them lapse.** When a flash's triggering event recedes, the entry
#     expires on its own date. Do not extend `expires` to keep a conflict on
#     the rail — the rail is not a "currently at war" indicator.
#   - **An ESCALATION IS ITSELF A NEW EVENT, and earns its own new flash.**
#     A materially bigger strike, a new theatre, a new combatant, an ordered
#     offensive — file a NEW entry rather than updating the old one. The old
#     one lapses on schedule.
#   - ⚠️ THIS REVERSES the 2026-07-30 precedent, where the Iran flash was
#     "widened in place" via an `updated:` field as the war grew (see that
#     entry below, and coverage-log 2026-07-30). Update-in-place is no longer
#     the pattern. That entry is left as-is to lapse rather than rewritten.
#   - Consequence to accept: during a fast-escalating conflict the rail can
#     briefly carry an old entry and its successor at once. That overlap is
#     expected and self-clears on the old entry's `expires` date — it is not
#     the "bar has drifted" failure the count rule above describes.
#
# 24-HOUR LIFESPAN — "FLASH MEANS TODAY" (Ben, 2026-08-01):
# "flash messages should expire in 24h typically. flash means today."
#   - **Default `expires` is the event date + 1 day.** Not three days, not
#     five. A flash is a TODAY object; if it is still on the rail after a
#     day it has stopped being a flash and become a headline.
#   - **A multi-day `expires` is the exception and needs a reason.** The
#     default is 24h; longer requires a specific justification in a comment.
#   - **Corollary — a flash whose event is not today does not belong on the
#     rail.** If something major surfaces late (found days after it broke),
#     it still gets at most a 24h window from filing, and the lateness is
#     noted on the entry. It does not get a full fresh lifespan to make up
#     for having been missed.
#   - This supersedes the 3-5 day `expires` values used through 2026-07-31.
#
# YAML guardrail: safe_load after every LLM edit, or git revert.
#
# Fields:
#   id          stable slug
#   date        YYYY-MM-DD the event happened (digest-day bucketing)
#   severity    critical (reaches the rail) | major (summary only)
#   headline    one line, plain, no hedging
#   body        two sentences maximum — what happened, what is verified
#   sources     [{label, url}] — primary where one exists
#   lenses      [all] or an explicit subset when it genuinely is scoped
#   expires     YYYY-MM-DD — auto-drops from the rail
#   logged_by   ben-steer | curate-add

flashes:

  - id: iran-strikes-cancelled-deal-claimed
    date: 2026-08-01
    severity: critical
    headline: "Trump cancelled the strikes on Iran he had ordered a day earlier, saying a deal had been agreed to reopen the Strait of Hormuz — and Iran said no deal exists"
    body: >
      Late on 08-01 Trump posted that the United States was "locked and
      loaded and ready to go against the Islamic Republic of Iran" but
      that Iran and other regional states had asked him to hold off
      because "the perimeters of a deal has been agreed to" — terms he
      described as the "Immediate, Complete, and Total OPENING OF THE
      HORMUZ STRAIT" and an end to Iran's nuclear threat, adding "The
      Country of Israel joins me in this commitment." No US or Israeli
      strike was carried out on 08-01 or 08-02. ⚠ Iran denies it: Mehr,
      citing military officials, called the claim "simply a new lie,"
      and Foreign Minister Abbas Araghchi warned of a "decisive response"
      to any aggression. This is a cancellation asserted by one side and
      an agreement denied by the other — not a ceasefire. Saudi Crown
      Prince Mohammed bin Salman called Trump urging de-escalation, and
      Qatar and Pakistan are reported working with US envoy Steve Witkoff
      toward an Iran-Oman arrangement to reopen commercial transits.
    sources:
      - label: "NPR (08-02)"
        url: https://www.npr.org/2026/08/02/nx-s1-5917113/trump-says-hes-cancelling-iran-strikes-deal-pending
      - label: "Al Jazeera live (08-02, Tehran's response)"
        url: https://www.aljazeera.com/news/liveblog/2026/8/2/iran-war-live-tehran-warns-of-decisive-response-to-any-us-aggression
    lenses: [all]
    expires: 2026-08-03
    logged_by: curate-add
    # NEW ENTRY, not an update to iran-us-strikes-ordered-hormuz-tankers
    # (2026-08-01 rule: a new event earns its own flash). A de-escalation
    # is a new event on the same terms an escalation is.
    # ⚠️ THE PREDECESSOR WAS LAPSED A DAY EARLY — deliberately, and NOT to
    # manage the rail count. `iran-us-strikes-ordered-hormuz-tankers`
    # announced imminent strikes "as soon as this weekend." Those strikes
    # were publicly cancelled overnight. Leaving that entry rendering on
    # every page of a live public site today would be publishing something
    # now known to be false, which is an accuracy failure, not a staleness
    # one. The 24h rule governs how long a TRUE flash lives; nothing in it
    # requires carrying a superseded one to term. Recorded here so the
    # early lapse is not later mistaken for expires-tampering.
    # Rail count today: 3 (this, ceuta, russia-kyiv-barrage). The other two
    # expire 08-02, so the rail carries ONE entry from 08-03. That is the
    # self-clearing overlap the header's own consequence clause describes.
    # ⚠️ CONTEXT THIS FLASH SITS IN, corrected the same day: this is month
    # five of a war that began 2026-02-28, not week two of one that began
    # 07-23. See threads/iran-conflict-widening.

  - id: ceuta-mass-border-crossing
    date: 2026-07-30
    severity: critical
    headline: "Roughly 50,000 people crossed from Morocco into Spain's Ceuta enclave in two days, dozens died, Spain deployed its armed forces and seven EU states reimposed border controls"
    body: >
      Between 07-30 and 07-31 an estimated 49,000-60,000 migrants crossed
      from Morocco into the Spanish enclave of Ceuta, with smaller
      crossings at Melilla — the largest such episode since 2021. Reported
      deaths rose across the window from at least 18 to 57; the figure was
      still moving and outlets differ, so treat the toll as unsettled.
      Spain deployed its armed forces and PM Pedro Sánchez called it "an
      attack on Spain's territorial integrity"; Spain and Morocco then
      agreed on returns, and Spain said by 07-31 that most of those who
      crossed had gone back. France, Italy, Finland, Austria, Sweden,
      Denmark and the Czech Republic reimposed or threatened Schengen
      border controls in response.
    sources:
      - label: "NPR (07-31)"
        url: https://www.npr.org/2026/07/31/g-s1-136507/morocco-spain-migration
      - label: "Al Jazeera (07-30)"
        url: https://www.aljazeera.com/news/2026/7/30/spanish-enclave-of-ceuta-raises-alarm-as-thousands-cross-morocco-border
      - label: "CNN (07-31, returns + revised toll)"
        url: https://www.cnn.com/2026/07/31/europe/spain-ceuta-migrants-intl
      - label: "Bloomberg (07-31, Sánchez 'under attack')"
        url: https://www.bloomberg.com/news/articles/2026-07-31/sanchez-says-spain-under-attack-after-mass-migration-influx
    lenses: [all]
    expires: 2026-08-02   # 24h from FILING, not from the event — see below
    logged_by: curate-add
    # ⚠️ LATE FILING, noted per the 24h rule's corollary: the event is dated
    # 07-30/31 but was only found on 08-01, so it gets 24h from filing
    # rather than a fresh multi-day window. Being missed does not buy a
    # longer lifespan.
    # THE CASE THIS RAIL EXISTS FOR, and it was nearly missed entirely.
    # This header's own definition — "a flash is for the thing the map has
    # no thread for and no lens model would surface, and which you would
    # want to know even if you had never heard of kestrel" — describes this
    # exactly. It surfaced only as an unmatched `Spain–MAR` cluster in the
    # mechanical world-news sweep (67/44/37 outlets), was offered to Ben
    # 2026-08-01 as an explicitly UNVERIFIED candidate, and he asked for it
    # to be checked. It was not on any lens's radar. Lesson: an unmatched
    # mechanical cluster with a high outlet count deserves a look before it
    # is dismissed as a CAMEO false positive.

  - id: russia-kyiv-barrage-aug
    date: 2026-07-31
    severity: critical
    headline: "Russia hit Kyiv directly with 35 missiles and 185 drones overnight, killing at least nine and partly collapsing a residential building"
    body: >
      Overnight 07-31 into 08-01, Russia struck the Ukrainian capital with
      35 missiles and 185 attack drones, killing at least 9 people and
      wounding 28, four of them children; a residential building in
      Kyiv's Shevchenkivskyi district partially collapsed. Casualty
      figures were still being revised upward at the time of filing.
      Separately, Zelenskyy is pressing Washington for a licence to
      manufacture Patriot missiles domestically, which Trump has so far
      declined — "it's a hard thing to give away that kind of
      technology."
    sources:
      - label: "Al Jazeera (08-01)"
        url: https://www.aljazeera.com/news/2026/8/1/russian-missile-attack-kills-three-in-ukraines-kyiv
      - label: "AP via KSAT (08-01)"
        url: https://www.ksat.com/news/world/2026/08/01/russia-hits-ukrainian-capital-with-ballistic-missiles-and-drones-killing-at-least-9/
    lenses: [all]
    expires: 2026-08-02
    logged_by: curate-add
    # NEW ENTRY, not an update to russia-missile-poland-nato-airspace
    # (2026-08-01 rule: escalation earns its own flash). That entry covers
    # the NATO-airspace incursion of 07-29/30 and lapses 08-03 on its own
    # schedule. This is a separate, materially deadlier event: the earlier
    # one was the diplomatic incident, this is the human one. Poland
    # notably did NOT invoke NATO Article 4 over the incursion, unlike its
    # September 2025 response to a drone incursion.

  - id: iran-us-strikes-ordered-hormuz-tankers
    date: 2026-07-31
    severity: critical
    headline: "Trump ordered new strikes on Iran 'as soon as this weekend' as the IRGC hit two tankers in the Strait of Hormuz"
    body: >
      At a Camp David cabinet meeting on 07-31 Trump ordered fresh
      strikes on Iran "as soon as this weekend," saying the US "will be
      hitting them very hard"; reported targets include missile sites,
      energy infrastructure and possibly nuclear-linked sites, described
      as a two-week bombardment plan. ⚠ As of filing the strikes had NOT
      been carried out — this is an ordered intention, not an executed
      action. Separately and already executed: Iran's IRGC struck two
      tankers transiting the Strait of Hormuz, its first direct action
      against transiting vessels rather than a threat, and claimed a
      drone strike on US assets at Kuwait's Ahmad Al-Jaber airbase.
    sources:
      - label: "Bloomberg, citing WSJ (07-31)"
        url: https://www.bloomberg.com/news/articles/2026-07-31/trump-orders-attacks-on-iran-as-soon-as-this-weekend-wsj-says
      - label: "Axios (07-31)"
        url: https://www.axios.com/2026/07/31/trump-iran-strikes-energy-infrastructure-war
      - label: "Washington Times (07-31, Hormuz tankers)"
        url: https://www.washingtontimes.com/news/2026/jul/31/irgc-says-struck-two-tankers-strait-hormuz-escorted-us-military/
      - label: "Al Jazeera (07-31, Kuwait airbase claim)"
        url: https://www.aljazeera.com/news/2026/7/31/irgc-strikes-us-targets-in-kuwait-a-day-after-us-hits-iran-latest-events
    lenses: [all]
    expires: 2026-08-01   # LAPSED A DAY EARLY 2026-08-02 — see below
    logged_by: curate-add
    # NEW ENTRY, not an update to iran-strikes-us-base-jordan (2026-08-01
    # rule). That entry covers the 07-28 Jordan strike and its widening and
    # lapses 08-02 on its own schedule; it was itself widened in place on
    # 07-30 under the OLD rule, which this supersedes.
    # ⚠️ 2026-08-02 ⟨daily⟩: `expires` SHORTENED from 08-02 to 08-01. The
    # strikes this entry announces as imminent were publicly cancelled by
    # Trump late on 08-01 (see iran-strikes-cancelled-deal-claimed, which
    # supersedes this). Flashes publish to every page of a live public
    # site, so carrying this to its original term would have meant
    # publishing a claim already known to be false. Shortened on ACCURACY
    # grounds only. This is not the "don't extend expires" rule being bent
    # — that rule stops a conflict being held on the rail past its event;
    # this is the opposite case, a superseded entry being let go sooner.
    # The body is left exactly as written; only the lifespan changed.

  - id: iran-strikes-us-base-jordan
    date: 2026-07-28
    severity: critical
    headline: "The Iran-US conflict widened sharply: direct US strikes on Iran, Saudi Arabia joins as a combatant, Kuwait and Egypt hit"
    body: >
      What began as an intercepted Iranian missile salvo on a US base in
      Jordan (07-28, no casualties) escalated within 48 hours into a
      multi-country exchange: the US struck targets inside Iran directly
      (Bandar Abbas, Kish Island, Khuzestan's oil belt), killing civilians
      on Qeshm Island; Saudi Arabia joined US airstrikes against
      Iran-backed militias in Iraq, its first direct action of this kind;
      an Iranian strike killed a worker in Kuwait, and a drone hit vessels
      at Egypt's Damietta port — both first-time countries in this
      conflict. The US Treasury separately sanctioned firms and tankers
      tied to an Iranian scheme extorting insurance payments for Strait of
      Hormuz passage. This is a wider war than the triggering event, not
      an echo of it — updated in place rather than as a second flash.
    sources:
      - label: "Axios (07-28 Jordan strike)"
        url: https://www.axios.com/2026/07/28/iran-missile-attack-us-base-jordan
      - label: "NPR (07-30, US strikes on Iran)"
        url: https://www.npr.org/2026/07/30/nx-s1-5913077
      - label: "Al Jazeera live blog (07-29/30, Iraq/Kuwait/Egypt widening)"
        url: https://www.aljazeera.com/where/iraq/
      - label: "CNN live coverage"
        url: https://edition.cnn.com/2026/07/28/world/live-news/iran-trump-news
    lenses: [all]
    expires: 2026-07-31
    logged_by: curate-add
    updated: 2026-07-30   # widened in place — see coverage-log.md 2026-07-30

  - id: russia-missile-poland-nato-airspace
    date: 2026-07-30
    severity: critical
    headline: "A Russian cruise missile crossed into Polish — NATO — airspace during the war's largest missile-and-drone barrage on Ukraine in weeks"
    body: >
      Overnight 07-29→30, Russia launched 70+ missiles and 280+ attack
      drones at Ukraine (260+ intercepted), killing at least 8-10
      civilians including children. A Kh-101 cruise missile crossed into
      Poland — a NATO member — landing in the rural village of
      Tarnawa-Kolonia; Polish PM Donald Tusk called it "a very serious
      incident" but said Poland was not the target. NATO scrambled
      fighter jets, an attack helicopter, and ground defenses;
      Secretary-General Mark Rutte called it "yet another reckless act by
      Russia." This is a genuinely separate conflict from the active Iran
      flash (different theater, different actors) and gets its own entry
      rather than folding in.
    sources:
      - label: "NPR (07-30)"
        url: https://www.npr.org/2026/07/30/g-s1-136276/russia-ukraine-war
      - label: "Al Jazeera (07-30, NATO jets scramble)"
        url: https://www.aljazeera.com/news/2026/7/30/nato-jets-scramble-as-russian-missile-detonates-in-poland
      - label: "Foreign Policy (07-30)"
        url: https://foreignpolicy.com/2026/07/30/poland-russia-missile-incursion-nato-ukraine-war-strikes/
      - label: "ABC News (07-30)"
        url: https://abcnews.com/International/russian-strikes-ukraine-kill-8-zelenskyy-blames-insufficient/story?id=135216948
    lenses: [all]
    expires: 2026-07-31
    logged_by: curate-add
    # NOTE: this is a SECOND concurrent flash (Iran is the other). AGENTS.md's
    # own bar says "two is exceptional" — flagged plainly to Ben in the daily
    # digest rather than filed silently, precisely because it's the exception
    # case the rule anticipates, not a drift. This is exactly the scenario
    # flash.yaml's own header describes: "a flash is for the thing the map
    # has no thread for" — Russia-Ukraine (this event's war) has ZERO thread
    # coverage in kestrel. It was already offered as a thread candidate
    # 2026-07-30 (315 outlets then) and went unanswered; per the world-news
    # candidate restraint rule ("don't re-offer a second time"), it is NOT
    # re-offered today — flash and thread-candidacy are independent
    # mechanisms, and this discrete NATO-airspace event earns its own flash
    # regardless of the parent war's tracking status.
