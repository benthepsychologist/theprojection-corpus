# attention/capital-context.yaml — the standing "what's the global capital
# picture right now" snapshot (DESIGN.md Part 2 §11). A macro-wide sibling
# to actor-doing.yaml — but for the whole global capital system rather
# than one actor. Daily Global-Capital-lens curation READS this to answer
# "how does this news item interact with the current picture" instead of
# reasoning from nothing each time; it does NOT write here.
#
# REFRESH DISCIPLINE: refreshed on a separate, slower pass — /week-adjacent,
# roughly weekly, matching the underlying data's own cadence (Treasury TIC
# ~2mo lag, BIS ~6wk, IMF quarterly-ish, EPFR weekly) — never by /daily.
# Read-only from /daily's curation step, same "who writes what" discipline
# that keeps threads.yaml/upcoming.yaml main-session-only.
#
# `/steer capital-context ...` touches `framing` ONLY (Ben, 2026-07-30) —
# never a `readings.*.value` directly. A wrong reading is a data/collector
# bug, not a /steer edit.
#
# Fields per reading: {value, basis, sources[{figure, label, url, as_of}], as_of}

