  conflict_risk_premium:
    value: >
      Iran's war is now nearly six months old (opened 2026-02-28), and this
      week widened rather than resolved on every front it touches. The
      Iran-Oman reopening deal — reported "final drafting" earlier — hit a
      real setback: Iran's Revolutionary Guard went public with six
      maximalist conditions (war-damage compensation, an end to the US
      counter-blockade, sanctions relief, frozen assets released),
      explicitly separating Hormuz reopening from the Oman channel
      entirely. Houthi drones struck Saudi Aramco's Jazan refinery twice
      this week (a repeat target, first hit ~07-25/27), and Iran's IRGC
      hit a 16th ADNOC tanker with a missile in Hormuz (UAE-flagged, no
      casualties) — both continuations of the standing war, not new
      fronts. TWO GENUINELY NEW theatres opened this week: Israel-Lebanon
      turned deadly (soldiers and civilians killed on both sides amid a
      collapsing seventh round of talks), promoted under the standing
      "all active conflicts get coverage" rule; and Yemen's OWN civil war
      (Houthis vs. the Saudi-backed government, distinct from the Red Sea
      shipping campaign) had its worst 3-day stretch in four years, with
      the UN's Yemen envoy on record warning of a return to full-scale
      war. Regional powers answered with structure: Saudi Arabia, Turkey,
      and Pakistan signed a trilateral mutual-defense pact in Mecca —
      two regional powers binding themselves to a nuclear-armed state
      while the fronts burn. THIS WEEK (08-10–08-14): the pattern this
      reading has tracked for weeks — oil prices falling even as
      rhetoric/incidents escalate — held again and again. Two ADNOC-owned
      tankers were struck by drones transiting Hormuz (08-13 evening), a
      second Gulf state's vessels hit (distinct from Saudi Aramco's Jazan
      refinery, itself struck twice this week); the UAE formally blamed
      Iran's Revolutionary Guard as "acts of piracy" (08-14), Canada
      sanctioned five Iranian officials, and Trump escalated rhetorically
      ("I'll be declaring the Hormuz Strait a territory of the United
      States" once Iran is "defeated") — a claim with no stated
      implementation mechanism. Yet Brent/WTI kept falling on OPEC's
      fourth straight demand-growth downgrade and a large US inventory
      build, not rising on the incidents. A second theatre sharpened
      further: Israel is reportedly besieging ~40 Hezbollah fighters
      trapped in a tunnel network beneath the Ali al-Taher ridge (cutting
      supply lines, awaiting a US "green light" for an assault) — the
      most concrete step toward renewed ground combat that front has
      seen — the same day Hezbollah's Qassem publicly rejected the
      Rome-talks framework. Underwriting layer (war-risk insurance 3-10%
      of hull value vs. ~0.25% pre-war) unchanged, no new check found.
      FRIDAY/SATURDAY (08-14–08-15): the falling-oil pattern broke for
      the first time all week. Brent closed the week up more than 5% not
      on any physical incident but on the US floating an "indefinite"
      Hormuz blockade — the first time this reading's own tracked pattern
      (rhetoric/incidents up, oil down on fundamentals) reversed. A third
      ADNOC tanker was hit the same week. Iran and Oman announced a
      partial "shipping map" agreement over the weekend — real forward
      movement, but explicitly short of the tracked interim deal's own
      terms (60-day no-toll window, dual transit lanes, mine-clearing);
      `upcoming.yaml`'s `iran-oman-hormuz-deal-signing` stays pending, due
      08-19. Israel-Lebanon turned genuinely deadlier: Israeli strikes on
      two Lebanese villages killed at least 11 — the deadliest single day
      since the ceasefire — after a Hezbollah drone attack severely
      wounded three IDF soldiers.
      THIS WEEK (08-17-08-24): the Iran war's economic-warfare axis
      sharpened into the most concrete instrument yet. Treasury's 08-24
      "Operation Economic Outcast" package (~60 designations, five
      sectoral determinations, every Bank Melli branch ordered shut)
      named China directly as not exempt -- it buys roughly 90% of
      Iran's oil exports -- and threatened removal from the US dollar
      system for any facilitator of Iranian money-laundering. With
      Iranian loadings already down to roughly 287k bbl/day from ~2m
      pre-war, there is almost no physical barrel left to squeeze; this
      is a payments-rail sanction aimed at Chinese refiners and their
      banks, not an oil sanction. Oil fell about 2.5% INTO the
      announcement, continuing this reading's own tracked pattern of
      prices falling even as enforcement escalates. The same afternoon
      and the same OFAC notice, the US delisted Syria from the State
