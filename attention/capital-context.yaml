framing:
  emphasis: []       # ben-steer additions: what the next refresh should weight
  deprioritize: []   # ben-steer additions: what to stop centering
  notes: ""          # freeform standing instruction to the refresh pass

readings:

  rate_regime:
    value: >
      Fed on a hawkish hold at 3.50%-3.75% (9-3 vote, three dissents FOR a
      hike — up from unanimous in June). The July jobs report (published
      08-07) landed as the sharpest challenge yet to that hawkish read:
      payrolls FELL 23,000 against a consensus +83-85k gain, with a
      combined 103,000-job downward revision to May/June — the strongest
      data point yet to push back on the hike-dissent bloc before the
      09-16 decision, though markets read it as hike-relief (a rally, not
      a recession signal) with no Fed voice yet on the record. Chaired by
      Kevin Warsh (confirmed 54-45, narrowest margin in the office's
      history; Jerome Powell remains a governor, not a departure). NEW
      this week and genuinely a different axis: Trump revived his effort
      to remove Fed Governor Lisa Cook (hard three-week deadline, 08-26),
      rebuilt to survive the Supreme Court's due-process ruling that
      blocked his first attempt — pressure on the committee's COMPOSITION,
      distinct from Warsh's own low-guidance messaging regime. 30-year
      Treasury yield near 5.24% as of the last check, highest since 2007.
      Next decision 2026-09-16.
    basis: "FRED policy-rate/curve series + the 07-29 FOMC decision + the 08-07 jobs report + the Lisa Cook removal fight (radar Q7)"
    sources:
      - figure: "3.50%-3.75%, 9-3 vote"
        label: "Federal Reserve press release, 2026-07-29"
        url: "https://www.federalreserve.gov/newsevents/pressreleases/monetary20260729a.htm"
        as_of: "2026-07-29"
      - figure: "Payrolls -23,000 vs +83-85k consensus; -103k combined revision"
        label: "BLS, July 2026 Employment Situation"
        url: "https://www.bls.gov/news.release/empsit.nr0.htm"
        as_of: "2026-08-07"
      - figure: "Kevin Warsh confirmed 54-45, sworn in 2026-05-22"
        label: "federalreserve.gov, Board of Governors"
        url: "https://www.federalreserve.gov/aboutthefed/bios/board/warsh.htm"
        as_of: "2026-08-02"
      - figure: "Lisa Cook removal effort revived, 08-26 deadline"
        label: "NPR, 2026-08-07"
        url: "https://www.npr.org/2026/08/07/nx-s1-5925167/trump-lisa-cook-federal-reserve"
        as_of: "2026-08-07"
    as_of: "2026-08-09"

  cross_border_credit:
    value: >
      Global cross-border bank claims rose to $47.62T in 2026-Q1 (BIS
      locational banking stats), up from $45.97T in 2025-Q4 — the
      balance-sheet channel through which a rate or risk shock in one
      jurisdiction transmits to bank lending in another kept expanding
      through the quarter. USD-denominated claims specifically: $21.80T
      (up from $20.84T), still the dominant currency leg.
    basis: "collectors/bis_stats.py (BIS SDMX locational banking statistics API) — re-run 2026-08-04, new quarter available since the last refresh"
    sources:
      - figure: "$47.62T (was $45.97T)"
        label: "BIS locational banking statistics, 2026-Q1"
        url: "https://stats.bis.org/api/v1"
        as_of: "2026-Q1"
      - figure: "$21.80T USD-denominated (was $20.84T)"
        label: "BIS locational banking statistics, 2026-Q1"
        url: "https://stats.bis.org/api/v1"
        as_of: "2026-Q1"
    as_of: "2026-08-04"

  external_position:
    value: >
      US foreign-held Treasury securities at $9,371.1B (2026-05), holding
      roughly flat over the prior two months. US current account -$195B
      and net international investment position -$21.27T (both 2026-Q1) —
      the US remains a large net external debtor, the structural backdrop
      any dollar-flow story sits on top of.
    basis: "collectors/treasury_tic.py (Treasury TIC Table 5) + collectors/imf_data.py (IMF BOP/IIP via api.imf.org)"
    sources:
      - figure: "$9,371.1B foreign-held Treasuries"
