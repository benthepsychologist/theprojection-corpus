readings:

  rate_regime:
    value: >
      Fed on a hawkish hold at 3.50%-3.75% (9-3 vote, three dissents FOR a
      hike — up from unanimous in June). The July jobs report (published
      08-07) landed as the sharpest challenge yet to that hawkish read:
      payrolls FELL 23,000 against a consensus +83-85k gain, with a
      combined 103,000-job downward revision to May/June — the strongest
      data point yet to push back on the hike-dissent bloc before the
      09-16 decision, though markets read it as hike-relief (a rally, not
      a recession signal) with no Fed voice yet on the record. Chaired by
      Kevin Warsh (confirmed 54-45, narrowest margin in the office's
      history; Jerome Powell remains a governor, not a departure). NEW
      this week and genuinely a different axis: Trump revived his effort
      to remove Fed Governor Lisa Cook (hard three-week deadline, 08-26),
      rebuilt to survive the Supreme Court's due-process ruling that
      blocked his first attempt — pressure on the committee's COMPOSITION,
      distinct from Warsh's own low-guidance messaging regime. 30-year
      Treasury yield near 5.24% as of the last check, highest since 2007.
      Next decision 2026-09-16. THIS WEEK (08-10–08-14): two fresh data
      points cut in opposite directions on the same 09-16 decision. July's
      producer-price index came in flat month-over-month (core ex food/
      energy/trade +0.4% m/m, +4.7% y/y) while initial jobless claims rose
      9,000 to 209,000 (above the 202,000 estimate) — both add to the
      case the economy is cooling on its own, the same direction as the
      July jobs report above. Cutting the other way: the Treasury sold
      $25B of 30-year bonds at 5.216%, the highest yield for that maturity
      since 2001 and the THIRD 2026 auction to clear above 5% (May 5.046%,
      July 5.058%) — a structural federal-borrowing-cost pressure distinct
      from, but compounding, the Fed's own rate debate. Market-implied
      September rate-hike probability sat around 30.4% as of 08-14,
      pricing in the softer data without fully discounting a hike. The
      Lisa Cook removal fight's 08-26 deadline has not yet resolved.
      FRIDAY (08-15): two more data points landed on the cooling side of
      the ledger, not yet reflected in the September-hike probability
      above (still 30.4% as of Thursday). July retail sales fell 0.6%
      against a forecast +0.1% gain, and preliminary August consumer
      sentiment cratered to 51.0, its weakest reading since the 2024
      election — both consistent with the jobs/PPI/claims data already
      cooling into 09-16, not a new signal on their own.
      NEW 08-19, first cross-border data point this snapshot has carried:
      Japan's 10-year JGB pushed toward its highest yield since 1996,
      taking Nikkei/SoftBank/Kioxia/Arm down together in the same session
      -- the rate-into-AI-equities transmission mechanism this snapshot has
      tracked domestically reproducing outside the US. Hours later the
      Treasury doubled its long-bond buyback size and the 30-year fell to
      5.196%, a partial reversal. This snapshot's rate_regime still reads
      almost entirely US-Fed-framed; a proper BOJ/JGB leg is a /week-scale
      addition, flagged here rather than built out in this daily pass.
      THIS WEEK (08-17-08-24): the Fed-composition fight and a NEW
      Treasury-side pressure converged into the same window. Lisa Cook's
      08-26 removal deadline is now two days out with no resolution.
      Separately, and newly significant: CNBC reported (08-24) that a
      Treasury General Account balance of $935-950bn -- some $350-400bn
      above the prior administration's target -- is what funds the
      doubled long-end bond-buyback ceiling, turning Deutsche Bank's
      "soft-form financial repression" characterisation (standing since
      around 08-20) into a mechanism with a known size. Commentary
      escalated the framing to "fiscal dominance" by the 08-24 afternoon
      -- monetary policy allegedly subordinated to fiscal financing needs,
      not merely leaned on. The 30-year touched a 19-year high of 5.33%
      intraday on 08-24 before pulling back to 5.228% on the TGA reporting
      itself. Warsh gives his first Jackson Hole keynote as chair on
      08-28, directly into a bond market that just learned about the TGA
      mechanism -- the cleanest test yet of whether his messaging regime
      and Treasury's own balance-sheet operations are read as coordinated
      or in tension. A new standing thread opened 2026-08-25,
      `treasury-long-end-intervention`, split out of
      `fed-independence-fight` since this is a distinct balance-sheet-
      operations story, not a Fed-composition one -- read that thread for
      the ongoing detail rather than this snapshot going forward.
