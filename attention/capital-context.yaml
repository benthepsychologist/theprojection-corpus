        url: "https://punchng.com/iran-wont-reopen-hormuz-until-us-meets-all-conditions-revolutionary-guards/"
        as_of: "2026-08-09"
      - figure: "Second Aramco Jazan refinery strike this week"
        label: "NPR, 2026-08-09"
        url: "https://www.npr.org/2026/08/09/nx-s1-5926387/yemens-houthis-claim-attack-on-aramco-oil-facility-in-saudi-arabia-and-other-middle-east-news"
