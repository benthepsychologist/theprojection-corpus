      NOTE THE PREMISE, which is easy to get wrong: this is NOT active
      large-scale war. A ceasefire has held since 2025-10-10 under UNSC
      Resolution 2803 — a low-intensity, frequently-violated truce that
      monitors describe as "neither war nor peace." Five standing
      questions. ① Does the 14-day disarmament roadmap actually land
      (~08-14), or slip like the NCAG-entry and phase-two-talks deadlines
      before it? ② Does a verifiable phased withdrawal begin, or does the
      security-zone line keep expanding — it has moved one way only since
      October 2025 (Yellow Line ~57.8% → Orange Line ~64% → ~70% by July),
      so a genuine reversal would itself be the signal. ③ Does the
      stabilization force scale from its ~200-troop Rafah pilot toward the
      ~5,000 target, given Indonesia has already suspended participation
      and only Morocco has signed a deployment agreement? ④ Does Hamas
      surrender actual heavy weapons to the National Committee, or does
      disarmament stay symbolic — the 07-06 civilian-authority handover
      carried no disarmament commitment at all. ⑤ Does the low-boil
      strike pattern hold, escalate, or taper, and does food insecurity
      (67% of the population at crisis level or worse) turn a corner or
      slide toward the 90% monitors warn of.
      SIBLING, NOT CHILD, of the Middle East conflict thread: the news
      drivers here are Gaza-specific and do not move in lockstep. The
      Houthis did pause their campaign over this ceasefire in November
      2025, but on resuming in March 2026 they re-framed it around a
      different war entirely. Re-linkage risk is the thing to watch — if
      the Houthis explicitly re-cite this conflict as a strike rationale,
      reconsider the structure.
