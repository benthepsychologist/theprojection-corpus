      was wrong by five months. The war began 2026-02-28, when a
      US-Israeli opening strike wave killed Iran's Supreme Leader ALI
      KHAMENEI at his office in Tehran. His son MOJTABA KHAMENEI was
      named third Supreme Leader by the Assembly of Experts and took
      office 2026-03-08; he has been strikingly little-seen since (a
      written "sacred unity" statement mid-July, read out by an anchor
      rather than delivered). Confirmed by Iran's OWN state media (Press
      TV, Tasnim, Mehr; a 40-day mourning period was declared) plus Al
      Jazeera, NBC and Britannica — a hostile power's state media
      confirming the killing of its own head of state is close to
      unfalsifiable. Found twice independently on 2026-08-02, by two
      sweeps that did not share sources (a world-news check and a
      shipping/CRS-sourced capital check) — cross-sweep agreement is why
      it is being treated as established rather than as one agent's
      claim. The 07-23 Houthi tanker strikes and the 07-28 Iranian
      missile attack on the US base in Jordan are PHASE BOUNDARIES
      inside a five-month war, not its origin; 07-28 is specifically the
      resumption of Iranian strikes on US bases after a brief
      Trump-ordered pause. EVERYTHING BEFORE 2026-07-23 IS A GAP — a
      `/crawl` backfill of 02-28 → 07-23 is the single biggest hole in
      this map. Correspondingly, the caution this thread used to carry —
      that aggregators calling this a "US-Israel-Iran war" were
      unconfirmed — was itself the error. They were right and this
      thread's scepticism was aimed the wrong way. ISRAEL IS A
      CO-BELLIGERENT and has been since the opening wave; treat that as
      established, not as a claim needing a further check.
      CURRENT STATE: after 07-28 the conflict widened into direct US
      strikes inside Iran, Saudi Arabia joining as a combatant in Iraq,
      and strikes reaching Kuwait and Egypt for the first time. On 07-31
      Trump ordered fresh strikes "as soon as this weekend"; late on
      08-01 he announced he was CANCELLING them, saying parameters of a
      deal had been agreed requiring the complete reopening of the Strait
      of Hormuz and an end to Iran's nuclear threat, and that Israel
      joined the commitment. Iran, via Mehr, called the deal claim
      "simply a new lie." The de-escalation is asserted by one side and
      denied by the other — do NOT record it as a ceasefire, and do not
      let the cancellation read as resolution. This is the conflict for
      its own sake — who's fighting whom, where it's widening, what
      diplomacy is doing about it. Its capital-markets and underwriting
