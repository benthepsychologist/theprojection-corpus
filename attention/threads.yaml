# attention/threads.yaml — DEVELOPING THREADS (projects + stories) tracked
# across days until they resolve.
#
# A thread is a PROJECT (a concrete thing being built/shipped) or a STORY
# (a developing narrative). A single pull is a point-in-time snapshot; a
# thread is a named, persistent narrative we keep pulling on. Collectors fold
# each open thread's `terms` into the query sweep. When a thread resolves,
# set status: resolved (keep it for the record).
#
# Seeded 2026-07-20 by one-time copy from the reference repo (operation had
# been dark ~3 weeks). last_seen refreshed on 8 of 10 threads by the first
# /daily's sweep (2026-07-20 evening; openai-custom-silicon and
# apple-gemini-model-deal found nothing newer). The same day's re-triage
# proposals (resolve gpt-5.6-release — sweep confirmed shipped 07-09; new
# thread candidates incl. frontier-model-gov-review-precedent) were surfaced
# in briefing #0 and AWAIT BEN'S STEERING — statuses unchanged until then.
#
# Fields:
#   slug        stable id
#   title       SHORT, scannable label (2-4 words, not a headline sentence —
#               Ben, 2026-07-24: "they all look and feel like newspaper
#               headlines not threads, my gaze passes right over them").
#               The full narrative belongs in `watch`, not `title`.
#   kind        project (a concrete thing being built/shipped) | story (a developing narrative)
#               | meta (2026-07-23: a big-picture thread that groups sibling
#               threads — see `parent` below; a meta-thread has its own terms
#               and can carry its own directly-tagged items too, it isn't
#               purely derived)
#   status      open | developing | resolved | retired (decay-review kill —
#               folded/abandoned rather than concluded). resolved/retired
#               threads STAY published as archive pages (the record is the
#               point) but drop out of sweeps and collapse into the
#               "concluded" section on node pages (W6, 2026-07-28).
#   genre       what KIND of story it is — a neutral slug from
#               attention/board.yaml `genres` (ben-steer 2026-07-24). Drives
#               the board's thread rollups and its costume label (feudal:
#               "siege", "revolt", …). One per thread; the thing a topic tag
#               never captures.
#   lens        which watchlist lens it belongs to: ai | global-capital |
#               mental-health | world-news.
#               `global-capital` (renamed from `money` 2026-07-30, Ben:
#               "'finance' is boring 'Global Capital' is interesting to
#               me" — full rename, not cosmetic) is the interpretive
#               reframe: every relevant item can carry a generated,
#               confidence-tagged `interpretation` alongside its sourced
#               bullet, read against the standing
#               attention/capital-context.yaml snapshot. See DESIGN.md
#               Part 2 for the full spec.
#               `world-news` (2026-07-30, Ben — a fourth lens, but a
#               NARROW one, not a peer of the other three: no watchlist
#               entity sweep of its own, no coverage-critic benchmark
#               set. A thread is world-news when it's genuinely
#               irreducible to the other three — the conflict/
#               geopolitical narrative itself (who's fighting whom,
#               where it's widening). Its downstream capital-flow effects
#               stay global-capital's job, cross-referenced (see
#               `iran-conflict-widening` / `red-sea-oil-shock`'s split).
#               New world-news threads open the normal way — a candidate
#               from attention/world-news.yaml (tools/build_world_news.py)
#               gets promoted.
#   terms       query strings to sweep (quoted multi-word)
#   opened      YYYY-MM-DD
#   last_seen   YYYY-MM-DD the sweep last found a matching item (tool updates this)
#   watch       what specifically we're waiting to learn (the open question)
#   notes       running log
#   parent      OPTIONAL (2026-07-23, Ben — "figure out how to do meta-threads").
#               Slug of a `kind: meta` thread this one nests under (e.g.
#               google-capex's parent is hyperscaler-capex-big-picture). The
#               pointer lives on the CHILD, never as a `children:` list on the
#               parent — same reason items point to threads instead of
#               threads listing items: one source of truth, no drift. A
#               meta-thread's ranking score aggregates its children's item
#               counts (render/publish layer, computed, not stored); its
#               rendered card shows children as linked rows, never a flat
#               re-listing of their items (that would defeat the point).
#               Nesting: prefer ≤2 levels (Ben, 2026-07-24 — "no hard cap,
#               just caution against more than 2"). A meta MAY nest under one
#               other meta (e.g. ai-compute-spend's parent is
#               where-the-capex-lands, whose leaves are project threads —
#               question→category→project). Going past 2 levels isn't
#               forbidden but is a smell: flag it. Most metas stay one level.
#   public      OPTIONAL, default true (every thread publishes to
#               theprojection.org via `tools/publish_projection.py` unless
#               told not to). Set `public: false` to hold one back — see
#               AGENTS.md discipline 9. There's no private data here by
#               design, so this is an escape hatch, not a gate.
#   public_blurb  OPTIONAL. One-line public-facing summary used on the
#               published site; falls back to `watch` if absent.

