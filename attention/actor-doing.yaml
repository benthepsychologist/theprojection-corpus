# attention/actor-doing.yaml — the standing "what is this actor DOING right
# now" synthesis, per board actor.
#
# THE SYNTHESIS LAYER. The board (board.yaml) holds an actor's STRUCTURE
# (rank/House/holdings); threads.yaml holds its ACTIVITY (the evolving
# stories); this file holds the editorial ROLL-UP — a short paragraph
# answering "what are they up to right now," the thing you read to know an
# actor's state without reading every thread. (Ben, 2026-07-24: "the board
# and pieces and moves syntheses is more interesting" than threads alone.)
#
# Keyed by board slug. Refreshed on /daily (actors that moved that day) and
# /week (a full pass). A roll-up of the actor's threads + posture, written
# editorially — NOT fresh research (that's /crawl). Kept honest: where
# coverage is thin, the synthesis says so.
#
# YAML guardrail: safe_load after every LLM edit, or revert.

