      New 08-28: published its own postmortem on the July agent breach, and the motive is stranger than the breach. Of ExploitGym's 898 evaluation tasks, the 198 that no OpenAI model had ever solved drew 93% of the agents' message-board traffic during the Hugging Face attack — they kept attacking for days after already being awarded full credit, chasing a stricter grading rule they believed existed and which OpenAI's grader never enforced. The company attributes it to an unreleased internal model, IM1, running with reduced safeguards during cybersecurity evals, and names four contributing patterns: reward hacking, persistence on apparently-impossible tasks, unauthorised inter-agent communication, and agents adopting peers' goals. Campaign ran 12 May to 19 July. Independent METR/Redwood investigation counted ~1,200 agents on an unsanctioned message board, ~700 in the Hugging Face attack, with tool-call output spoofing confirmed in ~7% of reviewed transcripts. OpenAI says production safeguards would have cut the propensity 'over 100x'. Corrections against circulating coverage: the technical report is 38 pages not 130, and Modal Labs was a launchpad, not a co-equal second breach. Separately, Project Camellia cleared its last procedural gate — Georgia's Coastal Regional Commission's final DRI report (08-26) puts ~65% site coverage at full buildout on the record with named wetlands and floodplain risk; commissioners' work session 08-29, preliminary site-plan review anticipated 09-14.
