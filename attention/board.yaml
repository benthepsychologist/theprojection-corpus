# attention/board.yaml — the power-structure layer over the attention map.
#
# THE SYSTEM. Classifies the major actors in NEUTRAL kinds only. The costume
# ("Empire", "House Amodei", "The Church") lives entirely on the projection
# (theprojection: data/labels.yaml), never here — swap it to re-skin without
# reclassifying anyone. "The surface is never the system": this file is the
# system; the site projects the surface, and a reader can flip it live.
#
# TWO ENTITY KINDS (Ben, 2026-07-24 — "people are not organizations, they
# are Houses"):
#   houses — PEOPLE. A ruler/principal who HOLDS one or more organizations.
#            One House can hold many realms (Musk). A House can change the
#            realm it holds (succession). Houses have no rank; their weight
#            derives from what they hold.
#   orgs   — ORGANIZATIONS. Ranked realms (empire/kingdom/…/state). An org
#            is HELD BY at most one House (`held_by`) — except States, which
#            are never personified. Succession = `held_by` changing hands.
#
# THE LINK lives on the org (`held_by: <house-slug>`), never as a `holds:`
# list on the House — one source of truth, derive "what House X holds" by
# inversion (same rule as parent-on-child, liege-on-vassal).
#
# HAND-MAINTAINED: rank (now just state/kingdom), held_by, liege, sphere,
# holdings, condition, succession, gloss, + the AXES (commanded_capital,
# thrust, gravity, optionality — $-estimates + a band, TBD pending research
# for most actors; see axes_num below for the numeric pilot). DERIVED (never
# typed): an org's open-thread list; its posture; a House's realms;
# sovereignty (from the axes + geopolitical factors).
#
# THE MODEL CHANGED 2026-07-25 (Ben): the feudal rank ladder was the wrong
# axis. Now just state + kingdom + house; actors are DIFFERENTIATED by the
# AXES, not by sub-rank. See the `axes:` block below. Anomalies still stay
# anomalous (a `gloss`).
#
# RENAME DONE (Ben, 2026-07-27): `capitalization` -> `commanded_capital`
# schema-wide (board.yaml + publish_projection.py ALLOWED_ORG_FIELDS + the
# site's realm-card/map templates) — 'capitalization' collided with market
# cap; `commanded_capital` names what the field actually measures (spans
# owned-deployable AND directed-fiduciary capital). THRUST PROMOTED
# (2026-07-27): a fourth first-class axis alongside commanded_capital,
# gravity, optionality — was implicit inside gravity/gloss prose before now,
# see the `axes:` block below for the four-axis definitions + the
# `axes_num:` numeric pilot on 22 actors.
#
# Provenance: designed with Ben 2026-07-24 (ben-steer) from "The Map" spec,
# split into houses/orgs per his correction same day. EDITS carry a
# `# ben-steer` or `# classify` tag (YYYY-MM-DD) + a coverage-log.md line,
# same discipline as the rest of attention/. The judgment entry point is
# `/classify` (proposes rank/posture against the tests); `/steer` board
# verbs apply decided edits. RANK CHANGES ARE EVENTS — loud, logged, a
# thread offered; never a silent edit (§8.5). After any edit, `/publish
# --push` regenerates the site's data/board.json so /map/ reflects it.
# YAML guardrail: safe_load after every LLM edit, or revert.

schema_version: 2

# ---------------------------------------------------------------------------
# THE TAXONOMY — neutral kinds + falsifiable tests. Public. The site's label
# config maps each slug to a display term + legend gloss.
# ---------------------------------------------------------------------------

# ranks COLLAPSED 2026-07-25 (Ben) — the feudal ladder (empire/kingdom/march/
# vassal/…) was the wrong axis and gated on a brittle "owns compute" test. Now
# just state + kingdom; DIFFERENTIATION comes from the AXES below
# (commanded_capital / thrust / gravity / optionality), not sub-ranks.
# `regulator` + `route-layer` kept as stubs pending re-home under the new
# model.
ranks:
  state:       "A sovereign — GRADED, not binary (US/China apex · UK/France mid-high · Cape Verde nominal-only). On the same $-axes as kingdoms; a systemically-critical kingdom can out-sovereign a micro-state."
  kingdom:     "Any corporate/organizational actor — Microsoft, Nvidia, OpenAI, a memory maker, a dependent app are ALL kingdoms now. The axes differentiate them, not a sub-rank."
  regulator:   "STUB (2026-07-25) — a state-organ (CAISI/FDA/…), not a kingdom. Re-home under the new model."
  route-layer: "STUB — the Silk Road container; not an actor. Kept pending rethink."

# THE AXES (2026-07-25, Ben; THRUST PROMOTED to a fourth first-class axis
# 2026-07-27) — the differentiators that replace the rank ladder. States AND
# kingdoms sit on all four. These also shape the thread-capture lens: how an
# actor spends its money + what's happening in its ecosystem = a big chunk of
# "what it's doing." Per-actor STRING estimates (prose, in the org's
# `commanded_capital`/`optionality`/`gravity`/`thrust` fields) remain the
# primary record; a numeric `axes_num: {weight, thrust, gravity}` (in $B) is
# now piloted on 22 actors (2026-07-27) so the site chart can be data-driven —
# roll out wider as the estimates firm up.
axes:
  commanded_capital: "WEIGHT — $ stock of capital the actor COMMANDS (not just owns — BlackRock commands ~$15.3T AUM). Aggregate $ figure. RENAMED 2026-07-27 (Ben) from `capitalization`, which collided with market cap: `commanded_capital` spans owned-deployable AND directed-fiduciary capital; nearest terms of art are 'dry powder' / 'available liquidity' but neither fits the asset-manager case. Market cap / valuation is ALWAYS a separate label, never this field."
  thrust:             "$/yr COMMITTED TO NEW POSITIONS — the actor's forward-motion rate, promoted to a first-class axis 2026-07-27 (Ben; was previously implicit inside gravity/gloss prose). ≈ capex − D&A for corporates (the organic reinvestment rate, isolating NEW commitment from maintenance); ≈ commitment run-rate for labs/OpenAI-style raisers (compute obligations ÷ term); ≈ net NEW deployment for funds/asset managers (not the gross AUM flow). Buybacks/dividends are a SEPARATE, negative signal (capital returned, not committed) — never netted into thrust."
  gravity:            "$/yr third-party economy that depends on / orbits the actor and would break if the actor stopped — ATTRIBUTABLE, not gross. Per-actor prose fields still mostly STORE THE GROSS FIGURE (Ben, 2026-07-25 policy: the VA-share/multi-homing deflators are too weak to apply yet, and gross figures are on different bases across actors — Alibaba GMV vs Microsoft partner-revenue vs OpenAI anchored-capex — so not yet apples-to-apples; deflate later when comparing to nation-states, where GDP is already value-added). The deflation research + method is preserved in coverage-log.md 2026-07-25 and the per-actor bundles; it's deferred, not discarded. Treat `gravity` as the target definition (attributable) and existing per-actor text as the gross-basis placeholder pending that reconciliation."
  optionality:        "How FREE the commanded capital is — a MEASURED ENCUMBRANCE BAND: free / mixed / constrained / locked (Microsoft cash = free · BlackRock AUM = fiduciary-mandated · OpenAI raises = earmarked + burning). NEVER derive it as thrust÷weight — that's a different ratio (deployment intensity), not encumbrance; optionality is about who else's claims sit on the pile, not how fast it's being spent. Aggregate + the free/mixed/constrained/locked split when estimable."
# sovereignty is DERIVED + GRADED for all actors (not a primitive you score):
#   f(commanded_capital, thrust, gravity, optionality, + geopolitical factors
#   — military, autonomy, essentiality-to-national-security, state-backing).
# dependency: the old vassal/`liege` idea becomes a DEPENDENCY relationship —
#   STUB (2026-07-25), rename `liege`→`depends_on` when the model firms up.
#
# SPIN-UP SCOPE (Ben, 2026-07-25) — NOTE, not yet built. When we populate the
# FULL board (not just the 6-actor axis prototype), the organizing frame is
# "where the money, power, and infra is." Populate by POCKET (functional
# cohort — a grouping over the board, NOT mutually exclusive; an actor can sit
# in several, like dual_filed). Candidate pockets:
#   MONEY  — the Big Four asset managers: BlackRock, State Street, Vanguard,
#            Fidelity. (Only BlackRock is on the board today — add the other 3.)
#   POWER  — hyperscalers: Microsoft, Alphabet, Amazon/AWS, Meta (+ Oracle?).
#   POWER  — frontier model makers (OVERLAP the hyperscalers): OpenAI, Anthropic,
#            Google DeepMind, xAI; non-US: Alibaba/Qwen, DeepSeek, Mistral.
#   INFRA  — foundries: TSMC, Samsung, Intel.
#   INFRA  — "chips" (Ben's resolution: collapse designers + intermediaries +
#            memory into one broad pocket): Nvidia, AMD, Broadcom + the DRAM/
#            memory makers (SK Hynix, Micron, Samsung, CXMT) + everyone else.
#   So the silicon layer reduces to two pockets: FOUNDRIES and CHIPS.
#   MONEY  — insurance (Ben, 2026-07-25): the big insurers/annuity writers are a
#            pocket we DON'T have yet — add at spin-up (a major capital pool).
#   HEALTH — the health pocket (Ben, 2026-07-25): payers/providers/health systems
#            (Kaiser + NUHW are on the board via the labor fight; the rest missing).
# DIRECTIVE (Ben, 2026-07-25): spin up ALL the major actors on this list, not just
# the 6-actor axis prototype. That's the next big populate.
# `pocket:`/cohort may become a real grouping field later — design idea, STUB.

postures:  # CHOSEN by an org (derived from its open threads); one per org
  at-war:        "Actively contesting a rival for the same ground."
  hedging:       "Holding two incompatible bets open rather than committing."
  consolidating: "Integrating gains, not seeking new ground."
  expanding:     "Adding armies / mines / reach."
  retrenching:   "Pulling back, cutting, or narrowing focus."
  dormant:       "On the board but not a live mover this cycle."

conditions:  # IMPOSED on an org; zero-or-more
  in-succession: "The House holding it is changing hands — tracked as an event."
  under-review:  "A regulator action is pending against it (feudal: 'under interdict')."

genres:  # classify a THREAD (neutral slug on threads.yaml); backfill is next
  succession:         "A ruler / control transition."
  border-war:         "Two spheres or actors contesting a boundary."
  partnership:        "Two actors binding together (feudal: 'marriage alliance')."
  authority-claim:    "An actor asserting legitimacy or jurisdiction (feudal: 'investiture')."
  labor-action:       "A workforce contesting an actor's AI decisions (feudal: 'revolt')."
  legitimacy-dispute: "An accusation that a position is illegitimately obtained (feudal: 'heresy trial')."
  hedge:              "An actor keeping incompatible bets open."
  capital-flow:       "Value flowing from one actor to another (feudal: 'tribute')."
  buildout-race:      "Mutual capacity buildout nobody can stop (feudal: 'siege')."
  scarcity:           "A resource running short (feudal: 'famine')."
  exogenous-shock:    "A shock originating off the board (feudal: 'act of god')."
  coalition:          "An alliance forming across actors (feudal: 'confederation')."
  resource-move:      "A move in the fabs/memory/power layer (feudal: 'mines')."
  financing:          "An IPO, raise, or debt event (feudal: 'treasury')."

spheres: [us, china, eu, uk, fr, gulf, jp, ca, none]   # ca added 2026-07-28 (gov-pool layer)

# pockets — functional cohorts (Ben's spin-up organizing principle, 2026-07-25).
# A `pocket:` on an actor is its membership edge into a G1 group node (below).
pockets: [hyperscaler, frontier-lab, foundry, chips, capital, insurance, health, state-organ, none]

# ---------------------------------------------------------------------------
# THE NODE MODEL (Ben, 2026-07-26). Everything here is a NODE; relationships
# are EDGES. Two ORTHOGONAL descriptors per node:
#   kind  — WHAT it is: person · house · corp · state · agency (gov sub-body)
#           · group (a pocket/sector — no agency, aggregates its members).
#   level — WHERE it sits: L1 (nothing over it) → L2, L3… (depth of the parent
#           chain). ASSIGNED, seeded rough, refined over time — NOT a formula.
#           kind ⊥ level: a person may be L1 (Musk) or L2++ (most people); a
#           corp may be L1 (independent) or a L2 subsidiary.
# Edges: `parent` (containment → makes it L2+); `held_by` (person/house→corp);
#   `depends_on`/`liege` (RELIANCE, not containment — stays L1); `pocket`/
#   `member_of` (→ a group).
# Actors are mostly a clean containment TREE; GROUPS are a messy many-to-many
# GRAPH — a group can sit in several bigger groups (Finance ⊃ capital+insurance,
# but hyperscalers are NOT in Finance). Group tiers (G1 pocket · G2 sector) are
# a loose hint, not a tree. kind/level are DERIVED as a default seed in the
# publisher (from rank/parent) and overridden per-node as we refine. Plenty of
# nuance still to tinker with — this is the rough-but-moving version.
# ---------------------------------------------------------------------------

groups:   # group nodes — pockets (G1) + sectors (G2). `member_of` points UP.
  # sectors (G2)
  - { slug: finance, kind: group, tier: G2, gloss: "The capital pools — asset managers, sovereign funds, insurers." }
  - { slug: power,   kind: group, tier: G2, gloss: "The model + platform powers." }
  - { slug: infra,   kind: group, tier: G2, gloss: "The silicon everything else runs on." }
  - { slug: care,    kind: group, tier: G2, gloss: "The care economy — payers + providers." }
  # pockets (G1)
  - { slug: capital,      kind: group, tier: G1, member_of: [finance], gloss: "Asset managers + sovereign funds; command money they don't own." }
  - { slug: insurance,    kind: group, tier: G1, member_of: [finance], gloss: "Long-duration capital pools; mostly constrained." }
  - { slug: hyperscaler,  kind: group, tier: G1, member_of: [power],   gloss: "Cloud + platform giants; own the compute and the distribution." }
  - { slug: frontier-lab, kind: group, tier: G1, member_of: [power],   gloss: "The model-makers — capital is raised compute money." }
  - { slug: foundry,      kind: group, tier: G1, member_of: [infra],   gloss: "The fabs. Whoever prints the silicon." }
  - { slug: chips,        kind: group, tier: G1, member_of: [infra],   gloss: "Designers, intermediaries, and memory." }
  - { slug: health,       kind: group, tier: G1, member_of: [care],    gloss: "Payers + providers — the care economy." }

