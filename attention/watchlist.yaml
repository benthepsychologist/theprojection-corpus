# attention/watchlist.yaml — the entities Ben cares about, per lens. THE PRODUCT.
#
# WHY THIS EXISTS: RSS only tells us what a publisher chose to push. This file
# drives the QUERY-based collection layer: every term here is actively swept
# against news / prediction-market / discourse APIs. RSS = "what got published";
# this = "what we're hunting for, everywhere."
#
# GROWING LIST — edits follow Ben's steering or the coverage critic (log why).
# Keep terms precise (quote multi-word names; prefer distinctive strings); each
# `term` is passed verbatim to the sweep collectors.
#
# ENTITY LAYER (reframe Phase 0, 2026-07-22): every entry here IS an entity.
# Entity slug = lowercase(term), non-alphanumeric runs -> "-", trimmed
# ("Character.AI" -> character-ai, "Google DeepMind" -> google-deepmind).
# Entity kind = section (orgs -> org, people -> person, everything else ->
# topic). Entries may use a mapping form when the sweep term and the entity
# identity must differ:
#   - term: "Elon Musk xAI"     # passed verbatim to the sweep, unchanged
#     entity: elon-musk         # fixed slug
#     name: "Elon Musk"         # display name
# Readers: term = x if isinstance(x, str) else x["term"]. Item/thread entity
# tags may only use slugs derivable from this file — a new tag means a
# watchlist add through the steering loop first.
#
# Seeded 2026-07-20 by one-time copy from the reference repo (ai + mental-health
# lenses as of 2026-06-28, incl. its coverage-critic auto-adds). This copy is
# kestrel's alone — no sync-back. `money` scoped by Ben same day (see its block).

