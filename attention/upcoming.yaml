    evidence: >
      In force today as scheduled, but not the thing this entry originally
      described. PRIMARY (European Commission,
      digital-strategy.ec.europa.eu, "Commission starts enforcing AI Act
      rules and new transparency requirements"): from 2026-08-02 the AI
      Office and member-state authorities begin actively ENFORCING the AI
      Act against general-purpose AI providers — power to request technical
      documentation, evaluate models, require corrective measures, and fine
      up to €15M or 3% of global turnover. Separately and on the same date,
      Article 50 transparency duties apply to a much broader set of systems:
      chatbots must disclose they are AI, deepfakes must be labelled, and
      AI-generated or altered content must carry machine-readable marks.
      The GPAI obligations themselves (Art. 53/55) and the GPAI Code of
      Practice as their voluntary compliance route have been live since
      2025-08-02 — the Code was finalised 2025-07-10 and Commission-endorsed
      2025-08-01. So today is the day the teeth arrive, not the day the
      duties arrive. Provider posture: Meta REVERSED its July-2025 refusal
      and signed the Article 50 Code of Practice on Transparency of
      AI-Generated Content in late July 2026 (primary: about.fb.com);
      Google signed the same code 2026-07-24 while warning the added
      complexity cuts against EU competitiveness. ⚠ Note these are two
      DIFFERENT instruments that trade press routinely conflates — the
      Article 50 transparency code is not the Art. 53/55 GPAI code, and
      Meta's reversal is on the former. The Digital Omnibus on AI
      (Parliament vote 2026-06-16) deferred the HIGH-RISK obligations that
      would otherwise also have landed today — Annex III standalone systems
      to 2027-12-02, Annex I embedded-product systems to 2028-08-02 — but
      explicitly left the GPAI enforcement and Article 50 dates untouched.
      No enforcement action, fine, or named-company penalty has been
      announced yet; today is the activation date, not an enforcement event.
      ⚠ ec.europa.eu's presscorner URL (ip_26_1714) returned an empty shell
      on fetch (JS-rendered); content confirmed via the digital-strategy.eu
      mirror of the same release.

