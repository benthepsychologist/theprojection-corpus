    evidence: |
      RESOLVED 2026-08-30 (afternoon), WITHDRAWN — the tracked event will
      not occur, and neither horn of the morning's dilemma was right.
      France's Conseil constitutionnel STRUCK DOWN Article 1 of the law
      on 2026-08-14, sixteen days before this check and four days after
      this thread logged the ban as hard-ID law. Décision n° 2026-911 DC,
      read directly at conseil-constitutionnel.fr: "L'article 1er de la
      loi visant à protéger les mineurs des risques auxquels les expose
      l'utilisation des réseaux sociaux est contraire à la Constitution."
      The Council held the ban an interdiction of general scope taken
      without regard to the individual minor or to per-service risk, and
      — the point that kills this entry — that blocking under-15s implies
      EVERY user must prove age, while "le législateur n'a pas prévu les
      garanties légales" defining that verification. So the provision
      fell because the verification requirement was left legally
      UNDEFINED, not because France picked hard-ID or self-declaration.
