    what_confirms: "the print itself, and whether guidance reflects the memory-cost pass-through; also the first read on whether hyperscalers absorb the 15% or cut units"
    logged: 2026-08-23
    logged_by: curate-add
    status: hit
    resolved: 2026-08-26
    evidence: |
      Reported after close 08-26 as scheduled. Naming correction: Nvidia's
      own filing calls this "Second Quarter Fiscal 2027" (quarter ended
      07-26), not "Q2 FY2026" as this entry's own id/claim have it —
      this map's label is off by one fiscal year; left unrenamed to avoid
      rippling the id, noted here instead. Revenue $96.2B (+18% QoQ,
      +106% YoY, beat ~$92B consensus); data-center revenue ~$89B;
      gross margin 75.0% GAAP/non-GAAP; Q3 FY2027 guidance $108B
      (Nvidia's first $100B+ quarter); Q4 FY2027 gross margin guided
      down to 71-72%, explicitly attributed to memory costs. On the
      question this entry exists to answer: management confirmed it is
      PASSING the >15% memory-cost inflation through rather than
      absorbing it, describing "extreme" memory pricing conditions
      "headed higher into next year" — and the top-five hyperscalers'
      combined capex guidance is reported rising to $1.3T next year from
      $800B in 2026, i.e. evidence points to absorption, not order cuts,
      though no hyperscaler has directly confirmed that reasoning yet.
      Sources: Nvidia's own GlobeNewswire release and 10-Q; CNBC;
      Tom's Hardware on the pricing detail; Yahoo Finance on guidance.

