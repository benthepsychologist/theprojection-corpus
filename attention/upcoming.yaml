    claim: "France's under-15 social-media ban takes effect with HARD identity verification — not Australia's self-declaration model"
    due: 2026-09-01
    due_precision: month   # the effective date reported 08-10; no single announced day yet
    thread: social-media-causality-fight
    entities: []
    source: https://www.legifrance.gouv.fr/
    confidence: reported
    what_confirms: "reporting that new accounts are ACTUALLY blocked for under-15s in France — not merely that the rule is in force. The verification method is the whole point of this entry: Australia's declaration-based ban produced two documented evasion jurisdictions (Australia itself, then Malaysia, logged 08-09), so a hard-ID regime is the first real test of whether verification changes the outcome or just moves the workaround."
    logged: 2026-08-11
    logged_by: curate-add   # /daily 08-11, mental-health lens
    status: withdrawn
    resolved: 2026-08-30
    evidence: |
      RESOLVED 2026-08-30 (afternoon), WITHDRAWN — the tracked event will
      not occur, and neither horn of the morning's dilemma was right.
      France's Conseil constitutionnel STRUCK DOWN Article 1 of the law
      on 2026-08-14, sixteen days before this check and four days after
      this thread logged the ban as hard-ID law. Décision n° 2026-911 DC,
      read directly at conseil-constitutionnel.fr: "L'article 1er de la
      loi visant à protéger les mineurs des risques auxquels les expose
      l'utilisation des réseaux sociaux est contraire à la Constitution."
      The Council held the ban an interdiction of general scope taken
      without regard to the individual minor or to per-service risk, and
      — the point that kills this entry — that blocking under-15s implies
      EVERY user must prove age, while "le législateur n'a pas prévu les
      garanties légales" defining that verification. So the provision
      fell because the verification requirement was left legally
      UNDEFINED, not because France picked hard-ID or self-declaration.
      There is no 09-01 commencement to observe and no verification model
      to compare against Australia's. Withdrawn rather than passed-silent:
      passed-silent means a date passed with nothing to show, and this
      has a dated primary-source reason.
      ⚠️ METHOD NOTE, worth more than the entry: this morning's interim
      called for "a direct read of the enacted text on legifrance.gouv.fr"
      and that read would NOT have surfaced this — the dispositive act was
      a constitutional-review decision on a different site. The 08-10
      timeline entry it rested on cited Reclaim The Net, an advocacy
      outlet, for a claim about what a statute requires. Both are recorded
      on artifacts/threads/social-media-causality-fight.md.

      SUPERSEDED — INTERIM 2026-08-30 (morning) — and the CLAIM ITSELF is now in doubt, which is
      a bigger finding than the date. This entry's whole point is the
      verification METHOD (hard identity check vs. Australia's self-
      declaration). Open-source reporting now contradicts itself on
      exactly that: some accounts (Digital Minister Anne Le Henanff, and
      coverage tying the check to CNIL and the EU's privacy-preserving
      zero-knowledge-proof pilot) describe a mandatory platform-side age
      check, while others report that parliament STRIPPED the age-
      verification enforcement mechanism from the final bill, leaving only
      the EU Digital Services Act as the enforcement tool — i.e. no hard
      identity check at all. Not resolvable by further searching. This
      needs a direct read of the enacted text on legifrance.gouv.fr before
      09-01. Flagged rather than guessed at.
