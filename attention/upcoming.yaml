# attention/upcoming.yaml — dated expectations, checked every /daily.
#
# The generalized catch-the-slip mechanic: every dated claim we've seen gets
# a ledger entry; /daily checks entries with due <= digest-day and flips
# status. passed-silent is the LOUD outcome (a date passing with no evidence
# is itself news) — it keeps a 3-day retro-flip grace before standing.
# /week writes the week's scorecard into the weekly digest, then prunes
# resolved entries older than the closing week.
#
# status: pending -> hit | slipped | passed-silent | withdrawn
#   on slip: push old date onto slips:[], update due, status back to pending
# logged_by: ben-steer | curate-add | crawl | critic-add
#   (lighter bar than the map files — expectations are dated claims, not
#   attention-map structure; see AGENTS.md provenance note)
# confidence: rumored | reported | confirmed
# YAML guardrail applies: safe_load after every LLM edit, or git revert.
#
# Seeded 2026-07-22 from the week's digests (Phase 0 of the thread-centric
# reframe — plan approved by Ben 2026-07-22).

