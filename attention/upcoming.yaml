  - id: jackson-hole-warsh-keynote
    claim: "Kevin Warsh gives his first Jackson Hole keynote as Fed chair, at the Kansas City Fed's symposium (08-27 to 08-29, theme 'Financial Innovation: Implications for Payments and Policy')"
    due: 2026-08-28
    due_precision: day
    thread: fed-independence-fight
    entities: [kevin-warsh]
    source: https://www.kansascityfed.org/research/jackson-hole-economic-symposium/
    confidence: confirmed
    what_confirms: "the keynote text — specifically whether Warsh addresses the long-end/buyback question this map has no thread for, and his stated line on flexible average inflation targeting"
    logged: 2026-08-23
    logged_by: curate-add   # verified against kansascityfed.org directly, not commentary; exact slot to be confirmed by the Wednesday-evening agenda release
    status: hit
    resolved: 2026-08-28
    evidence: |
      Delivered on the day, 2026-08-28 at 10:00 ET, titled "In Our Time."
      Verified by this session directly against the Federal Reserve
      Board's own released text (federalreserve.gov/newsevents/speech/
      warsh20260828a.htm, HTTP 200, body extracted and keyword-checked),
      not against a wire summary. The Kansas City Fed's own symposium
      page 403s on every transport, so the Board's site is the working
      primary source for this one.

      BOTH HALVES OF what_confirms ARE ANSWERED, one of them negatively:

      (1) The long-end/buyback question — NO. Warsh did not address it at
      all. The words "independence", "administration", "buyback", "long
      end" and "average inflation" appear NOWHERE in the released text
      (checked by direct string search over the extracted body). The one
      occurrence of "Treasury" refers to Treasury securities as one of
      several market signals the Fed should read, not to the Treasury
      Department, buybacks or the TGA. Going in, previews framed the
      buyback/fiscal-dominance pressure and the Cook removal fight as the
      market's central question; he used the platform on financial
      innovation and communications doctrine instead. This is a resolved
      NEGATIVE on a watch item, not an absence of evidence.

      (2) Flexible average inflation targeting — REJECTED in favour of a
      firm fixed target. He put 12-month PCE at 3.7% and the six-month at
      4.1%, said "inflation is running above our 2 percent target", and
      framed the 2% objective as fixed. "Average inflation" is not in the
      text.

      SUBSTANCE WORTH KEEPING: his 100th day as chairman; an explicit
      refusal to give a reaction function ("I wish our understanding of
      the economy were so precise ... that some simple function like a
      Taylor rule could be rigorously relied upon"); the argument that
      forward guidance "has overstayed its welcome" as routine practice;
      labour markets called consistent with full employment; and a
      substantial AI section calling AI "a new variable--potentially a
      new factor of production" and citing reports of annualized token
      sales for the two leading labs at more than $100 billion, up
      500-plus percent year over year (his attribution to "reports", not
      Fed data).

