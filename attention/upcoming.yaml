# attention/upcoming.yaml — dated expectations, checked every /daily.
#
# The generalized catch-the-slip mechanic: every dated claim we've seen gets
# a ledger entry; /daily checks entries with due <= digest-day and flips
# status. passed-silent is the LOUD outcome (a date passing with no evidence
# is itself news) — it keeps a 3-day retro-flip grace before standing.
# /week writes the week's scorecard into the weekly digest, then prunes
# resolved entries older than the closing week.
#
# status: pending -> hit | slipped | passed-silent | withdrawn | refuted
#   on slip: push old date onto slips:[], update due, status back to pending
#   refuted (added 2026-09-08, LOCAL — not yet in the engine's own vocabulary):
#     the claim was actively DISPROVED by evidence. Distinct from passed-silent,
#     which means the due date passed with NO evidence either way. Needed first
#     for kremlin-kyiv-strike-pause-0908, a NULL claim ("no strikes for three
#     nights") whose polarity is inverted — silence confirmed it and loud
#     evidence broke it, so recording the break as `passed-silent` would have
#     said the opposite of what happened. graph/ingest/03_expectations.py maps
#     it to `rejected`, the same graph state passed-silent produces.
# logged_by: ben-steer | curate-add | crawl | critic-add
#   (lighter bar than the map files — expectations are dated claims, not
#   attention-map structure; see AGENTS.md provenance note)
# confidence: rumored | reported | confirmed
# YAML guardrail applies: safe_load after every LLM edit, or git revert.
#
# Seeded 2026-07-22 from the week's digests (Phase 0 of the thread-centric
# reframe — plan approved by Ben 2026-07-22).
#
# Pruned 2026-08-14 (/week step 2): anthropic-ipo-filing (hit, resolved
# 2026-08-02 — older than any closing week since). Substance preserved:
# its successor entry anthropic-ipo-public-flip (below) carries the live
# tracking forward, and radar.md's Q1 08-04 working note already records
# the full finding (the filing was a real, well-covered 06-01 company
# announcement this map initially mis-logged as a thin rumor).
#
# Pruned 2026-08-15 (/week step 2, week_of 2026-08-10): 11 entries
# resolved before this closing week and already recorded in the 08-03
# weekly digests — gov-review-framework-announce, eo14409-deadlines
# (both passed-silent 08-05), spacex-q2-earnings, spacex-insider-unlock,
# softbank-q1-earnings, eu-ceuta-ministers-meeting,
# senate-commerce-kids-ai-markup, ism-services-cook-0805,
# amd-q2-2026-earnings, cvs-q2-2026-earnings, globalfoundries-q2-2026-
# earnings (all hit, resolved 08-04–08-06). Nothing lost — each week's
# own weekly digest already carries the finding.
#
# Pruned 2026-08-18 (/week step 2, week_of 2026-08-10 close): 2 entries
# — colombia-presidential-inauguration and jobs-report-july-0807, both
# due 08-07 (the prior week), both `status: hit` with no `resolved:`
# date ever stamped. That missing field is why the 08-15 prune pass
# above didn't catch them — its filter reads `resolved`, and these two
# never had one. Confirmed genuinely resolved before this closing week
# by their own `due` date; substance already carries in the 08-03
# weekly digests. This run's 12 newly-resolved entries (08-11 through
# 08-18) are deliberately NOT pruned yet — per the established pattern,
# they wait for the /week run that closes week_of 08-17, once this
# week's own weekly digests (which now record them) are the settled
# record rather than a same-run write.

