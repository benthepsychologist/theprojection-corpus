[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "theprojection-pipeline"
version = "0.1.0"
description = "theprojection-corpus's own read/digest/world-news surfaces."
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "requests>=2.31"]

[project.scripts]
theprojection = "theprojection_pipeline.cli:main"

[tool.setuptools.packages.find]
include = ["theprojection_pipeline*"]
