# kestrel.yaml — instance manifest (engine/instance split, kestrel
# ROADMAP/DESIGN.md §2). This repo is instance #1: Ben's attention map +
# derived artifacts, tended by the kestrel engine (/workspace/kestrel).
#
# kind: attention is the news-instance shape — distinct from `registry`
# (therapybulletin). The engine's instance-reading tools locate this repo
# via the KESTREL_INSTANCE env var; this manifest makes the repo
# self-describing per the contract. The layout keys mirror what the
# tools actually read today.
kind: attention
name: theprojection
contract_version: 1
layout:
  attention: attention/          # the map: watchlist, threads, upcoming, board…
  artifacts: artifacts/          # digests, timelines, bundles, readouts, read page
  digests: artifacts/digests/daily/
  threads: artifacts/threads/
  sources: sources/              # sources.yaml, feeds.yaml, benchmarks.yaml
  templates: templates/          # digest + read-shell templates
  buffer: buffer/                # 30-day cache semantics — gitignored
  snapshots: snapshots/          # page-diff prior-snapshot store (unused yet)
  provenance: provenance/        # per-run fetch + publish manifests
governance:
  yaml: safe-load-or-revert
  attention_edits: steering-loop-only   # provenance tag every change (CLAUDE.md)
outputs:
  site: /workspace/theprojection-site
  # Path relative to this repo's own root — kestrel's tools/publish.py loads
  # this file directly (no per-site code lives in the kestrel checkout;
  # relocated 2026-07-31 out of tools/publish/adapters/theprojection.py).
  adapter: publish/adapter.py
  # This repo's OWN command, for the surfaces it produces rather than the
  # engine does — readouts, render-read, build-world-news. They moved out of
  # kestrel 2026-08-21; the attention kit's templates name this token so a
  # shared template never hardcodes one instance's binary.
  cli: theprojection

# Scheduled recurring work (kestrel ROADMAP/FLEET.md §4.3). Declared HERE,
# in this repo's own manifest, because which of its skills may run
# unattended is this repo's decision — a crontab line cannot express it.
# `kestrel fleet cron` converts these to UTC crontab lines; installing
# them is the operator's, and kestrel never launches anything itself.
cadence:
  timezone: America/Toronto
  runs:
    - skill: daily
      at: ["10:00", "15:00"]   # -> 14:00 / 19:00 UTC while EDT
      unattended: true
